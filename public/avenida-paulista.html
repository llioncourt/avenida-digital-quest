        // Minimapa dinâmico
        updateMinimap: function() {
          const container = document.getElementById('minimap');
          if (!container) return;

          // Obter dimensões do viewport
          const viewport = document.getElementById('minimap-viewport');
          const viewportRect = viewport ? viewport.getBoundingClientRect() : { width: 300, height: 200 };
          const width = viewportRect.width || 300;
          const height = viewportRect.height || 200;

          // Definir layout do mapa baseado nas salas
          const roomPositions = this.calculateRoomPositions(width, height);

          // Limpar mapa
          container.innerHTML = '';

          // Desenhar conexões primeiro (para ficarem atrás)
          const drawnConnections = new Set();
          Object.entries(GameState.rooms).forEach(([roomId, room]) => {
            // Ocultar subsolo_masp até ser visitado ou revelado pela lanterna
            if (roomId === 'subsolo_masp' && !GameState.visitedRooms.has(roomId)) {
              var canReveal = GameState.playerLocation === 'masp' && GameState.playerInventory.includes('lanterna') && GameState.time >= 20 * 60;
              if (!canReveal) return;
            }
            // Usar posição customizada se existir
            let pos = roomPositions[roomId];
            if (MinimapController.customPositions[roomId]) {
              const custom = MinimapController.customPositions[roomId];
              pos = {
                x: custom.x * (width / 100),
                y: custom.y * (height / 100)
              };
            }
            if (!pos) return;

            // Não desenhar conexões de/para locais aéreos (não são ruas)
            if (room.requiresFlight) return;

            Object.values(room.exits).forEach(exitId => {
              const exitRoom = GameState.rooms[exitId];
              if (!exitRoom) return;

              // Ocultar conexões para subsolo_masp até ser visitado ou revelado
              if (exitId === 'subsolo_masp' && !GameState.visitedRooms.has(exitId)) {
                var canRevealExit = GameState.playerLocation === 'masp' && GameState.playerInventory.includes('lanterna') && GameState.time >= 20 * 60;
                if (!canRevealExit) return;
              }

              // Não desenhar conexão para local aéreo
              if (exitRoom.requiresFlight) return;

              // Usar posição customizada se existir
              let exitPos = roomPositions[exitId];
              if (MinimapController.customPositions[exitId]) {
                const custom = MinimapController.customPositions[exitId];
                exitPos = {
                  x: custom.x * (width / 100),
                  y: custom.y * (height / 100)
                };
              }
              if (!exitPos) return;

              // Evitar desenhar conexão duplicada
              const connectionKey = [roomId, exitId].sort().join('-');
              if (drawnConnections.has(connectionKey)) return;
              drawnConnections.add(connectionKey);

              const connection = document.createElement('div');
              connection.className = 'map-connection';

              // Calcular linha entre os dois pontos (centros das salas)
              const x1 = pos.x;
              const y1 = pos.y;
              const x2 = exitPos.x;
              const y2 = exitPos.y;

              const length = Math.sqrt(Math.pow(x2 - x1, 2) + Math.pow(y2 - y1, 2));
              const angle = Math.atan2(y2 - y1, x2 - x1) * 180 / Math.PI;

              connection.style.left = x1 + 'px';
              connection.style.top = y1 + 'px';
              connection.style.width = length + 'px';
              connection.style.transform = `rotate(${angle}deg)`;

              container.appendChild(connection);
            });
          });

          // Obter saídas válidas da sala atual
          const currentRoom = GameState.rooms[GameState.playerLocation];
          const validExitIds = currentRoom ? Object.values(currentRoom.exits) : [];

          // Desenhar salas
          Object.entries(GameState.rooms).forEach(([roomId, room]) => {
            // Ocultar subsolo_masp até ser visitado ou revelado
            if (roomId === 'subsolo_masp' && !GameState.visitedRooms.has(roomId)) {
              var canReveal2 = GameState.playerLocation === 'masp' && GameState.playerInventory.includes('lanterna') && GameState.time >= 20 * 60;
              if (!canReveal2) return;
            }
            // Usar posição customizada se existir
            let pos = roomPositions[roomId];
            if (MinimapController.customPositions[roomId]) {
              const custom = MinimapController.customPositions[roomId];
              pos = {
                x: custom.x * (width / 100),
                y: custom.y * (height / 100)
              };
            }
            if (!pos) return;

            const roomEl = document.createElement('div');
            roomEl.className = 'map-room';
            roomEl.setAttribute('data-room-id', roomId);
            roomEl.style.left = pos.x + 'px';
            roomEl.style.top = pos.y + 'px';

            // Efeito visual para sala secreta revelada mas não visitada
            if (roomId === 'subsolo_masp' && !GameState.visitedRooms.has(roomId)) {
              roomEl.classList.add('secret-revealed');
            }

            // Verificar se é a sala atual
            if (roomId === GameState.playerLocation) {
              roomEl.classList.add('current');
            } else if (validExitIds.includes(roomId)) {
              // Verificar se a saída é acessível
              const targetRoom = GameState.rooms[roomId];
              const needsFlight = targetRoom.requiresFlight && !Rules.canPlayerFly();
              const blockedByShield = roomId === 'teto_masp' && GameState.playerLocation === 'masp' && !GameState.forceShieldDown;

              // Exceção: Antena → Céu é sempre clicável (Game.move cuida da morte)
              const isDeadlyJump = GameState.playerLocation === 'antena' && roomId === 'ceu_cidade';

              if ((needsFlight || blockedByShield) && !isDeadlyJump) {
                roomEl.classList.add('blocked-exit');
                roomEl.title = room.name + (needsFlight ? ' (precisa voar)' : ' (escudo de força)');
              } else {
                roomEl.classList.add('valid-exit');
                roomEl.title = room.name + ' (clique para ir)';
              }
            }

            // Verificar entidades na sala (neblina esconde inimigos no minimapa)
            const enemies = GameState.fogActive ? [] : Object.values(GameState.characters).filter(
              c => c.id !== 'player' && c.location === roomId && c.isAlive && !c.isAlly && !c.isNeutral &&
              (c.id !== 'demonio' || c.isSummoned)
            );
            const allies = Object.values(GameState.characters).filter(
              c => c.id !== 'player' && c.location === roomId && c.isAlive && c.isAlly
            );
            // Vendedor aparece como neutro (dourado)
            const neutrals = Object.values(GameState.characters).filter(
              c => c.id !== 'player' && c.location === roomId && c.isAlive && c.isNeutral
            );

            if (enemies.length > 0 && allies.length > 0) {
              roomEl.classList.add('has-both');
            } else if (enemies.length > 0) {
              roomEl.classList.add('has-enemy');
            } else if (allies.length > 0) {
              roomEl.classList.add('has-ally');
            } else if (neutrals.length > 0) {
              roomEl.style.boxShadow = '0 0 6px var(--accent-gold)';
            }

            // Verificar se há bomba armada nesta sala
            if (GameState.armedBomb && GameState.armedBomb.location === roomId) {
              roomEl.classList.add('has-bomb');
            }

            // Indicadores de itens descobertos nesta sala
            const roomItems = Object.values(GameState.items).filter(function(item) {
              return GameState.discoveredItems.has(item.id) &&
                     item.location === roomId &&
                     !item.isDestroyed &&
                     !item.isAnimated &&
                     !GameState.playerInventory.includes(item.id);
            });

            // Nome abreviado da sala
            const shortName = this.getShortRoomName(room.name);
            roomEl.textContent = shortName;

            // Adicionar indicador APÓS textContent (senão seria apagado)
            if (roomItems.length > 0) {
              const indicator = document.createElement('span');
              indicator.className = 'item-indicator';
              indicator.textContent = roomItems.map(function(i) { return ITEM_ICONS[i.id] || '📦'; }).join('');
              roomEl.appendChild(indicator);
            }

            container.appendChild(roomEl);
          });

          // Aplicar transformação do MinimapController
          MinimapController.applyTransform();
        },

        // Calcular posições das salas dinamicamente com base no tamanho do container
        calculateRoomPositions: function(width, height) {
          // Grid proporcional baseado no tamanho do container
          const scaleX = width / 100;
          const scaleY = height / 100;

          // Layout organizado em grade com posições percentuais
          const positions = {
            // Topo
            'ceu_cidade':              { x: 42, y: 6 },
            'antena':                  { x: 82, y: 8 },

            // Nível superior
            'cinema':                  { x: 8, y: 18 },
            'shopping':                { x: 42, y: 17 },

            // Nível Paulista Oeste
            'rua_augusta':             { x: 8, y: 28 },
            'avenida_paulista_oeste':  { x: 42, y: 28 },
            'colegio':                 { x: 85, y: 28 },

            // Centro - MASP e arredores
            'teto_masp':               { x: 22, y: 40 },
            'masp':                    { x: 42, y: 42 },
            'avenida_paulista_leste':  { x: 88, y: 42 },

            // Nível médio-baixo
            'livraria':                { x: 62, y: 52 },
            'nove_julho_norte':        { x: 42, y: 58 },
            'distrito_italiano':       { x: 62, y: 58 },
            'avenida_brigadeiro':      { x: 85, y: 58 },

            // Nível inferior
            'tunel':                   { x: 42, y: 72 },

            // Base
            'avenida_santos':          { x: 8, y: 90 },
            'nove_julho_sul':          { x: 50, y: 88 },
            'subsolo_masp':            { x: 22, y: 52 },
          };

          // Converter posições percentuais para pixels
          const result = {};
          Object.entries(positions).forEach(([roomId, pos]) => {
            result[roomId] = {
              x: pos.x * scaleX,
              y: pos.y * scaleY
            };
          });

          return result;
        },

        // Nome curto para o mapa
        getShortRoomName: function(name) {
          const shortcuts = {
            'Túnel': 'TÚN',
            'Nove de Julho Norte': '9JN',
            'Nove de Julho Sul': '9JS',
            'Avenida Brigadeiro': 'BRG',
            'Avenida Santos': 'SNT',
            'Rua Augusta': 'AUG',
            'Shopping': 'SHP',
            'Avenida Paulista Oeste': 'P.O',
            'Avenida Paulista Leste': 'P.L',
            'MASP': '★',
            'Distrito Italiano': 'ITA',
            'Teto do MASP': 'TETO',
            'Colégio': 'COL',
            'Livraria': 'LIV',
            'Antena': 'ANT',
            'Céu da Cidade': 'CÉU',
            'Cinema': 'CIN'
          };
          return shortcuts[name] || name.substring(0, 3).toUpperCase();
        }
      };

      // ============================================================================
      // MINIMAP CONTROLLER - Sistema de drag, pan e zoom do minimapa
      // ============================================================================

      const MinimapController = {
        // Estado do viewport
        offsetX: 0,
        offsetY: 0,
        zoom: 1,
        minZoom: 0.5,
        maxZoom: 3,

        // Estado do drag
        isDragging: false,
        dragType: null, // 'node' ou 'pan'
        dragTarget: null,
        startX: 0,
        startY: 0,

        // Posições customizadas das salas (em percentual)
        customPositions: {},

        // Pinch zoom
        lastPinchDistance: null,

        init: function() {
          this.loadPositions();
          this.setupEventListeners();
          this.applyTransform();
        },

        setupEventListeners: function() {
          const viewport = document.getElementById('minimap-viewport');
          if (!viewport) return;

          // Mouse events
          viewport.addEventListener('mousedown', this.handleMouseDown.bind(this));
          document.addEventListener('mousemove', this.handleMouseMove.bind(this));
          document.addEventListener('mouseup', this.handleMouseUp.bind(this));

          // Wheel zoom
          viewport.addEventListener('wheel', this.handleWheel.bind(this), { passive: false });

          // Touch events
          viewport.addEventListener('touchstart', this.handleTouchStart.bind(this), { passive: false });
          viewport.addEventListener('touchmove', this.handleTouchMove.bind(this), { passive: false });
          viewport.addEventListener('touchend', this.handleTouchEnd.bind(this));
        },

        handleMouseDown: function(e) {
          const viewport = document.getElementById('minimap-viewport');
          const roomEl = e.target.closest('.map-room');

          if (roomEl) {
            // Iniciar drag de node
            this.isDragging = true;
            this.dragType = 'node';
            this.dragTarget = roomEl.getAttribute('data-room-id');
            roomEl.classList.add('dragging');
            viewport.classList.add('dragging-node');
          } else if (e.target === viewport || e.target.id === 'minimap') {
            // Iniciar pan do mapa
            this.isDragging = true;
            this.dragType = 'pan';
            viewport.classList.add('dragging');
          }

          this.startX = e.clientX;
          this.startY = e.clientY;

          e.preventDefault();
        },

        handleMouseMove: function(e) {
          if (!this.isDragging) return;

          const viewport = document.getElementById('minimap-viewport');
          if (!viewport) return;

          if (this.dragType === 'pan') {
            // Pan do mapa
            const deltaX = e.clientX - this.startX;
            const deltaY = e.clientY - this.startY;

            this.offsetX += deltaX;
            this.offsetY += deltaY;

            this.startX = e.clientX;
            this.startY = e.clientY;

            this.applyTransform();
          } else if (this.dragType === 'node' && this.dragTarget) {
            // Drag de node
            const viewportRect = viewport.getBoundingClientRect();
            const width = viewportRect.width;
            const height = viewportRect.height;

            // Converter coordenadas do mouse para coordenadas do mapa
            const x = (e.clientX - viewportRect.left - this.offsetX) / this.zoom;
            const y = (e.clientY - viewportRect.top - this.offsetY) / this.zoom;

            // Converter para porcentagem
            this.customPositions[this.dragTarget] = {
              x: (x / width) * 100,
              y: (y / height) * 100
            };

            // Atualizar posição do elemento diretamente (sem redesenhar tudo)
            const roomEl = document.querySelector(`[data-room-id="${this.dragTarget}"]`);
            if (roomEl) {
              roomEl.style.left = x + 'px';
              roomEl.style.top = y + 'px';
            }

            // Atualizar conexões
            Render.updateMinimap();
          }
        },

        handleMouseUp: function(e) {
          if (!this.isDragging) return;

          const viewport = document.getElementById('minimap-viewport');

          // Se foi um clique rápido num node de saída válida, mover
          if (this.dragType === 'node') {
            const roomEl = document.querySelector(`[data-room-id="${this.dragTarget}"]`);
            if (roomEl) {
              roomEl.classList.remove('dragging');

              // Se quase não moveu, considerar como clique
              const deltaX = Math.abs(e.clientX - this.startX);
              const deltaY = Math.abs(e.clientY - this.startY);
              if (deltaX < 5 && deltaY < 5) {
                // Verificar se é saída válida
                if (roomEl.classList.contains('valid-exit')) {
                  Game.move(this.dragTarget);
                } else if (roomEl.classList.contains('blocked-exit')) {
                  const room = GameState.rooms[this.dragTarget];
                  const msg = this.dragTarget === 'teto_masp' && !GameState.forceShieldDown
                    ? 'Um escudo de força mágico bloqueia o acesso!'
                    : '✈️ Você precisa voar para acessar ' + (room ? room.name : 'este local') + '.';
                  Log.add(msg, 'warning');
                }
              }
            }

            // Salvar posições após drag de node
            this.savePositions();
          }

          if (viewport) {
            viewport.classList.remove('dragging');
            viewport.classList.remove('dragging-node');
          }

          this.isDragging = false;
          this.dragType = null;
          this.dragTarget = null;
        },

        handleWheel: function(e) {
          e.preventDefault();

          const viewport = document.getElementById('minimap-viewport');
          if (!viewport) return;

          const delta = e.deltaY > 0 ? -0.15 : 0.15;
          const newZoom = Math.max(this.minZoom, Math.min(this.maxZoom, this.zoom + delta));

          // Zoom no ponto do cursor
          const rect = viewport.getBoundingClientRect();
          const cursorX = e.clientX - rect.left;
          const cursorY = e.clientY - rect.top;

          // Ajustar offset para zoom centrado no cursor
          const zoomRatio = newZoom / this.zoom;
          this.offsetX = cursorX - (cursorX - this.offsetX) * zoomRatio;
          this.offsetY = cursorY - (cursorY - this.offsetY) * zoomRatio;

          this.zoom = newZoom;
          this.applyTransform();
          this.savePositions();
        },

        handleTouchStart: function(e) {
          if (e.touches.length === 2) {
            // Pinch zoom - calcular distância inicial
            const touch1 = e.touches[0];
            const touch2 = e.touches[1];
            this.lastPinchDistance = Math.hypot(
              touch2.clientX - touch1.clientX,
              touch2.clientY - touch1.clientY
            );
            e.preventDefault();
          } else if (e.touches.length === 1) {
            // Single touch - pan ou drag
            const touch = e.touches[0];
            const roomEl = document.elementFromPoint(touch.clientX, touch.clientY)?.closest('.map-room');
            const viewport = document.getElementById('minimap-viewport');

            if (roomEl) {
              this.isDragging = true;
              this.dragType = 'node';
              this.dragTarget = roomEl.getAttribute('data-room-id');
              roomEl.classList.add('dragging');
              viewport.classList.add('dragging-node');
            } else {
              this.isDragging = true;
              this.dragType = 'pan';
              viewport.classList.add('dragging');
            }

            this.startX = touch.clientX;
            this.startY = touch.clientY;
            e.preventDefault();
          }
        },

        handleTouchMove: function(e) {
          if (e.touches.length === 2) {
            // Pinch zoom
            const touch1 = e.touches[0];
            const touch2 = e.touches[1];

            const currentDistance = Math.hypot(
              touch2.clientX - touch1.clientX,
              touch2.clientY - touch1.clientY
            );

            if (this.lastPinchDistance) {
              const delta = (currentDistance - this.lastPinchDistance) * 0.01;
              this.zoom = Math.max(this.minZoom, Math.min(this.maxZoom, this.zoom + delta));
              this.applyTransform();
            }

            this.lastPinchDistance = currentDistance;
            e.preventDefault();
          } else if (e.touches.length === 1 && this.isDragging) {
            const touch = e.touches[0];
            const viewport = document.getElementById('minimap-viewport');
            if (!viewport) return;

            if (this.dragType === 'pan') {
              const deltaX = touch.clientX - this.startX;
              const deltaY = touch.clientY - this.startY;

              this.offsetX += deltaX;
              this.offsetY += deltaY;

              this.startX = touch.clientX;
              this.startY = touch.clientY;

              this.applyTransform();
            } else if (this.dragType === 'node' && this.dragTarget) {
              const viewportRect = viewport.getBoundingClientRect();
              const width = viewportRect.width;
              const height = viewportRect.height;

              const x = (touch.clientX - viewportRect.left - this.offsetX) / this.zoom;
              const y = (touch.clientY - viewportRect.top - this.offsetY) / this.zoom;

              this.customPositions[this.dragTarget] = {
                x: (x / width) * 100,
                y: (y / height) * 100
              };

              Render.updateMinimap();
            }

            e.preventDefault();
          }
        },

        handleTouchEnd: function(e) {
          this.lastPinchDistance = null;

          if (this.isDragging) {
            const viewport = document.getElementById('minimap-viewport');

            if (this.dragType === 'node') {
              const roomEl = document.querySelector(`[data-room-id="${this.dragTarget}"]`);
              if (roomEl) {
                roomEl.classList.remove('dragging');

                // Verificar se foi um tap (toque rápido sem arrastar) para navegar
                if (e.changedTouches && e.changedTouches.length > 0) {
                  const touch = e.changedTouches[0];
                  const deltaX = Math.abs(touch.clientX - this.startX);
                  const deltaY = Math.abs(touch.clientY - this.startY);

                  // Se moveu menos de 10px, considerar como tap (navegar)
                  if (deltaX < 10 && deltaY < 10) {
                    if (roomEl.classList.contains('valid-exit')) {
                      Game.move(this.dragTarget);
                    } else if (roomEl.classList.contains('blocked-exit')) {
                      const room = GameState.rooms[this.dragTarget];
                      const msg = this.dragTarget === 'teto_masp' && !GameState.forceShieldDown
                        ? '🛡️ Um escudo de força mágico bloqueia o acesso! Derrote o Feiticeiro para removê-lo.'
                        : '✈️ Você precisa voar para acessar ' + (room ? room.name : 'este local') + '.';
                      Log.add(msg, 'warning');
                    }
                  }
                }
              }
              this.savePositions();
            }

            if (viewport) {
              viewport.classList.remove('dragging');
              viewport.classList.remove('dragging-node');
            }

            this.isDragging = false;
            this.dragType = null;
            this.dragTarget = null;
          }
        },

        applyTransform: function() {
          const minimap = document.getElementById('minimap');
          if (!minimap) return;

          minimap.style.transform = `translate(${this.offsetX}px, ${this.offsetY}px) scale(${this.zoom})`;
        },

        savePositions: function() {
          try {
            localStorage.setItem('avp_minimap_positions', JSON.stringify(this.customPositions));
            localStorage.setItem('avp_minimap_viewport', JSON.stringify({
              offsetX: this.offsetX,
              offsetY: this.offsetY,
              zoom: this.zoom
            }));
          } catch (e) {
            console.warn('Não foi possível salvar posições do minimapa:', e);
          }
        },

        loadPositions: function() {
          try {
            const saved = localStorage.getItem('avp_minimap_positions');
            if (saved) {
              this.customPositions = JSON.parse(saved);
            }

            const viewport = localStorage.getItem('avp_minimap_viewport');
            if (viewport) {
              const v = JSON.parse(viewport);
              this.offsetX = v.offsetX || 0;
              this.offsetY = v.offsetY || 0;
              this.zoom = v.zoom || 1;
            }
          } catch (e) {
            console.warn('Não foi possível carregar posições do minimapa:', e);
          }
        },

        resetPositions: function() {
          this.customPositions = {};
          this.offsetX = 0;
          this.offsetY = 0;
          this.zoom = 1;

          try {
            localStorage.removeItem('avp_minimap_positions');
            localStorage.removeItem('avp_minimap_viewport');
          } catch (e) {
            console.warn('Não foi possível limpar posições do minimapa:', e);
          }

          this.applyTransform();
          Render.updateMinimap();

          Log.add('Posições do minimapa resetadas.', 'info');
        }
      };

      // ============================================================================
      // MODALS - Sistema de modais
      // ============================================================================

      const Modals = {

          document.getElementById('modal-title').textContent = title;
          document.getElementById('modal-content').innerHTML = content;
          document.getElementById('modal-overlay').classList.add('active');
        },

        hide: function() {
          document.getElementById('modal-overlay').classList.remove('active', 'mapa-exclusive');
        },

        hideMapaAntigo: function() {
          document.getElementById('modal-overlay').classList.remove('active', 'mapa-exclusive');
        },

      // ============================================================================
      // GAME - Controlador principal
      // ============================================================================

      const Game = {
        // Inicializar jogo
        init: function() {
          // Inicializar sistema de som
          SoundSystem.init();

          // Parar música anterior antes de reinicializar (evita múltiplas instâncias)
          MusicSystem.stop();

          // Inicializar sistema de música (carrega MIDI em background)
          MusicSystem.init();

          // Inicializar sistema de música de combate
          CombatMusicSystem.init();
          DefeatMusicSystem.init();
           VictoryMusicSystem.init();
           ClickMusicSystem.init();
           GameOverMusicSystem.init();

           // Inicializar controlador do minimapa
          MinimapController.init();

          // Gerar seed
          GameState.seed = Date.now();

          // Clonar dados
          GameState.rooms = Utils.deepClone(ROOMS_DATA);
          GameState.characters = Utils.deepClone(CHARACTERS_DATA);
          GameState.items = Utils.deepClone(ITEMS_DATA);

          // Reset do estado
          GameState.time = 17 * 60;
          GameState.witchWords = 0;
          GameState.lastWitchWordTime = 0;
          GameState.gameOver = false;
          GameState.victory = false;
          GameState.deathReason = null;
          GameState.playerInventory = [];
          GameState.playerDefenseBonus = 0;
          GameState.playerDefenseBonusTurns = 0;
          GameState.demonSummoned = false;
          GameState.forceShieldDown = false;
          GameState.armedBomb = null;
          GameState.hasReadMagicBook = false;
          GameState.discoveredItems = new Set();
          GameState.skipNextTimeAdvance = false;
          GameState.roomTraps = {};
          GameState.visitedRooms = new Set(['masp']);
          GameState.energy = 100;
          GameState.fogActive = false;
          GameState.environmentTraps = {};
          GameState.nightModeActive = false;

          // Reset journal (keep persistent data)
          Journal.load();

          // Setup vendor trade inventory
          // (done in setupPositions)

          // Reset combat modal
          CombatModal.reset();

          // Reset eventos aleatórios
          RandomEvents.reset();

          // Gerar palavra mágica do demônio
          GameState.demonMagicWord = Utils.randomChoice(MAGIC_WORDS);

          // Posicionar entidades
          this.setupPositions();

          // Limpar log
          Log.clear();
          Log.add('Bem-vindo à Avenida Paulista!', 'success');
          Log.add('A Bruxa está no topo do MASP tentando abrir um portal dimensional.', 'warning');
          Log.add('Você deve derrotá-la antes que ela complete o ritual!', 'info');

          // Descobrir itens na sala inicial
          Object.values(GameState.items).forEach(function(item) {
            if (item.location === GameState.playerLocation && !item.isDestroyed && !item.isAnimated) {
              GameState.discoveredItems.add(item.id);
            }
          });

          // Atualizar UI
          Render.update();
        },

        // Posicionar personagens e itens
        setupPositions: function() {
          // Salas que NÃO requerem voo (para itens e personagens terrestres)
          const groundRooms = Object.keys(GameState.rooms).filter(r =>
            r !== 'teto_masp' && r !== 'subsolo_masp' &&
            GameState.rooms[r].requiresFlight !== true
          );

          // Todas as salas exceto teto_masp (para personagens que voam)
          const flyingRooms = Object.keys(GameState.rooms).filter(r => r !== 'teto_masp' && r !== 'subsolo_masp');

          // Posições fixas
          GameState.characters.player.location = 'masp';
          GameState.playerLocation = 'masp';

          GameState.characters.bruxa.location = 'teto_masp';
          GameState.characters.feiticeiro.location = 'tunel';
          GameState.characters.demonio.location = null; // Não começa no mapa
          GameState.characters.demonio.isSummoned = false;

          // Vendedor: posição aleatória
          if (GameState.characters.vendedor) {
            GameState.characters.vendedor.location = Utils.randomChoice(groundRooms);
            // Inventário do vendedor: 3 itens aleatórios do pool (cópias lógicas)
            var pool = GameState.characters.vendedor.tradePool || [];
            var tradeInv = [];
            var poolCopy = pool.slice();
            for (var vi = 0; vi < 3 && poolCopy.length > 0; vi++) {
              var idx = Math.floor(Utils.random() * poolCopy.length);
              tradeInv.push(poolCopy.splice(idx, 1)[0]);
            }
            GameState.characters.vendedor.tradeInventory = tradeInv;
          }

          // LIVRO sempre na LIVRARIA
          GameState.items.livro.location = 'livraria';

          // Relíquia sempre no subsolo do MASP
          if (GameState.items.reliquia) {
            GameState.items.reliquia.location = 'subsolo_masp';
          }

          // Comidas: espalhar pelas salas terrestres
          ['coxinha', 'acai', 'pastel'].forEach(function(foodId) {
            if (GameState.items[foodId]) {
              GameState.items[foodId].location = Utils.randomChoice(groundRooms);
            }
          });

          // Randomizar personagens RESPEITANDO canFly
          ['aguia', 'bombardeador', 'coruja', 'cachorro'].forEach(charId => {
            const char = GameState.characters[charId];
            // Se pode voar, pode ir em qualquer sala; se não, só groundRooms
            const validRooms = char.canFly ? flyingRooms : groundRooms;
            char.location = Utils.randomChoice(validRooms);
          });

          // Randomizar itens (SEMPRE em groundRooms - itens não voam!)
          const itemsToPlace = Object.keys(GameState.items).filter(i =>
            i !== 'livro' && i !== 'bomba' && i !== 'reliquia' &&
            i !== 'coxinha' && i !== 'acai' && i !== 'pastel' &&
            !GameState.items[i].isCrafted
          );
          itemsToPlace.forEach(itemId => {
            GameState.items[itemId].location = Utils.randomChoice(groundRooms);
          });

          // Bomba começa sem localização (criada pelo Bombardeador)
          GameState.items.bomba.location = null;
          GameState.items.bomba.isDestroyed = false;

          // ===== ARMADILHAS AMBIENTAIS =====
          var trapTypes = [
            { type: 'pisoQuebrado', preferredRooms: ['tunel', 'subsolo_masp'] },
            { type: 'fioTropeco', preferredRooms: ['rua_augusta', 'avenida_paulista_oeste'] },
            { type: 'gasResidual', preferredRooms: ['shopping', 'cinema'] }
          ];
          GameState.environmentTraps = {};
          trapTypes.forEach(function(t) {
            var validTrapRooms = t.preferredRooms.filter(function(r) { return GameState.rooms[r]; });
            if (validTrapRooms.length > 0) {
              var trapRoom = Utils.randomChoice(validTrapRooms);
              GameState.environmentTraps[trapRoom] = { type: t.type, triggered: false };
            }
          });

          // WORLD SANITY: validar posições iniciais (segurança extra)
          WorldSanity.init();
          WorldSanity.enforce();
        },

        // Fechar modal de explosão e verificar game over
        closeExplosionModal: function(playerDied) {
          Modals.hide();
          GameState._explosionInProgress = false;
          // Sempre verificar game over (vitória OU derrota) após explosão
          const gameCheck = Rules.checkGameOver();
          if (gameCheck.ended) {
            Modals.showGameOver(gameCheck.reason);
          }
        },

        // Processar resultado de ação
        processAction: function(result) {
          // Combat modal handles its own flow
          if (result.combatModal) {
            // Still advance time
            if (result.success && result.advanceTime) {
              if (GameState.skipNextTimeAdvance) {
                GameState.skipNextTimeAdvance = false;
                Log.add('☕ O efeito do CAFÉ fez o tempo não avançar!', 'success');
              } else {
                Events.advanceTime();
              }
            }
            // Discover items
            Object.values(GameState.items).forEach(function(item) {
              if (item.location === GameState.playerLocation && !item.isDestroyed && !item.isAnimated) {
                GameState.discoveredItems.add(item.id);
              }
            });
            Render.update();
            return;
          }

          if (result.message) {
            const type = result.success ? 'action' : 'warning';
            Log.add(result.message, type);
          }

          if (result.success && result.advanceTime) {
            if (GameState.skipNextTimeAdvance) {
              GameState.skipNextTimeAdvance = false;
              Log.add('☕ O efeito do CAFÉ fez o tempo não avançar!', 'success');
            } else {
              Events.advanceTime();
            }
          }

          // Verificar fim de jogo (não durante explosão - o modal de explosão controla o fluxo)
          if (!GameState._explosionInProgress) {
            const gameCheck = Rules.checkGameOver();
            if (gameCheck.ended) {
              Modals.showGameOver(gameCheck.reason);
            }
          }

          // Descobrir itens na sala atual
          Object.values(GameState.items).forEach(function(item) {
            if (item.location === GameState.playerLocation && !item.isDestroyed && !item.isAnimated) {
              GameState.discoveredItems.add(item.id);
            }
          });

          Render.update();
        },

        // Ações do jogador
        move: function(roomId) {
          var prevRoom = GameState.playerLocation;
          var panel = document.getElementById('location-panel');

          // Se mudou de sala, animar transição
          var self = this;
          if (prevRoom !== roomId) {
            var isTeto = (roomId === 'teto_masp');
            var delay = isTeto ? 300 : 160;

            panel.classList.remove('room-transition-in');
            panel.classList.add('room-transition-out');

            // Efeitos especiais do Teto do MASP
            if (isTeto) {
              var flashEl = document.createElement('div');
              flashEl.className = 'teto-flash-overlay';
              document.body.appendChild(flashEl);
              document.getElementById('game-container').classList.add('screen-shake');
              setTimeout(function() {
                flashEl.remove();
                document.getElementById('game-container').classList.remove('screen-shake');
              }, 500);
            }

            setTimeout(function() {
              self.processAction(Actions.moveTo(roomId));

              // NPCs na nova sala falam ao encontrar o jogador
              if (GameState.playerLocation !== prevRoom) {
                Object.values(GameState.characters).forEach(function(char) {
                  if (char.id === 'player') return;
                  if (!char.isAlive) return;
                  if (char.location !== GameState.playerLocation) return;
                  var phrases = NPC_PHRASES[char.id];
                  if (phrases && phrases.encounter && Utils.random() < 0.5) {
                    Log.add('💬 ' + char.name + ': "' + Utils.randomChoice(phrases.encounter) + '"', 'info');
                  }
                });
              }

              panel.classList.remove('room-transition-out');
              panel.classList.add('room-transition-in');

              // Glow no nome da sala
              var nameEl = document.getElementById('location-name');
              var glowClass = isTeto ? 'teto-masp-glow' : 'room-name-glow';
              nameEl.classList.remove('room-name-glow', 'teto-masp-glow');
              void nameEl.offsetWidth;
              nameEl.classList.add(glowClass);
              setTimeout(function() { nameEl.classList.remove(glowClass); }, isTeto ? 1050 : 650);
            }, delay);
          } else {
            // Mesma sala (tentativa inválida)
            this.processAction(Actions.moveTo(roomId));
          }
        },

        // === CRAFTING UI ===
        toggleCraftMode: function() {
          GameState.craftMode = !GameState.craftMode;
          GameState.craftSelection = [];
          this.updateCraftUI();
          Render.updateInventory();
        },

        updateCraftUI: function() {
          var btn = document.getElementById('craft-toggle-btn');
          var status = document.getElementById('craft-status');
          if (GameState.craftMode) {
            btn.classList.add('craft-active');
            btn.textContent = '✖';
            btn.title = 'Cancelar combinação';
            status.style.display = 'block';
            var sel = GameState.craftSelection || [];
            if (sel.length === 0) status.textContent = '⚗️ Selecione o 1º item para combinar';
            else if (sel.length === 1) status.textContent = '⚗️ Agora selecione o 2º item';
          } else {
            btn.classList.remove('craft-active');
            btn.textContent = '⚗️';
            btn.title = 'Combinar itens';
            status.style.display = 'none';
          }
        },

        craftSelect: function(itemId) {
          if (!GameState.craftMode) return;
          var sel = GameState.craftSelection || [];
          // Deselect if already selected
          var idx = sel.indexOf(itemId);
          if (idx > -1) { sel.splice(idx, 1); GameState.craftSelection = sel; this.updateCraftUI(); Render.updateInventory(); return; }
          if (sel.length >= 2) return;
          sel.push(itemId);
          GameState.craftSelection = sel;
          if (sel.length === 2) {
            // Attempt craft
            var result = Actions.craft(sel[0], sel[1]);
            GameState.craftMode = false;
            GameState.craftSelection = [];
            this.processAction(result);
            this.updateCraftUI();
          } else {
            this.updateCraftUI();
            Render.updateInventory();
          }
        },


        use: function(itemId, targetId) {
          const result = Actions.useItem(itemId, targetId);

          // Caso especial: precisa selecionar um item (Cera Mágica)
          if (result.message === 'SELECT_ITEM' && result.selectableItems) {
            this.openItemSelectModal(itemId, result.selectableItems);
            return;
          }

          // Caso especial: precisa selecionar um alvo (Hipnodisco)
          if (result.message === 'SELECT_HIPNO_TARGET' && result.selectableTargets) {
            this.openHipnoSelectModal(result.selectableTargets);
            return;
          }

          // Caso especial: precisa selecionar um alvo (Seta Mortal)
          if (result.message === 'SELECT_SETA_TARGET' && result.selectableTargets) {
            this.openSetaSelectModal(result.selectableTargets);
            return;
          }

          // Caso especial: precisa selecionar sala (Mapa Antigo)
          if (result.message === 'SELECT_MAPA_TARGET' && result.selectableRooms) {
            this.openMapaSelectModal(result.selectableRooms);
            return;
          }

          this.processAction(result);
        },

        // Reiniciar jogo
        restart: function() {
          Modals.hide();
          this.init();
        }
      };

      // ============================================================================
      // ACHIEVEMENTS - Sistema de conquistas
      // ============================================================================

      const Achievements = {
        definitions: {
          pacifista: { icon: '🕊️', name: 'Pacifista', desc: 'Vencer sem matar nenhum NPC (só a Bruxa)' },
          speedrunner: { icon: '⚡', name: 'Speedrunner', desc: 'Vencer antes das 19:00' },
          colecionador: { icon: '🎒', name: 'Colecionador', desc: 'Ter 8+ itens ao mesmo tempo' },
          diplomata: { icon: '🤝', name: 'Diplomata', desc: 'Converter o Demônio e hipnotizar o Feiticeiro' },
          sobrevivente: { icon: '💪', name: 'Sobrevivente', desc: 'Vencer com menos de 10 HP' },
          explorador: { icon: '🗺️', name: 'Explorador', desc: 'Visitar todas as salas' },
          alquimista: { icon: '⚗️', name: 'Alquimista', desc: 'Criar seu primeiro item craftado' }
        },
        unlockedThisSession: new Set(),
        tryUnlock: function(key) {
          if (this.unlockedThisSession.has(key)) return;
          var saved = this.load();
          if (saved[key]) return;
          saved[key] = true;
          this.save(saved);
          this.unlockedThisSession.add(key);
          this.showToast(key);
        },
        showToast: function(key) {
          var def = this.definitions[key];
          if (!def) return;
          var toast = document.createElement('div');
          toast.className = 'achievement-toast';
          toast.innerHTML = '<span class="toast-icon">' + def.icon + '</span>' +
            '<span class="toast-text">' +
            '<span class="toast-title">🏆 Conquista Desbloqueada!</span>' +
            '<span class="toast-name">' + def.name + '</span>' +
            '</span>';
          document.body.appendChild(toast);
          SoundSystem.playVictory();
          setTimeout(function() {
            toast.classList.add('hiding');
            setTimeout(function() { toast.remove(); }, 500);
          }, 3500);
        },
        load: function() {
          try { return JSON.parse(localStorage.getItem('avp_achievements') || '{}'); } catch(e) { return {}; }
        },
        save: function(data) {
          try { localStorage.setItem('avp_achievements', JSON.stringify(data)); } catch(e) {}
        },
        check: function() {
          var earned = [];
          var saved = this.load();
          var nonBruxaKills = Object.values(GameState.characters).filter(function(c) {
            return c.id !== 'player' && c.id !== 'bruxa' && !c.isAlive && !c.isAlly;
          });
          if (GameState.victory && nonBruxaKills.length === 0) { earned.push('pacifista'); saved.pacifista = true; }
          if (GameState.victory && GameState.time < 19 * 60) { earned.push('speedrunner'); saved.speedrunner = true; }
          if (GameState.playerInventory.length >= 8) { earned.push('colecionador'); saved.colecionador = true; }
          var demonConverted = GameState.characters.demonio && GameState.characters.demonio.isAlly;
          var feiticeiroHypno = GameState.characters.feiticeiro && GameState.characters.feiticeiro.isAlly;
          if (demonConverted && feiticeiroHypno) { earned.push('diplomata'); saved.diplomata = true; }
          if (GameState.victory && GameState.characters.player.hp < 10) { earned.push('sobrevivente'); saved.sobrevivente = true; }
          var totalRooms = Object.keys(GameState.rooms).length;
          if (GameState.visitedRooms && GameState.visitedRooms.size >= totalRooms) { earned.push('explorador'); saved.explorador = true; }
          this.save(saved);
          return { earned: earned, all: saved };
        },
        renderHTML: function() {
          var saved = this.load();
          if (GameState.victory) { var result = this.check(); saved = result.all; }
          var self = this;
          var html = '<div class="achievement-grid">';
          Object.keys(this.definitions).forEach(function(key) {
            var def = self.definitions[key];
            var isEarned = saved[key];
            html += '<div class="achievement-badge ' + (isEarned ? 'earned' : '') + '" title="' + def.desc + '">' +
              '<span class="achievement-icon">' + def.icon + '</span>' +
              '<strong>' + def.name + '</strong></div>';
          });
          html += '</div>';
          return html;
        }
      };

      // ============================================================================
      // JOURNAL - Diário do jogador
      // ============================================================================

      const Journal = {
        data: { rooms: {}, npcs: {}, lore: {} },
        loreFragments: {
          masp: 'O MASP foi inaugurado em 1947 por Assis Chateaubriand, guardando segredos além da arte...',
          cinema: 'Dizem que o projetor deste cinema ainda funciona sozinho à meia-noite, exibindo filmes que nunca existiram.',
          livraria: 'Entre os volumes antigos, há um que muda de conteúdo cada vez que é aberto.',
          tunel: 'Este túnel conectava bunkers secretos da Guerra Fria. Poucos sabem de sua existência.',
          distrito_italiano: 'Os imigrantes italianos trouxeram mais que comida — trouxeram magia mediterrânea.',
          teto_masp: 'Os símbolos no chão são runas de contenção. Alguém as desenhou para prender algo... ou alguém.',
          subsolo_masp: 'Escavações revelaram artefatos pré-colombianos sob o MASP. A energia mística é palpável.'
        },
        load: function() {
          try {
            var saved = JSON.parse(localStorage.getItem('avp_journal') || '{}');
            if (saved.rooms) this.data.rooms = saved.rooms;
            if (saved.npcs) this.data.npcs = saved.npcs;
            if (saved.lore) this.data.lore = saved.lore;
          } catch(e) {}
        },
        save: function() {
          try { localStorage.setItem('avp_journal', JSON.stringify(this.data)); } catch(e) {}
        },
        recordRoom: function(roomId) {
          if (!this.data.rooms[roomId]) {
            var room = GameState.rooms[roomId];
            if (room) {
              this.data.rooms[roomId] = { name: room.name, time: Utils.formatTime(GameState.time) };
              if (this.loreFragments[roomId] && !this.data.lore[roomId]) {
                this.data.lore[roomId] = this.loreFragments[roomId];
                Log.add('📓 Você descobriu algo sobre este lugar! Verifique seu Diário.', 'magic');
              }
              this.save();
            }
          }
        },
        recordNPC: function(npcId) {
          if (!this.data.npcs[npcId]) {
            var npc = GameState.characters[npcId];
            if (npc && npc.id !== 'player') {
              this.data.npcs[npcId] = { name: npc.name, time: Utils.formatTime(GameState.time) };
              this.save();
            }
          }
        },
        showModal: function() {
          var content = '<div>';
          content += '<div class="journal-tabs">';
          content += '<button class="journal-tab active" onclick="Journal.showTab(\'rooms\')">🏠 Salas (' + Object.keys(this.data.rooms).length + ')</button>';
          content += '<button class="journal-tab" onclick="Journal.showTab(\'npcs\')">👥 NPCs (' + Object.keys(this.data.npcs).length + ')</button>';
          content += '<button class="journal-tab" onclick="Journal.showTab(\'lore\')">📜 Lore (' + Object.keys(this.data.lore).length + ')</button>';
          content += '<button class="journal-tab" onclick="Journal.showTab(\'achievements\')">🏆 Conquistas</button>';
          content += '</div>';
          content += '<div id="journal-tab-content" class="journal-content">' + this.renderRooms() + '</div>';
          content += '<button class="btn" onclick="Modals.hide()" style="margin-top: 1rem;">Fechar</button></div>';
          Modals.show('📓 DIÁRIO', content);
        },
        showTab: function(tab) {
          var content = '';
          if (tab === 'rooms') content = this.renderRooms();
          else if (tab === 'npcs') content = this.renderNPCs();
          else if (tab === 'lore') content = this.renderLore();
          else if (tab === 'achievements') content = Achievements.renderHTML();
          document.getElementById('journal-tab-content').innerHTML = content;
          document.querySelectorAll('.journal-tab').forEach(function(t, i) {
            var tabs = ['rooms', 'npcs', 'lore', 'achievements'];
            t.className = 'journal-tab' + (tabs[i] === tab ? ' active' : '');
          });
        },
        renderRooms: function() {
          var entries = Object.values(this.data.rooms);
          if (entries.length === 0) return '<div class="journal-entry">Nenhuma sala descoberta ainda.</div>';
          return entries.map(function(r) { return '<div class="journal-entry">📍 ' + r.name + ' <small style="color:var(--text-muted)">(' + r.time + ')</small></div>'; }).join('');
        },
        renderNPCs: function() {
          var entries = Object.values(this.data.npcs);
          if (entries.length === 0) return '<div class="journal-entry">Nenhum NPC encontrado ainda.</div>';
          return entries.map(function(n) { return '<div class="journal-entry">👤 ' + n.name + ' <small style="color:var(--text-muted)">(' + n.time + ')</small></div>'; }).join('');
        },
        renderLore: function() {
          var entries = Object.entries(this.data.lore);
          if (entries.length === 0) return '<div class="journal-entry">Nenhum fragmento de lore descoberto.</div>';
          return entries.map(function(e) {
            var room = GameState.rooms[e[0]];
            return '<div class="journal-entry"><strong>' + (room ? room.name : e[0]) + ':</strong> <em>' + e[1] + '</em></div>';
          }).join('');
        },
        reset: function() { this.data = { rooms: {}, npcs: {}, lore: {} }; }
      };

      // ============================================================================
      // VENDOR TRADE - Sistema de troca com vendedor
      // ============================================================================

      const VendorTrade = {
        selectedVendorItem: null,

        openTradeModal: function() {
          var vendedor = GameState.characters.vendedor;
          if (!vendedor || !vendedor.isAlive || vendedor.location !== GameState.playerLocation) return;
          if (!vendedor.tradeInventory || vendedor.tradeInventory.length === 0) {
            Modals.show('🛒 VENDEDOR', '<p>O vendedor não tem nada para trocar.</p><button class="btn" onclick="Modals.hide()">Fechar</button>');
            return;
          }
          VendorTrade.selectedVendorItem = null;
          VendorTrade.showStep1();
        },

        showStep1: function() {
          var vendedor = GameState.characters.vendedor;
          var vendorItemsHtml = vendedor.tradeInventory.map(function(id) {
            var item = GameState.items[id];
            return '<button class="btn btn-item" onclick="VendorTrade.selectVendorItem(\'' + id + '\')" style="width:100%;margin:0.2rem 0;border-color:var(--accent-gold);color:var(--accent-gold);">' +
              (ITEM_ICONS[id] || '📦') + ' ' + item.name + ' <small>(' + item.weight + 'kg)</small></button>';
          }).join('');
          var content = '<p style="font-style:italic;color:var(--text-secondary);">"E aí, chefe! Vamo trocar?"</p>' +
            '<h4 style="margin:0.5rem 0 0.3rem;color:var(--accent-gold);">Escolha o que você quer:</h4>' +
            '<div style="max-height:40vh;overflow-y:auto;">' + vendorItemsHtml + '</div>' +
            '<button class="btn" onclick="Modals.hide()" style="margin-top:0.75rem;">Cancelar</button>';
          Modals.show('🛒 VENDEDOR AMBULANTE', content);
        },

        selectVendorItem: function(vendorItemId) {
          VendorTrade.selectedVendorItem = vendorItemId;
          var vendorItem = GameState.items[vendorItemId];
          var playerItems = GameState.playerInventory.filter(function(id) { return id !== 'reliquia'; });
          if (playerItems.length === 0) {
            Modals.show('🛒 VENDEDOR', '<p>Você não tem itens para trocar!</p><button class="btn" onclick="Modals.hide()">Fechar</button>');
            return;
          }
          var playerItemsHtml = playerItems.map(function(id) {
            var item = GameState.items[id];
            return '<button class="btn btn-item" onclick="VendorTrade.executeTrade(\'' + id + '\')" style="width:100%;margin:0.2rem 0;">' +
              (ITEM_ICONS[id] || '📦') + ' ' + item.name + ' (' + item.weight + 'kg)</button>';
          }).join('');
          var content = '<p style="color:var(--accent-gold);">Você quer: ' + (ITEM_ICONS[vendorItemId] || '📦') + ' <strong>' + vendorItem.name + '</strong></p>' +
            '<h4 style="margin:0.5rem 0 0.3rem;color:var(--accent-blue);">Dê em troca:</h4>' +
            '<div style="max-height:35vh;overflow-y:auto;">' + playerItemsHtml + '</div>' +
            '<button class="btn" onclick="VendorTrade.showStep1()" style="margin-top:0.5rem;">← Voltar</button> ' +
            '<button class="btn" onclick="Modals.hide()" style="margin-top:0.5rem;">Cancelar</button>';
          Modals.show('🛒 VENDEDOR AMBULANTE', content);
        },

        executeTrade: function(playerItemId) {
          var vendedor = GameState.characters.vendedor;
          var vendorItemId = VendorTrade.selectedVendorItem;
          if (!vendorItemId || !vendedor.tradeInventory) return;
          var vidx = vendedor.tradeInventory.indexOf(vendorItemId);
          var pidx = GameState.playerInventory.indexOf(playerItemId);
          if (vidx === -1 || pidx === -1) return;
          GameState.playerInventory.splice(pidx, 1);
          vendedor.tradeInventory.splice(vidx, 1);
          GameState.playerInventory.push(vendorItemId);
          vendedor.tradeInventory.push(playerItemId);
          if (playerItemId === 'mochila') {
            GameState.characters.player.maxWeight = Math.max(20, GameState.characters.player.maxWeight - 20);
            // Dropar itens excedentes ao trocar a mochila
            while (Rules.getInventoryWeight() > GameState.characters.player.maxWeight && GameState.playerInventory.length > 0) {
              var excessId = GameState.playerInventory[GameState.playerInventory.length - 1];
              var excessItem = GameState.items[excessId];
              GameState.playerInventory.pop();
              excessItem.location = GameState.playerLocation;
              Log.add('🎒 ' + excessItem.name + ' caiu da mochila!', 'info');
            }
          }
          if (vendorItemId === 'mochila') {
            GameState.characters.player.maxWeight += 20;
          }
          var givenItem = GameState.items[vendorItemId];
          var takenItem = GameState.items[playerItemId];
          SoundSystem.playUseItem();
          Log.add('🛒 Você trocou ' + takenItem.name + ' por ' + givenItem.name + ' com o Vendedor!', 'success');
          Modals.hide();
          Render.update();
        }
      };

      // ============================================================================
      // WORLD SANITY - Validação contínua para evitar regressões
      // ============================================================================

      const WorldSanity = {
        // Salas terrestres (cache)
        groundRooms: null,

        // Inicializar cache
        init: function() {
          this.groundRooms = Object.keys(GameState.rooms).filter(r =>
            r !== 'teto_masp' &&
            GameState.rooms[r].requiresFlight !== true
          );
        },

        // Executar todas as validações
        enforce: function() {
          this.sanitizeCharacters();
          this.sanitizeItems();
          this.sanitizeBombs();
        },

        // Personagens terrestres não podem estar em salas que requerem voo
        sanitizeCharacters: function() {
          if (!this.groundRooms) this.init();

          Object.values(GameState.characters).forEach(char => {
            if (char.id === 'player') return; // Player é tratado separadamente
            if (!char.isAlive) return;
            if (char.canFly) return; // Pode voar, sem problema
            if (!char.location) return;

            const room = GameState.rooms[char.location];
            if (room && room.requiresFlight) {
              // ERRO: personagem terrestre no céu! Teleportar para terra
              const newLocation = Utils.randomChoice(this.groundRooms);
              Log.add(`⚠️ CORREÇÃO: ${char.name} foi teleportado de volta ao solo (${GameState.rooms[newLocation].name})!`, 'warning');
              char.location = newLocation;
            }
          });
        },

        // Itens não podem permanecer em salas com mayHaveItems === false
        sanitizeItems: function() {
          Object.values(GameState.items).forEach(item => {
            if (!item.location) return;
            if (item.isDestroyed) return;

            const room = GameState.rooms[item.location];
            if (room && room.mayHaveItems === false) {
              // ERRO: item no céu! Destruir
              Log.add(`⚠️ ${item.name} caiu do céu e foi destruído!`, 'warning');
              item.location = null;
              item.isDestroyed = true;
            }
          });
        },

        // Bombas armadas não podem estar em salas aéreas
        sanitizeBombs: function() {
          if (!GameState.armedBomb) return;

          const room = GameState.rooms[GameState.armedBomb.location];
          if (room && room.requiresFlight) {
            // ERRO: bomba no céu! Desarmar
            Log.add(`⚠️ A bomba armada caiu do céu e foi desarmada!`, 'warning');
            GameState.armedBomb = null;
          }
        }
      };

      // ============================================================================
      // INTRO SYSTEM - Animação estilo Star Wars (DETERMINÍSTICO)
      // ============================================================================

      const IntroSystem = {
        safetyTimeout: null,
        isComplete: false,

        // ========================================
        // HISTÓRIA - EDITE O TEXTO ABAIXO:
        // ========================================
        storyText: `
      AVENIDA PAULISTA

      No final da década de 80, nas ruas movimentadas de São Paulo, uma terrível BRUXA toma posse do MASP, o icônico museu de arte da Avenida Paulista. Com seus poderes arcanos, ela tenta pronunciar QUATRO PALAVRAS MÁGICAS para abrir um portal dimensional e invocar forças das trevas sobre a cidade.


      Criaturas sobrenaturais passam a vagar pelas ruas. Um DEMÔNIO é visto nas sombras. O FEITICEIRO se esconde no túnel, aguardando o anoitecer. Mas nem tudo está perdido. Aliados improváveis surgem pelo caminho — uma CORUJA sábia, um fiel CACHORRO CARAMELO, e outros heróis urbanos.


      Artefatos místicos estão espalhados pela cidade. Uma ESPADA lendária. Um ESCUDO ancestral. E um LIVRO que guarda o segredo para conter as forças do mal. Você é a última esperança. Explore a cidade, reúna aliados, encontre armas e derrote a Bruxa antes que o ritual seja concluído...

        // Tooltip do clima: position fixed com posicionamento via JS
        var weatherTooltip = document.createElement('div');
        weatherTooltip.id = 'weather-tooltip-content';
        document.body.appendChild(weatherTooltip);
        document.querySelectorAll('.weather-indicator').forEach(function(ind) {
          ind.addEventListener('mouseenter', function() {
            var rect = ind.getBoundingClientRect();
            weatherTooltip.textContent = ind.getAttribute('data-tooltip');
            weatherTooltip.style.display = 'block';
            weatherTooltip.style.top = (rect.bottom + 6) + 'px';
            weatherTooltip.style.left = (rect.left + rect.width / 2 - weatherTooltip.offsetWidth / 2) + 'px';
          });
          ind.addEventListener('mouseleave', function() {
            weatherTooltip.style.display = 'none';
          });
        });

      O destino de São Paulo está em suas mãos.
        `,
        // ========================================

        formatStory: function() {
          const lines = this.storyText.trim().split('\n\n').filter(p => p.trim() !== '');
          let html = '';

          lines.forEach((paragraph, index) => {
            if (index === 0) {
              html += `<h1 class="crawl-title">${paragraph}</h1>`;
            } else if (index === lines.length - 1) {
              html += `<p class="crawl-final">${paragraph}</p>`;
            } else {
              html += `<p>${paragraph}</p>`;
            }
          });

          return html;
        },

        init: function() {
          const intro = document.getElementById('intro-container');
          if (!intro) {
            Game.init();
            return;
          }

          // Marcar que intro está ativo (esconde o jogo)
          document.body.classList.add('intro-active');

          // Inserir história formatada
          const crawl = document.getElementById('intro-crawl');
          crawl.innerHTML = this.formatStory();

          // Forçar reset completo da animação
          crawl.style.animation = 'none';
          void crawl.offsetHeight;

          // AGORA iniciar a animação via JS (60s para o novo keyframe 3D)
          crawl.style.animation = 'star-wars-crawl 168s linear forwards';

          // Iniciar música em velocidade lenta
          MusicSystem.init();
          MusicSystem.setSpeed(0.7);

          // Listener para fim da animação (once: true evita múltiplas execuções)
          crawl.addEventListener('animationend', () => this.complete(), { once: true });

          // Timer de segurança: se animação não terminar em 65s, forçar conclusão
          this.safetyTimeout = setTimeout(() => {
            if (!this.isComplete) {
              console.warn('IntroSystem: safety timeout triggered');
              this.complete();
            }
          }, 90000);
        },

        skip: function() {
          if (this.isComplete) return;
          this.complete();
        },

        complete: function() {
          if (this.isComplete) return;
          this.isComplete = true;

          // Limpar timer de segurança
          if (this.safetyTimeout) {
            clearTimeout(this.safetyTimeout);
            this.safetyTimeout = null;
          }

          // Remover intro
          const intro = document.getElementById('intro-container');
          if (intro) intro.remove();

          // Mostrar jogo
          document.body.classList.remove('intro-active');

          // Restaurar velocidade da música
          MusicSystem.setSpeed(1.0);

          // Iniciar jogo
          Game.init();
        }
      };

      // ============================================================================
      // INICIALIZAÇÃO
      // ============================================================================

      document.addEventListener('DOMContentLoaded', function() {
        IntroSystem.init();

        // Tooltip da bomba: position fixed com posicionamento via JS
        var bombBtn = document.getElementById('bomb-indicator-btn');
        var bombTooltip = document.getElementById('bomb-tooltip-content');
        if (bombBtn && bombTooltip) {
          // Mover tooltip para o body para escapar overflow:hidden
          document.body.appendChild(bombTooltip);
          bombBtn.addEventListener('mouseenter', function() {
            var rect = bombBtn.getBoundingClientRect();
            bombTooltip.style.display = 'block';
            bombTooltip.style.top = (rect.bottom + 8) + 'px';
            bombTooltip.style.left = Math.max(0, rect.right - bombTooltip.offsetWidth) + 'px';
          });
          bombBtn.addEventListener('mouseleave', function() {
            bombTooltip.style.display = 'none';
          });
        }

        // Scroll indicator listeners
        document.querySelectorAll('.scroll-indicator-container').forEach(el => {
          el.addEventListener('scroll', () => GameUI.updateScrollIndicators());
        });

        // Fechar modal ao clicar fora (exceto mapa exclusivo)
        document.getElementById('modal-overlay').addEventListener('click', function(e) {
          if (e.target === this && !this.classList.contains('mapa-exclusive')) {
            Modals.hide();
          }
        });
      });
    </script>
  </body>
</html>
