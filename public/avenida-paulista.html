<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Explore a Avenida Paulista em um RPG de aventura e sobrevivência. Enfrente a Bruxa, o Bombardeador e criaturas sombrias enquanto busca itens e desvenda mistérios pela avenida mais icônica de São Paulo."
    />
    <meta name="author" content="Avenida Paulista Adventure" />
    <meta
      name="keywords"
      content="RPG, aventura, jogo, Avenida Paulista, São Paulo, browser game, text adventure, survival"
    />

    <meta property="og:title" content="Avenida Paulista - Adventure RPG" />
    <meta
      property="og:description"
      content="Um RPG de aventura e sobrevivência na Avenida Paulista. Enfrente a Bruxa, o Bombardeador e criaturas sombrias em São Paulo."
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Avenida Paulista - Adventure RPG" />
    <meta
      name="twitter:description"
      content="RPG de aventura e sobrevivência na avenida mais icônica de São Paulo. Jogue direto no navegador!"
    />

    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏙️</text></svg>"
    />
    <title>Avenida Paulista - Adventure RPG</title>
    <style>
      /* ========== RESET & BASE ========== */
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --bg-primary: #0a0a0f;
        --bg-secondary: #12121a;
        --bg-tertiary: #1a1a25;
        --text-primary: #e8e8f0;
        --text-secondary: #a0a0b0;
        --text-muted: #606070;
        --accent-gold: #d4a846;
        --accent-gold-dim: #8a6d2e;
        --accent-red: #c94040;
        --accent-green: #40a060;
        --accent-blue: #4080c0;
        --accent-purple: #8040a0;
        --border-color: #2a2a35;
        --shadow: 0 4px 20px rgba(0,0,0,0.5);
        --radius: 8px;
        --font-mono: 'Courier New', Courier, monospace;
        --font-sans: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      }

      html, body {
        height: 100%;
        font-family: var(--font-sans);
        background: var(--bg-primary);
        color: var(--text-primary);
        line-height: 1.5;
      }

      /* ========== LAYOUT ========== */
      #game-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        max-width: 1200px;
        margin: 0 auto;
        padding: 1rem;
        gap: 1rem;
        transition: --bg-primary 0.5s ease, --bg-secondary 0.5s ease, --bg-tertiary 0.5s ease,
                    --text-primary 0.5s ease, --text-secondary 0.5s ease, --border-color 0.5s ease,
                    --accent-gold 0.5s ease;
      }

      /* Sala destruida - tons avermelhados/cinzentos */
      #game-container.theme-ruins {
        --bg-primary: #1a0a0a;
        --bg-secondary: #201010;
        --bg-tertiary: #2a1515;
        --text-primary: #d0b0b0;
        --text-secondary: #907070;
        --border-color: #3a2020;
        --accent-gold: #a06040;
      }

      /* Ceu - tons azuis etéreos */
      #game-container.theme-sky {
        --bg-primary: #0a0f1a;
        --bg-secondary: #101825;
        --bg-tertiary: #152030;
        --text-primary: #c0d8f0;
        --text-secondary: #7090b0;
        --border-color: #203050;
        --accent-gold: #60a0d0;
      }

      /* Bomba ativa na sala - tons alaranjados tensos */
      #game-container.theme-bomb {
        --bg-primary: #1a100a;
        --bg-secondary: #201810;
        --bg-tertiary: #2a2015;
        --text-primary: #f0d0a0;
        --text-secondary: #b08050;
        --border-color: #3a2a10;
        --accent-gold: #e08020;
      }

      /* ========== HEADER (compacto, dentro do game-panel) ========== */
      #header {
        background: linear-gradient(135deg, var(--bg-secondary), var(--bg-tertiary));
        border: 1px solid var(--border-color);
        border-radius: var(--radius);
        padding: 0.5rem 1rem;
        display: flex;
        justify-content: flex-start;
        align-items: center;
        flex-wrap: nowrap;
        gap: 0.5rem;
        box-shadow: var(--shadow);
        flex-shrink: 0;
      }

      #stats {
        display: flex;
        gap: 1rem;
        flex-wrap: nowrap;
        font-family: var(--font-mono);
        font-size: 0.85rem;
        flex: 1;
        min-width: 0;
        overflow: hidden;
      }

      .stat {
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .stat-label {
        color: var(--text-secondary);
      }

      .stat-value {
        font-weight: bold;
        padding: 0.2rem 0.5rem;
        background: var(--bg-primary);
        border-radius: 4px;
      }

      #time-display { color: var(--accent-gold); }
      #hp-display { color: var(--accent-green); }
      #hp-display.danger { color: var(--accent-red); }
      #weight-display { color: var(--accent-blue); }

      /* ========== MAIN CONTENT ========== */
      #main-content {
        display: flex;
        gap: 1rem;
        flex: 1;
        min-height: 0;
        align-items: stretch;
      }

      /* ========== LEFT COLUMN ========== */
      #left-column {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 1rem;
        min-width: 0;
        /* Garante que o container ocupe a altura total para dividir */
        height: 100%;
      }

      /*
        ALTERAÇÃO: Log Panel agora é flex: 1 (50% do espaço)
        e removemos max-height fixo.
      */
      #log-panel {
        background: linear-gradient(135deg, #1a1a2e, #16213e);
        border: 1px solid var(--accent-blue);
        flex: 1; /* Ocupa espaço flexível */
        min-height: 0; /* Permite scroll interno */
        border-radius: var(--radius);
        padding: 1rem;
        box-shadow: var(--shadow);
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }

      #log-container {
        flex: 1;
        min-height: 0;
        max-height: 100%;
        overflow-y: auto;
        overflow-x: hidden;
        padding: 0.5rem;
        background: var(--bg-primary);
        border-radius: var(--radius);
        font-family: var(--font-mono);
        font-size: 0.9rem; /* Aumentei um pouco a fonte para aproveitar o espaço */
        line-height: 1.6;
        word-wrap: break-word;
        word-break: break-word;
      }

      /*
        ALTERAÇÃO: Left Bottom agora é flex: 1 (os outros 50% do espaço)
      */
      #left-bottom {
        display: flex;
        gap: 1rem;
        flex: 1; /* Ocupa o restante do espaço vertical */
        min-height: 0;
      }

      #left-bottom #location-panel {
        flex: 1;
        overflow-y: auto;
        min-width: 0;
      }

      /*
        ALTERAÇÃO: Aumentar largura do inventário horizontalmente
      */
      #left-bottom #inventory-panel {
        flex: 0 0 340px; /* Aumentado de 220px para 340px */
        max-height: none;
        overflow-y: auto;
      }

      /* ========== RIGHT SIDEBAR (mapa + inventário) ========== */
      #right-sidebar {
        flex: 0 0 auto;
        width: 320px;
        min-width: 280px;
        max-width: 400px;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }

      #minimap-container {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }

      .panel {
        background: var(--bg-secondary);
        border: 1px solid var(--border-color);
        border-radius: var(--radius);
        padding: 1rem;
        box-shadow: var(--shadow);
      }

      #location-panel {
        flex-shrink: 0;
      }

      #location-name {
        font-size: 1.3rem;
        font-weight: bold;
        color: var(--accent-gold);
        margin-bottom: 0.5rem;
        font-family: var(--font-mono);
      }

      #location-description {
        color: var(--text-secondary);
        margin-bottom: 1rem;
        line-height: 1.6;
      }

      .section-title {
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: var(--text-muted);
        margin-bottom: 0.5rem;
        border-bottom: 1px solid var(--border-color);
        padding-bottom: 0.3rem;
      }

      /*
        ALTERAÇÃO: Nova classe de animação para o título do Log
      */
      @keyframes modern-pulse {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }

      .modern-pulse-title {
        font-size: 1.2rem;
        letter-spacing: 3px;
        text-transform: uppercase;
        font-family: var(--font-mono);
        font-weight: 800;
        margin: 0;
        padding: 0;
        border: none;

        /* Gradiente animado */
        background: linear-gradient(270deg, var(--accent-gold), #fff, var(--accent-gold), var(--accent-gold-dim));
        background-size: 300% 300%;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;

        animation: modern-pulse 4s ease infinite;
        text-shadow: 0 0 15px rgba(212, 168, 70, 0.2);
      }

      .button-group {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin-bottom: 1rem;
      }

      .btn {
        font-family: var(--font-mono);
        font-size: 0.85rem;
        padding: 0.5rem 1rem;
        border: 1px solid var(--border-color);
        border-radius: var(--radius);
        background: var(--bg-tertiary);
        color: var(--text-primary);
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .btn:hover {
        background: var(--accent-gold-dim);
        border-color: var(--accent-gold);
        transform: translateY(-1px);
      }

      .btn:active {
        transform: translateY(0);
      }

      .btn-item {
        background: linear-gradient(135deg, #2a1a1a, #1a1a0a);
        border-color: var(--accent-gold-dim);
      }

      .btn-item:hover {
        background: var(--accent-gold);
        color: #000;
      }

      .btn-character {
        background: linear-gradient(135deg, #2a1a2a, #1a0a1a);
        border-color: var(--accent-purple);
      }

      .btn-character:hover {
        background: var(--accent-purple);
        color: #fff;
      }

      .btn-character.ally {
        border-color: var(--accent-green);
        background: linear-gradient(135deg, #1a2a1a, #0a150a);
      }

      .btn-character.hostile {
        border-color: var(--accent-red);
        background: linear-gradient(135deg, #2a1a1a, #1a0a0a);
      }

      .btn-danger {
        background: linear-gradient(135deg, #2a1a1a, #1a0a0a);
        border-color: var(--accent-red);
      }

      .btn-danger:hover {
        background: var(--accent-red);
        color: #fff;
      }

      /* ========== INVENTORY PANEL ========== */
      #inventory-panel {
        flex-shrink: 0;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }

      #inventory-panel .section-title {
        position: sticky;
        top: 0;
        z-index: 2;
        background: var(--bg-secondary);
        margin: 0 0 0.5rem 0;
        padding-bottom: 0.3rem;
      }

      #inventory-panel .inventory-scroll-wrap {
        flex: 1;
        overflow-y: auto;
        position: relative;
      }

      /* ========== SUBTLE SCROLL INDICATORS ========== */
      .scroll-indicator-container {
        position: relative;
      }
      .scroll-indicator-container::after {
        content: '';
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 24px;
        background: linear-gradient(to bottom, transparent, var(--bg-secondary));
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.3s ease;
      }
      .scroll-indicator-container.has-overflow-below::after {
        opacity: 1;
      }

      #inventory-list {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }

      .inventory-item {
        display: flex;
        justify-content: space-between;
        align-items: center; /* Alinha o botão de ação verticalmente */
        padding: 0.6rem 0.5rem; /* Um pouco mais de padding vertical */
        background: var(--bg-tertiary);
        border-radius: var(--radius);
        border: 1px solid var(--border-color);
        overflow: hidden;
        min-width: 0;
      }

      .inventory-item > div:first-child {
        min-width: 0;
        overflow: hidden;
      }

      /*
        ALTERAÇÃO: Formatação dos itens do inventário
      */
      .inventory-item-name {
        display: block; /* Força quebra de linha */
        font-family: var(--font-mono);
        font-size: 0.9rem;
        color: var(--accent-gold);
        margin-bottom: 2px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .inventory-item-weight {
        display: block; /* Força quebra de linha (abaixo do nome) */
        font-size: 0.75rem;
        color: var(--text-muted);
      }

      .inventory-actions {
        display: flex;
        gap: 0.3rem;
        flex-shrink: 0;
        margin-left: 0.5rem;
      }

      .btn-small {
        font-size: 1rem;
        padding: 0.2rem 0.4rem;
        line-height: 1;
      }

      /* ========== LOG ENTRY STYLES ========== */
      .log-entry {
        padding: 0.2rem 0;
        border-bottom: 1px solid var(--border-color);
        overflow-wrap: break-word; /* Quebrar palavras longas */
      }

      .log-entry:last-child {
        border-bottom: none;
      }

      .log-time {
        color: var(--text-muted);
        font-size: 0.75rem;
        margin-right: 0.5rem;
      }

      .log-action { color: var(--accent-blue); }
      .log-success { color: var(--accent-green); }
      .log-danger { color: var(--accent-red); }
      .log-warning { color: var(--accent-gold); }
      .log-info { color: var(--text-secondary); }
      .log-magic { color: var(--accent-purple); font-style: italic; }

      /* ========== MINIMAP (estilos internos) ========== */
      #minimap-container {
        background:
          /* Grid sutil de quadras da cidade */
          linear-gradient(rgba(40, 40, 55, 0.3) 1px, transparent 1px),
          linear-gradient(90deg, rgba(40, 40, 55, 0.3) 1px, transparent 1px),
          linear-gradient(180deg, #0a0a12 0%, #08080d 100%);
        background-size: 20px 20px, 20px 20px, 100% 100%;
        border-radius: var(--radius);
        padding: 0.75rem;
        position: relative;
        overflow: hidden;
        border: 1px solid rgba(42, 42, 53, 0.8);
      }

      #minimap-container::before {
        content: '';
        position: absolute;
        inset: 0;
        background:
          radial-gradient(ellipse at 50% 0%, rgba(212, 168, 70, 0.03) 0%, transparent 50%),
          radial-gradient(ellipse at 50% 100%, rgba(64, 128, 192, 0.02) 0%, transparent 40%);
        pointer-events: none;
      }

      #minimap-header {
        display: flex;
        justify-content: center;
        align-items: center;
        margin-bottom: 0.5rem;
        position: relative;
      }

      #minimap-title {
        font-size: 0.65rem;
        text-transform: uppercase;
        letter-spacing: 2px;
        color: var(--accent-gold);
        text-align: center;
        font-weight: 600;
        text-shadow: 0 0 10px rgba(212, 168, 70, 0.3);
      }

      #minimap-reset {
        position: absolute;
        right: 0;
        top: 50%;
        transform: translateY(-50%);
        background: var(--bg-tertiary);
        border: 1px solid var(--border-color);
        border-radius: 4px;
        color: var(--text-secondary);
        font-size: 0.8rem;
        padding: 0.2rem 0.4rem;
        cursor: pointer;
        transition: all 0.2s ease;
      }

      #minimap-reset:hover {
        background: var(--accent-gold-dim);
        border-color: var(--accent-gold);
        color: var(--text-primary);
      }

      #minimap-viewport {
        position: relative;
        width: 100%;
        flex: 1;
        min-height: 0;
        overflow: hidden;
        cursor: grab;
        touch-action: none;
      }

      #minimap-viewport.dragging {
        cursor: grabbing;
      }

      #minimap-viewport.dragging-node {
        cursor: move;
      }

      #minimap {
        position: absolute;
        width: 100%;
        height: 100%;
        transform-origin: 0 0;
      }

      .map-room {
        position: absolute;
        /* Círculo de interseção - estilo mapa de cidade */
        background: radial-gradient(circle,
          rgba(45, 45, 60, 0.95) 0%,
          rgba(30, 30, 42, 0.9) 100%
        );
        border: 2px solid rgba(80, 80, 100, 0.8);
        border-radius: 50%;
        width: 28px;
        height: 28px;
        padding: 0;
        font-size: 0.45rem;
        font-family: var(--font-mono);
        font-weight: 600;
        color: rgba(180, 180, 200, 0.9);
        text-align: center;
        line-height: 24px;
        cursor: move;
        transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
        transform: translate(-50%, -50%);
        box-shadow:
          0 0 0 3px rgba(30, 30, 42, 0.8),
          0 2px 8px rgba(0, 0, 0, 0.5);
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: center;
        user-select: none;
      }

      .map-room:hover {
        transform: translate(-50%, -50%) scale(1.15);
        z-index: 20;
      }

      .map-room.dragging {
        opacity: 0.8;
        z-index: 100;
        box-shadow:
          0 0 0 3px rgba(212, 168, 70, 0.6),
          0 4px 16px rgba(0, 0, 0, 0.7);
        transition: none;
      }

      .map-room.current {
        /* Marcador "Você está aqui" - dourado destacado */
        background: radial-gradient(circle,
          rgba(212, 168, 70, 0.4) 0%,
          rgba(180, 140, 50, 0.6) 100%
        );
        border: 3px solid var(--accent-gold);
        color: var(--accent-gold);
        width: 36px;
        height: 36px;
        line-height: 30px;
        font-size: 0.5rem;
        box-shadow:
          0 0 0 4px rgba(30, 30, 42, 0.9),
          0 0 15px rgba(212, 168, 70, 0.5),
          0 0 30px rgba(212, 168, 70, 0.2);
        z-index: 15;
        animation: current-pulse 2s ease-in-out infinite;
      }

      /* Salas adjacentes (saídas válidas) - destinos clicáveis */
      .map-room.valid-exit {
        background: radial-gradient(circle,
          rgba(88, 166, 255, 0.2) 0%,
          rgba(56, 139, 219, 0.3) 100%
        );
        border: 2px solid rgba(88, 166, 255, 0.8);
        color: rgba(140, 190, 255, 1);
        cursor: pointer;
        box-shadow:
          0 0 0 3px rgba(30, 30, 42, 0.8),
          0 0 10px rgba(88, 166, 255, 0.4);
      }

      .map-room.valid-exit:hover {
        transform: translate(-50%, -50%) scale(1.2);
        box-shadow:
          0 0 0 4px rgba(30, 30, 42, 0.9),
          0 0 20px rgba(88, 166, 255, 0.6);
      }

      /* Saídas bloqueadas (requer voo ou escudo) */
      .map-room.blocked-exit {
        border: 2px dashed rgba(255, 180, 60, 0.5);
        color: rgba(255, 180, 60, 0.7);
        cursor: not-allowed;
      }

      @keyframes current-pulse {
        0%, 100% {
          box-shadow:
            0 0 0 4px rgba(30, 30, 42, 0.9),
            0 0 15px rgba(212, 168, 70, 0.5),
            0 0 30px rgba(212, 168, 70, 0.2);
        }
        50% {
          box-shadow:
            0 0 0 4px rgba(30, 30, 42, 0.9),
            0 0 20px rgba(212, 168, 70, 0.7),
            0 0 40px rgba(212, 168, 70, 0.3);
        }
      }

      .map-room.has-enemy::after {
        content: '';
        position: absolute;
        top: -3px;
        right: -3px;
        width: 10px;
        height: 10px;
        background: var(--accent-red);
        border-radius: 50%;
        border: 2px solid rgba(30, 30, 42, 0.9);
        animation: enemy-blink 1s ease-in-out infinite;
      }

      @keyframes enemy-blink {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.6; transform: scale(0.85); }
      }

      .map-room.has-ally::after {
        content: '';
        position: absolute;
        top: -3px;
        right: -3px;
        width: 10px;
        height: 10px;
        background: var(--accent-green);
        border-radius: 50%;
        border: 2px solid rgba(30, 30, 42, 0.9);
      }

      .map-room.has-both::after {
        content: '';
        position: absolute;
        top: -3px;
        right: -3px;
        width: 10px;
        height: 10px;
        background: linear-gradient(135deg, var(--accent-red) 50%, var(--accent-green) 50%);
        border-radius: 50%;
        border: 2px solid rgba(30, 30, 42, 0.9);
        animation: enemy-blink 1s ease-in-out infinite;
      }

      .map-room.has-bomb::after {
        content: '💣';
        position: absolute;
        top: -8px;
        right: -8px;
        font-size: 0.6rem;
        z-index: 25;
        animation: bomb-pulse 1s ease-in-out infinite;
      }

      /* Quando tem bomba E inimigo/aliado, bomba fica à esquerda */
      .map-room.has-bomb.has-enemy::after,
      .map-room.has-bomb.has-ally::after,
      .map-room.has-bomb.has-both::after {
        right: auto;
        left: -8px;
      }

      .map-room .item-indicator {
        position: absolute;
        bottom: -10px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 0.45rem;
        z-index: 25;
        white-space: nowrap;
        pointer-events: none;
        line-height: 1;
      }

      @keyframes bomb-pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.5; transform: scale(1.3); }
      }

      /* Conexões como RUAS da cidade */
      .map-connection {
        position: absolute;
        background: linear-gradient(90deg,
          rgba(70, 70, 85, 0.5) 0%,
          rgba(90, 90, 110, 0.7) 10%,
          rgba(90, 90, 110, 0.7) 90%,
          rgba(70, 70, 85, 0.5) 100%
        );
        transform-origin: left center;
        height: 10px;
        z-index: 1;
        border-radius: 2px;
        box-shadow:
          inset 0 1px 0 rgba(255,255,255,0.08),
          inset 0 -1px 0 rgba(0,0,0,0.3),
          0 2px 4px rgba(0,0,0,0.4);
      }

      /* Linha central tracejada (faixa da rua) */
      .map-connection::after {
        content: '';
        position: absolute;
        top: 50%;
        left: 5%;
        right: 5%;
        height: 1px;
        background: repeating-linear-gradient(
          90deg,
          rgba(255, 220, 100, 0.25) 0px,
          rgba(255, 220, 100, 0.25) 6px,
          transparent 6px,
          transparent 12px
        );
        transform: translateY(-50%);
      }

      .map-legend {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        display: flex;
        justify-content: center;
        gap: 1rem;
        padding: 0.4rem;
        background: rgba(10, 10, 15, 0.8);
        border-radius: 0 0 var(--radius) var(--radius);
        border-top: 1px solid rgba(42, 42, 53, 0.4);
      }

      .legend-item {
        display: flex;
        align-items: center;
        gap: 4px;
        font-size: 0.6rem;
        color: var(--text-muted);
        font-family: var(--font-mono);
      }

      .legend-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        box-shadow: 0 0 6px currentColor;
      }

      .legend-dot.player {
        background: var(--accent-gold);
        box-shadow: 0 0 8px rgba(212, 168, 70, 0.6);
      }
      .legend-dot.enemy {
        background: var(--accent-red);
        box-shadow: 0 0 8px rgba(201, 64, 64, 0.6);
      }
      .legend-dot.ally {
        background: var(--accent-green);
        box-shadow: 0 0 8px rgba(64, 160, 96, 0.6);
      }

      #action-buttons {
        display: flex;
        gap: 0.5rem;
        margin-top: 0.5rem;
        flex-wrap: wrap;
      }

      /* ========== MODAL ========== */
      #modal-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.8);
        z-index: 100;
        justify-content: center;
        align-items: center;
      }

      #modal-overlay.active {
        display: flex;
      }

      #modal {
        background: var(--bg-secondary);
        border: 2px solid var(--accent-gold);
        border-radius: var(--radius);
        padding: 2rem;
        max-width: 500px;
        width: 90%;
        text-align: center;
        box-shadow: 0 0 50px rgba(212, 168, 70, 0.3);
      }

      #modal h2 {
        font-family: var(--font-mono);
        font-size: 1.5rem;
        color: var(--accent-gold);
        margin-bottom: 1rem;
      }

      #modal p {
        color: var(--text-secondary);
        margin-bottom: 1.5rem;
        line-height: 1.6;
      }

      #modal .btn {
        margin: 0.5rem;
      }

      /* ========== CHARACTER MODAL ========== */
      #character-modal-content {
        text-align: left;
      }

      #character-modal-content .character-stats {
        background: var(--bg-tertiary);
        padding: 1rem;
        border-radius: var(--radius);
        margin: 1rem 0;
        font-family: var(--font-mono);
        font-size: 0.9rem;
      }

      /* ========== RESPONSIVE ========== */
      @media (max-width: 800px) {
        #main-content {
          flex-direction: column;
        }

        /* Em mobile, restauramos o comportamento original
           para que os cards empilhem corretamente sem forçar 50/50
        */
        #log-panel {
           max-height: 250px;
           flex: 0 0 auto;
        }

        #left-bottom {
          flex-direction: column;
          flex: 0 0 auto;
        }

        #left-bottom #inventory-panel {
          flex: 0 0 auto;
          width: 100%; /* Largura total em mobile */
        }

        #right-sidebar {
          width: 100% !important;
        }

        #stats {
          font-size: 0.8rem;
          gap: 0.75rem;
        }
      }

      /* ========== SCROLLBAR ========== */
      ::-webkit-scrollbar {
        width: 8px;
      }

      ::-webkit-scrollbar-track {
        background: var(--bg-primary);
      }

      ::-webkit-scrollbar-thumb {
        background: var(--border-color);
        border-radius: 4px;
      }

      ::-webkit-scrollbar-thumb:hover {
        background: var(--text-muted);
      }

      /* ========== WITCH COUNTER ========== */
      #witch-indicator {
        display: flex;
        gap: 0.3rem;
        align-items: center;
      }

      .witch-orb {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: var(--bg-tertiary);
        border: 1px solid var(--accent-purple);
        transition: all 0.3s ease;
      }

      .witch-orb.active {
        background: var(--accent-purple);
        box-shadow: 0 0 10px var(--accent-purple);
      }

      /* ========== GLITCH EFFECT ========== */
      @keyframes glitch-skew {
        0% { transform: skew(0deg); }
        10% { transform: skew(-2deg); }
        20% { transform: skew(3deg); }
        30% { transform: skew(-1deg); }
        40% { transform: skew(2deg); }
        50% { transform: skew(-3deg); }
        60% { transform: skew(1deg); }
        70% { transform: skew(-2deg); }
        80% { transform: skew(2deg); }
        90% { transform: skew(-1deg); }
        100% { transform: skew(0deg); }
      }

      @keyframes glitch-color {
        0% { filter: hue-rotate(0deg) saturate(1); }
        25% { filter: hue-rotate(90deg) saturate(2); }
        50% { filter: hue-rotate(-90deg) saturate(1.5); }
        75% { filter: hue-rotate(180deg) saturate(2); }
        100% { filter: hue-rotate(0deg) saturate(1); }
      }

      .glitch-active {
        animation: glitch-skew 0.15s infinite linear, glitch-color 0.3s infinite linear;
        position: relative;
      }

      .glitch-active::before,
      .glitch-active::after {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: inherit;
        pointer-events: none;
      }

      .glitch-active::before {
        animation: glitch-offset 0.2s infinite linear;
        background: rgba(255, 0, 0, 0.1);
        mix-blend-mode: multiply;
      }

      .glitch-active::after {
        animation: glitch-offset 0.25s infinite linear reverse;
        background: rgba(0, 255, 255, 0.1);
        mix-blend-mode: multiply;
      }

      /* Overlay de glitch */
      #glitch-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 10000;
        display: none;
      }

      #glitch-overlay.active {
        display: block;
        animation: glitch-overlay-flash 0.1s infinite;
      }

      @keyframes glitch-overlay-flash {
        0% { background: rgba(255, 0, 0, 0.05); }
        25% { background: rgba(0, 255, 0, 0.08); }
        50% { background: rgba(0, 0, 255, 0.05); }
        75% { background: rgba(255, 255, 0, 0.06); }
        100% { background: rgba(255, 0, 255, 0.04); }
      }

      /* ========== WITCH FLASH EFFECT ========== */
      @keyframes witch-flash {
        0% { opacity: 1; }
        100% { opacity: 0; }
      }

      /* ========== INTRO STAR WARS ========== */
      #intro-container {
        position: fixed;
        inset: 0;
        background: black;
        z-index: 10000;
        overflow: hidden;
        perspective: 400px;
        perspective-origin: 50% 40%;
      }

      /* Esconder jogo durante intro */
      body.intro-active #game-container {
        visibility: hidden;
        pointer-events: none;
      }

      #intro-stars {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(1px 1px at 20% 30%, white, transparent),
          radial-gradient(1px 1px at 40% 70%, white, transparent),
          radial-gradient(1px 1px at 50% 50%, white, transparent),
          radial-gradient(1px 1px at 80% 10%, white, transparent),
          radial-gradient(1px 1px at 10% 60%, white, transparent),
          radial-gradient(1px 1px at 70% 40%, white, transparent),
          radial-gradient(1px 1px at 30% 80%, white, transparent),
          radial-gradient(1px 1px at 60% 90%, white, transparent);
        background-size: 200px 200px;
        opacity: 0.4;
      }

      #intro-skip {
        position: absolute;
        top: 2rem;
        right: 2rem;
        z-index: 10001;
        background: transparent;
        border: 1px solid var(--accent-gold);
        color: var(--accent-gold);
        padding: 0.5rem 1rem;
        cursor: pointer;
        font-family: var(--font-mono);
        font-size: 0.9rem;
        transition: all 0.2s ease;
      }

      #intro-skip:hover {
        background: var(--accent-gold);
        color: black;
      }

      #intro-crawl {
        position: absolute;
        width: 80%;
        left: 50%;
        bottom: 0;
        transform-style: preserve-3d;
        /* Animação iniciada via JS após inserir conteúdo */
        animation: none;
        text-align: justify;
        color: var(--accent-gold);
        font-size: 1.6rem;
        line-height: 1.8;
      }

      .crawl-title {
        font-size: 3rem;
        margin-bottom: 2rem;
        text-shadow: 0 0 20px rgba(212, 168, 70, 0.5);
        text-align: center;
      }

      #intro-crawl p {
        margin-bottom: 3rem;
      }

      .crawl-final {
        font-size: 2rem;
        margin-top: 3rem;
        font-style: italic;
      }

      @keyframes star-wars-crawl {
        0% {
          transform: translateX(-50%) rotateX(28deg) translateY(80vh) translateZ(0);
          opacity: 1;
        }
        100% {
          transform: translateX(-50%) rotateX(28deg) translateY(-400vh) translateZ(-1200px);
          opacity: 1;
        }
      }
      /* ========== RANDOM EVENTS OVERLAYS ========== */
      #rain-overlay {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 100;
        background: linear-gradient(transparent 0%, rgba(100, 130, 180, 0.08) 100%);
        opacity: 0;
        transition: opacity 1.5s ease;
      }
      #rain-overlay.active {
        opacity: 1;
      }
      #rain-overlay.active::before {
        content: '';
        position: absolute;
        inset: 0;
        background-image:
          repeating-linear-gradient(
            transparent,
            transparent 4px,
            rgba(170, 200, 255, 0.08) 4px,
            rgba(170, 200, 255, 0.08) 5px
          );
        background-size: 3px 100%;
        animation: rain-fall 0.4s linear infinite;
      }
      #rain-overlay.active::after {
        content: '';
        position: absolute;
        inset: 0;
        background-image:
          repeating-linear-gradient(
            transparent,
            transparent 6px,
            rgba(170, 200, 255, 0.05) 6px,
            rgba(170, 200, 255, 0.05) 7px
          );
        background-size: 5px 100%;
        animation: rain-fall 0.6s linear infinite;
        animation-delay: 0.2s;
      }

      @keyframes rain-fall {
        0% { transform: translateY(-100%); }
        100% { transform: translateY(100%); }
      }

      #fog-overlay {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 99;
        background: radial-gradient(ellipse at center, rgba(200, 210, 220, 0.12) 0%, rgba(180, 190, 200, 0.06) 50%, transparent 80%);
        opacity: 0;
        transition: opacity 2s ease;
      }
      #fog-overlay.active {
        opacity: 1;
      }

      #whisper-overlay {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 98;
        background: rgba(0, 0, 0, 0.15);
        opacity: 0;
        transition: opacity 1.5s ease;
      }
      #whisper-overlay.active {
        opacity: 1;
      }

      .screen-shake {
        animation: screen-shake 0.3s ease-out !important;
      }

      @keyframes screen-shake {
        0%, 100% { transform: translate(0, 0); }
        10% { transform: translate(-3px, -2px); }
        20% { transform: translate(4px, 1px); }
        30% { transform: translate(-2px, 3px); }
        40% { transform: translate(3px, -1px); }
        50% { transform: translate(-4px, 2px); }
        60% { transform: translate(2px, -3px); }
        70% { transform: translate(-1px, 4px); }
        80% { transform: translate(3px, -2px); }
        90% { transform: translate(-2px, 1px); }
      }
    </style>
  </head>

      const GlitchEffect = {
        isActive: false,

        // Dispara o efeito de glitch por um tempo determinado
        trigger: function(durationMs = 3000) {
          if (this.isActive) return;
          this.isActive = true;

          const container = document.getElementById('game-container');
          const overlay = document.getElementById('glitch-overlay');

          // Ativar glitch visual
          container.classList.add('glitch-active');
          overlay.classList.add('active');

          // Som de glitch (estático/ruído)
          this.playGlitchSound();

          // Desativar após duração
          setTimeout(() => {
            container.classList.remove('glitch-active');
            overlay.classList.remove('active');
            this.isActive = false;
          }, durationMs);
        },

        // Som de glitch usando ruído
        playGlitchSound: function() {
          if (!SoundSystem.audioCtx || !SoundSystem.enabled) return;

          const ctx = SoundSystem.audioCtx;
          const duration = 0.3;
          const intervals = 10;

          for (let i = 0; i < intervals; i++) {
            setTimeout(() => {
              if (!this.isActive) return;

              // Criar buffer de ruído
              const bufferSize = ctx.sampleRate * 0.05;
              const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
              const data = buffer.getChannelData(0);

              for (let j = 0; j < bufferSize; j++) {
                data[j] = (Math.random() * 2 - 1) * 0.3;
              }

              const noise = ctx.createBufferSource();
              noise.buffer = buffer;

              const gain = ctx.createGain();
              gain.gain.setValueAtTime(0.15 * SoundSystem.masterVolume, ctx.currentTime);
              gain.gain.exponentialValueToTargetAtTime(0.01, ctx.currentTime, 0.04);

              noise.connect(gain);
              gain.connect(ctx.destination);
              noise.start();
              noise.stop(ctx.currentTime + 0.05);
            }, i * 300);
          }
        }
      };

      const RandomEvents = {
        activeEvents: {},
        activeSounds: {},

        process: function() {
          if (GameState.gameOver) return;

          // 1. Decrementar e expirar eventos ativos
          const toRemove = [];
          Object.keys(this.activeEvents).forEach(function(eventId) {
            const active = RandomEvents.activeEvents[eventId];
            if (active.turnsLeft > 0) {
              active.turnsLeft--;
              if (active.turnsLeft <= 0) {
                toRemove.push(eventId);
              }
            }
          });
          toRemove.forEach(function(eventId) { RandomEvents.endEvent(eventId); });

          // 2. Tentar disparar novos eventos independentes
          Object.keys(RANDOM_EVENTS).forEach(function(eventId) {
            const evt = RANDOM_EVENTS[eventId];
            if (evt.parent) return;
            if (RandomEvents.isActive(eventId)) return;
            if (Utils.random() < evt.chance) {
              RandomEvents.startEvent(eventId);
            }
          });

          // 3. Processar filhos de eventos ativos
          Object.keys(RandomEvents.activeEvents).forEach(function(eventId) {
            const evt = RANDOM_EVENTS[eventId];
            if (!evt || !evt.children) return;
            evt.children.forEach(function(childId) {
              const child = RANDOM_EVENTS[childId];
              if (child && Utils.random() < child.chance) {
                RandomEvents.startEvent(childId);
              }
            });
          });
        },

        startEvent: function(eventId) {
          const evt = RANDOM_EVENTS[eventId];
          if (!evt) return;

          // Para eventos com duração, não iniciar se já ativo
          if (evt.duration !== 0 && this.isActive(eventId)) return;

          // Calcular duração
          var turnsLeft = 0;
          if (typeof evt.duration === 'object') {
            turnsLeft = Utils.randomInt(evt.duration.min, evt.duration.max);
          } else {
            turnsLeft = evt.duration;
          }

          // Registrar se tem duração
          if (turnsLeft > 0) {
            this.activeEvents[eventId] = { turnsLeft: turnsLeft, startedAt: GameState.time };
          }

          // Texto no log
          if (evt.text && evt.text.length > 0) {
            Log.add(Utils.randomChoice(evt.text), 'info');
          }

          // Som
          if (this.sounds[eventId]) {
            this.sounds[eventId]();
          }

          // Visual
          if (this.visuals[eventId]) {
            this.visuals[eventId](true);
          }
        },

        endEvent: function(eventId) {
          var evt = RANDOM_EVENTS[eventId];
          delete this.activeEvents[eventId];

          // Parar som contínuo
          this.stopSound(eventId);

          // Texto de fim
          if (evt && evt.endText && evt.endText.length > 0) {
            Log.add(Utils.randomChoice(evt.endText), 'info');
          }

          // Remover visual
          if (this.visuals[eventId]) {
            this.visuals[eventId](false);
          }

          // Encerrar filhos
          if (evt && evt.children) {
            var self = this;
            evt.children.forEach(function(childId) {
              if (self.isActive(childId)) {
                self.endEvent(childId);
              }
            });
          }
        },

        isActive: function(eventId) {
          return !!this.activeEvents[eventId];
        },

        stopSound: function(eventId) {
          if (this.activeSounds[eventId]) {
            try {
              this.activeSounds[eventId].forEach(function(node) {
                if (node.stop) node.stop();
                if (node.disconnect) node.disconnect();
              });
            } catch(e) {}
            delete this.activeSounds[eventId];
          }
        },

        reset: function() {
          var self = this;
          Object.keys(this.activeSounds).forEach(function(id) { self.stopSound(id); });
          this.activeEvents = {};
          this.activeSounds = {};
          ['rain-overlay', 'fog-overlay', 'whisper-overlay'].forEach(function(id) {

      // ============================================================================
      // SOUND SYSTEM - Web Audio API
      // ============================================================================

      const SoundSystem = {
        audioCtx: null,
        enabled: true,
        masterVolume: 0.3,

        init: function() {
          this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        },

        resume: function() {
          if (this.audioCtx && this.audioCtx.state === 'suspended') {
            this.audioCtx.resume();
          }
        },

        toggle: function() {
          this.enabled = !this.enabled;
          const btn = document.getElementById('sound-toggle');
          if (btn) {
            btn.textContent = this.enabled ? '🔊' : '🔇';
          }
        },

        // Criar oscilador básico
        createOsc: function(type, freq, duration, volume = 0.3) {
          if (!this.enabled || !this.audioCtx) return null;
          this.resume();

          const osc = this.audioCtx.createOscillator();
          const gain = this.audioCtx.createGain();

          osc.type = type;
          osc.frequency.value = freq;
          gain.gain.value = volume * this.masterVolume;

          osc.connect(gain);
          gain.connect(this.audioCtx.destination);

          return { osc, gain, ctx: this.audioCtx };
        },

        // Criar ruído branco
        createNoise: function(duration, volume = 0.2) {
          if (!this.enabled || !this.audioCtx) return null;
          this.resume();

          const bufferSize = this.audioCtx.sampleRate * duration;
          const buffer = this.audioCtx.createBuffer(1, bufferSize, this.audioCtx.sampleRate);
          const data = buffer.getChannelData(0);

          for (let i = 0; i < bufferSize; i++) {
            data[i] = Math.random() * 2 - 1;
          }

          const noise = this.audioCtx.createBufferSource();
          const gain = this.audioCtx.createGain();
          noise.buffer = buffer;
          gain.gain.value = volume * this.masterVolume;

          noise.connect(gain);
          gain.connect(this.audioCtx.destination);

          return { noise, gain, ctx: this.audioCtx };
        },

        // === SONS DO JOGO ===

        playAttack: function() {
          const result = this.createOsc('sawtooth', 400, 0.15);
          if (!result) return;
          const { osc, gain, ctx } = result;

          const now = ctx.currentTime;
          osc.frequency.linearRampToValueAtTime(100, now + 0.15);
          gain.gain.linearRampToValueAtTime(0, now + 0.15);

          osc.start(now);
          osc.stop(now + 0.15);
        },

        playHit: function() {
          // Ruído de impacto
          const noise = this.createNoise(0.1, 0.3);
          if (noise) {
            const now = noise.ctx.currentTime;
            noise.gain.gain.linearRampToValueAtTime(0, now + 0.1);
            noise.noise.start(now);
            noise.noise.stop(now + 0.1);
          }

          // Tom grave
          const result = this.createOsc('sine', 80, 0.2, 0.4);
          if (result) {
            const { osc, gain, ctx } = result;
            const now = ctx.currentTime;
            gain.gain.linearRampToValueAtTime(0, now + 0.2);
            osc.start(now);
            osc.stop(now + 0.2);
          }
        },

        playDeath: function() {
          const result = this.createOsc('sine', 400, 1.0, 0.3);
          if (!result) return;
          const { osc, gain, ctx } = result;

          const now = ctx.currentTime;
          osc.frequency.linearRampToValueAtTime(50, now + 1.0);
          gain.gain.setValueAtTime(0.3 * this.masterVolume, now);
          gain.gain.linearRampToValueAtTime(0, now + 1.0);

          osc.start(now);
          osc.stop(now + 1.0);
        },

        playMove: function() {
          const noise = this.createNoise(0.05, 0.1);
          if (!noise) return;

          const now = noise.ctx.currentTime;
          noise.gain.gain.linearRampToValueAtTime(0, now + 0.05);
          noise.noise.start(now);
          noise.noise.stop(now + 0.05);
        },

        playPickup: function() {
          const result = this.createOsc('sine', 300, 0.15);
          if (!result) return;
          const { osc, gain, ctx } = result;

          const now = ctx.currentTime;
          osc.frequency.linearRampToValueAtTime(600, now + 0.1);
          gain.gain.linearRampToValueAtTime(0, now + 0.15);

          osc.start(now);
          osc.stop(now + 0.15);
        },

        playUseItem: function() {
          const result = this.createOsc('triangle', 400, 0.3);
          if (!result) return;
          const { osc, gain, ctx } = result;

          const now = ctx.currentTime;
          // Vibrato
          const lfo = ctx.createOscillator();
          const lfoGain = ctx.createGain();
          lfo.frequency.value = 15;
          lfoGain.gain.value = 50;
          lfo.connect(lfoGain);
          lfoGain.connect(osc.frequency);

          gain.gain.linearRampToValueAtTime(0, now + 0.3);

          lfo.start(now);
          osc.start(now);
          lfo.stop(now + 0.3);
          osc.stop(now + 0.3);
        },

        playExplosion: function() {
          // Ruído de explosão
          const noise = this.createNoise(0.8, 0.5);
          if (noise) {
            const now = noise.ctx.currentTime;
            noise.gain.gain.linearRampToValueAtTime(0, now + 0.8);
            noise.noise.start(now);
            noise.noise.stop(now + 0.8);
          }

          // Baixo grave
          const result = this.createOsc('sine', 60, 0.5, 0.5);
          if (result) {
            const { osc, gain, ctx } = result;
            const now = ctx.currentTime;
            osc.frequency.linearRampToValueAtTime(20, now + 0.5);
            gain.gain.linearRampToValueAtTime(0, now + 0.5);
            osc.start(now);
            osc.stop(now + 0.5);
          }
        },

        playHeal: function() {
          const notes = [400, 500, 600, 800];
          const self = this;
          notes.forEach((freq, i) => {
            setTimeout(() => {
              const result = self.createOsc('sine', freq, 0.2);
              if (result) {
                const { osc, gain, ctx } = result;
                const now = ctx.currentTime;
                gain.gain.linearRampToValueAtTime(0, now + 0.2);
                osc.start(now);
                osc.stop(now + 0.2);
              }
            }, i * 80);
          });
        },

        playVictory: function() {
          const melody = [523, 659, 784, 1047]; // C5, E5, G5, C6
          const self = this;
          melody.forEach((freq, i) => {
            setTimeout(() => {
              const result = self.createOsc('square', freq, 0.3, 0.2);
              if (result) {
                const { osc, gain, ctx } = result;
                const now = ctx.currentTime;
                gain.gain.linearRampToValueAtTime(0, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
              }
            }, i * 150);
          });
        },

        playEnemyDefeat: function() {
          const notes = [600, 800, 1000];
          const self = this;
          notes.forEach((freq, i) => {
            setTimeout(() => {
              const result = self.createOsc('triangle', freq, 0.15);
              if (result) {
                const { osc, gain, ctx } = result;
                const now = ctx.currentTime;
                gain.gain.linearRampToValueAtTime(0, now + 0.15);
                osc.start(now);
                osc.stop(now + 0.15);
              }
            }, i * 60);
          });
        },

        playDarkMagic: function() {
          const result = this.createOsc('square', 100, 0.5, 0.2);
          if (!result) return;
          const { osc, gain, ctx } = result;

          const now = ctx.currentTime;
          osc.frequency.setValueAtTime(100, now);
          osc.frequency.linearRampToValueAtTime(150, now + 0.25);
          osc.frequency.linearRampToValueAtTime(80, now + 0.5);
          gain.gain.linearRampToValueAtTime(0, now + 0.5);

          osc.start(now);
          osc.stop(now + 0.5);
        },

        playBombTick: function() {
          const result = this.createOsc('sine', 800, 0.05, 0.3);
          if (!result) return;
          const { osc, gain, ctx } = result;

          const now = ctx.currentTime;
          gain.gain.linearRampToValueAtTime(0, now + 0.05);
          osc.start(now);
          osc.stop(now + 0.05);
        },

        playError: function() {
          const result = this.createOsc('square', 200, 0.2, 0.2);
          if (!result) return;
          const { osc, gain, ctx } = result;

          const now = ctx.currentTime;
          osc.frequency.linearRampToValueAtTime(100, now + 0.2);
          gain.gain.linearRampToValueAtTime(0, now + 0.2);
          osc.start(now);
          osc.stop(now + 0.2);
        }

        // Parser MIDI from embedded Base64 data (no external file needed)
        loadMIDI: async function() {
          try {
            // Decode Base64 to Uint8Array
            const binaryString = atob(MIDI_BASE64);
            const bytes = new Uint8Array(binaryString.length);
            for (let i = 0; i < binaryString.length; i++) {
              bytes[i] = binaryString.charCodeAt(i);
            }

            let pos = 0;
            const notes = [];

            // Funções auxiliares
            const readUint32 = () => (bytes[pos++] << 24) | (bytes[pos++] << 16) | (bytes[pos++] << 8) | bytes[pos++];
            const readUint16 = () => (bytes[pos++] << 8) | bytes[pos++];
            const readVarLen = () => {
              let value = 0, byte;
              do { byte = bytes[pos++]; value = (value << 7) | (byte & 0x7F); } while (byte & 0x80);
              return value;
            };
            const readString = (len) => { let str = ''; for (let i = 0; i < len; i++) str += String.fromCharCode(bytes[pos++]); return str; };

            // Header
            if (readString(4) !== 'MThd') throw new Error('Invalid MIDI');
            readUint32(); // length
            readUint16(); // format
            const numTracks = readUint16();
            const ticksPerQuarter = readUint16();

            let microsecondsPerBeat = 500000; // 120 BPM

            for (let t = 0; t < numTracks; t++) {
              if (readString(4) !== 'MTrk') continue;
              const trackLength = readUint32();
              const trackEnd = pos + trackLength;

              let absoluteTime = 0;
              let runningStatus = 0;
              const activeNotes = {};

              const tickToSeconds = (ticks) => (ticks / ticksPerQuarter) * (microsecondsPerBeat / 1000000);

              while (pos < trackEnd) {
                absoluteTime += readVarLen();
                let statusByte = bytes[pos];

                if (statusByte < 0x80) statusByte = runningStatus;
                else { pos++; if (statusByte < 0xF0) runningStatus = statusByte; }

                const cmd = statusByte & 0xF0;

                if (cmd === 0x90) {
                  const note = bytes[pos++], vel = bytes[pos++];
                  if (vel > 0) activeNotes[note] = { start: absoluteTime, vel };
                  else if (activeNotes[note]) {
                    notes.push({ t: tickToSeconds(activeNotes[note].start), n: note, d: tickToSeconds(absoluteTime - activeNotes[note].start), v: activeNotes[note].vel });
                    delete activeNotes[note];
                  }
                } else if (cmd === 0x80) {
                  const note = bytes[pos++]; pos++;
                  if (activeNotes[note]) {
                    notes.push({ t: tickToSeconds(activeNotes[note].start), n: note, d: tickToSeconds(absoluteTime - activeNotes[note].start), v: activeNotes[note].vel });
                    delete activeNotes[note];
                  }
                } else if (cmd === 0xA0 || cmd === 0xB0 || cmd === 0xE0) pos += 2;
                else if (cmd === 0xC0 || cmd === 0xD0) pos++;
                else if (statusByte === 0xFF) {
                  const type = bytes[pos++], len = readVarLen();
                  if (type === 0x51) microsecondsPerBeat = (bytes[pos] << 16) | (bytes[pos+1] << 8) | bytes[pos+2];
                  pos += len;
                } else if (statusByte === 0xF0 || statusByte === 0xF7) pos += readVarLen();
              }
            }

            notes.sort((a, b) => a.t - b.t);
            this.notes = notes;
            const lastNote = notes[notes.length - 1];
            this.duration = lastNote ? lastNote.t + lastNote.d : 0;
            this.isLoaded = true;

        // Tocar uma nota sintetizada (piano-like)
        playNote: function(note, startTime, duration, velocity) {
          const ctx = SoundSystem.audioCtx;
          if (!ctx || !SoundSystem.enabled) return;

          const freq = 440 * Math.pow(2, (note - 69) / 12);
          const vol = (velocity / 127) * this.volume * SoundSystem.masterVolume;

          // Oscilador principal (triangle - som mais suave)
          const osc1 = ctx.createOscillator();
          osc1.type = 'triangle';
          osc1.frequency.value = freq;

          // Segundo harmônico (oitava acima, mais suave)
          const osc2 = ctx.createOscillator();
          osc2.type = 'sine';
          osc2.frequency.value = freq * 2;

          // Mixer
          const gain1 = ctx.createGain();
          const gain2 = ctx.createGain();
          const masterGain = ctx.createGain();

          gain1.gain.value = 0.7;
          gain2.gain.value = 0.3;

          osc1.connect(gain1);
          osc2.connect(gain2);
          gain1.connect(masterGain);
          gain2.connect(masterGain);
          masterGain.connect(ctx.destination);

          // Envelope ADSR
          const now = startTime;
          const attackTime = 0.01;
          const decayTime = 0.1;
          const sustainLevel = 0.6;
          const releaseTime = 0.15;

          masterGain.gain.setValueAtTime(0, now);
          masterGain.gain.linearRampToValueAtTime(vol, now + attackTime);
          masterGain.gain.linearRampToValueAtTime(vol * sustainLevel, now + attackTime + decayTime);
          masterGain.gain.setValueAtTime(vol * sustainLevel, now + duration - releaseTime);
          masterGain.gain.linearRampToValueAtTime(0, now + duration);

          osc1.start(now);
          osc2.start(now);
          osc1.stop(now + duration + 0.1);
          osc2.stop(now + duration + 0.1);

          this.scheduledOscs.push(osc1, osc2);
        },

        scheduleNotes: function() {
          if (!this.isLoaded || !SoundSystem.audioCtx) return;

          const ctx = SoundSystem.audioCtx;
          this.startTime = ctx.currentTime;
          const speed = this.playbackSpeed || 1.0;

          this.notes.forEach(note => {
            this.playNote(
              note.n,
              this.startTime + (note.t / speed),
              note.d / speed,
              note.v
            );
          });

          // Agendar loop com duração ajustada pela velocidade
          if (this.isPlaying) {
            this.loopTimeoutId = setTimeout(() => {
              if (this.isPlaying) {
                this.scheduleNotes();
              }
            }, ((this.duration / speed) + 0.5) * 1000);
          }
        },
