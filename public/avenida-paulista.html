<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avenida Paulista - Adventure</title>
  <style>
    /* ========== RESET & BASE ========== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-primary: #0a0a0f;
      --bg-secondary: #12121a;
      --bg-tertiary: #1a1a25;
      --text-primary: #e8e8f0;
      --text-secondary: #a0a0b0;
      --text-muted: #606070;
      --accent-gold: #d4a846;
      --accent-gold-dim: #8a6d2e;
      --accent-red: #c94040;
      --accent-green: #40a060;
      --accent-blue: #4080c0;
      --accent-purple: #8040a0;
      --border-color: #2a2a35;
      --shadow: 0 4px 20px rgba(0,0,0,0.5);
      --radius: 8px;
      --font-mono: 'Courier New', Courier, monospace;
      --font-sans: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    html, body {
      height: 100%;
      font-family: var(--font-sans);
      background: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.5;
    }

    /* ========== LAYOUT ========== */
    #game-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-width: 1200px;
      margin: 0 auto;
      padding: 1rem;
      gap: 1rem;
    }

    /* ========== HEADER ========== */
    #header {
      background: linear-gradient(135deg, var(--bg-secondary), var(--bg-tertiary));
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 1rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      box-shadow: var(--shadow);
    }

    #game-title {
      font-family: var(--font-mono);
      font-size: 1.5rem;
      font-weight: bold;
      color: var(--accent-gold);
      text-shadow: 0 0 10px rgba(212, 168, 70, 0.3);
      letter-spacing: 2px;
    }

    #stats {
      display: flex;
      gap: 1.5rem;
      flex-wrap: wrap;
      font-family: var(--font-mono);
      font-size: 0.95rem;
    }

    .stat {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .stat-label {
      color: var(--text-secondary);
    }

    .stat-value {
      font-weight: bold;
      padding: 0.2rem 0.5rem;
      background: var(--bg-primary);
      border-radius: 4px;
    }

    #time-display { color: var(--accent-gold); }
    #hp-display { color: var(--accent-green); }
    #hp-display.danger { color: var(--accent-red); }
    #weight-display { color: var(--accent-blue); }

    /* ========== MAIN CONTENT ========== */
    #main-content {
      display: flex;
      gap: 1rem;
      flex: 1;
      min-height: 0;
    }

    /* ========== GAME PANEL ========== */
    #game-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      min-width: 0;
    }

    /* ========== MINIMAP ASIDE (altura total à direita) ========== */
    #minimap-container {
      flex: 1;
      min-width: 350px;
      max-width: 450px;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    .panel {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 1rem;
      box-shadow: var(--shadow);
    }

    #location-panel {
      flex-shrink: 0;
    }

    #location-name {
      font-size: 1.3rem;
      font-weight: bold;
      color: var(--accent-gold);
      margin-bottom: 0.5rem;
      font-family: var(--font-mono);
    }

    #location-description {
      color: var(--text-secondary);
      margin-bottom: 1rem;
      line-height: 1.6;
    }

    .section-title {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 0.3rem;
    }

    .button-group {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }

    .btn {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      padding: 0.5rem 1rem;
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      background: var(--bg-tertiary);
      color: var(--text-primary);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn:hover {
      background: var(--accent-gold-dim);
      border-color: var(--accent-gold);
      transform: translateY(-1px);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn-exit {
      background: linear-gradient(135deg, #1a2a1a, #0a150a);
      border-color: var(--accent-green);
    }

    .btn-exit:hover {
      background: var(--accent-green);
      color: #000;
    }

    .btn-item {
      background: linear-gradient(135deg, #2a2a1a, #1a1a0a);
      border-color: var(--accent-gold-dim);
    }

    .btn-item:hover {
      background: var(--accent-gold);
      color: #000;
    }

    .btn-character {
      background: linear-gradient(135deg, #2a1a2a, #1a0a1a);
      border-color: var(--accent-purple);
    }

    .btn-character:hover {
      background: var(--accent-purple);
      color: #fff;
    }

    .btn-character.ally {
      border-color: var(--accent-green);
      background: linear-gradient(135deg, #1a2a1a, #0a150a);
    }

    .btn-character.hostile {
      border-color: var(--accent-red);
      background: linear-gradient(135deg, #2a1a1a, #1a0a0a);
    }

    .btn-danger {
      background: linear-gradient(135deg, #2a1a1a, #1a0a0a);
      border-color: var(--accent-red);
    }

    .btn-danger:hover {
      background: var(--accent-red);
      color: #fff;
    }

    /* ========== INVENTORY PANEL ========== */
    #inventory-panel {
      flex: 1;
      overflow-y: auto;
    }

    #inventory-list {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .inventory-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.5rem;
      background: var(--bg-tertiary);
      border-radius: var(--radius);
      border: 1px solid var(--border-color);
    }

    .inventory-item-name {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      color: var(--accent-gold);
    }

    .inventory-item-weight {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .inventory-actions {
      display: flex;
      gap: 0.3rem;
    }

    .btn-small {
      font-size: 0.7rem;
      padding: 0.3rem 0.5rem;
    }

    /* ========== LOG PANEL (no topo do game-panel, em destaque) ========== */
    #log-panel {
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      border: 1px solid var(--accent-blue);
      max-height: 150px;
      flex-shrink: 0;
      border-radius: var(--radius);
      padding: 1rem;
      box-shadow: var(--shadow);
      overflow: hidden; /* Impedir que conteúdo vaze */
      display: flex;
      flex-direction: column;
    }

    #log-container {
      flex: 1;
      min-height: 0; /* Importante para flex children */
      max-height: 100%; /* Respeitar o pai */
      overflow-y: auto;
      overflow-x: hidden;
      padding: 0.5rem;
      background: var(--bg-primary);
      border-radius: var(--radius);
      font-family: var(--font-mono);
      font-size: 0.8rem;
      line-height: 1.5;
      word-wrap: break-word;
      word-break: break-word;
    }

    .log-entry {
      padding: 0.2rem 0;
      border-bottom: 1px solid var(--border-color);
      overflow-wrap: break-word; /* Quebrar palavras longas */
    }

    .log-entry:last-child {
      border-bottom: none;
    }

    .log-time {
      color: var(--text-muted);
      font-size: 0.7rem;
    }

    .log-action { color: var(--accent-blue); }
    .log-success { color: var(--accent-green); }
    .log-danger { color: var(--accent-red); }
    .log-warning { color: var(--accent-gold); }
    .log-info { color: var(--text-secondary); }
    .log-magic { color: var(--accent-purple); font-style: italic; }

    /* ========== MINIMAP (estilos internos) ========== */
    #minimap-container {
      background: 
        /* Grid sutil de quadras da cidade */
        linear-gradient(rgba(40, 40, 55, 0.3) 1px, transparent 1px),
        linear-gradient(90deg, rgba(40, 40, 55, 0.3) 1px, transparent 1px),
        linear-gradient(180deg, #0a0a12 0%, #08080d 100%);
      background-size: 20px 20px, 20px 20px, 100% 100%;
      border-radius: var(--radius);
      padding: 0.75rem;
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(42, 42, 53, 0.8);
    }

    #minimap-container::before {
      content: '';
      position: absolute;
      inset: 0;
      background: 
        radial-gradient(ellipse at 50% 0%, rgba(212, 168, 70, 0.03) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 100%, rgba(64, 128, 192, 0.02) 0%, transparent 40%);
      pointer-events: none;
    }

    #minimap-header {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 0.5rem;
      position: relative;
    }

    #minimap-title {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--accent-gold);
      text-align: center;
      font-weight: 600;
      text-shadow: 0 0 10px rgba(212, 168, 70, 0.3);
    }

    #minimap-reset {
      position: absolute;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      background: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      border-radius: 4px;
      color: var(--text-secondary);
      font-size: 0.8rem;
      padding: 0.2rem 0.4rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    #minimap-reset:hover {
      background: var(--accent-gold-dim);
      border-color: var(--accent-gold);
      color: var(--text-primary);
    }

    #minimap-viewport {
      position: relative;
      width: 100%;
      height: calc(100% - 50px);
      overflow: hidden;
      cursor: grab;
      touch-action: none;
    }

    #minimap-viewport.dragging {
      cursor: grabbing;
    }

    #minimap-viewport.dragging-node {
      cursor: move;
    }

    #minimap {
      position: absolute;
      width: 100%;
      height: 100%;
      transform-origin: 0 0;
    }

    .map-room {
      position: absolute;
      /* Círculo de interseção - estilo mapa de cidade */
      background: radial-gradient(circle,
        rgba(45, 45, 60, 0.95) 0%,
        rgba(30, 30, 42, 0.9) 100%
      );
      border: 2px solid rgba(80, 80, 100, 0.8);
      border-radius: 50%;
      width: 28px;
      height: 28px;
      padding: 0;
      font-size: 0.45rem;
      font-family: var(--font-mono);
      font-weight: 600;
      color: rgba(180, 180, 200, 0.9);
      text-align: center;
      line-height: 24px;
      cursor: move;
      transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
      transform: translate(-50%, -50%);
      box-shadow:
        0 0 0 3px rgba(30, 30, 42, 0.8),
        0 2px 8px rgba(0, 0, 0, 0.5);
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }

    .map-room:hover {
      transform: translate(-50%, -50%) scale(1.15);
      z-index: 20;
    }

    .map-room.dragging {
      opacity: 0.8;
      z-index: 100;
      box-shadow:
        0 0 0 3px rgba(212, 168, 70, 0.6),
        0 4px 16px rgba(0, 0, 0, 0.7);
      transition: none;
    }

    .map-room.current {
      /* Marcador "Você está aqui" - dourado destacado */
      background: radial-gradient(circle,
        rgba(212, 168, 70, 0.4) 0%,
        rgba(180, 140, 50, 0.6) 100%
      );
      border: 3px solid var(--accent-gold);
      color: var(--accent-gold);
      width: 36px;
      height: 36px;
      line-height: 30px;
      font-size: 0.5rem;
      box-shadow:
        0 0 0 4px rgba(30, 30, 42, 0.9),
        0 0 15px rgba(212, 168, 70, 0.5),
        0 0 30px rgba(212, 168, 70, 0.2);
      z-index: 15;
      animation: current-pulse 2s ease-in-out infinite;
    }

    /* Salas adjacentes (saídas válidas) - destinos clicáveis */
    .map-room.valid-exit {
      background: radial-gradient(circle,
        rgba(88, 166, 255, 0.2) 0%,
        rgba(56, 139, 219, 0.3) 100%
      );
      border: 2px solid rgba(88, 166, 255, 0.8);
      color: rgba(140, 190, 255, 1);
      cursor: pointer;
      box-shadow:
        0 0 0 3px rgba(30, 30, 42, 0.8),
        0 0 10px rgba(88, 166, 255, 0.4);
    }

    .map-room.valid-exit:hover {
      transform: translate(-50%, -50%) scale(1.2);
      box-shadow:
        0 0 0 4px rgba(30, 30, 42, 0.9),
        0 0 20px rgba(88, 166, 255, 0.6);
    }

    /* Saídas bloqueadas (requer voo ou escudo) */
    .map-room.blocked-exit {
      border: 2px dashed rgba(255, 180, 60, 0.5);
      color: rgba(255, 180, 60, 0.7);
      cursor: not-allowed;
    }

    @keyframes current-pulse {
      0%, 100% { 
        box-shadow: 
          0 0 0 4px rgba(30, 30, 42, 0.9),
          0 0 15px rgba(212, 168, 70, 0.5),
          0 0 30px rgba(212, 168, 70, 0.2);
      }
      50% { 
        box-shadow: 
          0 0 0 4px rgba(30, 30, 42, 0.9),
          0 0 20px rgba(212, 168, 70, 0.7),
          0 0 40px rgba(212, 168, 70, 0.3);
      }
    }

    .map-room.has-enemy {
      /* Bolinha indicadora de inimigo */
    }

    .map-room.has-enemy::after {
      content: '';
      position: absolute;
      top: -3px;
      right: -3px;
      width: 10px;
      height: 10px;
      background: var(--accent-red);
      border-radius: 50%;
      border: 2px solid rgba(30, 30, 42, 0.9);
      animation: enemy-blink 1s ease-in-out infinite;
    }

    @keyframes enemy-blink {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(0.85); }
    }

    .map-room.has-ally {
      /* Bolinha indicadora de aliado */
    }

    .map-room.has-ally::after {
      content: '';
      position: absolute;
      top: -3px;
      right: -3px;
      width: 10px;
      height: 10px;
      background: var(--accent-green);
      border-radius: 50%;
      border: 2px solid rgba(30, 30, 42, 0.9);
    }

    .map-room.has-both {
      /* Bolinha bicolor - inimigo e aliado */
    }

    .map-room.has-both::after {
      content: '';
      position: absolute;
      top: -3px;
      right: -3px;
      width: 10px;
      height: 10px;
      background: linear-gradient(135deg, var(--accent-red) 50%, var(--accent-green) 50%);
      border-radius: 50%;
      border: 2px solid rgba(30, 30, 42, 0.9);
      animation: enemy-blink 1s ease-in-out infinite;
    }

    /* Conexões como RUAS da cidade */
    .map-connection {
      position: absolute;
      background: linear-gradient(90deg,
        rgba(70, 70, 85, 0.5) 0%,
        rgba(90, 90, 110, 0.7) 10%,
        rgba(90, 90, 110, 0.7) 90%,
        rgba(70, 70, 85, 0.5) 100%
      );
      transform-origin: left center;
      height: 10px;
      z-index: 1;
      border-radius: 2px;
      box-shadow: 
        inset 0 1px 0 rgba(255,255,255,0.08),
        inset 0 -1px 0 rgba(0,0,0,0.3),
        0 2px 4px rgba(0,0,0,0.4);
    }

    /* Linha central tracejada (faixa da rua) */
    .map-connection::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 5%;
      right: 5%;
      height: 1px;
      background: repeating-linear-gradient(
        90deg,
        rgba(255, 220, 100, 0.25) 0px,
        rgba(255, 220, 100, 0.25) 6px,
        transparent 6px,
        transparent 12px
      );
      transform: translateY(-50%);
    }

    .map-legend {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      gap: 1rem;
      padding: 0.4rem;
      background: rgba(10, 10, 15, 0.8);
      border-radius: 0 0 var(--radius) var(--radius);
      border-top: 1px solid rgba(42, 42, 53, 0.4);
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 0.6rem;
      color: var(--text-muted);
      font-family: var(--font-mono);
    }

    .legend-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      box-shadow: 0 0 6px currentColor;
    }

    .legend-dot.player { 
      background: var(--accent-gold); 
      box-shadow: 0 0 8px rgba(212, 168, 70, 0.6);
    }
    .legend-dot.enemy { 
      background: var(--accent-red); 
      box-shadow: 0 0 8px rgba(201, 64, 64, 0.6);
    }
    .legend-dot.ally { 
      background: var(--accent-green); 
      box-shadow: 0 0 8px rgba(64, 160, 96, 0.6);
    }

    #command-input-container {
      display: flex;
      gap: 0.5rem;
    }

    #command-input {
      flex: 1;
      font-family: var(--font-mono);
      font-size: 0.9rem;
      padding: 0.5rem;
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      background: var(--bg-tertiary);
      color: var(--text-primary);
    }

    #command-input:focus {
      outline: none;
      border-color: var(--accent-gold);
    }

    #action-buttons {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.5rem;
      flex-wrap: wrap;
    }

    /* ========== MODAL ========== */
    #modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      z-index: 100;
      justify-content: center;
      align-items: center;
    }

    #modal-overlay.active {
      display: flex;
    }

    #modal {
      background: var(--bg-secondary);
      border: 2px solid var(--accent-gold);
      border-radius: var(--radius);
      padding: 2rem;
      max-width: 500px;
      width: 90%;
      text-align: center;
      box-shadow: 0 0 50px rgba(212, 168, 70, 0.3);
    }

    #modal h2 {
      font-family: var(--font-mono);
      font-size: 1.5rem;
      color: var(--accent-gold);
      margin-bottom: 1rem;
    }

    #modal p {
      color: var(--text-secondary);
      margin-bottom: 1.5rem;
      line-height: 1.6;
    }

    #modal .btn {
      margin: 0.5rem;
    }

    /* ========== SPEAK MODAL ========== */
    #speak-modal {
      display: none;
    }

    #speak-modal.active {
      display: flex;
    }

    #speak-input {
      width: 100%;
      font-family: var(--font-mono);
      font-size: 1rem;
      padding: 0.75rem;
      margin-bottom: 1rem;
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      background: var(--bg-tertiary);
      color: var(--text-primary);
      text-align: center;
    }

    /* ========== CHARACTER MODAL ========== */
    #character-modal-content {
      text-align: left;
    }

    #character-modal-content .character-stats {
      background: var(--bg-tertiary);
      padding: 1rem;
      border-radius: var(--radius);
      margin: 1rem 0;
      font-family: var(--font-mono);
      font-size: 0.9rem;
    }

    /* ========== RESPONSIVE ========== */
    @media (max-width: 800px) {
      #main-content {
        flex-direction: column;
      }
      
      #log-panel {
        max-width: none;
        max-height: 250px;
      }

      #game-title {
        font-size: 1.2rem;
      }

      #stats {
        font-size: 0.85rem;
        gap: 1rem;
      }
    }

    /* ========== SCROLLBAR ========== */
    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: var(--bg-primary);
    }

    ::-webkit-scrollbar-thumb {
      background: var(--border-color);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--text-muted);
    }

    /* ========== WITCH COUNTER ========== */
    #witch-indicator {
      display: flex;
      gap: 0.3rem;
      align-items: center;
    }

    .witch-orb {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--bg-tertiary);
      border: 1px solid var(--accent-purple);
      transition: all 0.3s ease;
    }

    .witch-orb.active {
      background: var(--accent-purple);
      box-shadow: 0 0 10px var(--accent-purple);
    }

    /* ========== GLITCH EFFECT ========== */
    @keyframes glitch-skew {
      0% { transform: skew(0deg); }
      10% { transform: skew(-2deg); }
      20% { transform: skew(3deg); }
      30% { transform: skew(-1deg); }
      40% { transform: skew(2deg); }
      50% { transform: skew(-3deg); }
      60% { transform: skew(1deg); }
      70% { transform: skew(-2deg); }
      80% { transform: skew(2deg); }
      90% { transform: skew(-1deg); }
      100% { transform: skew(0deg); }
    }

    @keyframes glitch-color {
      0% { filter: hue-rotate(0deg) saturate(1); }
      25% { filter: hue-rotate(90deg) saturate(2); }
      50% { filter: hue-rotate(-90deg) saturate(1.5); }
      75% { filter: hue-rotate(180deg) saturate(2); }
      100% { filter: hue-rotate(0deg) saturate(1); }
    }

    @keyframes glitch-offset {
      0% { clip-path: inset(0 0 0 0); transform: translate(0); }
      10% { clip-path: inset(10% 0 60% 0); transform: translate(-5px, 2px); }
      20% { clip-path: inset(40% 0 30% 0); transform: translate(5px, -2px); }
      30% { clip-path: inset(70% 0 10% 0); transform: translate(-3px, 1px); }
      40% { clip-path: inset(20% 0 50% 0); transform: translate(3px, -1px); }
      50% { clip-path: inset(80% 0 5% 0); transform: translate(-2px, 3px); }
      60% { clip-path: inset(5% 0 80% 0); transform: translate(4px, -2px); }
      70% { clip-path: inset(50% 0 20% 0); transform: translate(-4px, 2px); }
      80% { clip-path: inset(30% 0 40% 0); transform: translate(2px, -3px); }
      90% { clip-path: inset(60% 0 25% 0); transform: translate(-3px, 1px); }
      100% { clip-path: inset(0 0 0 0); transform: translate(0); }
    }

    .glitch-active {
      animation: glitch-skew 0.15s infinite linear, glitch-color 0.3s infinite linear;
      position: relative;
    }

    .glitch-active::before,
    .glitch-active::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: inherit;
      pointer-events: none;
    }

    .glitch-active::before {
      animation: glitch-offset 0.2s infinite linear;
      background: rgba(255, 0, 0, 0.1);
      mix-blend-mode: multiply;
    }

    .glitch-active::after {
      animation: glitch-offset 0.25s infinite linear reverse;
      background: rgba(0, 255, 255, 0.1);
      mix-blend-mode: multiply;
    }

    /* Overlay de glitch */
    #glitch-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10000;
      display: none;
    }

    #glitch-overlay.active {
      display: block;
      animation: glitch-overlay-flash 0.1s infinite;
    }

    @keyframes glitch-overlay-flash {
      0% { background: rgba(255, 0, 0, 0.05); }
      25% { background: rgba(0, 255, 0, 0.08); }
      50% { background: rgba(0, 0, 255, 0.05); }
      75% { background: rgba(255, 255, 0, 0.06); }
      100% { background: rgba(255, 0, 255, 0.04); }
    }

    /* ========== WITCH FLASH EFFECT ========== */
    @keyframes witch-flash {
      0% { opacity: 1; }
      100% { opacity: 0; }
    }

    /* ========== INTRO STAR WARS ========== */
    #intro-container {
      position: fixed;
      inset: 0;
      background: black;
      z-index: 10000;
      overflow: hidden;
      /* Perspectiva mais agressiva para efeito 3D */
      perspective: 400px;
      perspective-origin: 50% 40%; /* Ponto de fuga mais alto */
    }

    #intro-stars {
      position: absolute;
      inset: 0;
      background: 
        radial-gradient(1px 1px at 20% 30%, white, transparent),
        radial-gradient(1px 1px at 40% 70%, white, transparent),
        radial-gradient(1px 1px at 50% 50%, white, transparent),
        radial-gradient(1px 1px at 80% 10%, white, transparent),
        radial-gradient(1px 1px at 10% 60%, white, transparent),
        radial-gradient(1px 1px at 70% 40%, white, transparent),
        radial-gradient(1px 1px at 30% 80%, white, transparent),
        radial-gradient(1px 1px at 60% 90%, white, transparent);
      background-size: 200px 200px;
      opacity: 0.4;
    }

    #intro-skip {
      position: absolute;
      top: 2rem;
      right: 2rem;
      z-index: 10001;
      background: transparent;
      border: 1px solid var(--accent-gold);
      color: var(--accent-gold);
      padding: 0.5rem 1rem;
      cursor: pointer;
      font-family: var(--font-mono);
      font-size: 0.9rem;
      transition: all 0.2s ease;
    }

    #intro-skip:hover {
      background: var(--accent-gold);
      color: black;
    }

    #intro-crawl {
      position: absolute;
      width: 90%;
      left: 5%;
      bottom: 0;
      /* Transformação 3D para simular inclinação */
      transform-style: preserve-3d;
      transform: rotateX(45deg) translateZ(0); /* Mais inclinado */
      transform-origin: 50% 100%; /* Origem na base */
      animation: star-wars-crawl 60s linear forwards;
      text-align: center;
      color: var(--accent-gold);
      font-size: 1.8rem;
      line-height: 1.8;
    }

    .crawl-title {
      font-size: 3rem;
      margin-bottom: 2rem;
      text-shadow: 0 0 20px rgba(212, 168, 70, 0.5);
    }

    .crawl-final {
      font-size: 2rem;
      margin-top: 3rem;
      font-style: italic;
    }

    @keyframes star-wars-crawl {
      0% { 
        transform: rotateX(45deg) translateY(0);
        opacity: 1;
      }
      100% { 
        transform: rotateX(45deg) translateY(-300vh);
        opacity: 1;
      }
    }
  </style>
</head>

const GlitchEffect = {
  isActive: false,
  
  // Dispara o efeito de glitch por um tempo determinado
  trigger: function(durationMs = 3000) {
    if (this.isActive) return;
    this.isActive = true;
    
    const container = document.getElementById('game-container');
    const overlay = document.getElementById('glitch-overlay');
    
    // Ativar glitch visual
    container.classList.add('glitch-active');
    overlay.classList.add('active');
    
    // Som de glitch (estático/ruído)
    this.playGlitchSound();
    
    // Desativar após duração
    setTimeout(() => {
      container.classList.remove('glitch-active');
      overlay.classList.remove('active');
      this.isActive = false;
    }, durationMs);
  },
  
  // Som de glitch usando ruído
  playGlitchSound: function() {
    if (!SoundSystem.audioCtx || !SoundSystem.enabled) return;
    
    const ctx = SoundSystem.audioCtx;
    const duration = 0.3;
    const intervals = 10;
    
    for (let i = 0; i < intervals; i++) {
      setTimeout(() => {
        if (!this.isActive) return;
        
        // Criar buffer de ruído
        const bufferSize = ctx.sampleRate * 0.05;
        const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
        const data = buffer.getChannelData(0);
        
        for (let j = 0; j < bufferSize; j++) {
          data[j] = (Math.random() * 2 - 1) * 0.3;
        }
        
        const noise = ctx.createBufferSource();
        noise.buffer = buffer;
        
        const gain = ctx.createGain();
        gain.gain.setValueAtTime(0.15 * SoundSystem.masterVolume, ctx.currentTime);
        gain.gain.exponentialValueToTargetAtTime(0.01, ctx.currentTime, 0.04);
        
        noise.connect(gain);
        gain.connect(ctx.destination);
        noise.start();
        noise.stop(ctx.currentTime + 0.05);
      }, i * 300);
    }
  }
};

const SoundSystem = {
  audioCtx: null,
  enabled: true,
  masterVolume: 0.3,
  
  init: function() {
    this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  },
  
  resume: function() {
    if (this.audioCtx && this.audioCtx.state === 'suspended') {
      this.audioCtx.resume();
    }
  },
  
  toggle: function() {
    this.enabled = !this.enabled;
    const btn = document.getElementById('sound-toggle');
    if (btn) {
      btn.textContent = this.enabled ? '🔊' : '🔇';
    }

  createOsc: function(type, freq, duration, volume = 0.3) {
    if (!this.enabled || !this.audioCtx) return null;
    this.resume();
    
    const osc = this.audioCtx.createOscillator();
    const gain = this.audioCtx.createGain();
    
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.value = volume * this.masterVolume;
    
    osc.connect(gain);
    gain.connect(this.audioCtx.destination);
    
    return { osc, gain, ctx: this.audioCtx };
  },

    const buffer = this.audioCtx.createBuffer(1, bufferSize, this.audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    
    for (let i = 0; i < bufferSize; i++) {
      data[i] = Math.random() * 2 - 1;
    }
    
    const noise = this.audioCtx.createBufferSource();
    const gain = this.audioCtx.createGain();
    noise.buffer = buffer;
    gain.gain.value = volume * this.masterVolume;

const MusicSystem = {
  isPlaying: false,
  isLoaded: false,
  volume: 0.15,
  notes: [],
  duration: 0,
  scheduledOscs: [],
  loopTimeoutId: null,
  startTime: 0,
  
  init: async function() {
    await this.loadMIDI();
  },
  
  // Parser MIDI from embedded Base64 data (no external file needed)
  loadMIDI: async function() {
    try {
      // Decode Base64 to Uint8Array
      const binaryString = atob(MIDI_BASE64);
      const bytes = new Uint8Array(binaryString.length);
      for (let i = 0; i < binaryString.length; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }
      
      let pos = 0;
      const notes = [];
      
      // Funções auxiliares
      const readUint32 = () => (bytes[pos++] << 24) | (bytes[pos++] << 16) | (bytes[pos++] << 8) | bytes[pos++];
      const readUint16 = () => (bytes[pos++] << 8) | bytes[pos++];
      const readVarLen = () => {
        let value = 0, byte;
        do { byte = bytes[pos++]; value = (value << 7) | (byte & 0x7F); } while (byte & 0x80);
        return value;
      };
      const readString = (len) => { let str = ''; for (let i = 0; i < len; i++) str += String.fromCharCode(bytes[pos++]); return str; };
      
      // Header
      if (readString(4) !== 'MThd') throw new Error('Invalid MIDI');
      readUint32(); // length
      readUint16(); // format
      const numTracks = readUint16();
      const ticksPerQuarter = readUint16();
      
      let microsecondsPerBeat = 500000; // 120 BPM
      
      for (let t = 0; t < numTracks; t++) {
        if (readString(4) !== 'MTrk') continue;
        const trackLength = readUint32();
        const trackEnd = pos + trackLength;
        
        let absoluteTime = 0;
        let runningStatus = 0;
        const activeNotes = {};
        
        const tickToSeconds = (ticks) => (ticks / ticksPerQuarter) * (microsecondsPerBeat / 1000000);
        
        while (pos < trackEnd) {
          absoluteTime += readVarLen();
          let statusByte = bytes[pos];
          
          if (statusByte < 0x80) statusByte = runningStatus;
          else { pos++; if (statusByte < 0xF0) runningStatus = statusByte; }
          
          const cmd = statusByte & 0xF0;
          
          if (cmd === 0x90) {
            const note = bytes[pos++], vel = bytes[pos++];
            if (vel > 0) activeNotes[note] = { start: absoluteTime, vel };
            else if (activeNotes[note]) {
              notes.push({ t: tickToSeconds(activeNotes[note].start), n: note, d: tickToSeconds(absoluteTime - activeNotes[note].start), v: activeNotes[note].vel });
              delete activeNotes[note];
            }
          } else if (cmd === 0x80) {
            const note = bytes[pos++]; pos++;
            if (activeNotes[note]) {
              notes.push({ t: tickToSeconds(activeNotes[note].start), n: note, d: tickToSeconds(absoluteTime - activeNotes[note].start), v: activeNotes[note].vel });
              delete activeNotes[note];
            }
          } else if (cmd === 0xA0 || cmd === 0xB0 || cmd === 0xE0) pos += 2;
          else if (cmd === 0xC0 || cmd === 0xD0) pos++;
          else if (statusByte === 0xFF) {
            const type = bytes[pos++], len = readVarLen();
            if (type === 0x51) microsecondsPerBeat = (bytes[pos] << 16) | (bytes[pos+1] << 8) | bytes[pos+2];
            pos += len;
          } else if (statusByte === 0xF0 || statusByte === 0xF7) pos += readVarLen();
        }
      }
      
      notes.sort((a, b) => a.t - b.t);
      this.notes = notes;
      const lastNote = notes[notes.length - 1];
      this.duration = lastNote ? lastNote.t + lastNote.d : 0;
      this.isLoaded = true;
      console.log(`MusicSystem: Loaded ${notes.length} notes, duration: ${this.duration.toFixed(2)}s`);
      
      // Iniciar música automaticamente após carregar
      this.start();
    } catch (err) {
      console.error('MusicSystem: Failed to load MIDI', err);
    }
  },
  
  // Tocar uma nota sintetizada (piano-like)
  playNote: function(note, startTime, duration, velocity) {
    const ctx = SoundSystem.audioCtx;
    if (!ctx || !SoundSystem.enabled) return;
    
    const freq = 440 * Math.pow(2, (note - 69) / 12);
    const vol = (velocity / 127) * this.volume * SoundSystem.masterVolume;
    
    // Oscilador principal (triangle - som mais suave)
    const osc1 = ctx.createOscillator();
    osc1.type = 'triangle';
    osc1.frequency.value = freq;
    
    // Segundo harmônico (oitava acima, mais suave)
    const osc2 = ctx.createOscillator();
    osc2.type = 'sine';
    osc2.frequency.value = freq * 2;
    
    // Mixer
    const gain1 = ctx.createGain();
    const gain2 = ctx.createGain();
    const masterGain = ctx.createGain();
    
    gain1.gain.value = 0.7;
    gain2.gain.value = 0.3;
    
    osc1.connect(gain1);
    osc2.connect(gain2);
    gain1.connect(masterGain);
    gain2.connect(masterGain);
    masterGain.connect(ctx.destination);
    
    // Envelope ADSR
    const now = startTime;
    const attackTime = 0.01;
    const decayTime = 0.1;
    const sustainLevel = 0.6;
    const releaseTime = 0.15;
    
    masterGain.gain.setValueAtTime(0, now);
    masterGain.gain.linearRampToValueAtTime(vol, now + attackTime);
    masterGain.gain.linearRampToValueAtTime(vol * sustainLevel, now + attackTime + decayTime);
    masterGain.gain.setValueAtTime(vol * sustainLevel, now + duration - releaseTime);
    masterGain.gain.linearRampToValueAtTime(0, now + duration);
    
    osc1.start(now);
    osc2.start(now);
    osc1.stop(now + duration + 0.1);
    osc2.stop(now + duration + 0.1);
    
    this.scheduledOscs.push(osc1, osc2);
  },
  
  // Agendar todas as notas
  scheduleNotes: function() {
    if (!this.isLoaded || !SoundSystem.audioCtx) return;
    
    const ctx = SoundSystem.audioCtx;
    this.startTime = ctx.currentTime;
    
    this.notes.forEach(note => {
      this.playNote(note.n, this.startTime + note.t, note.d, note.v);
    });
    
    // Agendar loop
    if (this.isPlaying) {
      this.loopTimeoutId = setTimeout(() => {
        if (this.isPlaying) {
          this.scheduleNotes();
        }
      }, (this.duration + 0.5) * 1000);
    }
  },
  
  // Iniciar música
  start: function() {
    if (!this.isLoaded) {
      console.log('MusicSystem: Not loaded yet');
      return;
    }
    
    SoundSystem.resume();
    this.isPlaying = true;
    this.scheduleNotes();
    this.updateButton();
  },
  
  // Parar música
  stop: function() {
    this.isPlaying = false;
    
    // Limpar timeout de loop
    if (this.loopTimeoutId) {
      clearTimeout(this.loopTimeoutId);
      this.loopTimeoutId = null;
    }
    
    // Parar osciladores agendados
    this.scheduledOscs.forEach(osc => {
      try { osc.stop(); } catch(e) {}
    });
    this.scheduledOscs = [];
    
    this.updateButton();
  },
  
  // Toggle
  toggle: function() {
    SoundSystem.resume();
    if (this.isPlaying) {
      this.stop();
    } else {
      this.start();
    }
  },
  
  // Atualizar botão
  updateButton: function() {
    const btn = document.getElementById('music-toggle');
    if (btn) {
      btn.textContent = this.isPlaying ? '🎵' : '🔕';
      btn.title = this.isPlaying ? 'Desligar música' : 'Ligar música';
    }
  },
  
  // Definir velocidade de playback (para intro Star Wars)
  setSpeed: function(speed) {
    this.playbackSpeed = speed || 1.0;
    // A velocidade será aplicada na próxima vez que as notas forem agendadas
  }
};

// ============================================================================

const Utils = {
  // Gerador de números pseudo-aleatórios com seed
  random: function() {
    GameState.seed = (GameState.seed * 1103515245 + 12345) & 0x7fffffff;
    return GameState.seed / 0x7fffffff;
  },

  // Número aleatório entre min e max (inclusive)
  randomInt: function(min, max) {
    return Math.floor(this.random() * (max - min + 1)) + min;
  },

  // Escolher item aleatório de array
  randomChoice: function(arr) {
    return arr[Math.floor(this.random() * arr.length)];
  },

  // Embaralhar array
  shuffle: function(arr) {
    const result = [...arr];
    for (let i = result.length - 1; i > 0; i--) {
      const j = Math.floor(this.random() * (i + 1));
      [result[i], result[j]] = [result[j], result[i]];
    }
    return result;
  },

  // Formatar tempo (minutos para HH:MM)
  formatTime: function(minutes) {
    const h = Math.floor(minutes / 60) % 24;
    const m = minutes % 60;
    return `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}`;
  },

  // Clonar objeto profundamente
  deepClone: function(obj) {
    return JSON.parse(JSON.stringify(obj));
  }
};

// ============================================================================
// RULES - Regras e validações do jogo
// ============================================================================

const Rules = {
  // Verificar se jogador pode voar
  canPlayerFly: function() {
    const player = GameState.characters.player;
    if (player.canFly) return true;
    
    // Verificar se tem asa delta no inventário
    return GameState.playerInventory.includes('asa_delta');
  },

  // Verificar se pode ir para uma sala
  canMoveTo: function(roomId) {
    const room = GameState.rooms[roomId];
    if (!room) return false;
    
    if (room.requiresFlight) {
      return this.canPlayerFly();
    }
    return true;
  },

  // Calcular peso total do inventário
  getInventoryWeight: function() {
    return GameState.playerInventory.reduce((total, itemId) => {
      const item = GameState.items[itemId];
      return total + (item ? item.weight : 0);
    }, 0);
  },

  // Verificar se pode pegar item
  canPickupItem: function(itemId) {
    const item = GameState.items[itemId];
    if (!item) return false;
    
    const currentWeight = this.getInventoryWeight();
    const player = GameState.characters.player;
    
    return (currentWeight + item.weight) <= player.maxWeight;
  },

  // Calcular poder de ataque total do jogador
  getPlayerAttackPower: function() {
    const player = GameState.characters.player;
    let attack = player.attackPower;
    
    // Adicionar bônus de itens
    GameState.playerInventory.forEach(itemId => {
      const item = GameState.items[itemId];
      if (item) attack += item.attackPower;
    });
    
    return attack;
  },

  // Calcular poder de defesa total do jogador
  getPlayerDefensePower: function() {
    const player = GameState.characters.player;
    let defense = player.defensePower;
    
    // Adicionar bônus de itens
    GameState.playerInventory.forEach(itemId => {
      const item = GameState.items[itemId];
      if (item) defense += item.defensePower;
    });
    
    // Adicionar bônus temporário
    defense += GameState.playerDefenseBonus;
    
    return defense;
  },

  // Verificar se jogador tem máscara de gás
  hasGasMask: function() {
    return GameState.playerInventory.includes('mascara_gas');
  },

  // Verificar condições de fim de jogo
  checkGameOver: function() {
    const player = GameState.characters.player;
    const witch = GameState.characters.bruxa;
    
    // Derrota: jogador morreu
    if (player.hp <= 0) {
      GameState.gameOver = true;
      GameState.victory = false;
      SoundSystem.playDeath();
      return { ended: true, victory: false, reason: 'Você foi derrotado! A escuridão consome São Paulo...' };
    }
    
    // Derrota: bruxa completou o portal
    if (GameState.witchWords >= 4) {
      GameState.gameOver = true;
      GameState.victory = false;
      SoundSystem.playDeath();
      return { ended: true, victory: false, reason: 'A Bruxa completou o ritual! O portal dimensional se abre e criaturas das trevas invadem a cidade!' };
    }
    
    // Vitória: bruxa derrotada
    if (witch.hp <= 0) {
      GameState.gameOver = true;
      GameState.victory = true;
      SoundSystem.playVictory();
      return { ended: true, victory: true, reason: 'VITÓRIA! Você derrotou a Bruxa e salvou São Paulo!' };
    }
    
    return { ended: false };
  }
};
