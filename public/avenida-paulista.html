      // ============================================================================
      // GAME - Controlador principal
      // ============================================================================

      const Game = {
        // Inicializar jogo
        init: function() {
          // Inicializar sistema de som
          SoundSystem.init();

          // Parar música anterior antes de reinicializar (evita múltiplas instâncias)
          MusicSystem.stop();

          // Inicializar sistema de música (carrega MIDI em background)
          MusicSystem.init();

          // Inicializar controlador do minimapa
          MinimapController.init();

          // Gerar seed
          GameState.seed = Date.now();

          // Clonar dados
          GameState.rooms = Utils.deepClone(ROOMS_DATA);
          GameState.characters = Utils.deepClone(CHARACTERS_DATA);
          GameState.items = Utils.deepClone(ITEMS_DATA);

          // Reset do estado
          GameState.time = 17 * 60;
          GameState.witchWords = 0;
          GameState.lastWitchWordTime = 0;
          GameState.gameOver = false;
          GameState.victory = false;
          GameState.deathReason = null;
          GameState.playerInventory = [];
          GameState.playerDefenseBonus = 0;
          GameState.playerDefenseBonusTurns = 0;
          GameState.demonSummoned = false;
          GameState.forceShieldDown = false;
          GameState.armedBomb = null;
          GameState.hasReadMagicBook = false;
          GameState.discoveredItems = new Set();

          // Reset eventos aleatórios
          RandomEvents.reset();

          // Gerar palavra mágica do demônio
          GameState.demonMagicWord = Utils.randomChoice(MAGIC_WORDS);

          // Posicionar entidades
          this.setupPositions();

          // Limpar log
          Log.clear();
          Log.add('Bem-vindo à Avenida Paulista!', 'success');
          Log.add('A Bruxa está no topo do MASP tentando abrir um portal dimensional.', 'warning');
          Log.add('Você deve derrotá-la antes que ela complete o ritual!', 'info');

          // Descobrir itens na sala inicial
          Object.values(GameState.items).forEach(function(item) {
            if (item.location === GameState.playerLocation && !item.isDestroyed && !item.isAnimated) {
              GameState.discoveredItems.add(item.id);
            }
          });

          // Atualizar UI
          Render.update();
        },

        // Posicionar personagens e itens
        setupPositions: function() {
          // Salas que NÃO requerem voo (para itens e personagens terrestres)
          const groundRooms = Object.keys(GameState.rooms).filter(r =>
            r !== 'teto_masp' &&
            GameState.rooms[r].requiresFlight !== true
          );

          // Todas as salas exceto teto_masp (para personagens que voam)
          const flyingRooms = Object.keys(GameState.rooms).filter(r => r !== 'teto_masp');

          // Posições fixas
          GameState.characters.player.location = 'masp';
          GameState.playerLocation = 'masp';

          GameState.characters.bruxa.location = 'teto_masp';
          GameState.characters.feiticeiro.location = 'tunel';
          GameState.characters.demonio.location = null; // Não começa no mapa
          GameState.characters.demonio.isSummoned = false;

          // LIVRO sempre na LIVRARIA
          GameState.items.livro.location = 'livraria';

          // Randomizar personagens RESPEITANDO canFly
          ['aguia', 'bombardeador', 'coruja', 'cachorro'].forEach(charId => {
            const char = GameState.characters[charId];
            // Se pode voar, pode ir em qualquer sala; se não, só groundRooms
            const validRooms = char.canFly ? flyingRooms : groundRooms;
            char.location = Utils.randomChoice(validRooms);
          });

          // Randomizar itens (SEMPRE em groundRooms - itens não voam!)
          const itemsToPlace = Object.keys(GameState.items).filter(i => i !== 'livro' && i !== 'bomba');
          itemsToPlace.forEach(itemId => {
            GameState.items[itemId].location = Utils.randomChoice(groundRooms);
          });

          // Bomba começa sem localização (criada pelo Bombardeador)
          GameState.items.bomba.location = null;
          GameState.items.bomba.isDestroyed = false;

          // WORLD SANITY: validar posições iniciais (segurança extra)
          WorldSanity.init();
          WorldSanity.enforce();
        },

        // Fechar modal de explosão e verificar game over
        closeExplosionModal: function(playerDied) {
          Modals.hide();
          GameState._explosionInProgress = false;
          if (playerDied) {
            const gameCheck = Rules.checkGameOver();
            if (gameCheck.ended) {
              Modals.showGameOver(gameCheck.reason);
            }
          }
        },

        // Processar resultado de ação
        processAction: function(result) {
          if (result.message) {
            const type = result.success ? 'action' : 'warning';
            Log.add(result.message, type);
          }

          if (result.success && result.advanceTime) {
            Events.advanceTime();
          }

          // Verificar fim de jogo (não durante explosão - o modal de explosão controla o fluxo)
          if (!GameState._explosionInProgress) {
            const gameCheck = Rules.checkGameOver();
            if (gameCheck.ended) {
              Modals.showGameOver(gameCheck.reason);
            }
          }

          // Descobrir itens na sala atual
          Object.values(GameState.items).forEach(function(item) {
            if (item.location === GameState.playerLocation && !item.isDestroyed && !item.isAnimated) {
              GameState.discoveredItems.add(item.id);
            }
          });

          Render.update();
        },

        // Ações do jogador
        move: function(roomId) {
          const prevRoom = GameState.playerLocation;
          this.processAction(Actions.moveTo(roomId));

          // NPCs na nova sala falam ao encontrar o jogador
          if (GameState.playerLocation !== prevRoom) {
            Object.values(GameState.characters).forEach(function(char) {
              if (char.id === 'player') return;
              if (!char.isAlive) return;
              if (char.location !== GameState.playerLocation) return;
              const phrases = NPC_PHRASES[char.id];
              if (phrases && phrases.encounter && Utils.random() < 0.5) {
                Log.add('💬 ' + char.name + ': "' + Utils.randomChoice(phrases.encounter) + '"', 'info');
              }
            });
          }
        },

        pickup: function(itemId) {
          this.processAction(Actions.pickupItem(itemId));
        },

        drop: function(itemId) {
          this.processAction(Actions.dropItem(itemId));
        },

        use: function(itemId, targetId) {
          const result = Actions.useItem(itemId, targetId);

          // Caso especial: precisa selecionar um item (Cera Mágica)
          if (result.message === 'SELECT_ITEM' && result.selectableItems) {
            this.openItemSelectModal(itemId, result.selectableItems);
            return;
          }

          // Caso especial: precisa selecionar um alvo (Hipnodisco)
          if (result.message === 'SELECT_HIPNO_TARGET' && result.selectableTargets) {
            this.openHipnoSelectModal(result.selectableTargets);
            return;
          }

          // Caso especial: precisa selecionar um alvo (Seta Mortal)
          if (result.message === 'SELECT_SETA_TARGET' && result.selectableTargets) {
            this.openSetaSelectModal(result.selectableTargets);
            return;
          }

          this.processAction(result);
        },

        // Modal de seleção de alvo para Seta Mortal
        openSetaSelectModal: function(targets) {
          const targetButtons = targets.map(t => {
            return `<button class="btn btn-danger" onclick="Game.useSetaAndClose('${t.id}');">
              ⚔️ ${t.name} (HP: ${t.hp})
            </button>`;
          }).join('');

          const content = `
            <p>Escolha o alvo da SETA MORTAL (40 de dano!):</p>
            <div class="button-group" style="margin-top: 1rem; flex-direction: column; align-items: stretch;">
              ${targetButtons}
            </div>
            <button class="btn" onclick="Modals.hide()" style="margin-top: 1rem;">Cancelar</button>
          `;
          Modals.show('🏹 SETA MORTAL', content);
        },

        // Modal de seleção de alvo para Hipnodisco
        openHipnoSelectModal: function(targets) {
          const targetButtons = targets.map(t => {
            return `<button class="btn btn-item" onclick="Game.useWithTarget('hipnodisco', '${t.id}'); Modals.hide();">
              ${t.name}
            </button>`;
          }).join('');

          const content = `
            <p>Escolha um alvo para o HIPNODISCO (uso único!):</p>
            <div class="button-group" style="margin-top: 1rem; flex-direction: column; align-items: stretch;">
              ${targetButtons}
            </div>
            <button class="btn" onclick="Modals.hide()" style="margin-top: 1rem;">Cancelar</button>
          `;
          Modals.show('💫 HIPNODISCO', content);
        },

        // Modal de seleção de item (para Cera Mágica)
        openItemSelectModal: function(sourceItemId, selectableItems) {
          const itemButtons = selectableItems.map(id => {
            const item = GameState.items[id];
            return `<button class="btn btn-item" onclick="Game.useWithTarget('${sourceItemId}', '${id}'); Modals.hide();">
              ${item.name} (${item.weight}kg)
            </button>`;
          }).join('');

          const content = `
            <p>Escolha um item para aplicar a CERA MÁGICA:</p>
            <div class="button-group" style="margin-top: 1rem; justify-content: center;">
              ${itemButtons}
            </div>
            <button class="btn" onclick="Modals.hide()" style="margin-top: 1rem;">Cancelar</button>
          `;
          Modals.show('🕯️ CERA MÁGICA', content);
        },

        useWithTarget: function(itemId, targetItemId) {
          this.processAction(Actions.useItem(itemId, targetItemId));
        },

        attack: function(charId) {
          this.processAction(Actions.attack(charId));
        },

        useSetaAndClose: function(targetId) {
          this.processAction(Actions.useItem('seta_mortal', targetId));
          if (!GameState.gameOver) {
            Modals.hide();
          }
        },

        attackAndClose: function(charId) {
          this.processAction(Actions.attack(charId));
          // Só fecha o modal se o jogo NÃO acabou (game over mostra seu próprio modal)
          if (!GameState.gameOver) {
            Modals.hide();
          }
        },

        speak: function(word) {
          this.processAction(Actions.speak(word));
        },

        showCharacter: function(charId) {
          Modals.showCharacter(charId);
        },

        // Confirmar reinício
        confirmRestart: function() {
          if (GameState.gameOver) {
            this.restart();
            return;
          }

          const content = `
            <p style="font-size: 1.1rem; margin-bottom: 1.5rem;">Tem certeza que deseja reiniciar o jogo?</p>
            <p style="color: var(--text-muted); margin-bottom: 1.5rem;">Todo o progresso será perdido e um novo jogo começará.</p>
            <div style="display: flex; gap: 1rem; justify-content: center;">
              <button class="btn btn-danger" onclick="Game.restart()">🔄 Sim, Reiniciar</button>
              <button class="btn" onclick="Modals.hide()">Cancelar</button>
            </div>
          `;
          Modals.show('⚠️ Reiniciar Jogo', content);
        },

        // Reiniciar jogo
        restart: function() {
          Modals.hide();
          this.init();
        }
      };

      // ============================================================================
      // WORLD SANITY - Validação contínua para evitar regressões
      // ============================================================================

      const WorldSanity = {
        // Salas terrestres (cache)
        groundRooms: null,

        // Inicializar cache
        init: function() {
          this.groundRooms = Object.keys(GameState.rooms).filter(r =>
            r !== 'teto_masp' &&
            GameState.rooms[r].requiresFlight !== true
          );
        },

        // Executar todas as validações
        enforce: function() {
          this.sanitizeCharacters();
          this.sanitizeItems();
          this.sanitizeBombs();
        },

        // Personagens terrestres não podem estar em salas que requerem voo
        sanitizeCharacters: function() {
          if (!this.groundRooms) this.init();

          Object.values(GameState.characters).forEach(char => {
            if (char.id === 'player') return; // Player é tratado separadamente
            if (!char.isAlive) return;
            if (char.canFly) return; // Pode voar, sem problema
            if (!char.location) return;

            const room = GameState.rooms[char.location];
            if (room && room.requiresFlight) {
              // ERRO: personagem terrestre no céu! Teleportar para terra
              const newLocation = Utils.randomChoice(this.groundRooms);
              Log.add(`⚠️ CORREÇÃO: ${char.name} foi teleportado de volta ao solo (${GameState.rooms[newLocation].name})!`, 'warning');
              char.location = newLocation;
            }
          });
        },

        // Itens não podem permanecer em salas com mayHaveItems === false
        sanitizeItems: function() {
          Object.values(GameState.items).forEach(item => {
            if (!item.location) return;
            if (item.isDestroyed) return;

            const room = GameState.rooms[item.location];
            if (room && room.mayHaveItems === false) {
              // ERRO: item no céu! Destruir
              Log.add(`⚠️ ${item.name} caiu do céu e foi destruído!`, 'warning');
              item.location = null;
              item.isDestroyed = true;
            }
          });
        },

        // Bombas armadas não podem estar em salas aéreas
        sanitizeBombs: function() {
          if (!GameState.armedBomb) return;

          const room = GameState.rooms[GameState.armedBomb.location];
          if (room && room.requiresFlight) {
            // ERRO: bomba no céu! Desarmar
            Log.add(`⚠️ A bomba armada caiu do céu e foi desarmada!`, 'warning');
            GameState.armedBomb = null;
          }
        }
      };

      // ============================================================================
      // INTRO SYSTEM - Animação estilo Star Wars (DETERMINÍSTICO)
      // ============================================================================

      const IntroSystem = {
        safetyTimeout: null,
        isComplete: false,

        // ========================================
        // HISTÓRIA - EDITE O TEXTO ABAIXO:
        // ========================================
        storyText: `
      AVENIDA PAULISTA

      No final da década de 80, nas ruas movimentadas de São Paulo, uma terrível BRUXA toma posse do MASP, o icônico museu de arte da Avenida Paulista. Com seus poderes arcanos, ela tenta pronunciar QUATRO PALAVRAS MÁGICAS para abrir um portal dimensional e invocar forças das trevas sobre a cidade.


      Criaturas sobrenaturais passam a vagar pelas ruas. Um DEMÔNIO é visto nas sombras. O FEITICEIRO se esconde no túnel, aguardando o anoitecer. Mas nem tudo está perdido. Aliados improváveis surgem pelo caminho — uma CORUJA sábia, um fiel CACHORRO CARAMELO, e outros heróis urbanos.


      Artefatos místicos estão espalhados pela cidade. Uma ESPADA lendária. Um ESCUDO ancestral. E um LIVRO que guarda o segredo para conter as forças do mal. Você é a última esperança. Explore a cidade, reúna aliados, encontre armas e derrote a Bruxa antes que o ritual seja concluído...


      O destino de São Paulo está em suas mãos.
        `,
        // ========================================

        formatStory: function() {
          const lines = this.storyText.trim().split('\n\n').filter(p => p.trim() !== '');
          let html = '';

          lines.forEach((paragraph, index) => {
            if (index === 0) {
              html += `<h1 class="crawl-title">${paragraph}</h1>`;
            } else if (index === lines.length - 1) {
              html += `<p class="crawl-final">${paragraph}</p>`;
            } else {
              html += `<p>${paragraph}</p>`;
            }
          });

          return html;
        },

        init: function() {
          const intro = document.getElementById('intro-container');
          if (!intro) {
            Game.init();
            return;
          }

          // Marcar que intro está ativo (esconde o jogo)
          document.body.classList.add('intro-active');

          // Inserir história formatada
          const crawl = document.getElementById('intro-crawl');
          crawl.innerHTML = this.formatStory();

          // Forçar reset completo da animação
          crawl.style.animation = 'none';
          void crawl.offsetHeight;

          // AGORA iniciar a animação via JS (60s para o novo keyframe 3D)
          crawl.style.animation = 'star-wars-crawl 168s linear forwards';

          // Iniciar música em velocidade lenta
          MusicSystem.init();
          MusicSystem.setSpeed(0.7);

          // Listener para fim da animação (once: true evita múltiplas execuções)
          crawl.addEventListener('animationend', () => this.complete(), { once: true });

          // Timer de segurança: se animação não terminar em 65s, forçar conclusão
          this.safetyTimeout = setTimeout(() => {
            if (!this.isComplete) {
              console.warn('IntroSystem: safety timeout triggered');
              this.complete();
            }
          }, 90000);
        },

        skip: function() {
          if (this.isComplete) return;
          this.complete();
        },

        complete: function() {
          if (this.isComplete) return;
          this.isComplete = true;

          // Limpar timer de segurança
          if (this.safetyTimeout) {
            clearTimeout(this.safetyTimeout);
            this.safetyTimeout = null;
          }

          // Remover intro
          const intro = document.getElementById('intro-container');
          if (intro) intro.remove();

          // Mostrar jogo
          document.body.classList.remove('intro-active');

          // Restaurar velocidade da música
          MusicSystem.setSpeed(1.0);

          // Iniciar jogo
          Game.init();
        }
      };

      // ============================================================================
      // INICIALIZAÇÃO
      // ============================================================================

      document.addEventListener('DOMContentLoaded', function() {
        IntroSystem.init();

        // Scroll indicator listeners
        document.querySelectorAll('.scroll-indicator-container').forEach(el => {
          el.addEventListener('scroll', () => GameUI.updateScrollIndicators());
        });

        // Fechar modal ao clicar fora
        document.getElementById('modal-overlay').addEventListener('click', function(e) {
          if (e.target === this) {
            Modals.hide();
          }
        });
      });
    </script>
  </body>
</html>
