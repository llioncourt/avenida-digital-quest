              },

              // Crafting - combinar 2 itens
              craft: function(itemId1, itemId2) {
                if (GameState.gameOver) return { success: false, message: 'O jogo acabou!' };
                if (!GameState.playerInventory.includes(itemId1) || !GameState.playerInventory.includes(itemId2)) {
                  return { success: false, message: 'Você não tem esses itens!' };
                }
                // Buscar receita (ordem não importa)
                var recipe = CRAFTING_RECIPES.find(function(r) {
                  return (r.ingredients.includes(itemId1) && r.ingredients.includes(itemId2) && itemId1 !== itemId2);
                });
                if (!recipe) {
                  return { success: false, message: '⚗️ Esses itens não combinam entre si.' };
                }
                // Remover ingredientes
                var idx1 = GameState.playerInventory.indexOf(itemId1);
                if (idx1 > -1) GameState.playerInventory.splice(idx1, 1);
                var idx2 = GameState.playerInventory.indexOf(itemId2);
                if (idx2 > -1) GameState.playerInventory.splice(idx2, 1);
                // Criar item resultante
                if (!GameState.items[recipe.result]) {
                  GameState.items[recipe.result] = Utils.deepClone(ITEMS_DATA[recipe.result]);
                }
                GameState.items[recipe.result].location = 'inventory';
                GameState.playerInventory.push(recipe.result);
                // Achievement
                Achievements.tryUnlock('alquimista');
                Karma.change(2, 'Craftou um item');
                SoundSystem.playPickup();
                ScreenEffects.flash('rgba(212, 168, 70, 0.5)');
                Log.add('⚗️ Você combinou ' + GameState.items[itemId1 === recipe.ingredients[0] ? itemId1 : itemId2]?.name + ' + ' + GameState.items[itemId1 === recipe.ingredients[0] ? itemId2 : itemId1]?.name + ' = ' + ITEMS_DATA[recipe.result].name + '!', 'success');
                return { success: true, message: '⚗️ Você criou: ' + ITEMS_DATA[recipe.result].name + '! ' + ITEMS_DATA[recipe.result].description, advanceTime: true };
              },


              // Atacar personagem
              attack: function(characterId) {
                if (GameState.gameOver) return { success: false, message: 'O jogo acabou!' };

                const target = GameState.characters[characterId];
                if (!target) {
                  return { success: false, message: 'Personagem não encontrado!' };
                }

                if (target.location !== GameState.playerLocation) {
                  return { success: false, message: 'Este personagem não está aqui!' };
                }

                if (!target.isAlive) {
                  return { success: false, message: `${target.name} já está morto!` };
                }

                // Atacar aliado: transforma em inimigo
                if (target.isAlly) {
                  target.isAlly = false;
                  target.followingPlayer = false;
                  target.followTurnsLeft = 0;
                  target.followCooldown = false;
                  Log.add('😡 ' + target.name + ' se voltou contra você!', 'danger');
                  Karma.change(-15, 'Atacou aliado ' + target.name);
                }

                // Atacar neutro: transforma em inimigo
                if (target.isNeutral) {
                  target.isNeutral = false;
                  target.aggression = 0.8;
                  Log.add('😡 ' + target.name + ' agora é seu inimigo!', 'danger');
                  Karma.change(-20, 'Atacou neutro ' + target.name);
                }

                // Calcular dano - defensor usa golpe aleatório
                const attackPower = Rules.getPlayerAttackPower();
                const player = GameState.characters.player;

                // Escolher golpe de defesa aleatório do alvo
                const defenseMove = target.moves && target.moves.defense && target.moves.defense.length > 0
                  ? Utils.randomChoice(target.moves.defense)
                  : { name: 'Defesa', power: target.defensePower };

                const damage = Math.max(1, attackPower - defenseMove.power);
                const killed = target.hp - damage <= 0;

                // Preparar dados para o modal
                const attackerData = {
                  name: '🗡️ JOGADOR',
                  hp: player.hp, maxHp: player.maxHp,
                  attackPower: player.attackPower,
                  items: CombatModal.getPlayerAttackItems(),
                  totalAttack: attackPower
                };
                const defenderData = {
                  name: '🛡️ ' + target.name.toUpperCase(),
                  hp: target.hp, maxHp: target.maxHp,
                  defensePower: defenseMove.power,
                  moveName: defenseMove.name,
                  items: [],
                  totalDefense: defenseMove.power
                };

                // Check if attacking target triggers onFirstHit
                let extraMessage = null;
                if (target.onFirstHit === 'summonDemon' && !killed && !GameState.demonSummoned) {
                  extraMessage = '⚡ A BRUXA invoca o DEMÔNIO!';
                }

                const combatResult = {
                  damage: damage,
                  killed: killed,
                  remainingHp: Math.max(0, target.hp - damage),
                  targetId: characterId,
                  attackerId: 'player',
                  extraMessage: extraMessage,
                  playerIsAttacker: true
                };

                // Apply callback: actually apply the damage when confirmed
                const applyCallback = function(result) {
                  const t = GameState.characters[result.targetId];
                  if (!t) return;
                  t.hp -= result.damage;
                  if (t.hp <= 0) {
                    t.hp = 0;
                    t.isAlive = false;
                    SoundSystem.playEnemyDefeat();
                    Karma.change(-5, 'Derrotou ' + t.name);
                    if (t.onDeath === 'glitchEffect') {
                      GlitchEffect.trigger(3000);
                    }
                  }
                  // Demon summoning via onFirstHit hook
                  if (t.onFirstHit === 'summonDemon' && t.isAlive && !GameState.demonSummoned) {
                    GameState.demonSummoned = true;
                    const demon = GameState.characters.demonio;
                    demon.location = t.location;
                    demon.isSummoned = true;
                    SoundSystem.playDemonSummon();
                    ScreenEffects.flash('rgba(139, 0, 0, 0.6)'); // Flash vermelho escuro
                    Log.add('🔥 A Bruxa invoca o DEMÔNIO! O chão treme e chamas brotam das sombras!', 'danger');
                  }
                  Log.add(`Você atacou ${t.name} causando ${result.damage} de dano! ${result.killed ? '(DERROTADO!)' : '(HP: ' + t.hp + ')'}`, 'action');
                };

                CombatModal.enqueue(attackerData, defenderData, combatResult, applyCallback);

                return { success: true, message: '', advanceTime: true, combatModal: true };
              },

              // Falar palavra
              speak: function(word) {
                if (GameState.gameOver) return { success: false, message: 'O jogo acabou!' };

                word = word.toUpperCase().trim();

                if (!word) {
                  return { success: false, message: 'Você precisa dizer uma palavra!' };
                }

                // Verificar se demônio está presente
                const demon = GameState.characters.demonio;
                if (demon.location === GameState.playerLocation && demon.isAlive && demon.isSummoned) {
                  if (word === GameState.demonMagicWord) {
                    demon.isAlly = true;
                    Karma.change(15, 'Converteu o Demônio');
                    SoundSystem.playDemonConvert();
                    ScreenEffects.flash('rgba(255, 215, 0, 0.5)'); // Flash dourado
                    // Achievement: Diplomata
                    var feitAlly = GameState.characters.feiticeiro && GameState.characters.feiticeiro.isAlly;
                    if (feitAlly) Achievements.tryUnlock('diplomata');
                    return {
                      success: true,
                      message: `Você pronuncia "${word}"... O DEMÔNIO estremece e seus olhos brilham! Ele foi CONVERTIDO e agora é seu aliado!`,
                      advanceTime: true
                    };
                  }
                }

                return {
                  success: true,
                  message: `Você diz "${word}"... Nada acontece.`,
                  advanceTime: true
                };
              }
            };

            // ============================================================================
            // COMBAT MODAL - Modal cinematográfico de combate
            // ============================================================================

            const CombatModal = {
              isOpen: false,
              phase: 0, // 0=showing stats, 1=waiting confirm1, 2=showing result, 3=waiting confirm2
              pendingCombat: null,
              typeTimers: [],
              queue: [],
              musicWasPlaying: false,

              isTargetedForKill: function(charId) {
                // Verificar combate atual (já removido da fila pelo shift)
                if (this.pendingCombat &&
                    this.pendingCombat.result.targetId === charId &&
                    this.pendingCombat.result.killed) {
                  return true;
                }
                // Verificar fila restante
                return this.queue.some(function(item) {
                  return item.combatResult.targetId === charId && item.combatResult.killed;
                });
              },

              // Get player attack item details
              getPlayerAttackItems: function() {
                const items = [];
                GameState.playerInventory.forEach(function(itemId) {
                  const item = GameState.items[itemId];
                  if (item && item.attackPower > 0) {
                    items.push({ name: item.name, bonus: item.attackPower });
                  }
                });
                return items;
              },

              // Get player defense item details
              getPlayerDefenseItems: function() {
                const items = [];
                GameState.playerInventory.forEach(function(itemId) {
                  const item = GameState.items[itemId];
                  if (item && item.defensePower > 0) {
                    items.push({ name: item.name, bonus: item.defensePower });
                  }
                });
                if (GameState.playerDefenseBonus > 0) {
                  items.push({ name: 'Cera Mágica', bonus: GameState.playerDefenseBonus });
                }
                return items;
              },

              enqueue: function(attackerData, defenderData, combatResult, applyCallback) {
                this.queue.push({ attackerData: attackerData, defenderData: defenderData, combatResult: combatResult, applyCallback: applyCallback });
                if (!this.isOpen) {
                  this.processNext();
                }
              },

              processNext: function() {
                if (this.queue.length === 0) {
                  // Resume music only after all combats
                  if (this.musicWasPlaying) {
                    MusicSystem.start();
                    this.musicWasPlaying = false;
                  }
                  // Resume ambient sounds after all combats
                  RandomEvents.resumeAllSounds();
                  return;
                }
                var next = this.queue.shift();

                // Atualizar HP para refletir estado atual (combates anteriores podem ter alterado)
                var atkChar = GameState.characters[next.combatResult.attackerId];
                if (atkChar) next.attackerData.hp = atkChar.hp;
                var defId = next.combatResult.targetId;
                var defChar = GameState.characters[defId];
                if (defChar) {
                  next.defenderData.hp = defChar.hp;
                  next.combatResult.remainingHp = Math.max(0, defChar.hp - next.combatResult.damage);
                  next.combatResult.killed = defChar.hp - next.combatResult.damage <= 0;
                }

                // Pular combate se atacante ou defensor já morreu
                if ((atkChar && !atkChar.isAlive) || (defChar && !defChar.isAlive)) {
                  this.processNext();
                  return;
                }

                this.open(next.attackerData, next.defenderData, next.combatResult, next.applyCallback);
              },

              open: function(attackerData, defenderData, combatResult, applyCallback) {
                this.isOpen = true;
                this.phase = 0;
                this.pendingCombat = { attacker: attackerData, defender: defenderData, result: combatResult, applyCallback: applyCallback };

                // Pause music (use pause() to preserve playback position)
                if (MusicSystem.isPlaying) {
                  this.musicWasPlaying = true;
                  if (MusicSystem.pause) {
                    MusicSystem.pause();
                  } else {
                    MusicSystem.stop();
                  }
                }

                // Pause ambient sounds during combat
                RandomEvents.pauseAllSounds();

                // Start combat music
                CombatMusicSystem.start();

                // Clear cards
                document.getElementById('combat-card-attacker').innerHTML = '';
                document.getElementById('combat-card-defender').innerHTML = '';
                document.getElementById('combat-confirm-btn').style.display = 'none';
                document.getElementById('combat-modal-overlay').classList.add('active');

                this.showStats();
              },

              showStats: function() {
                var self = this;
                var atk = this.pendingCombat.attacker;
                var def = this.pendingCombat.defender;

                // Build attacker lines
                var attackerLines = [
                  { text: atk.name, cls: 'combat-card-title' },
                  { text: '❤️ HP: ' + atk.hp + '/' + atk.maxHp, cls: '' },
                  { text: '───────────', cls: 'combat-separator' }
                ];
                if (atk.moveName) {
                  attackerLines.push({ text: '⚔️ ' + atk.moveName + ' (' + atk.attackPower + ')', cls: '' });
                } else {
                  attackerLines.push({ text: '⚔️ Ataque Base: ' + atk.attackPower, cls: '' });
                }
                if (atk.items && atk.items.length > 0) {
                  atk.items.forEach(function(item) {
                    attackerLines.push({ text: '  📦 +' + item.bonus + ' (' + item.name + ')', cls: '' });
                  });
                }
                attackerLines.push({ text: 'TOTAL: ' + atk.totalAttack, cls: 'combat-total' });


                // Build defender lines
                var defenderLines = [
                  { text: def.name, cls: 'combat-card-title' },
                  { text: '❤️ HP: ' + def.hp + '/' + def.maxHp, cls: '' },
                  { text: '───────────', cls: 'combat-separator' }
                ];
                if (def.moveName) {
                  defenderLines.push({ text: '🛡️ ' + def.moveName + ' (' + def.defensePower + ')', cls: '' });
                } else {
                  defenderLines.push({ text: '🛡️ Defesa Base: ' + def.defensePower, cls: '' });
                }
                if (def.items && def.items.length > 0) {
                  def.items.forEach(function(item) {
                    defenderLines.push({ text: '  📦 +' + item.bonus + ' (' + item.name + ')', cls: '' });
                  });
                }
                defenderLines.push({ text: 'TOTAL: ' + def.totalDefense, cls: 'combat-total' });

                // Render attacker card
                var atkCard = document.getElementById('combat-card-attacker');
                attackerLines.forEach(function(line) {
                  var div = document.createElement('div');
                  if (line.cls === 'combat-card-title') {
                    div.className = 'combat-card-title';
                  } else {
                    div.className = 'combat-line' + (line.cls ? ' ' + line.cls : '');
                  }
                  div.innerHTML = line.text.replace(/\*([^*]+)\*/g, '<em>$1</em>');
                  atkCard.appendChild(div);
                });

                // Render defender card
                var defCard = document.getElementById('combat-card-defender');
                defenderLines.forEach(function(line) {
                  var div = document.createElement('div');
                  if (line.cls === 'combat-card-title') {
                    div.className = 'combat-card-title';
                  } else {
                    div.className = 'combat-line' + (line.cls ? ' ' + line.cls : '');
                  }
                  div.innerHTML = line.text.replace(/\*([^*]+)\*/g, '<em>$1</em>');
                  defCard.appendChild(div);
                });

                // Animate lines progressively
                var allLines = atkCard.querySelectorAll('.combat-line');
                var defLines = defCard.querySelectorAll('.combat-line');
                var totalLines = allLines.length + defLines.length;

                // Calculate delay synchronized with combat music duration
                var musicDuration = CombatMusicSystem.isLoaded ? CombatMusicSystem.duration : 0;
                // +2 for titles, +1 for margin before confirm button
                var totalItems = totalLines + 2 + 1;
                var lineDelay = musicDuration > 0 ? (musicDuration * 1000) / totalItems : 250;

                var delay = 0;

                // Attacker title appears instantly
                var atkTitle = atkCard.querySelector('.combat-card-title');
                if (atkTitle) {
                  atkTitle.style.opacity = '0';
                  self.typeTimers.push(setTimeout(function() {
                    atkTitle.style.opacity = '1';
                    atkTitle.style.animation = 'combat-type-in 0.3s ease-out';
                  }, 100));
                  delay = lineDelay;
                }

                // Attacker stat lines
                for (var i = 0; i < allLines.length; i++) {
                  (function(line, d) {
                    self.typeTimers.push(setTimeout(function() {
                      line.classList.add('visible');
                    }, d));
                  })(allLines[i], delay);
                  delay += lineDelay;
                }

                // Defender title
                var defTitle = defCard.querySelector('.combat-card-title');
                if (defTitle) {
                  defTitle.style.opacity = '0';
                  self.typeTimers.push(setTimeout(function() {
                    defTitle.style.opacity = '1';
                    defTitle.style.animation = 'combat-type-in 0.3s ease-out';
                  }, delay));
                  delay += lineDelay;
                }

                // Defender stat lines
                for (var j = 0; j < defLines.length; j++) {
                  (function(line, d) {
                    self.typeTimers.push(setTimeout(function() {
                      line.classList.add('visible');
                    }, d));
                  })(defLines[j], delay);
                  delay += lineDelay;
                }

                // Show confirm button after all lines (synchronized with music end)
                self.typeTimers.push(setTimeout(function() {
                  self.phase = 1;
                  var btn = document.getElementById('combat-confirm-btn');
                  btn.textContent = '⚔️ CONFIRMAR';
                  btn.style.display = 'inline-block';
                }, delay));
              },

              confirm: function() {
                CombatMusicSystem.stop();
                ClickMusicSystem.start();

                if (this.phase === 1) {
                  // Choose music based on who is attacking
                  if (this.pendingCombat.result.playerIsAttacker) {
                    VictoryMusicSystem.start();
                  } else {
                    DefeatMusicSystem.start();
                  }
                  // Hide confirm button
                  document.getElementById('combat-confirm-btn').style.display = 'none';
                  this.phase = 2;
                  // Apply the combat
                  if (this.pendingCombat.applyCallback) {
                    this.pendingCombat.applyCallback(this.pendingCombat.result);
                  }
                  this.showResult();
                 } else if (this.phase === 3) {
                  // Play click three times in sequence before closing
                  var self = this;
                  var clickDuration = ClickMusicSystem.isLoaded ? ClickMusicSystem.duration * 1000 : 300;
                  // First click already played above
                  // Second click after first finishes
                  setTimeout(function() {
                    ClickMusicSystem.start();
                    // Third click after second finishes
                    setTimeout(function() {
                      ClickMusicSystem.start();
                      // Close after third click finishes
                      setTimeout(function() {
                        self.close();
                      }, clickDuration);
                    }, clickDuration);
                  }, clickDuration);
                  return; // Don't close immediately
                }
              },

              showResult: function() {
                var self = this;
                var result = this.pendingCombat.result;
                var defCard = document.getElementById('combat-card-defender');

                // Build result lines
                var resultLines = [
                  { text: '───────────', cls: 'combat-separator' },
                  { text: '💥 DANO RECEBIDO: ' + result.damage, cls: 'combat-result-damage' }
                ];

                if (result.killed) {
                  resultLines.push({ text: '💀 DERROTADO!', cls: 'combat-result-defeated' });
                } else {
                  resultLines.push({ text: '❤️ HP RESTANTE: ' + result.remainingHp + '/' + this.pendingCombat.defender.maxHp, cls: 'combat-result-hp' });
                }

                // extraMessage vai para o card do atacante quando NPC ataca, ou do defensor quando jogador ataca
                var extraDelay = 0;
                if (result.extraMessage) {
                  var extraTarget = result.playerIsAttacker ? defCard : document.getElementById('combat-card-attacker');
                  var extraDiv = document.createElement('div');
                  extraDiv.className = 'combat-line combat-result-damage';
                  extraDiv.innerHTML = result.extraMessage.replace(/\*([^*]+)\*/g, '<em>$1</em>');
                  extraTarget.appendChild(extraDiv);
                  (function(el, d) {
                    self.typeTimers.push(setTimeout(function() {
                      el.classList.add('visible');
                    }, d));
                  })(extraDiv, extraDelay);
                  extraDelay += 300;
                }

                // Calculate dynamic delay based on active music duration
                var isPlayerAttacking = this.pendingCombat.result.playerIsAttacker;
                var activeMusic = isPlayerAttacking ? VictoryMusicSystem : DefeatMusicSystem;
                var musicDuration = activeMusic.isLoaded ? activeMusic.duration : 0;
                var totalItems = resultLines.length + 1; // +1 for margin before confirm
                var lineDelay = musicDuration > 0 ? (musicDuration * 1000) / totalItems : 300;

                var delay = 0;
                resultLines.forEach(function(line) {
                  var div = document.createElement('div');
                  div.className = 'combat-line ' + line.cls;
                  div.innerHTML = line.text.replace(/\*([^*]+)\*/g, '<em>$1</em>');
                  defCard.appendChild(div);

                  (function(el, d) {
                    self.typeTimers.push(setTimeout(function() {
                      el.classList.add('visible');
                    }, d));
                  })(div, delay);
                  delay += lineDelay;
                });

                // Show second confirm button (synchronized with music end)
                self.typeTimers.push(setTimeout(function() {
                  self.phase = 3;
                  var btn = document.getElementById('combat-confirm-btn');
                  btn.textContent = '✓ CONFIRMAR';
                  btn.style.display = 'inline-block';
                }, delay + lineDelay));
              },

              close: function() {
                 CombatMusicSystem.stop();
                 DefeatMusicSystem.stop();
                 VictoryMusicSystem.stop();
                 // ClickMusicSystem NOT stopped here - let it finish playing naturally (it's short)
                 this.isOpen = false;
                 this.phase = 0;
                document.getElementById('combat-modal-overlay').classList.remove('active');
                document.getElementById('combat-confirm-btn').style.display = 'none';
                this.typeTimers.forEach(function(t) { clearTimeout(t); });
                this.typeTimers = [];

                // Update UI after combat
                Render.update();

                // Check game over
                if (!GameState._explosionInProgress) {
                  var gameCheck = Rules.checkGameOver();
                  if (gameCheck.ended) {
                    Modals.showGameOver(gameCheck.reason);
                    return;
                  }
                }

                // Process next in queue
                this.processNext();
              },

              reset: function() {
                 CombatMusicSystem.stop();
                 DefeatMusicSystem.stop();
                 VictoryMusicSystem.stop();
                 // ClickMusicSystem NOT stopped here - let it finish playing naturally
                 this.isOpen = false;
                 this.phase = 0;
                this.pendingCombat = null;
                this.queue = [];
                this.musicWasPlaying = false;
                this.typeTimers.forEach(function(t) { clearTimeout(t); });
                this.typeTimers = [];
                document.getElementById('combat-modal-overlay').classList.remove('active');
                document.getElementById('combat-confirm-btn').style.display = 'none';
              }
            };

            // ============================================================================
            // EVENTS - Sistema de eventos e IA
            // ============================================================================

            const Events = {
              // Verificar efeito do café antes de avançar tempo
              maybeAdvanceTime: function() {
                if (GameState.skipNextTimeAdvance) {
                  GameState.skipNextTimeAdvance = false;
                  Log.add('☕ O efeito do CAFÉ fez o tempo não avançar!', 'success');
                } else {
                  Events.advanceTime();
                }
              },

              // Avançar tempo
              advanceTime: function() {
                GameState.time += 5;

                // Processar bônus temporários
                if (GameState.playerDefenseBonusTurns > 0) {
                  GameState.playerDefenseBonusTurns--;
                  if (GameState.playerDefenseBonusTurns === 0) {
                    GameState.playerDefenseBonus = 0;
                    Log.add('O efeito da CERA MÁGICA acabou.', 'info');
                  }
                }

                // WORLD SANITY: validar estado do mundo antes de processar eventos
                WorldSanity.enforce();

                // Regeneração passiva da Relíquia Paulistana
                if (GameState.characters.player.isAlive && Rules.hasEffect('regen')) {
                  var player = GameState.characters.player;
                  if (player.hp < player.maxHp) {
                    player.hp = Math.min(player.hp + 1, player.maxHp);
                  }
                }

                // Processar eventos
                this.processBombTimer();
                this.processWitchWord();
                this.processNPCMovement();
                this.processBombardeadorBombs();
                this.processAutoCombat();
                RandomEvents.process();

                // Dano de chuva (se ativa e jogador não tem guarda-chuva e está ao ar livre)
                if (RandomEvents.isActive('rain') && !Rules.hasEffect('rainProtection')) {
                  var indoorRooms = ['shopping', 'cinema', 'tunel', 'livraria', 'colegio', 'subsolo_masp'];
                  if (!indoorRooms.includes(GameState.playerLocation)) {
                    if (Utils.random() < GAME_CONSTANTS.RAIN_DAMAGE_CHANCE) {
                      Rules.damagePlayer(GAME_CONSTANTS.RAIN_DAMAGE);
                      Log.add('🌧️ A chuva forte te encharca e você perde ' + GAME_CONSTANTS.RAIN_DAMAGE + ' HP! Um GUARDA-CHUVA ajudaria...', 'danger');
                    }
                  }
                }

                // ===== SISTEMA DE ENERGIA (FOME) =====
                GameState.energy = Math.max(0, GameState.energy - GAME_CONSTANTS.ENERGY_DRAIN_PER_TURN);
                if (GameState.energy <= 0) {
                  Rules.damagePlayer(GAME_CONSTANTS.EXHAUSTION_DAMAGE);
                  Log.add('😰 Você está exausto e perdendo forças! -' + GAME_CONSTANTS.EXHAUSTION_DAMAGE + ' HP. Coma algo para recuperar energia!', 'danger');
                } else if (GameState.energy <= GAME_CONSTANTS.ENERGY_LOW_THRESHOLD) {
                  Log.add('⚡ Energia baixa (' + GameState.energy + '/' + GAME_CONSTANTS.MAX_ENERGY + ')! Procure comida: Coxinha, Açaí ou Pastel.', 'warning');
                }

                // ===== MODO NOTURNO PROGRESSIVO =====
                if (GameState.time >= GAME_CONSTANTS.NIGHT_MODE_HOUR) {
                  if (!GameState.nightModeActive) {
                    GameState.nightModeActive = true;
                    Log.add('🌑 A noite cai sobre a Avenida Paulista... as sombras se adensam e o perigo aumenta.', 'warning');
                  }
                  // Bruxa fica mais forte após 21:00
                  var hoursPastNine = (GameState.time - GAME_CONSTANTS.NIGHT_MODE_HOUR) / 60;
                  if (GameState.characters.bruxa && GameState.characters.bruxa.isAlive) {
                    GameState.characters.bruxa.attackPower = GAME_CONSTANTS.WITCH_BASE_ATTACK + Math.floor(hoursPastNine * GAME_CONSTANTS.WITCH_NIGHT_BONUS_PER_HOUR);
                  }
                  // Inimigos ficam mais agressivos
                  Object.values(GameState.characters).forEach(function(c) {
                    if (c.id !== 'player' && !c.isAlly && c.isAlive && !c.isNeutral) {
                      c.aggression = Math.min(0.95, (c.aggression || 0.4) + 0.002);
                    }
                  });
                  // Tropeço noturno sem lanterna (15% chance ao mover)
                  if (!Rules.hasEffect('nightVision') && Utils.random() < 0.15) {
                    var tripDmg = 5;
                    Rules.damagePlayer(tripDmg);
                    Log.add('🌑 Você tropeça no escuro! -' + tripDmg + ' HP. Uma LANTERNA ajudaria.', 'danger');
                  }
                }

                // ===== EFEITOS MECÂNICOS DO CLIMA =====
                // Neblina: flag para esconder NPCs no minimapa
                GameState.fogActive = RandomEvents.isActive('fog');

                // Vento forte: empurra jogador com asa delta
                if (RandomEvents.isActive('wind_howl') && Rules.hasEffect('windVulnerable')) {
                  if (Utils.random() < 0.2) {
                    var currentExits = Object.values(GameState.rooms[GameState.playerLocation].exits);
                    if (currentExits.length > 0) {
                      var windDest = Utils.randomChoice(currentExits);
                      var windRoom = GameState.rooms[windDest];
                      if (windRoom && !windRoom.requiresFlight) {
                        GameState.playerLocation = windDest;
                        GameState.characters.player.location = windDest;
                        Log.add('💨 O vento forte arrasta sua ASA DELTA e te leva para ' + windRoom.name + '!', 'warning');
                      }
                    }
                  }
                }

                // Terremoto: derruba item do inventário
                if (RandomEvents.isActive('earthquake')) {
                  if (Utils.random() < 0.2 && GameState.playerInventory.length > 0) {
                    var quakeIdx = Math.floor(Utils.random() * GameState.playerInventory.length);
                    var quakeItemId = GameState.playerInventory.splice(quakeIdx, 1)[0];
                    GameState.items[quakeItemId].location = GameState.playerLocation;
                    Log.add('🫨 O tremor fez você derrubar ' + GameState.items[quakeItemId].name + '!', 'danger');
                  }
                }

                // Sussurros: revelam localização da Bruxa
                if (RandomEvents.isActive('whispers') && GameState.characters.bruxa && GameState.characters.bruxa.isAlive) {
                  var bruxaRoom = GameState.rooms[GameState.characters.bruxa.location];
                  if (bruxaRoom) {
                    Log.add('👻 Os sussurros apontam para... "' + bruxaRoom.name + '"...', 'magic');
                  }
                }

                // ===== VENDEDOR AMBULANTE: mover a cada ~10 turnos =====
                if (GameState.characters.vendedor && GameState.characters.vendedor.isAlive) {
                  if (!GameState._vendorMoveCooldown) GameState._vendorMoveCooldown = 0;
                  GameState._vendorMoveCooldown++;
                  if (GameState._vendorMoveCooldown >= 10) {
                    GameState._vendorMoveCooldown = 0;
                    var vendorGroundRooms = Object.keys(GameState.rooms).filter(function(r) {
                      return !GameState.rooms[r].requiresFlight && r !== 'teto_masp' && r !== 'subsolo_masp';
                    });
                    GameState.characters.vendedor.location = Utils.randomChoice(vendorGroundRooms);
                  }
                }

                // WORLD SANITY: validar novamente após eventos (double-check)
                WorldSanity.enforce();
              },

              // Processar timer da bomba
              processBombTimer: function() {
                if (!GameState.armedBomb) return;

                GameState.armedBomb.turnsLeft--;

                if (GameState.armedBomb.turnsLeft > 0) {
                  SoundSystem.playBombTick();
                  var bombRoom = GameState.rooms[GameState.armedBomb.location].name;
                  Log.add(`⏱️ BOMBA: ${GameState.armedBomb.turnsLeft} turno(s) para explodir em ${bombRoom}!`, 'warning');
                  return;
                }

                // EXPLOSÃO!
                const bombLocation = GameState.armedBomb.location;
                const roomName = GameState.rooms[bombLocation].name;

                // COLETAR o que havia na sala ANTES de destruir
                const itemsInRoom = Object.values(GameState.items)
                  .filter(item => item.location === bombLocation && !item.isDestroyed)
                  .map(item => item.name);

                const charsInRoom = Object.values(GameState.characters)
                  .filter(char => char.location === bombLocation && char.isAlive && char.id !== 'player')
                  .map(char => char.name);

                const victims = [];
                const playerInBombRoom = GameState.playerLocation === bombLocation;

                // Matar TODOS os personagens no local (incluindo player e aliados)
                Object.values(GameState.characters).forEach(char => {
                  if (char.location === bombLocation && char.isAlive) {
                    char.hp = 0;
                    char.isAlive = false;
                    victims.push(char.name);
                  }
                });

                // Proteção extra: garantir que o player morra se estiver na sala
                if (playerInBombRoom && GameState.characters.player.isAlive) {
                  GameState.characters.player.hp = 0;
                  GameState.characters.player.isAlive = false;
                  if (!victims.includes(GameState.characters.player.name)) {
                    victims.push(GameState.characters.player.name);
                  }
                }

                // Destruir TODOS os itens no local
                Object.values(GameState.items).forEach(item => {
                  if (item.location === bombLocation) {
                    item.location = null;
                    item.isDestroyed = true;
                  }
                });

                // Transformar sala em ruína
                const room = GameState.rooms[bombLocation];
                if (room.ruinName) {
                  room.name = room.ruinName;
                  room.description = room.ruinDescription;
                  room.isRuined = true;
                }

                GameState.armedBomb = null;
                GameState.items.bomba.location = null;

                // Som de explosão + FLASH laranja
                SoundSystem.playExplosion();
                ScreenEffects.flash('rgba(255, 150, 50, 0.7)');

                const playerInRoom = victims.includes(GameState.characters.player.name);

                if (victims.length > 0) {
                  Log.add(`💥 BOOM!!! A bomba explodiu em ${roomName}! Vítimas: ${victims.join(', ')}. Tudo foi destruído!`, 'danger');
                } else {
                  Log.add(`💥 BOOM!!! A bomba explodiu em ${roomName}! A área foi completamente destruída!`, 'danger');
                }

                // Modal de resumo do que foi destruído
                const itemsList = itemsInRoom.length > 0
                  ? `<p><strong>📦 Itens destruídos:</strong> ${itemsInRoom.join(', ')}</p>`
                  : '';
                const charsList = charsInRoom.length > 0
                  ? `<p><strong>👥 Personagens atingidos:</strong> ${charsInRoom.join(', ')}</p>`
                  : '';

                let modalContent = `<p>A bomba explodiu em <strong>${roomName}</strong>!</p>`;

                if (playerInRoom) {
                  modalContent = '<p style="color:#ff4444;font-size:1.2rem;font-weight:bold;">💀 VOCÊ FOI ATINGIDO PELA EXPLOSÃO!</p>' + modalContent;
                }

                modalContent += itemsList + charsList;

                const playerDied = playerInRoom && !GameState.characters.player.isAlive;
                modalContent += '<button class="btn" onclick="Game.closeExplosionModal(' + playerDied + ')">Continuar</button>';

                // Marcar flag para evitar checkGameOver automático durante explosão
                GameState._explosionInProgress = true;

                // Mostrar após um pequeno delay para o flash
                setTimeout(() => {
                  Modals.show('💥 EXPLOSÃO!', modalContent);
                }, 200);
              },

              // Bruxa fala palavra mágica
              processWitchWord: function() {
                if (GameState.witchWords >= 4) return;

                const witch = GameState.characters.bruxa;
                if (!witch.isAlive) return;

                // Cooldown entre palavras
                const timeSinceLast = GameState.time - GameState.lastWitchWordTime;
                if (timeSinceLast < GameState.witchWordCooldown) return;

                // Chance de falar (muito baixa, aumenta devagar)
                const baseChance = 0.04;
                const timeBonus = (GameState.time - GAME_CONSTANTS.START_TIME) / 500;
                const chance = Math.min(0.15, baseChance + timeBonus);

                if (Utils.random() < chance) {
                  GameState.witchWords++;
                  GameState.lastWitchWordTime = GameState.time;

                  // Som de magia negra e efeito visual
                  SoundSystem.playDarkMagic();
                  ScreenEffects.flash();

                  const messages = [
                    'O ar estremece... você sente uma energia arcana se acumulando no MASP!',
                    'Um trovão ecoa pelo céu... a Bruxa continua seu ritual!',
                    'Símbolos brilhantes aparecem no céu acima do MASP!',
                    'O portal está quase completo! A energia mágica atinge níveis críticos!'
                  ];

                  Log.add(messages[GameState.witchWords - 1], 'magic');
                }
              },

              // Movimento dos NPCs
              processNPCMovement: function() {
                Object.values(GameState.characters).forEach(char => {
                  if (char.id === 'player') return;
                  if (!char.isAlive) return;
                  if (!char.location) return;

                  // Decrementar pacificação
                  if (char.pacifiedTurns && char.pacifiedTurns > 0) {
                    char.pacifiedTurns--;
                    if (char.pacifiedTurns <= 0) {
                      Log.add('🎸 ' + char.name + ' não está mais pacificado.', 'info');
                    }
                  }

                  // Decrementar paralisia (grafite)
                  if (char.paralyzedTurns && char.paralyzedTurns > 0) {
                    char.paralyzedTurns--;
                    if (char.paralyzedTurns <= 0) {
                      Log.add('🎨 ' + char.name + ' se liberta da armadilha de grafite!', 'info');
                    }
                    return; // NPC paralisado não se move
                  }

                  // Movimento declarativo: movementLock nos dados do personagem
                  if (char.movementLock) {
                    if (char.movementLock.always) return;
                    if (char.movementLock.until && GameState.time < char.movementLock.until) return;
                    if (char.movementLock.untilSummoned && !char.isSummoned) return;
                  }

                  // guardsTarget: aliado convertido fica na sala do alvo enquanto ele estiver vivo
                  if (char.guardsTarget && char.isAlly) {
                    var guardTarget = GameState.characters[char.guardsTarget];
                    if (guardTarget && guardTarget.isAlive) return;
                  }

                  // Limpar cooldown quando aliado não está na mesma sala que o jogador
                  if (char.isAlly && char.followCooldown && char.location !== GameState.playerLocation) {
                    char.followCooldown = false;
                  }

                  // Aliado seguindo o jogador não se move sozinho
                  if (char.isAlly && char.followingPlayer && char.followTurnsLeft > 0) return;

                  // Pandeiro: aliado com alvo se move em direção ao jogador
                  if (char.isAlly && char.pandeiroTarget) {
                    const currentRoom = GameState.rooms[char.location];
                    if (!currentRoom) return;
                    if (char.location === char.pandeiroTarget) {
                      delete char.pandeiroTarget;
                      Log.add('🪘 ' + char.name + ' chegou ao seu chamado!', 'success');
                      // Ativar follow
                      Rules.activateFollow(char.id);
                      return;
                    }
                    // Tentar mover em direção ao alvo (BFS simples)
                    const path = Utils.findPath(char.location, char.pandeiroTarget, char.canFly);
                    if (path && path.length > 1) {
                      var prevLoc = char.location;
                      char.location = path[1];
                      if (prevLoc === GameState.playerLocation && char.location !== GameState.playerLocation) {
                        var destR = GameState.rooms[char.location];
                        Log.add('🤝 ' + char.name + ' foi para ' + destR.name + '.', 'info');
                      }
                    } else {
                      delete char.pandeiroTarget; // Caminho impossível
                    }
                    return;
                  }

                  // 30% de chance de mover
                  if (Utils.random() < GAME_CONSTANTS.NPC_MOVE_CHANCE) {
                    const currentRoom = GameState.rooms[char.location];
                    if (!currentRoom) return;

                    const exits = Object.values(currentRoom.exits);
                    if (exits.length === 0) return;

                    // Filtrar saídas que o personagem pode acessar
                    const validExits = exits.filter(exitId => {
                      const targetRoom = GameState.rooms[exitId];
                      // Personagem não pode voar e sala requer voo
                      if (targetRoom.requiresFlight && !char.canFly) return false;
                      // Escudo de força bloqueia acesso ao teto do MASP
                      if (exitId === 'teto_masp' && !GameState.forceShieldDown) return false;
                      return true;
                    });

                    if (validExits.length > 0) {
                      const prevLocation = char.location;
                      char.location = Utils.randomChoice(validExits);

                      // NPC sai da sala do jogador — logar destino
                      if (prevLocation === GameState.playerLocation && char.location !== GameState.playerLocation) {
                        var destRoom = GameState.rooms[char.location];
                        var icon = char.isAlly ? '🤝' : '⚔️';
                        Log.add(icon + ' ' + char.name + ' foi para ' + destRoom.name + '.', 'info');
                      }

                      // Grafite: inimigo entra em sala com armadilha
                      if (!char.isAlly && GameState.roomTraps && GameState.roomTraps[char.location]) {
                        char.paralyzedTurns = GAME_CONSTANTS.GRAFFITI_PARALYZE_TURNS;
                        delete GameState.roomTraps[char.location];
                        if (char.location === GameState.playerLocation) {
                          Log.add('🎨 ' + char.name + ' pisou no GRAFITE MÁGICO e ficou paralisado por 2 turnos!', 'success');
                        }
                      }

                      // NPC fala ao se mover (30% de chance)
                      if (Utils.random() < GAME_CONSTANTS.NPC_SPEAK_CHANCE) {
                        const phrases = NPC_PHRASES[char.id];
                        if (phrases && phrases.move) {
                          Log.add(`💬 ${char.name}: "${Utils.randomChoice(phrases.move)}"`, 'info');
                        }
                      }

                      // NPC encontra o jogador na nova sala
                      if (char.location === GameState.playerLocation && prevLocation !== GameState.playerLocation) {
                        const phrases = NPC_PHRASES[char.id];
                        if (phrases && phrases.encounter) {
                          Log.add(`💬 ${char.name}: "${Utils.randomChoice(phrases.encounter)}"`, 'info');
                        }
                        // Aliado ativa modo seguir ao encontrar o jogador
                        Rules.activateFollow(char.id);
                      }
                    }
                  }
                });
              },

              // Bombardeador cria e arma bombas
              processBombardeadorBombs: function() {
                const bombardeador = GameState.characters.bombardeador;
                if (!bombardeador.isAlive || bombardeador.isAlly) return;
                if (!bombardeador.canCreateBombs) return;

                // SEGURANÇA: Bombardeador não pode armar bomba em sala que requer voo!
                const currentRoom = GameState.rooms[bombardeador.location];
                if (currentRoom && currentRoom.requiresFlight) return;

                // Checar cooldown (GRANDE - 60 minutos de jogo = 12 turnos)
                const timeSinceLast = GameState.time - bombardeador.lastBombCreation;
                if (timeSinceLast < bombardeador.bombCooldown) return;

                // Não criar se já existe uma bomba armada
                if (GameState.armedBomb) return;

                // Bombardeador não pode colocar bombas no subsolo do MASP
                if (bombardeador.location === 'subsolo_masp') return;

                // Pequena chance de criar e armar bomba (5%)
                if (Utils.random() < 0.05) {
                  // Timer aleatório entre 10 e 20 turnos
                  const timerTurns = Utils.randomInt(10, 20);

                  // Armar a bomba diretamente na localização do bombardeador
                  GameState.armedBomb = {
                    location: bombardeador.location,
                    turnsLeft: timerTurns
                  };
                  GameState.items.bomba.location = bombardeador.location;

                  bombardeador.lastBombCreation = GameState.time;

                  const roomName = GameState.rooms[bombardeador.location].name;
                  Log.add(`💣 O BOMBARDEADOR criou e armou uma BOMBA em ${roomName}! Timer: ${timerTurns} turnos!`, 'danger');
                }
              },

              // Combate autônomo unificado (NPCs hostis → jogador + aliados → inimigos)
              processAutoCombat: function() {
                var playerRoom = GameState.playerLocation;
                var player = GameState.characters.player;
                if (!player.isAlive || GameState.gameOver) return;

                Object.values(GameState.characters).forEach(function(char) {
                  if (char.id === 'player' || !char.isAlive || char.isNeutral || !char.location) return;
                  if (CombatModal.isTargetedForKill(char.id)) return;
                  if (char.pacifiedTurns && char.pacifiedTurns > 0) return;
                  if (char.paralyzedTurns && char.paralyzedTurns > 0) return;

                  var isAlly = char.isAlly;

                  if (!isAlly) {
                    // === NPC hostil ataca o jogador ===
                    if (char.location !== playerRoom) return;

                    var aggression = char.aggression !== undefined ? char.aggression : 0.4;
                    if (Utils.random() >= aggression) return;

                    var attackMove = char.moves && char.moves.attack && char.moves.attack.length > 0
                      ? Utils.randomChoice(char.moves.attack)
                      : { name: 'Ataque', power: char.attackPower };

                    var playerDefense = Rules.getPlayerDefensePower();
                    var damage = Math.max(1, attackMove.power - playerDefense);

                    // Bombardeador usa gás
                    if (char.usesGas) {
                      if (Rules.hasGasMask()) {
                        Log.add(char.name + ' lança ' + attackMove.name + ', mas sua MÁSCARA GÁS te protege!', 'success');
                        return;
                      } else {
                        damage += 10;
                        Log.add(char.name + ' usa ' + attackMove.name + '! Você precisa de uma MÁSCARA GÁS!', 'danger');
                      }
                    }

                    var killed = player.hp - damage <= 0;

                    // Frase de ataque
                    var attackPhrase = null;
                    if (Utils.random() < 0.5) {
                      var phrases = NPC_PHRASES[char.id];
                      if (phrases && phrases.attack) attackPhrase = Utils.randomChoice(phrases.attack);
                    }

                    CombatModal.enqueue(
                      { name: '🗡️ ' + char.name.toUpperCase(), hp: char.hp, maxHp: char.maxHp, attackPower: attackMove.power, moveName: attackMove.name, items: (char.usesGas && !Rules.hasGasMask()) ? [{ name: 'Gás Tóxico ☠️', bonus: 10 }] : [], totalAttack: (char.usesGas && !Rules.hasGasMask()) ? attackMove.power + 10 : attackMove.power },
                      { name: '🛡️ JOGADOR', hp: player.hp, maxHp: player.maxHp, defensePower: player.defensePower, items: CombatModal.getPlayerDefenseItems(), totalDefense: playerDefense },
                      { damage: damage, killed: killed, remainingHp: Math.max(0, player.hp - damage), targetId: 'player', attackerId: char.id, extraMessage: attackPhrase ? ('💬 "' + attackPhrase + '"') : null, playerIsAttacker: false },
                      function(result) {
                        Rules.damagePlayer(result.damage);
                        SoundSystem.playHit();
                        ScreenEffects.flash('rgba(255, 255, 255, 0.6)');
                        Log.add(char.name + ' usa ' + attackMove.name + ' causando ' + result.damage + ' de dano! (HP: ' + GameState.characters.player.hp + '/' + player.maxHp + ')', 'danger');
                      }
                    );
                  } else {
                    // === Aliado ataca inimigos ===
                    var enemiesInRoom = Object.values(GameState.characters).filter(function(c) {
                      return c.id !== 'player' && c.location === char.location && c.isAlive && !c.isAlly && !c.isNeutral;
                    });
                    if (enemiesInRoom.length === 0) return;

                    var hasBruxaTarget = char.id === 'demonio' && enemiesInRoom.some(function(e) { return e.id === 'bruxa'; });
                    var allyAggression = char.aggression !== undefined ? char.aggression : 0.5;
                    if (!hasBruxaTarget && Utils.random() >= allyAggression) return;

                    var target = (char.id === 'demonio' && hasBruxaTarget)
                      ? enemiesInRoom.find(function(e) { return e.id === 'bruxa'; })
                      : Utils.randomChoice(enemiesInRoom);

                    var allyAttackMove = char.moves && char.moves.attack && char.moves.attack.length > 0
                      ? Utils.randomChoice(char.moves.attack)
                      : { name: 'Ataque', power: char.attackPower };

                    var defenseMove = target.moves && target.moves.defense && target.moves.defense.length > 0
                      ? Utils.randomChoice(target.moves.defense)
                      : { name: 'Defesa', power: target.defensePower };

                    var allyDamage = Math.max(1, allyAttackMove.power - defenseMove.power);
                    var allyKilled = target.hp - allyDamage <= 0;

                    var applyAllyCallback = function(result) {
                      var t = GameState.characters[result.targetId];
                      if (!t) return;
                      t.hp -= result.damage;
                      if (t.hp <= 0) {
                        t.hp = 0; t.isAlive = false;
                        Log.add(char.name + ' derrotou ' + t.name + ' com ' + allyAttackMove.name + '!', 'success');
                        if (t.onDeath === 'glitchEffect') GlitchEffect.trigger(3000);
                      } else {
                        Log.add(char.name + ' usa ' + allyAttackMove.name + ' em ' + t.name + ' causando ' + result.damage + ' de dano! (HP: ' + t.hp + ')', 'success');

                        { name: '🛡️ ' + target.name.toUpperCase(), hp: target.hp, maxHp: target.maxHp, defensePower: defenseMove.power, moveName: defenseMove.name, items: [], totalDefense: defenseMove.power },
                        { damage: allyDamage, killed: allyKilled, remainingHp: Math.max(0, target.hp - allyDamage), targetId: target.id, attackerId: char.id, extraMessage: null, playerIsAttacker: true },
                        applyAllyCallback
                      );
                    } else {
                      // Fora da sala do jogador — aplica direto sem modal
                      target.hp -= allyDamage;

                        target.hp = 0; target.isAlive = false;

            // ============================================================================
            // LOG - Sistema de mensagens
            // ============================================================================


            const Log = {
              // Histórico de mensagens exibidas no painel de log.
              entries: [],

              // Estado interno para renderização incremental (evita reconstruir todo o HTML a cada Log.add)
              _container: null,
              _renderedCount: 0,
              _flushScheduled: false,

              _ensureContainer: function() {
                if (!this._container) this._container = document.getElementById('log-container');
                return this._container;
              },

              _formatMessageHTML: function(message) {
                // Mantém o mesmo comportamento: trechos *assim* viram <em>assim</em>
                return String(message).replace(/\*([^*]+)\*/g, '<em>$1</em>');
              },

              _entryToHTML: function(entry) {
                return (
                  '<div class="log-entry">' +
                    '<span class="log-time">[' + entry.time + ']</span>' +
                    '<span class="log-' + entry.type + '">' + this._formatMessageHTML(entry.message) + '</span>' +
                  '</div>'
                );
              },

              // Typewriter state
              _twActive: false,
              _twEnabled: true,
              _twElement: null,  // this now points to the message <span>, not the <div>
              _twFullHTML: '',
              _twTimer: null,
              _twQueue: [],

              _typewrite: function(element, fullHTML) {
                // element = div.log-entry; find the message span inside it
                var span = element.querySelector('span:last-child');
                if (!span) return;
                this._twActive = true;
                this._twElement = span;
                this._twFullHTML = span.innerHTML; // store only the span's HTML
                var chars = Array.from(span.textContent || '');
                var charIdx = 0;
                var self = this;
                var cursor = document.createElement('span');
                cursor.className = 'typewriter-cursor';
                cursor.textContent = '▌';
                span.textContent = '';
                span.appendChild(cursor);

                this._twTimer = setInterval(function() {
                  if (charIdx < chars.length) {
                    span.insertBefore(document.createTextNode(chars[charIdx]), cursor);
                    charIdx++;
                    var c = self._ensureContainer(); c.scrollTop = c.scrollHeight;
                  } else {
                    self._finishTypewriter();
                  }
                }, 15);
              },

              _finishTypewriter: function() {
                if (this._twTimer) { clearInterval(this._twTimer); this._twTimer = null; }
                if (this._twElement) {
                  this._twElement.innerHTML = this._twFullHTML;
                  var c = this._ensureContainer(); c.scrollTop = c.scrollHeight;
                }
                this._twActive = false;
                this._twElement = null;
                // Process next in queue
                if (this._twQueue.length > 0) {
                  var next = this._twQueue.shift();
                  this._typewrite(next.element, next.html);
                }
              },

              _skipTypewriter: function() {
                if (!this._twActive) return;
                this._finishTypewriter();
                // Also finish everything in queue instantly
                while (this._twQueue.length > 0) {
                  var next = this._twQueue.shift();
                  var s = next.element.querySelector('span:last-child');
                  if (s) s.innerHTML = next.html;
                }
              },

              _flush: function() {
                this._flushScheduled = false;
                const container = this._ensureContainer();
                if (!container) return;

                // Se houve clear (ou algo desincronizou), reconstrói de forma segura
                if (this._renderedCount > this.entries.length) this._renderedCount = 0;

                // Append incremental: renderiza só as entradas novas
                if (this._renderedCount === 0) {
                  container.innerHTML = '';
                }

                var newCount = this.entries.length - this._renderedCount;
                if (newCount > 0) {
                  // If typewriter is active and new messages arrive, finish current instantly
                  if (this._twActive) {
                    this._skipTypewriter();
                  }

                  const frag = document.createDocumentFragment();
                  var lastDiv = null;
                  for (let i = this._renderedCount; i < this.entries.length; i++) {
                    const wrapper = document.createElement('div');
                    var html = this._entryToHTML(this.entries[i]);
                    wrapper.innerHTML = html;
                    var div = wrapper.firstChild;
                    frag.appendChild(div);
                    lastDiv = div;
                  }
                  container.appendChild(frag);
                  this._renderedCount = this.entries.length;

                  // Typewriter on the last entry only (if enabled and just 1-3 new messages)
                  if (this._twEnabled && newCount <= 3 && lastDiv) {
                    this._typewrite(lastDiv);
                  }
                }

                // Mantém comportamento original: scroll sempre no final após render
                container.scrollTop = container.scrollHeight;

                // Mantém indicador de scroll atualizado (mesma chamada, apenas batched)
                requestAnimationFrame(() => Render.updateScrollIndicators());
              },

              _scheduleFlush: function() {
                if (this._flushScheduled) return;
                this._flushScheduled = true;
                // Micro-batch para agrupar várias mensagens do mesmo "turno" do jogo
                requestAnimationFrame(() => this._flush());
              },

              add: function(message, type = 'info') {
                const time = Utils.formatTime(GameState.time);
                this.entries.push({ time, message, type });
                this._scheduleFlush();
              },

              clear: function() {
                this._skipTypewriter();
                this.entries = [];
                this._renderedCount = 0;
                const container = this._ensureContainer();
                if (container) container.innerHTML = '';
                this._scheduleFlush();
              },

              // Mantido por compatibilidade com chamadas existentes
              render: function() {
                this._renderedCount = 0;
                this._scheduleFlush();
              }
            };

            // Click to skip typewriter
            document.addEventListener('DOMContentLoaded', function() {
              var logContainer = document.getElementById('log-container');
              if (logContainer) {
                logContainer.addEventListener('click', function() { Log._skipTypewriter(); });
              }
            });

            // ============================================================================
            // AMBIENT PARTICLES - Efeitos visuais ambientais
            // ============================================================================
            const AmbientParticles = {
              enabled: true,
              _overlay: null,
              _interval: null,
              _currentPreset: null,
              _particleCount: 0,
              MAX_PARTICLES: 30,

              _ensureOverlay: function() {
                if (!this._overlay) {
                  this._overlay = document.getElementById('particles-overlay');
                  if (!this._overlay) {
                    this._overlay = document.createElement('div');
                    this._overlay.id = 'particles-overlay';
                    document.body.appendChild(this._overlay);

              },

              toggle: function() {

              },

              _clear: function() {
                if (this._interval) { clearInterval(this._interval); this._interval = null; }
                var overlay = this._ensureOverlay();

                this._particleCount = 0;
                this._currentPreset = null;
              },

              _detectPreset: function() {
                var container = document.getElementById('game-container');
                if (!container) return null;
                if (container.classList.contains('theme-bomb')) return 'spark';
                if (container.classList.contains('theme-ruins')) return 'dust';

                if (RandomEvents.isActive('fog')) return 'fog';
                if (RandomEvents.isActive('wind_howl')) return 'wind';

              },

              _spawnParticle: function(preset) {
                if (this._particleCount >= this.MAX_PARTICLES) return;
                var overlay = this._ensureOverlay();
                var p = document.createElement('div');
                p.className = 'particle';
                var dur, style;

                switch (preset) {
                  case 'rain':
                    dur = 0.6 + Math.random() * 0.4;
                    p.style.cssText = 'left:' + Math.random()*100 + '%;top:-5px;width:1px;height:' + (8+Math.random()*12) + 'px;background:rgba(180,200,255,0.5);animation:rain-fall-particle ' + dur + 's linear forwards;';
                    break;
                  case 'fog':

                    p.style.cssText = 'top:' + Math.random()*80 + '%;width:' + size + 'px;height:' + size*0.5 + 'px;background:radial-gradient(ellipse,rgba(200,200,220,0.15),transparent);border-radius:50%;animation:fog-drift ' + dur + 's linear forwards;';
                    break;
                  case 'wind':
                    dur = 0.5 + Math.random() * 0.5;
                    p.style.cssText = 'top:' + Math.random()*100 + '%;left:-50px;width:' + (30+Math.random()*40) + 'px;height:1px;background:rgba(200,220,255,0.3);animation:wind-streak ' + dur + 's linear forwards;';
                    break;
                  case 'firefly':
                    dur = 3 + Math.random() * 4;
                    p.style.cssText = 'left:' + Math.random()*100 + '%;top:' + Math.random()*100 + '%;width:3px;height:3px;background:#ffe080;border-radius:50%;box-shadow:0 0 6px #ffe080;animation:firefly ' + dur + 's ease-in-out forwards;';
                    break;
                  case 'spark':
                    dur = 0.4 + Math.random() * 0.4;
                    var sx = (Math.random()-0.5)*60, sy = -(20+Math.random()*40);
                    p.style.cssText = 'left:' + (30+Math.random()*40) + '%;bottom:' + Math.random()*30 + '%;width:2px;height:2px;background:#ffa030;border-radius:50%;box-shadow:0 0 4px #ff6000;--sx:' + sx + 'px;--sy:' + sy + 'px;animation:spark ' + dur + 's ease-out forwards;';
                    break;
                  case 'dust':
                    dur = 3 + Math.random() * 4;
                    p.style.cssText = 'left:' + Math.random()*100 + '%;top:-5px;width:' + (2+Math.random()*3) + 'px;height:' + (2+Math.random()*3) + 'px;background:rgba(180,140,120,0.4);border-radius:50%;animation:dust-fall ' + dur + 's linear forwards;';
                    break;
                }

                this._particleCount++;
                p.addEventListener('animationend', function() {
                  p.remove();
                  AmbientParticles._particleCount--;
                });
                overlay.appendChild(p);
              },

              update: function() {
                if (!this.enabled) return;
                var preset = this._detectPreset();

                if (preset !== this._currentPreset) {
                  this._clear();
                  this._currentPreset = preset;
                  if (!preset) return;

                  var rate = preset === 'rain' ? 60 : preset === 'wind' ? 100 : preset === 'fog' ? 1500 : preset === 'firefly' ? 800 : preset === 'spark' ? 150 : 500;
                  var self = this;
                  this._interval = setInterval(function() {
                    if (self.enabled && self._currentPreset === preset) self._spawnParticle(preset);
                  }, rate);
                }
              }
            };

            // BFS para calcular distância mínima entre duas salas
            function getBombDistance(startId, targetId) {
              if (startId === targetId) return 0;
              var visited = {};
              visited[startId] = true;
              var queue = [[startId, 0]];
              var qi = 0;
              while (qi < queue.length) {
                var item = queue[qi++];
                var curr = item[0];
                var dist = item[1];
                var room = GameState.rooms[curr];
                if (!room || !room.exits) continue;
                var exitKeys = Object.keys(room.exits);
                for (var i = 0; i < exitKeys.length; i++) {
                  var next = room.exits[exitKeys[i]];
                  if (next === targetId) return dist + 1;
                  if (!visited[next]) {
                    visited[next] = true;
                    queue.push([next, dist + 1]);
                  }
                }
              }
              return -1; // inacessível
            }

            const BombIndicator = {

                btn.classList.add('active');
                var bomb = GameState.armedBomb;
                var roomName = GameState.rooms[bomb.location] ? GameState.rooms[bomb.location].name : bomb.location;
                var dist = getBombDistance(GameState.playerLocation, bomb.location);
                var distText = dist < 0 ? 'inacessível' : dist + ' sala' + (dist !== 1 ? 's' : '');

                if (bomb.carriedByPlayer) {
                  tooltip.innerHTML =
                    '💣 Bomba com VOCÊ!<br>' +
                    '⏱️ ' + bomb.turnsLeft + ' turno' + (bomb.turnsLeft !== 1 ? 's' : '') + ' restante' + (bomb.turnsLeft !== 1 ? 's' : '') + '<br>' +
                    '🤡 Boa sorte, herói. Você está carregando a bomba.';

                    '🤡 Boa sorte, herói. Você está sentado na bomba.';

                    '🚶 ' + distText + ' de distância';
                }
              }
            };



            const Render = {

              dom: null,

              _renderSig: { items: '', chars: '', inv: '' },
              _nodeCache: { items: new Map(), chars: new Map(), inv: new Map() },

              cacheDom: function() {
                if (this.dom) return this.dom;

                // Cache de DOM (hot path): resolve 1x e reutiliza referências
                this.dom = {
                  gameContainer: document.getElementById('game-container'),

                  locationDescription: document.getElementById('location-description'),
                  itemsContainer: document.getElementById('items-container'),
                  charactersContainer: document.getElementById('characters-container'),
                  inventoryList: document.getElementById('inventory-list'),

                  energyDisplay: document.getElementById('energy-display'),
                  weightDisplay: document.getElementById('weight-display'),

              },

              updateTheme: function() {
                const container = this.dom.gameContainer;
                container.classList.remove('theme-ruins', 'theme-sky', 'theme-bomb', 'theme-night');

                const room = GameState.rooms[GameState.playerLocation];

                // Modo noturno (após 21:00)
                if (GameState.nightModeActive) {
                  container.classList.add('theme-night');

                // Prioridade: bomba > ruinas > ceu
                if (GameState.armedBomb && GameState.armedBomb.location === GameState.playerLocation) {
                  container.classList.add('theme-bomb');
                } else if (room.isRuined) {

              updateHeader: function() {
                this.dom.timeDisplay.textContent = Utils.formatTime(GameState.time);

                const player = GameState.characters.player;
                const hpDisplay = this.dom.hpDisplay;
                hpDisplay.textContent = `${player.hp}/${player.maxHp}`;
                hpDisplay.className = player.hp <= 30 ? 'stat-value danger' : 'stat-value';

                const weight = Rules.getInventoryWeight();
                this.dom.weightDisplay.textContent = `${weight}/${player.maxWeight}`;

                // Energia
                const energyDisplay = this.dom.energyDisplay;
                if (energyDisplay) {

                  energyDisplay.className = energyVal <= 20 ? 'stat-value danger' : 'stat-value';

              },

              updateLocation: function() {
                const room = GameState.rooms[GameState.playerLocation];
                this.dom.locationName.textContent = room.name;

                let desc = room.description;

                // Lanterna: ícone com tooltip no canto do painel
                var oldIndicator = document.querySelector('.lanterna-indicator');
                if (oldIndicator) oldIndicator.remove();

                if (Rules.hasEffect('revealAdjacent')) {
                  var isNight = GameState.time >= 1200;

                  if (isNight) {
                    var exits = Object.values(room.exits);
                    exits.forEach(function(exitId) {
                      var adjItems = Object.values(GameState.items).filter(function(item) {
                        return item.location === exitId && !item.isDestroyed && !item.isAnimated;
                      });
                      if (adjItems.length > 0) {

                  indicator.className = 'lanterna-indicator';

                  } else if (adjacentData.length === 0) {
                    tooltip.innerHTML = '<div class="lanterna-tooltip-title">🔦 Lanterna Revela</div><div class="lanterna-tooltip-room"><div class="lanterna-tooltip-item">Nenhum item nas salas adjacentes</div></div>';

                    adjacentData.forEach(function(d) {

              updateItems: function() {
                const container = this.dom.itemsContainer;
