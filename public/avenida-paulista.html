            /**
             * @namespace GlitchEffect
             * @description Efeito visual de glitch/distorção aplicado ao container do jogo.
             */

            const GlitchEffect = {
              isActive: false,

              // Dispara o efeito de glitch por um tempo determinado
              trigger: function(durationMs = 3000) {
                if (this.isActive) return;
                this.isActive = true;

                const container = document.getElementById('game-container');
                const overlay = document.getElementById('glitch-overlay');

                // Ativar glitch visual
                container.classList.add('glitch-active');
                overlay.classList.add('active');

                // Som de glitch (estático/ruído)
                this.playGlitchSound();

                // Desativar após duração
                setTimeout(() => {
                  container.classList.remove('glitch-active');
                  overlay.classList.remove('active');
                  this.isActive = false;
                }, durationMs);
              },

              // Som de glitch usando ruído
              playGlitchSound: function() {
                if (!SoundSystem.audioCtx || !SoundSystem.enabled) return;

                const ctx = SoundSystem.audioCtx;
                const duration = 0.3;
                const intervals = 10;

                for (let i = 0; i < intervals; i++) {
                  setTimeout(() => {
                    if (!this.isActive) return;

                    // Criar buffer de ruído
                    const bufferSize = ctx.sampleRate * 0.05;
                    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
                    const data = buffer.getChannelData(0);

                    for (let j = 0; j < bufferSize; j++) {
                      data[j] = (Math.random() * 2 - 1) * 0.3;
                    }

                    const noise = ctx.createBufferSource();
                    noise.buffer = buffer;

                    const gain = ctx.createGain();
                    gain.gain.setValueAtTime(0.15 * SoundSystem.masterVolume, ctx.currentTime);
                    gain.gain.exponentialValueToTargetAtTime(0.01, ctx.currentTime, 0.04);

                    noise.connect(gain);
                    gain.connect(ctx.destination);
                    noise.start();
                    noise.stop(ctx.currentTime + 0.05);
                  }, i * 300);
                }
              }
            };

            const WeatherIndicators = {
              update: function() {
                var mapping = { 'weather-rain': 'rain', 'weather-wind': 'wind_howl', 'weather-fog': 'fog' };
                Object.keys(mapping).forEach(function(elemId) {
                  var el = document.getElementById(elemId);
                  if (el) {
                    if (RandomEvents.isActive(mapping[elemId])) {
                      el.classList.add('active');
                    } else {
                      el.classList.remove('active');
                    }
                  }
                });
              }
            };

            const RandomEvents = {
              activeEvents: {},
              activeSounds: {},

              process: function() {
                if (GameState.gameOver) return;

                // 1. Decrementar e expirar eventos ativos
                const toRemove = [];
                Object.keys(this.activeEvents).forEach(function(eventId) {
                  const active = RandomEvents.activeEvents[eventId];
                  if (active.turnsLeft > 0) {
                    active.turnsLeft--;
                    if (active.turnsLeft <= 0) {
                      toRemove.push(eventId);
                    }
                  }
                });
                toRemove.forEach(function(eventId) { RandomEvents.endEvent(eventId); });

                // 2. Tentar disparar novos eventos independentes
                Object.keys(RANDOM_EVENTS).forEach(function(eventId) {
                  const evt = RANDOM_EVENTS[eventId];
                  if (evt.parent) return;
                  if (RandomEvents.isActive(eventId)) return;
                  if (Utils.random() < evt.chance) {
                    RandomEvents.startEvent(eventId);
                  }
                });

                // 3. Processar filhos de eventos ativos
                Object.keys(RandomEvents.activeEvents).forEach(function(eventId) {
                  const evt = RANDOM_EVENTS[eventId];
                  if (!evt || !evt.children) return;
                  evt.children.forEach(function(childId) {
                    const child = RANDOM_EVENTS[childId];
                    if (child && Utils.random() < child.chance) {
                      RandomEvents.startEvent(childId);
                    }
                  });
                });
              },

              startEvent: function(eventId) {
                const evt = RANDOM_EVENTS[eventId];
                if (!evt) return;

                // Para eventos com duração, não iniciar se já ativo
                if (evt.duration !== 0 && this.isActive(eventId)) return;

                // Calcular duração
                var turnsLeft = 0;
                if (typeof evt.duration === 'object') {
                  turnsLeft = Utils.randomInt(evt.duration.min, evt.duration.max);
                } else {
                  turnsLeft = evt.duration;
                }

                // Registrar se tem duração
                if (turnsLeft > 0) {
                  this.activeEvents[eventId] = { turnsLeft: turnsLeft, startedAt: GameState.time };
                }

                // Texto no log
                if (evt.text && evt.text.length > 0) {
                  Log.add(Utils.randomChoice(evt.text), 'info');
                }

                // Som
                if (this.sounds[eventId]) {
                  this.sounds[eventId]();
                }

                // Visual
                if (this.visuals[eventId]) {
                  this.visuals[eventId](true);
                }
                WeatherIndicators.update();
              },

              endEvent: function(eventId) {
                var evt = RANDOM_EVENTS[eventId];
                delete this.activeEvents[eventId];

                // Parar som contínuo
                this.stopSound(eventId);

                // Texto de fim
                if (evt && evt.endText && evt.endText.length > 0) {
                  Log.add(Utils.randomChoice(evt.endText), 'info');
                }

                // Remover visual
                if (this.visuals[eventId]) {
                  this.visuals[eventId](false);
                }

                // Encerrar filhos
                if (evt && evt.children) {
                  var self = this;
                  evt.children.forEach(function(childId) {
                    if (self.isActive(childId)) {
                      self.endEvent(childId);
                    }
                  });
                }
                WeatherIndicators.update();
              },

              isActive: function(eventId) {
                return !!this.activeEvents[eventId];
              },

              stopSound: function(eventId) {
                if (this.activeSounds[eventId]) {
                  try {
                    this.activeSounds[eventId].forEach(function(node) {
                      if (node.stop) node.stop();
                      if (node.disconnect) node.disconnect();
                    });
                  } catch(e) {}
                  delete this.activeSounds[eventId];
                }
              },

              reset: function() {
                var self = this;
                Object.keys(this.activeSounds).forEach(function(id) { self.stopSound(id); });
                this.activeEvents = {};
                this.activeSounds = {};
                ['rain-overlay', 'fog-overlay', 'whisper-overlay'].forEach(function(id) {
                  var el = document.getElementById(id);
                  if (el) el.classList.remove('active');
                });
              },

              // Pause all continuous ambient sounds (for combat)
              pauseAllSounds: function() {
                var self = this;
                Object.keys(this.activeSounds).forEach(function(id) {
                  var nodes = self.activeSounds[id];
                  if (nodes) {
                    nodes.forEach(function(node) {
                      // Mute gain nodes instead of stopping (so we can resume)
                      if (node instanceof GainNode) {
                        node._savedGain = node.gain.value;
                        node.gain.setValueAtTime(0, SoundSystem.audioCtx.currentTime);
                      }
                    });
                  }
                });
              },

              // Resume all continuous ambient sounds (after combat)
              resumeAllSounds: function() {
                var self = this;
                Object.keys(this.activeSounds).forEach(function(id) {
                  var nodes = self.activeSounds[id];
                  if (nodes) {
                    nodes.forEach(function(node) {
                      if (node instanceof GainNode && node._savedGain !== undefined) {
                        node.gain.setValueAtTime(node._savedGain, SoundSystem.audioCtx.currentTime);
                        delete node._savedGain;
                      }
                    });
                  }
                });
              },

                var self = this;
                Object.keys(this.activeSounds).forEach(function(id) { self.stopSound(id); });

            /**
             * @namespace SoundSystem
             * @description Motor de áudio baseado em Web Audio API. Gera sons
             * procedurais (sem arquivos de áudio) para todas as ações do jogo.
             */

            const SoundSystem = {
              audioCtx: null,
              enabled: true,
              masterVolume: 1.0,

              init: function() {
                this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                this.masterGain = this.audioCtx.createGain();
                this.masterGain.gain.value = this.masterVolume;
                this.masterGain.connect(this.audioCtx.destination);
              },

              resume: function() {
                if (this.audioCtx && this.audioCtx.state === 'suspended') {
                  this.audioCtx.resume();
                }
              },

              toggle: function() {
                this.enabled = !this.enabled;
                const btn = document.getElementById('sound-toggle');
                if (btn) {
                  btn.textContent = this.enabled ? '🔊' : '🔇';
                }
              },

              setVolume: function(val) {
                this.masterVolume = val;
                this.enabled = val > 0;
                if (this.masterGain) this.masterGain.gain.value = val;
                var btn = document.getElementById('sound-toggle');
                if (btn) btn.textContent = val > 0 ? '🔊' : '🔇';
              },

              toggleSlider: function() {
                var slider = document.getElementById('sound-slider');
                var musicSlider = document.getElementById('music-slider');
                if (musicSlider) musicSlider.classList.remove('active');
                if (slider) slider.classList.toggle('active');
              },

              // Criar oscilador básico
              createOsc: function(type, freq, duration, volume = 0.3) {
                if (!this.enabled || !this.audioCtx) return null;
                this.resume();

                const osc = this.audioCtx.createOscillator();
                const gain = this.audioCtx.createGain();

                osc.type = type;
                osc.frequency.value = freq;
                gain.gain.value = volume;

                osc.connect(gain);
                gain.connect(this.masterGain || this.audioCtx.destination);

                return { osc, gain, ctx: this.audioCtx };
              },

              // Criar ruído branco
              createNoise: function(duration, volume = 0.2) {
                if (!this.enabled || !this.audioCtx) return null;
                this.resume();

                const bufferSize = this.audioCtx.sampleRate * duration;
                const buffer = this.audioCtx.createBuffer(1, bufferSize, this.audioCtx.sampleRate);
                const data = buffer.getChannelData(0);

                for (let i = 0; i < bufferSize; i++) {
                  data[i] = Math.random() * 2 - 1;
                }

                const noise = this.audioCtx.createBufferSource();
                const gain = this.audioCtx.createGain();
                noise.buffer = buffer;
                gain.gain.value = volume;

                noise.connect(gain);
                gain.connect(this.masterGain || this.audioCtx.destination);

                return { noise, gain, ctx: this.audioCtx };
              },

              // === SONS DO JOGO ===

              playAttack: function() {
                const result = this.createOsc('sawtooth', 400, 0.15);
                if (!result) return;
                const { osc, gain, ctx } = result;

                const now = ctx.currentTime;
                osc.frequency.linearRampToValueAtTime(100, now + 0.15);
                gain.gain.linearRampToValueAtTime(0, now + 0.15);

                osc.start(now);
                osc.stop(now + 0.15);
              },

              playHit: function() {
                // Ruído de impacto
                const noise = this.createNoise(0.1, 0.3);
                if (noise) {
                  const now = noise.ctx.currentTime;
                  noise.gain.gain.linearRampToValueAtTime(0, now + 0.1);
                  noise.noise.start(now);
                  noise.noise.stop(now + 0.1);
                }

                // Tom grave
                const result = this.createOsc('sine', 80, 0.2, 0.4);
                if (result) {
                  const { osc, gain, ctx } = result;
                  const now = ctx.currentTime;
                  gain.gain.linearRampToValueAtTime(0, now + 0.2);
                  osc.start(now);
                  osc.stop(now + 0.2);
                }
              },

              playDeath: function() {
                const result = this.createOsc('sine', 400, 1.0, 0.3);
                if (!result) return;
                const { osc, gain, ctx } = result;

                const now = ctx.currentTime;
                osc.frequency.linearRampToValueAtTime(50, now + 1.0);
                gain.gain.setValueAtTime(0.3 * this.masterVolume, now);
                gain.gain.linearRampToValueAtTime(0, now + 1.0);

                osc.start(now);
                osc.stop(now + 1.0);
              },

              playMove: function() {
                const noise = this.createNoise(0.05, 0.1);
                if (!noise) return;

                const now = noise.ctx.currentTime;
                noise.gain.gain.linearRampToValueAtTime(0, now + 0.05);
                noise.noise.start(now);
                noise.noise.stop(now + 0.05);
              },

              playPickup: function() {
                const result = this.createOsc('sine', 300, 0.15);
                if (!result) return;
                const { osc, gain, ctx } = result;

                const now = ctx.currentTime;
                osc.frequency.linearRampToValueAtTime(600, now + 0.1);
                gain.gain.linearRampToValueAtTime(0, now + 0.15);

                osc.start(now);
                osc.stop(now + 0.15);
              },

              playUseItem: function() {
                const result = this.createOsc('triangle', 400, 0.3);
                if (!result) return;
                const { osc, gain, ctx } = result;

                const now = ctx.currentTime;
                // Vibrato
                const lfo = ctx.createOscillator();
                const lfoGain = ctx.createGain();
                lfo.frequency.value = 15;
                lfoGain.gain.value = 50;
                lfo.connect(lfoGain);
                lfoGain.connect(osc.frequency);

                gain.gain.linearRampToValueAtTime(0, now + 0.3);

                lfo.start(now);
                osc.start(now);
                lfo.stop(now + 0.3);
                osc.stop(now + 0.3);
              },

              // Som místico grandioso para abertura do livro
              playMysticBook: function() {
                if (!this.enabled || !this.audioCtx) return;
                this.resume();
                var ctx = this.audioCtx;
                var now = ctx.currentTime;
                var master = ctx.createGain();
                master.gain.value = 0.25 * this.masterVolume;
                master.connect(ctx.destination);

                // Camada 1: Drone grave pulsante (fundação mística)
                var drone = ctx.createOscillator();
                var droneGain = ctx.createGain();
                drone.type = 'sine';
                drone.frequency.value = 110;
                var droneLfo = ctx.createOscillator();
                var droneLfoGain = ctx.createGain();
                droneLfo.frequency.value = 2;
                droneLfoGain.gain.value = 8;
                droneLfo.connect(droneLfoGain);
                droneLfoGain.connect(drone.frequency);
                droneGain.gain.setValueAtTime(0, now);
                droneGain.gain.linearRampToValueAtTime(0.4, now + 0.5);
                droneGain.gain.linearRampToValueAtTime(0.3, now + 2.0);
                droneGain.gain.linearRampToValueAtTime(0, now + 3.5);
                drone.connect(droneGain);
                droneGain.connect(master);
                droneLfo.start(now);
                drone.start(now);
                droneLfo.stop(now + 3.5);
                drone.stop(now + 3.5);

                // Camada 2: Acordes etéreos (quintas abertas ascendentes)
                var chordNotes = [
                  { freq: 220, start: 0.2, dur: 2.8 },
                  { freq: 330, start: 0.4, dur: 2.6 },
                  { freq: 440, start: 0.6, dur: 2.4 },
                  { freq: 660, start: 0.9, dur: 2.0 },
                  { freq: 880, start: 1.2, dur: 1.5 },
                ];
                chordNotes.forEach(function(n) {
                  var osc = ctx.createOscillator();
                  var g = ctx.createGain();
                  osc.type = 'sine';
                  osc.frequency.value = n.freq;
                  var trem = ctx.createOscillator();
                  var tremG = ctx.createGain();
                  trem.frequency.value = 3 + Math.random() * 2;
                  tremG.gain.value = 0.15;
                  trem.connect(tremG);
                  tremG.connect(g.gain);
                  g.gain.setValueAtTime(0, now + n.start);
                  g.gain.linearRampToValueAtTime(0.2, now + n.start + 0.3);
                  g.gain.linearRampToValueAtTime(0.15, now + n.start + n.dur * 0.6);
                  g.gain.linearRampToValueAtTime(0, now + n.start + n.dur);
                  osc.connect(g);
                  g.connect(master);
                  trem.start(now + n.start);
                  osc.start(now + n.start);
                  trem.stop(now + n.start + n.dur);
                  osc.stop(now + n.start + n.dur);
                });

                // Camada 3: Brilhos cristalinos (partículas mágicas)
                for (var i = 0; i < 8; i++) {
                  var sparkle = ctx.createOscillator();
                  var sGain = ctx.createGain();
                  sparkle.type = 'sine';
                  var sparkFreq = 1200 + Math.random() * 2000;
                  sparkle.frequency.value = sparkFreq;
                  var sStart = 0.3 + Math.random() * 2.2;
                  var sDur = 0.1 + Math.random() * 0.25;
                  sGain.gain.setValueAtTime(0, now + sStart);
                  sGain.gain.linearRampToValueAtTime(0.08, now + sStart + 0.03);
                  sGain.gain.linearRampToValueAtTime(0, now + sStart + sDur);
                  sparkle.connect(sGain);
                  sGain.connect(master);
                  sparkle.start(now + sStart);
                  sparkle.stop(now + sStart + sDur);
                }

                // Camada 4: Sweep ascendente místico (abertura de portal)
                var sweep = ctx.createOscillator();
                var sweepGain = ctx.createGain();
                sweep.type = 'sawtooth';
                sweep.frequency.setValueAtTime(80, now + 0.1);
                sweep.frequency.exponentialRampToValueAtTime(1200, now + 2.5);
                var sweepFilter = ctx.createBiquadFilter();
                sweepFilter.type = 'lowpass';
                sweepFilter.frequency.setValueAtTime(200, now + 0.1);
                sweepFilter.frequency.exponentialRampToValueAtTime(3000, now + 2.0);
                sweepFilter.frequency.exponentialRampToValueAtTime(500, now + 3.0);
                sweepFilter.Q.value = 5;
                sweepGain.gain.setValueAtTime(0, now + 0.1);
                sweepGain.gain.linearRampToValueAtTime(0.12, now + 0.8);
                sweepGain.gain.linearRampToValueAtTime(0.08, now + 2.0);
                sweepGain.gain.linearRampToValueAtTime(0, now + 3.0);
                sweep.connect(sweepFilter);
                sweepFilter.connect(sweepGain);
                sweepGain.connect(master);
                sweep.start(now + 0.1);
                sweep.stop(now + 3.0);

                // Camada 5: Sussurro de vento (ruído filtrado)
                var windDur = 3.5;
                var windBuf = ctx.createBuffer(1, ctx.sampleRate * windDur, ctx.sampleRate);
                var windData = windBuf.getChannelData(0);
                for (var w = 0; w < windData.length; w++) {
                  windData[w] = (Math.random() * 2 - 1) * 0.5;
                }
                var wind = ctx.createBufferSource();
                wind.buffer = windBuf;
                var windFilter = ctx.createBiquadFilter();
                windFilter.type = 'bandpass';
                windFilter.frequency.setValueAtTime(400, now);
                windFilter.frequency.linearRampToValueAtTime(1500, now + 1.5);
                windFilter.frequency.linearRampToValueAtTime(600, now + 3.5);
                windFilter.Q.value = 3;
                var windGain = ctx.createGain();
                windGain.gain.setValueAtTime(0, now);
                windGain.gain.linearRampToValueAtTime(0.06, now + 0.5);
                windGain.gain.linearRampToValueAtTime(0.04, now + 2.5);
                windGain.gain.linearRampToValueAtTime(0, now + 3.5);
                wind.connect(windFilter);
                windFilter.connect(windGain);
                windGain.connect(master);
                wind.start(now);

                // Camada 6: Sino final revelador
                var bell1 = ctx.createOscillator();
                var bell2 = ctx.createOscillator();
                var bellGain = ctx.createGain();
                bell1.type = 'sine';
                bell1.frequency.value = 1318.5;
                bell2.type = 'sine';
                bell2.frequency.value = 1318.5 * 2.756;
                bellGain.gain.setValueAtTime(0, now + 2.5);
                bellGain.gain.linearRampToValueAtTime(0.2, now + 2.55);
                bellGain.gain.exponentialRampToValueAtTime(0.001, now + 3.8);

            // Generic MIDI parser - shared by all music systems
            function parseMidiBase64(base64) {
              var binaryString = atob(base64);
              var bytes = new Uint8Array(binaryString.length);
              for (var i = 0; i < binaryString.length; i++) {
                bytes[i] = binaryString.charCodeAt(i);
              }

              var pos = 0;
              var notes = [];

              var readUint32 = function() { return (bytes[pos++] << 24) | (bytes[pos++] << 16) | (bytes[pos++] << 8) | bytes[pos++]; };
              var readUint16 = function() { return (bytes[pos++] << 8) | bytes[pos++]; };
              var readVarLen = function() {
                var value = 0, b;
                do { b = bytes[pos++]; value = (value << 7) | (b & 0x7F); } while (b & 0x80);
                return value;
              };
              var readString = function(len) { var str = ''; for (var i = 0; i < len; i++) str += String.fromCharCode(bytes[pos++]); return str; };

              if (readString(4) !== 'MThd') throw new Error('Invalid MIDI');
              readUint32();
              readUint16();
              var numTracks = readUint16();
              var ticksPerQuarter = readUint16();
              var microsecondsPerBeat = 500000;

              for (var t = 0; t < numTracks; t++) {
                if (readString(4) !== 'MTrk') continue;
                var trackLength = readUint32();
                var trackEnd = pos + trackLength;
                var absoluteTime = 0;
                var runningStatus = 0;
                var activeNotes = {};
                var tickToSeconds = function(ticks) { return (ticks / ticksPerQuarter) * (microsecondsPerBeat / 1000000); };

                while (pos < trackEnd) {
                  absoluteTime += readVarLen();
                  var statusByte = bytes[pos];
                  if (statusByte < 0x80) statusByte = runningStatus;
                  else { pos++; if (statusByte < 0xF0) runningStatus = statusByte; }
                  var cmd = statusByte & 0xF0;

                  if (cmd === 0x90) {
                    var note = bytes[pos++], vel = bytes[pos++];
                    if (vel > 0) activeNotes[note] = { start: absoluteTime, vel: vel };
                    else if (activeNotes[note]) {
                      notes.push({ t: tickToSeconds(activeNotes[note].start), n: note, d: tickToSeconds(absoluteTime - activeNotes[note].start), v: activeNotes[note].vel });
                      delete activeNotes[note];
                    }
                  } else if (cmd === 0x80) {
                    var note2 = bytes[pos++]; pos++;
                    if (activeNotes[note2]) {
                      notes.push({ t: tickToSeconds(activeNotes[note2].start), n: note2, d: tickToSeconds(absoluteTime - activeNotes[note2].start), v: activeNotes[note2].vel });
                      delete activeNotes[note2];
                    }
                  } else if (cmd === 0xA0 || cmd === 0xB0 || cmd === 0xE0) pos += 2;
                  else if (cmd === 0xC0 || cmd === 0xD0) pos++;
                  else if (statusByte === 0xFF) {
                    var type = bytes[pos++], len = readVarLen();
                    if (type === 0x51) microsecondsPerBeat = (bytes[pos] << 16) | (bytes[pos+1] << 8) | bytes[pos+2];
                    pos += len;
                  } else if (statusByte === 0xF0 || statusByte === 0xF7) pos += readVarLen();
                }
              }

              notes.sort(function(a, b) { return a.t - b.t; });
              var lastNote = notes[notes.length - 1];
              var duration = lastNote ? lastNote.t + lastNote.d : 0;
              return { notes: notes, duration: duration };
            }

            // Factory: creates a MIDI player with specific audio parameters
            // config: { base64, volume, osc1Type, osc2Type, freqMult, gain1, gain2, attack, decay, sustain, release, name }
            function createMidiPlayer(config) {
              return {
                isPlaying: false,
                isLoaded: false,
                volume: config.volume,
                notes: [],
                duration: 0,
                scheduledOscs: [],

                init: function() {
                  this.loadMIDI();
                },

                loadMIDI: function() {
                  try {
                    var result = parseMidiBase64(config.base64);
                    this.notes = result.notes;
                    this.duration = result.duration;
                    this.isLoaded = true;
                    console.log((config.name || 'MidiPlayer') + ': Loaded ' + result.notes.length + ' notes, duration: ' + result.duration.toFixed(2) + 's');
                  } catch (err) {
                    console.error((config.name || 'MidiPlayer') + ': Failed to load MIDI', err);
                  }
                },

                playNote: function(note, startTime, duration, velocity) {
                  var ctx = SoundSystem.audioCtx;
                  if (!ctx || !SoundSystem.enabled) return;

                var freq = 440 * Math.pow(2, (note - 69) / 12);
                  var vol = (velocity / 127) * this.volume;

                  var osc1 = ctx.createOscillator();
                  osc1.type = config.osc1Type;
                  osc1.frequency.value = freq;

                  var osc2 = ctx.createOscillator();
                  osc2.type = config.osc2Type;
                  osc2.frequency.value = freq * config.freqMult;

                  var g1 = ctx.createGain();
                  var g2 = ctx.createGain();
                  var masterGain = ctx.createGain();

                  g1.gain.value = config.gain1 * 2;
                  g2.gain.value = config.gain2 * 2;

                  osc1.connect(g1);
                  osc2.connect(g2);
                  g1.connect(masterGain);
                  g2.connect(masterGain);
                  masterGain.connect(MusicSystem.musicGain || ctx.destination);

                  var now = startTime;
                  masterGain.gain.setValueAtTime(0, now);
                  masterGain.gain.linearRampToValueAtTime(vol, now + config.attack);
                  masterGain.gain.linearRampToValueAtTime(vol * config.sustain, now + config.attack + config.decay);
                  masterGain.gain.setValueAtTime(vol * config.sustain, now + duration - config.release);
                  masterGain.gain.linearRampToValueAtTime(0, now + duration);

                  osc1.start(now);
                  osc2.start(now);
                  osc1.stop(now + duration + 0.05);
                  osc2.stop(now + duration + 0.05);

                  this.scheduledOscs.push(osc1, osc2);
                },

                scheduleNotes: function() {
                  if (!this.isLoaded || !SoundSystem.audioCtx) return;
                  var ctx = SoundSystem.audioCtx;
                  var startTime = ctx.currentTime;
                  for (var i = 0; i < this.notes.length; i++) {
                    var note = this.notes[i];
                    this.playNote(note.n, startTime + note.t, note.d, note.v);
                  }
                },

                start: function() {
                  if (!this.isLoaded) return;
                  this.stop();
                  SoundSystem.resume();
                  this.isPlaying = true;
                  this.scheduleNotes();
                },

                stop: function() {
                  this.isPlaying = false;
                  this.scheduledOscs.forEach(function(osc) {
                    try { osc.stop(); } catch(e) {}
                  });
                  this.scheduledOscs = [];
                }
              };
            }

                if (this.isPlaying) {

              gameover: 'AVP Game Over.mp3',
              combat: '',    // placeholder — adicionar MP3 quando disponível
              defeat: '',    // placeholder
              victory: ''    // placeholder
            };

            const MP3_CACHE_NAME = 'avp-music-v1';

            /**
             * @namespace Mp3Cache
             * @description Gerencia cache de MP3s usando Cache API do navegador.
             * Permite reprodução offline após primeiro carregamento.
             */
            const Mp3Cache = {
              /**
               * Carrega MP3 do cache ou rede, salvando no cache se necessário.
               * @param {string} url - URL relativa do MP3
               * @returns {Promise<string|null>} Blob URL para reprodução ou null se falhar
               */
              async load(url) {
                if (!url) return null;
                try {
                  const cache = await caches.open(MP3_CACHE_NAME);
                  let response = await cache.match(url);
                  
                  if (!response) {
                    // Não está no cache, buscar da rede
                    console.log('[Mp3Cache] Fetching from network:', url);
                    response = await fetch(url);
                    if (response.ok) {
                      // Salvar no cache para uso offline
                      await cache.put(url, response.clone());
                      console.log('[Mp3Cache] Cached:', url);
                    } else {
                      console.warn('[Mp3Cache] Network fetch failed:', url);
                      return null;
                    }
                  } else {
                    console.log('[Mp3Cache] Loaded from cache:', url);
                  }
                  
                  const blob = await response.blob();
                  return URL.createObjectURL(blob);
                } catch (err) {
                  console.warn('[Mp3Cache] Error loading MP3:', url, err);
                  return null;
                }
              },

              /**
               * Pré-carrega todos os MP3s definidos em MP3_TRACKS.
               */
              async preloadAll() {
                const urls = Object.values(MP3_TRACKS).filter(u => u);
                for (const url of urls) {
                  await this.load(url);
                }
                console.log('[Mp3Cache] Preload complete');
              }
            };

            /**
             * @function _addMp3Layer
             * @description Adiciona camada MP3 a um player MIDI existente.
             * Sobrescreve start() e stop() para priorizar MP3 com fallback para MIDI.
             * @param {object} player - Player MIDI criado por createMidiPlayer
             * @param {string} trackKey - Chave em MP3_TRACKS (exploration, combat, etc.)
             * @param {object} options - { loop: boolean }
             */
            function _addMp3Layer(player, trackKey, options = {}) {
              const url = MP3_TRACKS[trackKey];
              if (!url) return; // Sem MP3 definido, mantém apenas MIDI

              const loop = options.loop !== false;
              let audio = null;
              let blobUrl = null;

              const originalStart = player.start.bind(player);
              const originalStop = player.stop.bind(player);

              player._mp3Active = false;
              let stoppedManually = false;

              player.start = async function() {
                // Se já está tocando, não faz nada
                if (audio && !audio.paused && player._mp3Active) return;

                // Tentar carregar MP3
                if (!blobUrl) {
                  blobUrl = await Mp3Cache.load(url);
                }

                if (blobUrl) {
                  // Usar MP3
                  if (!audio) {
                    audio = new Audio(blobUrl);
                    audio.loop = loop;
                  }
                  
                  // Sincronizar volume com musicGain
                  if (MusicSystem.musicGain) {
                    audio.volume = MusicSystem.musicGain.gain.value;
                  } else {
                    audio.volume = MusicSystem.volume || 1.0;
                  }

                  // Só reinicia do zero se foi parado manualmente ou se já terminou
                  if (stoppedManually || audio.ended) {
                    audio.currentTime = 0;
                  }
                  stoppedManually = false;

                  player._mp3Active = true;
                  player.isPlaying = true;
                  audio.play().then(() => {
                    if (player.updateButton) player.updateButton();
                  }).catch(err => {
                    console.warn('[Mp3Layer] Playback error, falling back to MIDI:', err);
                    player._mp3Active = false;
                    originalStart();
                  });
                  console.log('[Mp3Layer] Playing MP3:', trackKey);
                } else {
                  // Fallback para MIDI
                  player._mp3Active = false;
                  console.log('[Mp3Layer] No MP3 available, using MIDI:', trackKey);
                  originalStart();
                }
              };

              player.pause = function() {
                if (audio && player._mp3Active) {
                  audio.pause();
                  // NÃO reseta currentTime — permite retomar
                }
                player.isPlaying = false;
              };

              player.stop = function() {
                if (audio && player._mp3Active) {
                  stoppedManually = true;
                  audio.pause();
                  audio.currentTime = 0;
                }
                player._mp3Active = false;
                player.isPlaying = false;
                originalStop();
              };

              // Atualizar volume do audio quando musicGain mudar
              const originalSetVolume = MusicSystem.setVolume;
              MusicSystem.setVolume = function(val) {
                originalSetVolume.call(this, val);
                if (audio && player._mp3Active) {
                  audio.volume = val;
                }
              };
            }

            // Aplicar camada MP3 aos players existentes
            _addMp3Layer(MusicSystem, 'exploration', { loop: true });
            _addMp3Layer(GameOverMusicSystem, 'gameover', { loop: false });
            _addMp3Layer(CombatMusicSystem, 'combat', { loop: true });

            // Pré-carregar MP3s ao iniciar (opcional, melhora UX)
            if ('caches' in window) {

            /**

             * deep clone, e helpers de randomização.
             */

            const Utils = {
              // Gerador de números pseudo-aleatórios com seed
              random: function() {
                GameState.seed = (GameState.seed * 1103515245 + 12345) & 0x7fffffff;
                return GameState.seed / 0x7fffffff;
              },

              // Número aleatório entre min e max (inclusive)
              randomInt: function(min, max) {
                return Math.floor(this.random() * (max - min + 1)) + min;
              },

              // Escolher item aleatório de array
              randomChoice: function(arr) {
                return arr[Math.floor(this.random() * arr.length)];
              },

              // BFS pathfinding para NPCs
              findPath: function(fromId, toId, canFly) {
                if (fromId === toId) return [fromId];
                var visited = {};
                var queue = [[fromId]];
                visited[fromId] = true;
                while (queue.length > 0) {
                  var path = queue.shift();
                  var current = path[path.length - 1];
                  var room = GameState.rooms[current];
                  if (!room) continue;
                  var exits = Object.values(room.exits);
                  for (var i = 0; i < exits.length; i++) {
                    var next = exits[i];
                    if (visited[next]) continue;
                    var nextRoom = GameState.rooms[next];
                    if (!nextRoom) continue;
                    if (nextRoom.requiresFlight && !canFly) continue;
                    if (next === 'teto_masp' && !GameState.forceShieldDown) continue;
                    var newPath = path.concat([next]);
                    if (next === toId) return newPath;
                    visited[next] = true;
                    queue.push(newPath);
                  }
                }
                return null;
              },

              // Embaralhar array
              shuffle: function(arr) {
                const result = [...arr];
                for (let i = result.length - 1; i > 0; i--) {
                  const j = Math.floor(this.random() * (i + 1));
                  [result[i], result[j]] = [result[j], result[i]];
                }
                return result;
              },

              // Formatar tempo (minutos para HH:MM)
              formatTime: function(minutes) {
                const h = Math.floor(minutes / 60) % 24;
                const m = minutes % 60;
                return `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}`;
              },

              // Clonar objeto profundamente
              deepClone: function(obj) {
                return JSON.parse(JSON.stringify(obj));
              }
            };

            /**
             * @namespace Rules
             * @description Regras e validações do jogo: efeitos de itens, voo,
             * dano ao jogador, movimento de aliados, ativação de follow, e
             * verificação de game over. Funções centralizadas para consistência.
             */

            const Rules = {
              // Verificar se jogador pode voar
              canPlayerFly: function() {
                const player = GameState.characters.player;
                if (player.canFly) return true;

                // Verificar se tem asa delta no inventário
                return Rules.hasEffect('flight');
              },

              // Verificar se pode ir para uma sala
              canMoveTo: function(roomId) {
                const room = GameState.rooms[roomId];
                if (!room) return false;

                if (room.requiresFlight) {
                  return this.canPlayerFly();
                }
                return true;
              },

              // Calcular peso total do inventário
              getInventoryWeight: function() {
                return GameState.playerInventory.reduce((total, itemId) => {
                  const item = GameState.items[itemId];
                  return total + (item ? item.weight : 0);
                }, 0);
              },

              // Recalcular maxWeight de forma idempotente
              recalcMaxWeight: function() {
                var base = 20;
                if (Rules.hasEffect('weightBonus')) base += 20;
                GameState.characters.player.maxWeight = base;
              },

              // Verificar se pode pegar item
              canPickupItem: function(itemId) {
                const item = GameState.items[itemId];
                if (!item) return false;

                const currentWeight = this.getInventoryWeight();
                const player = GameState.characters.player;

                return (currentWeight + item.weight) <= player.maxWeight;
              },

              // Calcular poder de ataque total do jogador
              getPlayerAttackPower: function() {
                const player = GameState.characters.player;
                let attack = player.attackPower;

                // Adicionar bônus de itens
                GameState.playerInventory.forEach(itemId => {
                  const item = GameState.items[itemId];
                  if (item) attack += item.attackPower;
                });

                return attack;
              },

              // Calcular poder de defesa total do jogador
              getPlayerDefensePower: function() {
                const player = GameState.characters.player;
                let defense = player.defensePower;

                // Adicionar bônus de itens
                GameState.playerInventory.forEach(itemId => {
                  const item = GameState.items[itemId];
                  if (item) defense += item.defensePower;
                });

                // Adicionar bônus temporário
                defense += GameState.playerDefenseBonus;

                return defense;
              },

              // Verificar se jogador tem um efeito passivo (de qualquer item no inventário)
              hasEffect: function(effect) {
                return GameState.playerInventory.some(function(id) {
                  var item = GameState.items[id];
                  return item && item.passiveEffects && item.passiveEffects.includes(effect);
                });
              },

              // Verificar se jogador tem máscara de gás (atalho legado)
              hasGasMask: function() {

              // Verificar condições de fim de jogo
              checkGameOver: function() {
                const player = GameState.characters.player;
                const witch = GameState.characters.bruxa;

                // Derrota: jogador morreu
                if (player.hp <= 0) {
                  GameState.gameOver = true;
                  GameState.victory = false;
                  MusicSystem.stop();

                  // "Latch" do motivo do Game Over: uma vez definido, não deve ser sobrescrito/limpo
                  // por recomputes (inventário/efeitos) até reiniciar a partida.
                  if (!GameState.gameOverReason) {
                    GameState.gameOverReason = GameState.deathReason || 'Você foi derrotado! A escuridão consome São Paulo...';
                  }

                  return { ended: true, victory: false, reason: GameState.gameOverReason };
                }

                // Derrota: bruxa completou o portal
                if (GameState.witchWords >= 4) {
                  GameState.gameOver = true;
                  GameState.victory = false;
                  MusicSystem.stop();
                  return { ended: true, victory: false, reason: 'A Bruxa completou o ritual! O portal dimensional se abre e criaturas das trevas invadem a cidade!' };
                }

                // Vitória: bruxa derrotada
                if (witch.hp <= 0) {
                  GameState.gameOver = true;
                  GameState.victory = true;
                  MusicSystem.stop();
                  return { ended: true, victory: true, reason: 'VITÓRIA! Você derrotou a Bruxa e salvou São Paulo!' };
                }

                return { ended: false };
              },

              // Aplicar dano ao jogador com check de morte automático
              damagePlayer: function(amount) {
                var p = GameState.characters.player;
                p.hp -= amount;
                if (p.hp <= 0) { p.hp = 0; p.isAlive = false; }
                return p.hp;

              // Descobrir itens na sala atual do jogador
              discoverItemsInRoom: function() {
                Object.values(GameState.items).forEach(function(item) {
                  if (item.location === GameState.playerLocation && !item.isDestroyed && !item.isAnimated) {

                item.weight = 0;
                item.hasWax = true;

                // Remover a cera mágica do inventário
                const idx = GameState.playerInventory.indexOf('cera_magica');
                if (idx > -1) GameState.playerInventory.splice(idx, 1);

                return {
                  success: true,
                  message: `Você aplica a CERA MÁGICA em ${item.name}! O item fica leve como uma pluma (peso: ${oldWeight}kg → 0kg)!`,
                  consumed: true
                };
              },

              seta_mortal: function(targetId) {
                const playerRoom = GameState.playerLocation;
                const enemies = Object.values(GameState.characters).filter(
                  c => c.id !== 'player' && c.location === playerRoom && c.isAlive && !c.isAlly
                );

                // Se não foi passado um alvo, retorna pedindo seleção
                if (!targetId) {
                  if (enemies.length === 0) {
                    return {
                      success: false,
                      message: 'Não há inimigos aqui para usar a SETA MORTAL!',
                      consumed: false
                    };
                  }
                  return {
                    success: false,
                    message: 'SELECT_SETA_TARGET',
                    selectableTargets: enemies.map(e => ({ id: e.id, name: e.name, hp: e.hp })),
                    consumed: false
                  };
                }

                // Atacar o alvo escolhido
                const target = GameState.characters[targetId];
                if (!target || target.location !== playerRoom || !target.isAlive) {
                  return {
                    success: false,
                    message: 'Alvo inválido!',
                    consumed: false
                  };
                }

                const damage = 40;
                target.hp -= damage;
                if (target.hp <= 0) {
                  target.hp = 0;
                  target.isAlive = false;
                }

                const idx = GameState.playerInventory.indexOf('seta_mortal');
                if (idx > -1) GameState.playerInventory.splice(idx, 1);

                const status = target.isAlive ? `(HP restante: ${target.hp})` : '(MORTO!)';
                return {
                  success: true,
                  message: `A SETA MORTAL acerta ${target.name} causando ${damage} de dano! ${status}`,
                  consumed: true
                };
              },

              hipnodisco: function(targetId) {
                const playerRoom = GameState.playerLocation;

                // Coletar todos os alvos possíveis
                const targets = [];

                // Feiticeiro (se escudo ainda ativo)
                const feiticeiro = GameState.characters.feiticeiro;
                if (feiticeiro.location === playerRoom && feiticeiro.isAlive && !GameState.forceShieldDown) {
                  targets.push({ type: 'feiticeiro', id: 'feiticeiro', name: '🧙 FEITICEIRO (remover escudo)' });
                }

                // Inimigos (não aliados)
                Object.values(GameState.characters).forEach(c => {
                  if (c.id !== 'player' && c.id !== 'feiticeiro' &&
                      c.location === playerRoom && c.isAlive && !c.isAlly &&
                      !c.immuneToHypnosis && !c.isNeutral) {
                    targets.push({ type: 'enemy', id: c.id, name: `⚔️ ${c.name} (hipnotizar)` });
                  }
                });

                // Itens no chão
                Object.values(GameState.items).forEach(item => {
                  if (item.location === playerRoom && !item.isAnimated) {
                    targets.push({ type: 'item', id: item.id, name: `📦 ${item.name} (dar vida)` });
                  }
                });

                // Se não foi passado um alvo, retorna pedindo seleção
                if (!targetId) {
                  if (targets.length === 0) {
                    return {
                      success: false,
                      message: 'Não há alvos aqui para usar o HIPNODISCO!',
                      consumed: false
                    };
                  }
                  return {
                    success: false,
                    message: 'SELECT_HIPNO_TARGET',
                    selectableTargets: targets,
                    consumed: false
                  };
                }

                // Função para consumir o hipnodisco
                const consumeHipnodisco = () => {
                  const idx = GameState.playerInventory.indexOf('hipnodisco');
                  if (idx > -1) GameState.playerInventory.splice(idx, 1);
                };

                // CASO: Feiticeiro
                if (targetId === 'feiticeiro') {
                  if (feiticeiro.location === playerRoom && feiticeiro.isAlive && !GameState.forceShieldDown) {
                    GameState.forceShieldDown = true;
                    consumeHipnodisco();
                    SoundSystem.playHypnoShield();
                    // Flash ciano pulsante (3x) + flash branco final
                    ScreenEffects.flash('rgba(0, 255, 255, 0.5)');
                    setTimeout(function() { ScreenEffects.flash('rgba(0, 255, 255, 0.4)'); }, 300);
                    setTimeout(function() { ScreenEffects.flash('rgba(0, 255, 255, 0.3)'); }, 600);
                    setTimeout(function() { ScreenEffects.flash('rgba(255, 255, 255, 0.7)'); }, 2200);
                    return {
                      success: true,
                      message: 'O HIPNODISCO gira diante do FEITICEIRO... Seus olhos brilham! "Eu conheço esse artefato! Em troca da sua magia, vou remover o ESCUDO DE FORÇA que protege o Teto do MASP!" O Feiticeiro conjura um feitiço e o escudo se dissipa!',
                      consumed: true
                    };
                  }
                }

                // CASO: Inimigo - sempre funciona (exceto imunes)
                const enemy = GameState.characters[targetId];
                if (enemy && enemy.location === playerRoom && enemy.isAlive && !enemy.isAlly) {
                  // Defesa em profundidade: verificar imunidade
                  if (enemy.immuneToHypnosis) {
                    return {
                      success: false,
                      message: `O HIPNODISCO gira, mas ${enemy.name} resiste! Sua mente é forte demais para ser controlada!`,
                      consumed: false
                    };
                  }
                  consumeHipnodisco();
                  enemy.isAlly = true;
                  Karma.change(10, 'Hipnotizou ' + enemy.name);
                  SoundSystem.playHypnoEnemy();
                  // Achievement: Diplomata (check if demon also ally)
                  if (enemy.id === 'feiticeiro') {
                    var demonAlly = GameState.characters.demonio && GameState.characters.demonio.isAlly;
                    if (demonAlly) Achievements.tryUnlock('diplomata');
                  }
                  // Flash roxo/magenta pulsante (controle mental)
                  ScreenEffects.flash('rgba(180, 0, 255, 0.5)');
                  setTimeout(function() { ScreenEffects.flash('rgba(200, 0, 220, 0.4)'); }, 250);
                  setTimeout(function() { ScreenEffects.flash('rgba(160, 0, 255, 0.3)'); }, 500);
                  return {
                    success: true,
                    message: `O HIPNODISCO gira... ${enemy.name} está hipnotizado e agora é seu aliado!`,
                    consumed: true
                  };
                }

                // CASO: Item (dar vida)
                const item = GameState.items[targetId];
                if (item && item.location === playerRoom && !item.isAnimated) {
                  consumeHipnodisco();
                  SoundSystem.playHypnoAnimate();
                  // Flash verde-esmeralda pulsante (energia vital)
                  ScreenEffects.flash('rgba(0, 200, 100, 0.5)');
                  setTimeout(function() { ScreenEffects.flash('rgba(0, 220, 120, 0.4)'); }, 300);
                  setTimeout(function() { ScreenEffects.flash('rgba(0, 255, 150, 0.3)'); }, 600);

                  // Criar um novo personagem baseado no item
                  const animatedId = 'animated_' + item.id + '_' + Date.now();
                  const animatedChar = {
                    id: animatedId,
                    name: item.name + ' ANIMADO',
                    description: `${item.name} ganhou vida através do poder do HIPNODISCO! Agora é seu fiel aliado.`,
                    attackPower: 8 + item.attackPower,
                    defensePower: 3 + item.defensePower,
                    hp: 30 + (item.weight * 2),
                    maxHp: 30 + (item.weight * 2),
                    maxWeight: 0,
                    canFly: item.canFly,
                    isAlive: true,
                    isAlly: true,
                    lastBoss: false,
                    location: playerRoom,
                    isAnimatedObject: true
                  };

                  GameState.characters[animatedId] = animatedChar;
                  item.location = null;
                  item.isAnimated = true;

                  return {
                    success: true,
                    message: `O HIPNODISCO gira sobre ${item.name}... O objeto treme, levita e GANHA VIDA! ${animatedChar.name} agora é seu aliado!`,
                    consumed: true
                  };
                }

                return {
                  success: false,
                  message: 'Alvo inválido para o HIPNODISCO.',
                  consumed: false
                };
              },

              cafe: function() {
                GameState.skipNextTimeAdvance = true;
                SoundSystem.playUseItem();
                return {
                  success: true,
                  message: '☕ Você toma o CAFÉ PAULISTANO! A cafeína corre pelas veias — sua próxima ação não avançará o tempo!',
                  consumed: true
                };
              },

              grafite: function() {
                const room = GameState.playerLocation;
                if (GameState.roomTraps && GameState.roomTraps[room]) {
                  return {
                    success: false,
                    message: 'Já existe uma armadilha de grafite nesta sala!',
                    consumed: false
                  };
                }
                if (!GameState.roomTraps) GameState.roomTraps = {};
                GameState.roomTraps[room] = { active: true };
                SoundSystem.playUseItem();
                ScreenEffects.flash('rgba(255, 100, 200, 0.4)');
                return {
                  success: true,
                  message: '🎨 Você pinta um GRAFITE MÁGICO no chão! O próximo inimigo que entrar será paralisado por 2 turnos!',
                  consumed: true
                };
              },

              violao: function() {
                const playerRoom = GameState.playerLocation;
                let pacifiedCount = 0;
                Object.values(GameState.characters).forEach(function(c) {
                  if (c.id !== 'player' && c.location === playerRoom && c.isAlive && !c.isAlly) {
                    c.pacifiedTurns = 3;
                    pacifiedCount++;
                  }
                });
                if (pacifiedCount === 0) {
                  return {
                    success: false,
                    message: 'Não há inimigos aqui para pacificar com o VIOLÃO.',
                    consumed: false
                  };
                }
                Karma.change(5 * pacifiedCount, 'Pacificou ' + pacifiedCount + ' com Violão');
                SoundSystem.playUseItem();
                ScreenEffects.flash('rgba(100, 200, 255, 0.4)');
                return {
                  success: true,
                  message: '🎸 Você toca o VIOLÃO com maestria! ' + pacifiedCount + ' inimigo(s) ficam pacificados por 3 turnos!',
                  consumed: false
                };
              },

              mapa_antigo: function(targetRoomId) {
                if (!targetRoomId) {
                  // Retornar pedindo seleção de sala
                  const visitedRooms = Object.keys(GameState.rooms).filter(function(rId) {
                    return GameState.visitedRooms && GameState.visitedRooms.has(rId) && rId !== GameState.playerLocation;
                  });
                  if (visitedRooms.length === 0) {
                    return {
                      success: false,
                      message: 'Você não visitou nenhuma outra sala ainda!',
                      consumed: false
                    };
                  }
                  return {
                    success: false,
                    message: 'SELECT_MAPA_TARGET',
                    selectableRooms: visitedRooms,
                    consumed: false
                  };
                }

                // Teletransportar
                const targetRoom = GameState.rooms[targetRoomId];
                if (!targetRoom) {
                  return { success: false, message: 'Sala inválida!', consumed: false };
                }

                // Se precisa voar e jogador não pode, bloquear
                if (targetRoom.requiresFlight && !Rules.canPlayerFly()) {
                  return { success: false, message: 'Você precisa poder voar para ir a este local!', consumed: false };
                }

                Actions._setPlayerLocation(targetRoomId);
                SoundSystem.playUseItem();
                ScreenEffects.flash('rgba(200, 150, 50, 0.5)');

                // Mover aliados que estão seguindo
                Rules.moveFollowingAllies(targetRoomId);

                return {
                  success: true,
                  message: '🗺️ O MAPA ANTIGO brilha e você é teletransportado para ' + targetRoom.name + '!',
                  consumed: true
                };
              },

              pandeiro: function() {
                let calledCount = 0;
                Object.values(GameState.characters).forEach(function(c) {
                  if (c.id !== 'player' && c.isAlly && c.isAlive && c.location !== GameState.playerLocation) {
                    c.pandeiroTarget = GameState.playerLocation;
                    calledCount++;
                  }
                });
                if (calledCount === 0) {
                  return {
                    success: false,
                    message: 'Nenhum aliado vivo está longe de você para convocar!',
                    consumed: false
                  };
                }
                SoundSystem.playUseItem();
                ScreenEffects.flash('rgba(255, 200, 0, 0.4)');
                return {
                  success: true,
                  message: '🪘 Você toca o PANDEIRO! O ritmo ecoa pela cidade — ' + calledCount + ' aliado(s) estão vindo ao seu encontro!',
                  consumed: false
                };
              },

              // Comidas - handler genérico detectado pelo campo energyRestore no item (ver useItem)

              // === HANDLERS DE ITENS CRAFTADOS ===
              conjunto_musical: function() {
                var room = GameState.playerLocation;
                var pacified = 0;
                var attracted = 0;

                // Pacificar inimigos (como violão)
                Object.values(GameState.characters).forEach(function(c) {
                  if (c.id !== 'player' && c.isAlive && !c.isAlly && c.location === room) {
                    c.pacifiedTurns = (c.pacifiedTurns || 0) + 3;
                    pacified++;
                  }
                });

                // Atrair aliados (como pandeiro)
                Object.values(GameState.characters).forEach(function(c) {
                  if (c.id !== 'player' && c.isAlive && c.isAlly && c.location !== room) {
                    c.location = room;
                    attracted++;
                  }
                });

                if (pacified > 0) Karma.change(5 * pacified, 'Pacificou ' + pacified + ' com Conjunto Musical');
                SoundSystem.playUseItem();
                ScreenEffects.flash('rgba(255, 200, 0, 0.4)');
                var msg = '🎵 Você toca o CONJUNTO MUSICAL!';
                if (pacified > 0) msg += ' ' + pacified + ' inimigo(s) pacificado(s)!';
                if (attracted > 0) msg += ' ' + attracted + ' aliado(s) atraído(s)!';
                if (pacified === 0 && attracted === 0) msg += ' A música ecoa... mas ninguém responde.';
                return { success: true, message: msg, consumed: false };
              },

              energetico: function() {
                var player = GameState.characters.player;
                var oldHp = player.hp;
                player.hp = Math.min(player.maxHp, player.hp + GAME_CONSTANTS.ENERGETICO_HEAL);
                var healed = player.hp - oldHp;
                GameState.skipNextTimeAdvance = true;
                SoundSystem.playHeal();
                ScreenEffects.flash('rgba(0, 255, 100, 0.4)');
                return {
                  success: true,
                  message: '⚡ Você bebeu o ENERGÉTICO PAULISTA! +' + healed + ' HP! Sua próxima ação não avança o tempo!',
                  consumed: true
                };
              }
            };

            /**
             * @namespace Actions
             * @description Ações do jogador: mover, pegar/largar itens, usar itens, atacar.
             * Cada ação retorna {success, message, advanceTime?}.
             */

            const Actions = {
              /** Centraliza a atualização de localização do jogador. */
              _setPlayerLocation: function(roomId) {
                GameState.playerLocation = roomId;
                GameState.characters.player.location = roomId;
                GameState.visitedRooms.add(roomId);
                Journal.recordRoom(roomId);
              },

              /** Trata o pulo mortal da Antena (morte, guarda-chuva ou asa delta). */
              _handleDeadlyJump: function(roomId) {
                const hasUmbrella = Rules.hasEffect('safeJump');
                if (!Rules.canPlayerFly() && !hasUmbrella) {
                  const player = GameState.characters.player;
                  player.hp = 0;
                  player.isAlive = false;
                  GameState.gameOver = true;
                  GameState.playerLocation = roomId;
                  GameState.characters.player.location = roomId;
                  GameState.deathReason = 'Você tentou voar. A gravidade não aprovou a ideia. Talvez tente outra coisa.';
                  Karma.change(GAME_CONSTANTS.ANTENNA_KARMA_PENALTY, 'Pulou da Antena');
                  return { success: true, message: 'Você pula da Antena sem nada para te sustentar... VOCÊ DESPENCA E MORRE!', advanceTime: true };
                } else if (hasUmbrella && !Rules.canPlayerFly()) {
                  Actions._setPlayerLocation('avenida_paulista_leste');
                  SoundSystem.playMove();
                  return { success: true, message: '☂️ Você abre o GUARDA-CHUVA e pula! Ele funciona como um paraquedas improvisado — você plana suavemente até a Avenida Paulista Leste!', advanceTime: true };
                } else {
                  Actions._setPlayerLocation(roomId);
                  var totalRoomsFlying = Object.keys(GameState.rooms).length;
                  if (GameState.visitedRooms.size >= totalRoomsFlying) Achievements.tryUnlock('explorador');
                  SoundSystem.playMove();
                  return { success: true, message: 'Você salta da Antena e a ASA DELTA te carrega pelos céus de São Paulo!', advanceTime: true };
                }
              },

              /** Verifica restrições de acesso (escudo, voo, subsolo). Retorna erro ou null. */
              _checkMoveRestrictions: function(roomId, targetRoom) {
                if (roomId === 'teto_masp' && GameState.playerLocation === 'masp' && !GameState.forceShieldDown) {
                  return { success: false, message: 'Um ESCUDO DE FORÇA mágico bloqueia a subida! O Feiticeiro poderia ajudar a removê-lo...' };
                }
                if (targetRoom.requiresFlight && !Rules.canPlayerFly()) {
                  return { success: false, message: 'Você precisa poder voar para acessar este local! Encontre a ASA DELTA.' };
                }
                if (roomId === 'subsolo_masp') {
                  var hasLanterna = Rules.hasEffect('nightVision');
                  if (!hasLanterna || GameState.time < GAME_CONSTANTS.NIGHT_SECRET_HOUR) {
                    if (!hasLanterna) return { success: false, message: '🔦 Está escuro demais para ver a entrada secreta. Uma LANTERNA ajudaria...' };
                    else return { success: false, message: '🌙 A entrada do subsolo só se revela à noite (após as 20:00)...' };
                  }
                  Log.add('🔦 Sua lanterna revela uma passagem secreta sob o MASP!', 'magic');
                }
                return null;
              },

              /** Processa efeitos ao entrar numa sala (tropeço, armadilhas, aliados). */
              _processRoomEntry: function(roomId) {
                if (GameState.time >= GAME_CONSTANTS.NIGHT_MODE_HOUR && !Rules.hasEffect('nightVision')) {
                  if (Utils.random() < GAME_CONSTANTS.NIGHT_TRIP_CHANCE) {
                    Rules.damagePlayer(GAME_CONSTANTS.TRIP_DAMAGE);
                    Log.add('🌑 Você tropeça no escuro e se machuca! -' + GAME_CONSTANTS.TRIP_DAMAGE + ' HP. Uma LANTERNA evitaria isso.', 'danger');
                  }
                }
                if (GameState.armedBomb && GameState.armedBomb.carriedByPlayer) {
                  GameState.armedBomb.location = roomId;
                }
                var totalRoomsCount = Object.keys(GameState.rooms).length;
                if (GameState.visitedRooms.size >= totalRoomsCount) Achievements.tryUnlock('explorador');
                Object.values(GameState.characters).forEach(function(c) {
                  if (c.id !== 'player' && c.isAlive && c.location === roomId) Journal.recordNPC(c.id);
                });
                if (GameState.environmentTraps[roomId] && !GameState.environmentTraps[roomId].triggered) {
                  var trap = GameState.environmentTraps[roomId];
                  trap.triggered = true;
                  if (trap.type === 'pisoQuebrado') {
                    if (Utils.random() < GAME_CONSTANTS.TRAP_FLOOR_TRIGGER_CHANCE) {
                      Rules.damagePlayer(GAME_CONSTANTS.TRAP_FLOOR_DAMAGE);
                      Log.add('⚠️ ARMADILHA! O piso cede sob seus pés! -' + GAME_CONSTANTS.TRAP_FLOOR_DAMAGE + ' HP!', 'danger');
                    } else {
                      Log.add('⚠️ O piso range perigosamente, mas você passa com cuidado.', 'warning');
                    }
                  } else if (trap.type === 'fioTropeco') {
                    if (GameState.playerInventory.length > 0) {
                      var dropIdx = Math.floor(Utils.random() * GameState.playerInventory.length);
                      var droppedId = GameState.playerInventory.splice(dropIdx, 1)[0];
                      GameState.items[droppedId].location = roomId;
                      Log.add('⚠️ ARMADILHA! Você tropeça num fio e deixa cair ' + GameState.items[droppedId].name + '!', 'danger');
                    }
                  } else if (trap.type === 'gasResidual') {
                    if (!Rules.hasEffect('gasImmunity')) {
                      Rules.damagePlayer(GAME_CONSTANTS.TRAP_GAS_DAMAGE);
                      Log.add('⚠️ ARMADILHA! Gás residual queima suas vias aéreas! -' + GAME_CONSTANTS.TRAP_GAS_DAMAGE + ' HP! Uma MÁSCARA GÁS ajudaria.', 'danger');
                    } else {
                      Log.add('😷 Gás residual detectado, mas sua MÁSCARA GÁS te protege!', 'success');
                    }
                  }
                }
                Rules.moveFollowingAllies(roomId);
                Object.values(GameState.characters).forEach(function(c) {
                  if (c.id !== 'player' && c.isAlly && c.isAlive && c.location === roomId) Rules.activateFollow(c.id);
                });
              },

              /** Move o jogador para uma sala adjacente. */
              moveTo: function(roomId) {
                if (GameState.gameOver) return { success: false, message: 'O jogo acabou!' };
                const currentRoom = GameState.rooms[GameState.playerLocation];
                const targetRoom = GameState.rooms[roomId];
                if (!targetRoom) return { success: false, message: 'Sala não encontrada!' };
                const exits = Object.values(currentRoom.exits);
                if (!exits.includes(roomId)) return { success: false, message: 'Você não pode ir para lá daqui!' };

                if (currentRoom.hasDeadlyJump && roomId === 'ceu_cidade') {
                  return this._handleDeadlyJump(roomId);
                }

                var restriction = this._checkMoveRestrictions(roomId, targetRoom);
                if (restriction) return restriction;

                Actions._setPlayerLocation(roomId);
                SoundSystem.playMove();
                this._processRoomEntry(roomId);

                return { success: true, message: `Você foi para ${targetRoom.name}.`, advanceTime: true };
              },

              // Pegar item
              pickupItem: function(itemId) {
                if (GameState.gameOver) return { success: false, message: 'O jogo acabou!' };

                const item = GameState.items[itemId];
                if (!item) {
                  return { success: false, message: 'Item não encontrado!' };
                }

                if (item.location !== GameState.playerLocation) {
                  return { success: false, message: 'Este item não está aqui!' };
                }

                if (!Rules.canPickupItem(itemId)) {
                  return { success: false, message: `Você não pode carregar mais peso! (${item.name}: ${item.weight}kg)` };
                }

                item.location = null;
                GameState.playerInventory.push(itemId);

                // Sincronizar localização da bomba armada quando jogador pega
                if (itemId === 'bomba' && GameState.armedBomb) {
                  GameState.armedBomb.carriedByPlayer = true;
                  GameState.armedBomb.location = GameState.playerLocation;
                }

                // onPickup hook (ex: mochila recalcula peso)
                if (item.onPickup === 'recalcWeight') {
                  Rules.recalcMaxWeight();
                  Log.add('🎒 Capacidade de peso aumentada para ' + GameState.characters.player.maxWeight + 'kg!', 'success');
                }

                SoundSystem.playPickup();

                // Achievement: Colecionador
                if (GameState.playerInventory.length >= 8) Achievements.tryUnlock('colecionador');

                return {
                  success: true,
                  message: `Você pegou ${item.name}.`,
                  advanceTime: true
                };
              },

              // Largar item
              dropItem: function(itemId) {
                if (GameState.gameOver) return { success: false, message: 'O jogo acabou!' };

                const idx = GameState.playerInventory.indexOf(itemId);
                if (idx === -1) {
                  return { success: false, message: 'Você não tem este item!' };
                }

                const room = GameState.rooms[GameState.playerLocation];
                const item = GameState.items[itemId];

                // MORTE: Largar asa delta enquanto está voando no céu!
                if (itemId === 'asa_delta' && room.requiresFlight) {
                  GameState.playerInventory.splice(idx, 1);
                  item.location = null; // Asa delta também cai

                  // Jogador morre!
                  const player = GameState.characters.player;
                  player.hp = 0;
                  player.isAlive = false;
                  GameState.gameOver = true;
                  Karma.change(-10, 'Largou a asa delta no ar');
                  GameState.deathReason = '🪂 Largou a asa delta. No ar. Voando. Brilhante decisão estratégica. A lei da gravidade, que não aceita suborno, entrou em vigor imediatamente.';

                  return {
                    success: true,
                    message: 'Você solta a ASA DELTA... e imediatamente começa a cair! Sem nada para te sustentar, você despenca até o chão. VOCÊ MORREU!',
                    advanceTime: true
                  };
                }

                // Se a sala não permite itens, o item é destruído!
                if (room.mayHaveItems === false) {
                  GameState.playerInventory.splice(idx, 1);
                  item.location = null; // Item destruído, não está em lugar nenhum
                  return {
                    success: true,
                    message: `Você solta ${item.name}... e ele despenca do céu! O item foi destruído ao atingir o solo lá embaixo!`,
                    advanceTime: true
                  };
                }

                GameState.playerInventory.splice(idx, 1);
                item.location = GameState.playerLocation;

                // Sincronizar localização da bomba armada quando jogador larga
                if (itemId === 'bomba' && GameState.armedBomb) {
                  GameState.armedBomb.location = GameState.playerLocation;
                  GameState.armedBomb.carriedByPlayer = false;
                }

                // onDrop hook (ex: mochila recalcula peso)
                if (item.onDrop === 'recalcWeight') {
                  Rules.recalcMaxWeight();
                  Log.add('🎒 Capacidade de peso voltou para ' + GameState.characters.player.maxWeight + 'kg.', 'info');

                  // Dropar itens excedentes (mais recentes primeiro)
                  var droppedItems = [];
                  while (Rules.getInventoryWeight() > GameState.characters.player.maxWeight && GameState.playerInventory.length > 0) {
                    var lastItemId = GameState.playerInventory[GameState.playerInventory.length - 1];
                    var lastItem = GameState.items[lastItemId];
                    GameState.playerInventory.pop();
                    lastItem.location = GameState.playerLocation;
                    droppedItems.push(lastItem.name);
                    Log.add('🎒 ' + lastItem.name + ' caiu da mochila!', 'info');
                  }
                  if (droppedItems.length > 0) {
                    Log.add('📦 ' + droppedItems.length + ' item(ns) ficaram no chão.', 'info');
                  }
                }

                return {
                  success: true,
                  message: `Você largou ${item.name}.`,
                  advanceTime: true
                };
              },

              // Usar item
              useItem: function(itemId, targetItemId) {
                if (GameState.gameOver) return { success: false, message: 'O jogo acabou!' };

                if (!GameState.playerInventory.includes(itemId)) {
                  return { success: false, message: 'Você não tem este item!' };
                }

                const item = GameState.items[itemId];
                if (!item.isUsable) {
                  return { success: false, message: `${item.name} não pode ser usado ativamente.` };
                }

                // Handler genérico para comida (itens com energyRestore)
                var handler = ItemUseHandlers[itemId];
                if (!handler && item.energyRestore) {
                  handler = function() {
                    var restore = item.energyRestore;
                    GameState.energy = Math.min(100, GameState.energy + restore);
                    SoundSystem.playUseItem();
                    return { success: true, message: '🍽️ Você consumiu ' + item.name + '! +' + restore + ' energia! (Energia: ' + GameState.energy + '/100)', consumed: true };
                  };
                }
                if (!handler) {
                  return { success: false, message: 'Este item não tem efeito definido!' };
                }

                const result = handler(targetItemId);

                // Se consumed for true, remover do inventário
                if (result.consumed) {
                  const idx = GameState.playerInventory.indexOf(itemId);
                  if (idx !== -1) {
                    GameState.playerInventory.splice(idx, 1);
                  }
                }

                if (result.advanceTime === undefined) result.advanceTime = result.success;
                return result;
