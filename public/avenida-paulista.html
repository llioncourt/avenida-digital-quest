          return {
            success: true,
            message: 'Você desarmou a BOMBA com sucesso! Ela está desativada no chão.',
            consumed: false
          };
        },

        bomba: function() {
          // Player NÃO pode armar a bomba - só o Bombardeador
          return {
            success: false,
            message: 'Você não sabe como armar esta bomba! Apenas o BOMBARDEADOR sabe fabricar e armar bombas.',
            consumed: false
          };
        },

        livro: function() {
          GameState.hasReadMagicBook = true;
          return {
            success: true,
            message: `Você lê o livro antigo... Entre os encantamentos, você encontra a palavra mágica: "${GameState.demonMagicWord}". O livro se desfaz em pó mágico.`,
            consumed: true  // Remove do inventário
          };
        },

        cera_magica: function(targetItemId) {
          // Se não foi passado um item, retorna pedindo seleção
          if (!targetItemId) {
            const items = GameState.playerInventory.filter(id => id !== 'cera_magica' && GameState.items[id].weight > 0);
            if (items.length === 0) {
              return {
                success: false,
                message: 'Você não tem itens com peso para aplicar a CERA MÁGICA!',
                consumed: false
              };
            }
            return {
              success: false,
              message: 'SELECT_ITEM',
              selectableItems: items,
              consumed: false
            };
          }

          // Aplicar a cera no item selecionado
          const item = GameState.items[targetItemId];
          if (!item || !GameState.playerInventory.includes(targetItemId)) {
            return {
              success: false,
              message: 'Item não encontrado no seu inventário!',
              consumed: false
            };
          }

          const oldWeight = item.weight;
          item.weight = 0;
          item.hasWax = true;

          // Remover a cera mágica do inventário
          const idx = GameState.playerInventory.indexOf('cera_magica');
          if (idx > -1) GameState.playerInventory.splice(idx, 1);

          return {
            success: true,
            message: `Você aplica a CERA MÁGICA em ${item.name}! O item fica leve como uma pluma (peso: ${oldWeight}kg → 0kg)!`,
            consumed: true
          };
        },

        seta_mortal: function(targetId) {
          const playerRoom = GameState.playerLocation;
          const enemies = Object.values(GameState.characters).filter(
            c => c.id !== 'player' && c.location === playerRoom && c.isAlive && !c.isAlly
          );

          // Se não foi passado um alvo, retorna pedindo seleção
          if (!targetId) {
            if (enemies.length === 0) {
              return {
                success: false,
                message: 'Não há inimigos aqui para usar a SETA MORTAL!',
                consumed: false
              };
            }
            return {
              success: false,
              message: 'SELECT_SETA_TARGET',
              selectableTargets: enemies.map(e => ({ id: e.id, name: e.name, hp: e.hp })),
              consumed: false
            };
          }

          // Atacar o alvo escolhido
          const target = GameState.characters[targetId];
          if (!target || target.location !== playerRoom || !target.isAlive) {
            return {
              success: false,
              message: 'Alvo inválido!',
              consumed: false
            };
          }

          const damage = 40;
          target.hp -= damage;
          if (target.hp <= 0) {
            target.hp = 0;
            target.isAlive = false;
          }

          const idx = GameState.playerInventory.indexOf('seta_mortal');
          if (idx > -1) GameState.playerInventory.splice(idx, 1);

          const status = target.isAlive ? `(HP restante: ${target.hp})` : '(MORTO!)';
          return {
            success: true,
            message: `A SETA MORTAL acerta ${target.name} causando ${damage} de dano! ${status}`,
            consumed: true
          };
        },

        hipnodisco: function(targetId) {
          const playerRoom = GameState.playerLocation;

          // Coletar todos os alvos possíveis
          const targets = [];

          // Feiticeiro (se escudo ainda ativo)
          const feiticeiro = GameState.characters.feiticeiro;
          if (feiticeiro.location === playerRoom && feiticeiro.isAlive && !GameState.forceShieldDown) {
            targets.push({ type: 'feiticeiro', id: 'feiticeiro', name: '🧙 FEITICEIRO (remover escudo)' });
          }

          // Inimigos (não aliados)
          Object.values(GameState.characters).forEach(c => {
            if (c.id !== 'player' && c.id !== 'feiticeiro' &&
                c.location === playerRoom && c.isAlive && !c.isAlly &&
                !c.immuneToHypnosis) {
              targets.push({ type: 'enemy', id: c.id, name: `⚔️ ${c.name} (hipnotizar)` });
            }
          });

          // Itens no chão
          Object.values(GameState.items).forEach(item => {
            if (item.location === playerRoom && !item.isAnimated) {
              targets.push({ type: 'item', id: item.id, name: `📦 ${item.name} (dar vida)` });
            }
          });

          // Se não foi passado um alvo, retorna pedindo seleção
          if (!targetId) {
            if (targets.length === 0) {
              return {
                success: false,
                message: 'Não há alvos aqui para usar o HIPNODISCO!',
                consumed: false
              };
            }
            return {
              success: false,
              message: 'SELECT_HIPNO_TARGET',
              selectableTargets: targets,
              consumed: false
            };
          }

          // Função para consumir o hipnodisco
          const consumeHipnodisco = () => {
            const idx = GameState.playerInventory.indexOf('hipnodisco');
            if (idx > -1) GameState.playerInventory.splice(idx, 1);
          };

          // CASO: Feiticeiro
          if (targetId === 'feiticeiro') {
            if (feiticeiro.location === playerRoom && feiticeiro.isAlive && !GameState.forceShieldDown) {
              GameState.forceShieldDown = true;
              consumeHipnodisco();
              return {
                success: true,
                message: 'O HIPNODISCO gira diante do FEITICEIRO... Seus olhos brilham! "Eu conheço esse artefato! Em troca da sua magia, vou remover o ESCUDO DE FORÇA que protege o Teto do MASP!" O Feiticeiro conjura um feitiço e o escudo se dissipa!',
                consumed: true
              };
            }
          }

          // CASO: Inimigo - sempre funciona (exceto imunes)
          const enemy = GameState.characters[targetId];
          if (enemy && enemy.location === playerRoom && enemy.isAlive && !enemy.isAlly) {
            // Defesa em profundidade: verificar imunidade
            if (enemy.immuneToHypnosis) {
              return {
                success: false,
                message: `O HIPNODISCO gira, mas ${enemy.name} resiste! Sua mente é forte demais para ser controlada!`,
                consumed: false
              };
            }
            consumeHipnodisco();
            enemy.isAlly = true;
            return {
              success: true,
              message: `O HIPNODISCO gira... ${enemy.name} está hipnotizado e agora é seu aliado!`,
              consumed: true
            };
          }

          // CASO: Item (dar vida)
          const item = GameState.items[targetId];
          if (item && item.location === playerRoom && !item.isAnimated) {
            consumeHipnodisco();

            // Criar um novo personagem baseado no item
            const animatedId = 'animated_' + item.id + '_' + Date.now();
            const animatedChar = {
              id: animatedId,
              name: item.name + ' ANIMADO',
              description: `${item.name} ganhou vida através do poder do HIPNODISCO! Agora é seu fiel aliado.`,
              attackPower: 8 + item.attackPower,
              defensePower: 3 + item.defensePower,
              hp: 30 + (item.weight * 2),
              maxHp: 30 + (item.weight * 2),
              maxWeight: 0,
              canFly: item.canFly,
              isAlive: true,
              isAlly: true,
              lastBoss: false,
              location: playerRoom,
              isAnimatedObject: true
            };

            GameState.characters[animatedId] = animatedChar;
            item.location = null;
            item.isAnimated = true;

            return {
              success: true,
              message: `O HIPNODISCO gira sobre ${item.name}... O objeto treme, levita e GANHA VIDA! ${animatedChar.name} agora é seu aliado!`,
              consumed: true
            };
          }

          return {
            success: false,
            message: 'Alvo inválido para o HIPNODISCO.',
            consumed: false
          };
        }
      };

      // ============================================================================
      // ACTIONS - Ações do jogo
      // ============================================================================

      const Actions = {
        // Mover para uma sala
        moveTo: function(roomId) {
          if (GameState.gameOver) return { success: false, message: 'O jogo acabou!' };

          const currentRoom = GameState.rooms[GameState.playerLocation];
          const targetRoom = GameState.rooms[roomId];

          if (!targetRoom) {
            return { success: false, message: 'Sala não encontrada!' };
          }

          // Verificar se é uma saída válida
          const exits = Object.values(currentRoom.exits);
          if (!exits.includes(roomId)) {
            return { success: false, message: 'Você não pode ir para lá daqui!' };
          }

          // PULO MORTAL: Pular da Antena sem Asa Delta = morte!
          if (currentRoom.hasDeadlyJump && roomId === 'ceu_cidade') {
            if (!Rules.canPlayerFly()) {
              // MORTE!
              const player = GameState.characters.player;
              player.hp = 0;
              player.isAlive = false;
              GameState.playerLocation = roomId;
              GameState.characters.player.location = roomId;
              GameState.deathReason = '🪂 Você olhou para baixo, olhou para cima, bateu os braços com convicção... e descobriu que humanos não voam. A gravidade, sempre pontual, fez seu trabalho. Você se espatifou no asfalto da Avenida Paulista como um saco de batatas com sonhos de águia.';
              return {
                success: true,
                message: 'Você pula da Antena sem nada para te sustentar... VOCÊ DESPENCA E MORRE!',
                advanceTime: true
              };
            } else {
              GameState.playerLocation = roomId;
              GameState.characters.player.location = roomId;
              return {
                success: true,
                message: 'Você salta da Antena e a ASA DELTA te carrega pelos céus de São Paulo!',
                advanceTime: true
              };
            }
          }

          // ESCUDO DE FORÇA: Teto do MASP bloqueado quando vindo do MASP (à pé)
          if (roomId === 'teto_masp' && GameState.playerLocation === 'masp' && !GameState.forceShieldDown) {
            return {
              success: false,
              message: 'Um ESCUDO DE FORÇA mágico bloqueia a subida! O Feiticeiro poderia ajudar a removê-lo...'
            };
          }

          // Verificar requisito de voo (para outras salas)
          if (targetRoom.requiresFlight && !Rules.canPlayerFly()) {
            return { success: false, message: 'Você precisa poder voar para acessar este local! Encontre a ASA DELTA.' };
          }

          GameState.playerLocation = roomId;
          GameState.characters.player.location = roomId;
          SoundSystem.playMove();
          return {
            success: true,
            message: `Você foi para ${targetRoom.name}.`,
            advanceTime: true
          };
        },

        // Pegar item
        pickupItem: function(itemId) {
          if (GameState.gameOver) return { success: false, message: 'O jogo acabou!' };

          const item = GameState.items[itemId];
          if (!item) {
            return { success: false, message: 'Item não encontrado!' };
          }

          if (item.location !== GameState.playerLocation) {
            return { success: false, message: 'Este item não está aqui!' };
          }

          if (!Rules.canPickupItem(itemId)) {
            return { success: false, message: `Você não pode carregar mais peso! (${item.name}: ${item.weight}kg)` };
          }

          item.location = null;
          GameState.playerInventory.push(itemId);

          SoundSystem.playPickup();

          return {
            success: true,
            message: `Você pegou ${item.name}.`,
            advanceTime: true
          };
        },

        // Largar item
        dropItem: function(itemId) {
          if (GameState.gameOver) return { success: false, message: 'O jogo acabou!' };

          const idx = GameState.playerInventory.indexOf(itemId);
          if (idx === -1) {
            return { success: false, message: 'Você não tem este item!' };
          }

          const room = GameState.rooms[GameState.playerLocation];
          const item = GameState.items[itemId];

          // MORTE: Largar asa delta enquanto está voando no céu!
          if (itemId === 'asa_delta' && room.requiresFlight) {
            GameState.playerInventory.splice(idx, 1);
            item.location = null; // Asa delta também cai

            // Jogador morre!
            const player = GameState.characters.player;
            player.hp = 0;
            player.isAlive = false;
            GameState.deathReason = '🪂 Largou a asa delta. No ar. Voando. Brilhante decisão estratégica. A lei da gravidade, que não aceita suborno, entrou em vigor imediatamente.';

            return {
              success: true,
              message: 'Você solta a ASA DELTA... e imediatamente começa a cair! Sem nada para te sustentar, você despenca até o chão. VOCÊ MORREU!',
              advanceTime: true
            };
          }

          // Se a sala não permite itens, o item é destruído!
          if (room.mayHaveItems === false) {
            GameState.playerInventory.splice(idx, 1);
            item.location = null; // Item destruído, não está em lugar nenhum
            return {
              success: true,
              message: `Você solta ${item.name}... e ele despenca do céu! O item foi destruído ao atingir o solo lá embaixo!`,
              advanceTime: true
            };
          }

          GameState.playerInventory.splice(idx, 1);
          item.location = GameState.playerLocation;

          return {
            success: true,
            message: `Você largou ${item.name}.`,
            advanceTime: true
          };
        },

        // Usar item
        useItem: function(itemId, targetItemId) {
          if (GameState.gameOver) return { success: false, message: 'O jogo acabou!' };

          if (!GameState.playerInventory.includes(itemId)) {
            return { success: false, message: 'Você não tem este item!' };
          }

          const item = GameState.items[itemId];
          if (!item.isUsable) {
            return { success: false, message: `${item.name} não pode ser usado ativamente.` };
          }

          const handler = ItemUseHandlers[itemId];
          if (!handler) {
            return { success: false, message: 'Este item não tem efeito definido!' };
          }

          const result = handler(targetItemId);

          // Se consumed for true, remover do inventário
          if (result.consumed) {
            const idx = GameState.playerInventory.indexOf(itemId);
            if (idx !== -1) {
              GameState.playerInventory.splice(idx, 1);
            }
          }

          result.advanceTime = result.success;
          return result;
        },

        // Atacar personagem
        attack: function(characterId) {
          if (GameState.gameOver) return { success: false, message: 'O jogo acabou!' };

          const target = GameState.characters[characterId];
          if (!target) {
            return { success: false, message: 'Personagem não encontrado!' };
          }

          if (target.location !== GameState.playerLocation) {
            return { success: false, message: 'Este personagem não está aqui!' };
          }

          if (!target.isAlive) {
            return { success: false, message: `${target.name} já está morto!` };
          }

          if (target.isAlly) {
            return { success: false, message: `${target.name} é seu aliado! Você não pode atacá-lo.` };
          }

          // Calcular dano
          const attackPower = Rules.getPlayerAttackPower();
          const damage = Math.max(1, attackPower - target.defensePower);

          // Som de ataque
          SoundSystem.playAttack();

          target.hp -= damage;
          if (target.hp <= 0) {
            target.hp = 0;
            target.isAlive = false;
            // Som de derrota de inimigo
            SoundSystem.playEnemyDefeat();

            // Efeito de glitch ao derrotar o Bombardeador
            if (target.id === 'bombardeador') {
              GlitchEffect.trigger(3000);
            }
          }

          const status = target.isAlive ? `(HP restante: ${target.hp})` : '(DERROTADO!)';

          // Verificar se atacou a bruxa (pode invocar demônio)
          if (target.id === 'bruxa' && target.isAlive && !GameState.demonSummoned) {
            GameState.demonSummoned = true;
            const demon = GameState.characters.demonio;
            demon.location = target.location;
            demon.isSummoned = true;

            return {
              success: true,
              message: `Você atacou ${target.name} causando ${damage} de dano! ${status} A BRUXA invoca o DEMÔNIO para protegê-la!`,
              advanceTime: true
            };
          }

          return {
            success: true,
            message: `Você atacou ${target.name} causando ${damage} de dano! ${status}`,
            advanceTime: true
          };
        },

        // Falar palavra
        speak: function(word) {
          if (GameState.gameOver) return { success: false, message: 'O jogo acabou!' };

          word = word.toUpperCase().trim();

          if (!word) {
            return { success: false, message: 'Você precisa dizer uma palavra!' };
          }

          // Verificar se demônio está presente
          const demon = GameState.characters.demonio;
          if (demon.location === GameState.playerLocation && demon.isAlive && demon.isSummoned) {
            if (word === GameState.demonMagicWord) {
              demon.isAlly = true;
              return {
                success: true,
                message: `Você pronuncia "${word}"... O DEMÔNIO estremece e seus olhos brilham! Ele foi CONVERTIDO e agora é seu aliado!`,
                advanceTime: true
              };
            }
          }

          return {
            success: true,
            message: `Você diz "${word}"... Nada acontece.`,
            advanceTime: true
          };
        }
      };

      // ============================================================================
      // EVENTS - Sistema de eventos e IA
      // ============================================================================

      const Events = {
        // Avançar tempo
        advanceTime: function() {
          GameState.time += 5;

          // Processar bônus temporários
          if (GameState.playerDefenseBonusTurns > 0) {
            GameState.playerDefenseBonusTurns--;
            if (GameState.playerDefenseBonusTurns === 0) {
              GameState.playerDefenseBonus = 0;
              Log.add('O efeito da CERA MÁGICA acabou.', 'info');
            }
          }

          // WORLD SANITY: validar estado do mundo antes de processar eventos
          WorldSanity.enforce();

          // Processar eventos
          this.processBombTimer();
          this.processWitchWord();
          this.processNPCMovement();
          this.processBombardeadorBombs();
          this.processNPCAttacks();
          this.processAllyAttacks();
          RandomEvents.process();

          // WORLD SANITY: validar novamente após eventos (double-check)
          WorldSanity.enforce();
        },

        // Processar timer da bomba
        processBombTimer: function() {
          if (!GameState.armedBomb) return;

          GameState.armedBomb.turnsLeft--;

          if (GameState.armedBomb.turnsLeft > 0) {
            SoundSystem.playBombTick();
            Log.add(`⏱️ BOMBA: ${GameState.armedBomb.turnsLeft} turno(s) para explodir em ${GameState.rooms[GameState.armedBomb.location].name}!`, 'warning');
            return;
          }

          // EXPLOSÃO!
          const bombLocation = GameState.armedBomb.location;
          const roomName = GameState.rooms[bombLocation].name;

          // COLETAR o que havia na sala ANTES de destruir
          const itemsInRoom = Object.values(GameState.items)
            .filter(item => item.location === bombLocation && !item.isDestroyed)
            .map(item => item.name);

          const charsInRoom = Object.values(GameState.characters)
            .filter(char => char.location === bombLocation && char.isAlive && char.id !== 'player')
            .map(char => char.name);

          const victims = [];
          const playerInBombRoom = GameState.playerLocation === bombLocation;

          // Matar TODOS os personagens no local (incluindo player e aliados)
          Object.values(GameState.characters).forEach(char => {
            if (char.location === bombLocation && char.isAlive) {
              char.hp = 0;
              char.isAlive = false;
              victims.push(char.name);
            }
          });

          // Proteção extra: garantir que o player morra se estiver na sala
          if (playerInBombRoom && GameState.characters.player.isAlive) {
            GameState.characters.player.hp = 0;
            GameState.characters.player.isAlive = false;
            if (!victims.includes(GameState.characters.player.name)) {
              victims.push(GameState.characters.player.name);
            }
          }

          // Destruir TODOS os itens no local
          Object.values(GameState.items).forEach(item => {
            if (item.location === bombLocation) {
              item.location = null;
              item.isDestroyed = true;
            }
          });

          // Transformar sala em ruína
          const room = GameState.rooms[bombLocation];
          if (room.ruinName) {
            room.name = room.ruinName;
            room.description = room.ruinDescription;
            room.isRuined = true;
          }

          GameState.armedBomb = null;

          // Som de explosão + FLASH laranja
          SoundSystem.playExplosion();
          ScreenEffects.flash('rgba(255, 150, 50, 0.7)');

          const playerInRoom = victims.includes(GameState.characters.player.name);

          if (victims.length > 0) {
            Log.add(`💥 BOOM!!! A bomba explodiu em ${roomName}! Vítimas: ${victims.join(', ')}. Tudo foi destruído!`, 'danger');
          } else {
            Log.add(`💥 BOOM!!! A bomba explodiu em ${roomName}! A área foi completamente destruída!`, 'danger');
          }

          // Modal de resumo do que foi destruído
          const itemsList = itemsInRoom.length > 0
            ? `<p><strong>📦 Itens destruídos:</strong> ${itemsInRoom.join(', ')}</p>`
            : '';
          const charsList = charsInRoom.length > 0
            ? `<p><strong>👥 Personagens atingidos:</strong> ${charsInRoom.join(', ')}</p>`
            : '';

          let modalContent = `<p>A bomba explodiu em <strong>${roomName}</strong>!</p>`;

          if (playerInRoom) {
            modalContent = '<p style="color:#ff4444;font-size:1.2rem;font-weight:bold;">💀 VOCÊ FOI ATINGIDO PELA EXPLOSÃO!</p>' + modalContent;
          }

          modalContent += itemsList + charsList;

          const playerDied = playerInRoom && !GameState.characters.player.isAlive;
          modalContent += '<button class="btn" onclick="Game.closeExplosionModal(' + playerDied + ')">Continuar</button>';

          // Marcar flag para evitar checkGameOver automático durante explosão
          GameState._explosionInProgress = true;

          // Mostrar após um pequeno delay para o flash
          setTimeout(() => {
            Modals.show('💥 EXPLOSÃO!', modalContent);
          }, 200);
        },

        // Bruxa fala palavra mágica
        processWitchWord: function() {
          if (GameState.witchWords >= 4) return;

          const witch = GameState.characters.bruxa;
          if (!witch.isAlive) return;

          // Cooldown entre palavras
          const timeSinceLast = GameState.time - GameState.lastWitchWordTime;
          if (timeSinceLast < GameState.witchWordCooldown) return;

          // Chance de falar (muito baixa, aumenta devagar)
          const baseChance = 0.04;
          const timeBonus = (GameState.time - 17 * 60) / 500; // Aumenta bem devagar
          const chance = Math.min(0.15, baseChance + timeBonus);

          if (Utils.random() < chance) {
            GameState.witchWords++;
            GameState.lastWitchWordTime = GameState.time;

            // Som de magia negra e efeito visual
            SoundSystem.playDarkMagic();
            ScreenEffects.flash();

            const messages = [
              'O ar estremece... você sente uma energia arcana se acumulando no MASP!',
              'Um trovão ecoa pelo céu... a Bruxa continua seu ritual!',
              'Símbolos brilhantes aparecem no céu acima do MASP!',
              'O portal está quase completo! A energia mágica atinge níveis críticos!'
            ];

            Log.add(messages[GameState.witchWords - 1], 'magic');
          }
        },

        // Movimento dos NPCs
        processNPCMovement: function() {
          Object.values(GameState.characters).forEach(char => {
            if (char.id === 'player') return;
            if (!char.isAlive) return;
            if (!char.location) return;

            // Feiticeiro fica preso até 18:00
            if (char.id === 'feiticeiro' && GameState.time < 18 * 60) return;

            // Bruxa fica no teto do MASP
            if (char.id === 'bruxa') return;

            // Demônio só existe se invocado
            if (char.id === 'demonio' && !char.isSummoned) return;

            // 30% de chance de mover
            if (Utils.random() < 0.3) {
              const currentRoom = GameState.rooms[char.location];
              if (!currentRoom) return;

              const exits = Object.values(currentRoom.exits);
              if (exits.length === 0) return;

              // Filtrar saídas que o personagem pode acessar
              const validExits = exits.filter(exitId => {
                const targetRoom = GameState.rooms[exitId];
                // Personagem não pode voar e sala requer voo
                if (targetRoom.requiresFlight && !char.canFly) return false;
                // Escudo de força bloqueia acesso ao teto do MASP
                if (exitId === 'teto_masp' && !GameState.forceShieldDown) return false;
                return true;
              });

              if (validExits.length > 0) {
                const prevLocation = char.location;
                char.location = Utils.randomChoice(validExits);

                // NPC fala ao se mover (30% de chance)
                if (Utils.random() < 0.3) {
                  const phrases = NPC_PHRASES[char.id];
                  if (phrases && phrases.move) {
                    Log.add(`💬 ${char.name}: "${Utils.randomChoice(phrases.move)}"`, 'info');
                  }
                }

                // NPC encontra o jogador na nova sala
                if (char.location === GameState.playerLocation && prevLocation !== GameState.playerLocation) {
                  const phrases = NPC_PHRASES[char.id];
                  if (phrases && phrases.encounter) {
                    Log.add(`💬 ${char.name}: "${Utils.randomChoice(phrases.encounter)}"`, 'info');
                  }
                }
              }
            }
          });
        },

        // Bombardeador cria e arma bombas
        processBombardeadorBombs: function() {
          const bombardeador = GameState.characters.bombardeador;
          if (!bombardeador.isAlive || bombardeador.isAlly) return;
          if (!bombardeador.canCreateBombs) return;

          // SEGURANÇA: Bombardeador não pode armar bomba em sala que requer voo!
          const currentRoom = GameState.rooms[bombardeador.location];
          if (currentRoom && currentRoom.requiresFlight) return;

          // Checar cooldown (GRANDE - 60 minutos de jogo = 12 turnos)
          const timeSinceLast = GameState.time - bombardeador.lastBombCreation;
          if (timeSinceLast < bombardeador.bombCooldown) return;

          // Não criar se já existe uma bomba armada
          if (GameState.armedBomb) return;

          // Pequena chance de criar e armar bomba (5%)
          if (Utils.random() < 0.05) {
            // Timer aleatório entre 10 e 20 turnos
            const timerTurns = Utils.randomInt(10, 20);

            // Armar a bomba diretamente na localização do bombardeador
            GameState.armedBomb = {
              location: bombardeador.location,
              turnsLeft: timerTurns
            };

            bombardeador.lastBombCreation = GameState.time;

            const roomName = GameState.rooms[bombardeador.location].name;
            Log.add(`💣 O BOMBARDEADOR criou e armou uma BOMBA em ${roomName}! Timer: ${timerTurns} turnos!`, 'danger');
          }
        },

        // Ataques dos NPCs
        processNPCAttacks: function() {
          const playerRoom = GameState.playerLocation;
          const player = GameState.characters.player;

          Object.values(GameState.characters).forEach(char => {
            if (char.id === 'player') return;
            if (!char.isAlive) return;
            if (char.isAlly) return;
            if (char.location !== playerRoom) return;

            // 40% de chance de atacar
            if (Utils.random() < 0.4) {
              let damage = Math.max(1, char.attackPower - Rules.getPlayerDefensePower());

              // Bombardeador usa gás
              if (char.usesGas) {
                if (Rules.hasGasMask()) {
                  Log.add(`${char.name} lança gás tóxico, mas sua MÁSCARA GÁS te protege!`, 'success');
                  return;
                } else {
                  damage += 10;
                  Log.add(`${char.name} lança gás tóxico! Você precisa de uma MÁSCARA GÁS!`, 'danger');
                }
              }

              player.hp -= damage;
              if (player.hp <= 0) {
                player.hp = 0;
                player.isAlive = false;
              }

              // Som de receber dano + flash branco
              SoundSystem.playHit();
              ScreenEffects.flash('rgba(255, 255, 255, 0.6)');

              // Frase de ataque do NPC
              if (Utils.random() < 0.5) {
                const phrases = NPC_PHRASES[char.id];
                if (phrases && phrases.attack) {
                  Log.add(`💬 ${char.name}: "${Utils.randomChoice(phrases.attack)}"`, 'info');
                }
              }

              Log.add(`${char.name} te ataca causando ${damage} de dano! (HP: ${player.hp}/${player.maxHp})`, 'danger');
            }
          });
        },

        // Ataques dos aliados contra inimigos
        processAllyAttacks: function() {
          Object.values(GameState.characters).forEach(ally => {
            if (ally.id === 'player') return;
            if (!ally.isAlive) return;
            if (!ally.isAlly) return;
            if (!ally.location) return;

            // Encontrar inimigos na mesma sala (Bruxa protegida pelo escudo de força)
            const enemiesInRoom = Object.values(GameState.characters).filter(
              c => c.id !== 'player' &&
                   c.location === ally.location &&
                   c.isAlive &&
                   !c.isAlly &&
                   !(c.id === 'bruxa' && !GameState.forceShieldDown)
            );

            if (enemiesInRoom.length === 0) return;

            // 50% de chance de atacar
            if (Utils.random() < 0.5) {
              const target = Utils.randomChoice(enemiesInRoom);
              const damage = Math.max(1, ally.attackPower - target.defensePower);

              target.hp -= damage;
              if (target.hp <= 0) {
                target.hp = 0;
                target.isAlive = false;
                Log.add(`${ally.name} derrotou ${target.name}!`, 'success');

                // Efeito de glitch ao derrotar o Bombardeador
                if (target.id === 'bombardeador') {
                  GlitchEffect.trigger(3000);
                }
              } else {
                Log.add(`${ally.name} atacou ${target.name} causando ${damage} de dano! (HP: ${target.hp})`, 'success');
              }
            }
          });
        }
      };

      // ============================================================================
      // LOG - Sistema de mensagens
      // ============================================================================

      const Log = {
        entries: [],

        add: function(message, type = 'info') {
          const time = Utils.formatTime(GameState.time);
          this.entries.push({ time, message, type });
          this.render();
        },

        clear: function() {
          this.entries = [];
          this.render();
        },

        render: function() {
          const container = document.getElementById('log-container');
          container.innerHTML = this.entries.map(entry =>
            `<div class="log-entry">
              <span class="log-time">[${entry.time}]</span>
              <span class="log-${entry.type}">${entry.message}</span>
            </div>`
          ).join('');
          container.scrollTop = container.scrollHeight;
          requestAnimationFrame(() => GameUI.updateScrollIndicators());
        }
      };

      // ============================================================================
      // RENDER - Atualização da interface
      // ============================================================================

      const Render = {
        update: function() {
          this.updateHeader();
          this.updateLocation();
          this.updateTheme();
          this.updateItems();
          this.updateCharacters();
          this.updateInventory();
          this.updateWitchIndicator();
          this.updateMinimap();
        },

        updateTheme: function() {
          const container = document.getElementById('game-container');
          container.classList.remove('theme-ruins', 'theme-sky', 'theme-bomb');

          const room = GameState.rooms[GameState.playerLocation];

          // Prioridade: bomba > ruinas > ceu
          if (GameState.armedBomb && GameState.armedBomb.location === GameState.playerLocation) {
            container.classList.add('theme-bomb');
          } else if (room.isRuined) {
            container.classList.add('theme-ruins');
          } else if (room.requiresFlight) {
            container.classList.add('theme-sky');
          }
        },

        updateHeader: function() {
          document.getElementById('time-display').textContent = Utils.formatTime(GameState.time);

          const player = GameState.characters.player;
          const hpDisplay = document.getElementById('hp-display');
          hpDisplay.textContent = `${player.hp}/${player.maxHp}`;
          hpDisplay.className = player.hp <= 30 ? 'stat-value danger' : 'stat-value';

          const weight = Rules.getInventoryWeight();
          document.getElementById('weight-display').textContent = `${weight}/${player.maxWeight}`;
        },

        updateLocation: function() {
          const room = GameState.rooms[GameState.playerLocation];
          document.getElementById('location-name').textContent = room.name;
          document.getElementById('location-description').textContent = room.description;
        },


        updateItems: function() {
          const container = document.getElementById('items-container');
          const currentRoom = GameState.rooms[GameState.playerLocation];

          // Se a sala não permite itens, nem mostrar (e sanitizar por segurança)
          if (currentRoom && currentRoom.mayHaveItems === false) {
            container.innerHTML = '<span style="color: var(--text-muted)">Nenhum item aqui (itens largados cairiam do céu).</span>';
            return;
          }

          // Filtrar itens não destruídos que estão nesta sala
          const items = Object.values(GameState.items).filter(
            item => item.location === GameState.playerLocation && !item.isDestroyed
          );

          if (items.length === 0) {
            container.innerHTML = '<span style="color: var(--text-muted)">Nenhum item aqui.</span>';
            return;
          }

          container.innerHTML = items.map(item =>
            `<button class="btn btn-item" onclick="Game.pickup('${item.id}')" title="${item.description} (${item.weight}kg)">
              ${item.name}
            </button>`
          ).join('');
        },

        updateCharacters: function() {
          const container = document.getElementById('characters-container');
          const chars = Object.values(GameState.characters).filter(
            char => char.id !== 'player' &&
                    char.location === GameState.playerLocation &&
                    char.isAlive &&
                    (char.id !== 'demonio' || char.isSummoned)
          );

          if (chars.length === 0) {
            container.innerHTML = '<span style="color: var(--text-muted)">Ninguém aqui.</span>';
            return;
          }

          container.innerHTML = chars.map(char => {
            const allyClass = char.isAlly ? 'ally' : 'hostile';
            const icon = char.isAlly ? '🤝' : '⚔️';
            return `<button class="btn btn-character ${allyClass}" onclick="Game.showCharacter('${char.id}')" title="${char.description}">
              ${icon} ${char.name} (HP: ${char.hp})
            </button>`;
          }).join('');
        },

        updateInventory: function() {
          const container = document.getElementById('inventory-list');

          if (GameState.playerInventory.length === 0) {
            container.innerHTML = '<span style="color: var(--text-muted)">Inventário vazio.</span>';
            return;
          }

          container.innerHTML = GameState.playerInventory.map(itemId => {
            const item = GameState.items[itemId];
            const useBtn = item.isUsable ?
              `<button class="btn btn-small" onclick="Game.use('${item.id}')" title="Usar">✋</button>` : '';
            return `<div class="inventory-item">
              <div>
                <span class="inventory-item-name">${item.name}</span>
                <span class="inventory-item-weight">(${item.weight}kg)</span>
              </div>
              <div class="inventory-actions">
                ${useBtn}
                <button class="btn btn-small" onclick="Game.drop('${item.id}')" title="Largar">📤</button>
              </div>
            </div>`;
          }).join('');

          // Update scroll indicator
          requestAnimationFrame(() => this.updateScrollIndicators());
        },

        updateScrollIndicators: function() {
          document.querySelectorAll('.scroll-indicator-container').forEach(el => {
            const hasOverflow = el.scrollHeight > el.clientHeight + 4;
            const isNearBottom = el.scrollTop + el.clientHeight >= el.scrollHeight - 8;
            el.classList.toggle('has-overflow-below', hasOverflow && !isNearBottom);
          });
        },

        updateWitchIndicator: function() {
          const orbs = document.querySelectorAll('.witch-orb');
          orbs.forEach((orb, i) => {
            if (i < GameState.witchWords) {
              orb.classList.add('active');
            } else {
              orb.classList.remove('active');
            }
          });
        },

        // Minimapa dinâmico
        updateMinimap: function() {
          const container = document.getElementById('minimap');
          if (!container) return;

          // Obter dimensões do viewport
          const viewport = document.getElementById('minimap-viewport');
          const viewportRect = viewport ? viewport.getBoundingClientRect() : { width: 300, height: 200 };
          const width = viewportRect.width || 300;
          const height = viewportRect.height || 200;

          // Definir layout do mapa baseado nas salas
          const roomPositions = this.calculateRoomPositions(width, height);

          // Limpar mapa
          container.innerHTML = '';

          // Desenhar conexões primeiro (para ficarem atrás)
          const drawnConnections = new Set();
          Object.entries(GameState.rooms).forEach(([roomId, room]) => {
            // Usar posição customizada se existir
            let pos = roomPositions[roomId];
            if (MinimapController.customPositions[roomId]) {
              const custom = MinimapController.customPositions[roomId];
              pos = {
                x: custom.x * (width / 100),
                y: custom.y * (height / 100)
              };
            }
            if (!pos) return;

            // Não desenhar conexões de/para locais aéreos (não são ruas)
            if (room.requiresFlight) return;

            Object.values(room.exits).forEach(exitId => {
              const exitRoom = GameState.rooms[exitId];
              if (!exitRoom) return;

              // Não desenhar conexão para local aéreo
              if (exitRoom.requiresFlight) return;

              // Usar posição customizada se existir
              let exitPos = roomPositions[exitId];
              if (MinimapController.customPositions[exitId]) {
                const custom = MinimapController.customPositions[exitId];
                exitPos = {
                  x: custom.x * (width / 100),
                  y: custom.y * (height / 100)
                };
              }
              if (!exitPos) return;

              // Evitar desenhar conexão duplicada
              const connectionKey = [roomId, exitId].sort().join('-');
              if (drawnConnections.has(connectionKey)) return;
              drawnConnections.add(connectionKey);

              const connection = document.createElement('div');
              connection.className = 'map-connection';

              // Calcular linha entre os dois pontos (centros das salas)
              const x1 = pos.x;
              const y1 = pos.y;
              const x2 = exitPos.x;
              const y2 = exitPos.y;

              const length = Math.sqrt(Math.pow(x2 - x1, 2) + Math.pow(y2 - y1, 2));
              const angle = Math.atan2(y2 - y1, x2 - x1) * 180 / Math.PI;

              connection.style.left = x1 + 'px';
              connection.style.top = y1 + 'px';
              connection.style.width = length + 'px';
              connection.style.transform = `rotate(${angle}deg)`;

              container.appendChild(connection);
            });
          });

          // Obter saídas válidas da sala atual
          const currentRoom = GameState.rooms[GameState.playerLocation];
          const validExitIds = currentRoom ? Object.values(currentRoom.exits) : [];

          // Desenhar salas
          Object.entries(GameState.rooms).forEach(([roomId, room]) => {
            // Usar posição customizada se existir
            let pos = roomPositions[roomId];
            if (MinimapController.customPositions[roomId]) {
              const custom = MinimapController.customPositions[roomId];
              pos = {
                x: custom.x * (width / 100),
                y: custom.y * (height / 100)
              };
            }
            if (!pos) return;

            const roomEl = document.createElement('div');
            roomEl.className = 'map-room';
            roomEl.setAttribute('data-room-id', roomId);
            roomEl.style.left = pos.x + 'px';
            roomEl.style.top = pos.y + 'px';

            // Verificar se é a sala atual
            if (roomId === GameState.playerLocation) {
              roomEl.classList.add('current');
            } else if (validExitIds.includes(roomId)) {
              // Verificar se a saída é acessível
              const targetRoom = GameState.rooms[roomId];
              const needsFlight = targetRoom.requiresFlight && !Rules.canPlayerFly();
              const blockedByShield = roomId === 'teto_masp' && GameState.playerLocation === 'masp' && !GameState.forceShieldDown;

              // Exceção: Antena → Céu é sempre clicável (Game.move cuida da morte)
              const isDeadlyJump = GameState.playerLocation === 'antena' && roomId === 'ceu_cidade';

              if ((needsFlight || blockedByShield) && !isDeadlyJump) {
                roomEl.classList.add('blocked-exit');
                roomEl.title = room.name + (needsFlight ? ' (precisa voar)' : ' (escudo de força)');
              } else {
                roomEl.classList.add('valid-exit');
                roomEl.title = room.name + ' (clique para ir)';
              }
            }

            // Verificar entidades na sala
            const enemies = Object.values(GameState.characters).filter(
              c => c.id !== 'player' && c.location === roomId && c.isAlive && !c.isAlly &&
              (c.id !== 'demonio' || c.isSummoned)
            );
            const allies = Object.values(GameState.characters).filter(
              c => c.id !== 'player' && c.location === roomId && c.isAlive && c.isAlly
            );

            if (enemies.length > 0 && allies.length > 0) {
              roomEl.classList.add('has-both');
            } else if (enemies.length > 0) {
              roomEl.classList.add('has-enemy');
            } else if (allies.length > 0) {
              roomEl.classList.add('has-ally');
            }

            // Verificar se há bomba armada nesta sala
            if (GameState.armedBomb && GameState.armedBomb.location === roomId) {
              roomEl.classList.add('has-bomb');
            }

            // Indicadores de itens descobertos nesta sala
            const roomItems = Object.values(GameState.items).filter(function(item) {
              return GameState.discoveredItems.has(item.id) &&
                     item.location === roomId &&
                     !item.isDestroyed &&
                     !item.isAnimated &&
                     !GameState.playerInventory.includes(item.id);
            });

            // Nome abreviado da sala
            const shortName = this.getShortRoomName(room.name);
            roomEl.textContent = shortName;

            // Adicionar indicador APÓS textContent (senão seria apagado)
            if (roomItems.length > 0) {
              const indicator = document.createElement('span');
              indicator.className = 'item-indicator';
              indicator.textContent = roomItems.map(function(i) { return ITEM_ICONS[i.id] || '📦'; }).join('');
              roomEl.appendChild(indicator);
            }

            container.appendChild(roomEl);
          });

          // Aplicar transformação do MinimapController
          MinimapController.applyTransform();
        },

        // Calcular posições das salas dinamicamente com base no tamanho do container
        calculateRoomPositions: function(width, height) {
          // Grid proporcional baseado no tamanho do container
          const scaleX = width / 100;
          const scaleY = height / 100;

          // Layout organizado em grade com posições percentuais
          const positions = {
            // === CAMADA AÉREA (y: 8-20%) - Não desenhada como rua ===
            'ceu_cidade':  { x: 50, y: 8 },   // Centro do céu
            'teto_masp':   { x: 50, y: 22 },  // Logo acima do MASP
            'antena':      { x: 88, y: 8 },   // Topo direito (acima do colégio)

            // === AVENIDA PAULISTA - LINHA PRINCIPAL HORIZONTAL (y: 38%) ===
            'shopping':              { x: 10, y: 38 },
            'avenida_paulista_oeste': { x: 30, y: 38 },
            'masp':                  { x: 50, y: 38 },
            'avenida_paulista_leste': { x: 70, y: 38 },
            'colegio':               { x: 90, y: 38 },

            // === RUAS VERTICAIS - NÍVEL MÉDIO (y: 58%) ===
            'rua_augusta':           { x: 22, y: 58 },
            'nove_julho_norte':      { x: 50, y: 58 },
            'avenida_brigadeiro':    { x: 78, y: 58 },

            // === RUAS VERTICAIS - NÍVEL INFERIOR (y: 78%) ===
            'cinema':                { x: 14, y: 78 },
            'avenida_santos':        { x: 30, y: 78 },
            'nove_julho_sul':        { x: 50, y: 78 },
            'tunel':                 { x: 50, y: 92 },
            'distrito_italiano':     { x: 78, y: 78 },

            // === LOCAIS FINAIS (y: 92%) ===
            'livraria':              { x: 88, y: 92 },
          };

          // Converter posições percentuais para pixels
          const result = {};
          Object.entries(positions).forEach(([roomId, pos]) => {
            result[roomId] = {
              x: pos.x * scaleX,
              y: pos.y * scaleY
            };
          });

          return result;
        },

        // Nome curto para o mapa
        getShortRoomName: function(name) {
          const shortcuts = {
            'Túnel': 'TÚN',
            'Nove de Julho Norte': '9JN',
            'Nove de Julho Sul': '9JS',
            'Avenida Brigadeiro': 'BRG',
            'Avenida Santos': 'SNT',
            'Rua Augusta': 'AUG',
            'Shopping': 'SHP',
            'Avenida Paulista Oeste': 'P.O',
            'Avenida Paulista Leste': 'P.L',
            'MASP': '★',
            'Distrito Italiano': 'ITA',
            'Teto do MASP': 'TETO',
            'Colégio': 'COL',
            'Livraria': 'LIV',
            'Antena': 'ANT',
            'Céu da Cidade': 'CÉU',
            'Cinema': 'CIN'
          };
          return shortcuts[name] || name.substring(0, 3).toUpperCase();
        }
      };

      // ============================================================================
      // MINIMAP CONTROLLER - Sistema de drag, pan e zoom do minimapa
      // ============================================================================

      const MinimapController = {
        // Estado do viewport
        offsetX: 0,
        offsetY: 0,
        zoom: 1,
        minZoom: 0.5,
        maxZoom: 3,

        // Estado do drag
        isDragging: false,
        dragType: null, // 'node' ou 'pan'
        dragTarget: null,
        startX: 0,
        startY: 0,

        // Posições customizadas das salas (em percentual)
        customPositions: {},

        // Pinch zoom
        lastPinchDistance: null,

        init: function() {
          this.loadPositions();
          this.setupEventListeners();
          this.applyTransform();
        },

        setupEventListeners: function() {
          const viewport = document.getElementById('minimap-viewport');
          if (!viewport) return;

          // Mouse events
          viewport.addEventListener('mousedown', this.handleMouseDown.bind(this));
          document.addEventListener('mousemove', this.handleMouseMove.bind(this));
          document.addEventListener('mouseup', this.handleMouseUp.bind(this));

          // Wheel zoom
          viewport.addEventListener('wheel', this.handleWheel.bind(this), { passive: false });

          // Touch events
          viewport.addEventListener('touchstart', this.handleTouchStart.bind(this), { passive: false });
          viewport.addEventListener('touchmove', this.handleTouchMove.bind(this), { passive: false });
          viewport.addEventListener('touchend', this.handleTouchEnd.bind(this));
        },

        handleMouseDown: function(e) {
          const viewport = document.getElementById('minimap-viewport');
          const roomEl = e.target.closest('.map-room');

          if (roomEl) {
            // Iniciar drag de node
            this.isDragging = true;
            this.dragType = 'node';
            this.dragTarget = roomEl.getAttribute('data-room-id');
            roomEl.classList.add('dragging');
            viewport.classList.add('dragging-node');
          } else if (e.target === viewport || e.target.id === 'minimap') {
            // Iniciar pan do mapa
            this.isDragging = true;
            this.dragType = 'pan';
            viewport.classList.add('dragging');
          }

          this.startX = e.clientX;
          this.startY = e.clientY;

          e.preventDefault();
        },

        handleMouseMove: function(e) {
          if (!this.isDragging) return;

          const viewport = document.getElementById('minimap-viewport');
          if (!viewport) return;

          if (this.dragType === 'pan') {
            // Pan do mapa
            const deltaX = e.clientX - this.startX;
            const deltaY = e.clientY - this.startY;

            this.offsetX += deltaX;
            this.offsetY += deltaY;

            this.startX = e.clientX;
            this.startY = e.clientY;

            this.applyTransform();
          } else if (this.dragType === 'node' && this.dragTarget) {
            // Drag de node
            const viewportRect = viewport.getBoundingClientRect();
            const width = viewportRect.width;
            const height = viewportRect.height;

            // Converter coordenadas do mouse para coordenadas do mapa
            const x = (e.clientX - viewportRect.left - this.offsetX) / this.zoom;
            const y = (e.clientY - viewportRect.top - this.offsetY) / this.zoom;

            // Converter para porcentagem
            this.customPositions[this.dragTarget] = {
              x: (x / width) * 100,
              y: (y / height) * 100
            };

            // Atualizar posição do elemento diretamente (sem redesenhar tudo)
            const roomEl = document.querySelector(`[data-room-id="${this.dragTarget}"]`);
            if (roomEl) {
              roomEl.style.left = x + 'px';
              roomEl.style.top = y + 'px';
            }

            // Atualizar conexões
            Render.updateMinimap();
          }
        },

        handleMouseUp: function(e) {
          if (!this.isDragging) return;

          const viewport = document.getElementById('minimap-viewport');

          // Se foi um clique rápido num node de saída válida, mover
          if (this.dragType === 'node') {
            const roomEl = document.querySelector(`[data-room-id="${this.dragTarget}"]`);
            if (roomEl) {
              roomEl.classList.remove('dragging');

              // Se quase não moveu, considerar como clique
              const deltaX = Math.abs(e.clientX - this.startX);
              const deltaY = Math.abs(e.clientY - this.startY);
              if (deltaX < 5 && deltaY < 5) {
                // Verificar se é saída válida
                if (roomEl.classList.contains('valid-exit')) {
                  Game.move(this.dragTarget);
                } else if (roomEl.classList.contains('blocked-exit')) {
                  const room = GameState.rooms[this.dragTarget];
                  const msg = this.dragTarget === 'teto_masp' && !GameState.forceShieldDown
                    ? 'Um escudo de força mágico bloqueia o acesso!'
                    : '✈️ Você precisa voar para acessar ' + (room ? room.name : 'este local') + '.';
                  Log.add(msg, 'warning');
                }
              }
            }

            // Salvar posições após drag de node
            this.savePositions();
          }

          if (viewport) {
            viewport.classList.remove('dragging');
            viewport.classList.remove('dragging-node');
          }

          this.isDragging = false;
          this.dragType = null;
          this.dragTarget = null;
        },

        handleWheel: function(e) {
          e.preventDefault();

          const viewport = document.getElementById('minimap-viewport');
          if (!viewport) return;

          const delta = e.deltaY > 0 ? -0.15 : 0.15;
          const newZoom = Math.max(this.minZoom, Math.min(this.maxZoom, this.zoom + delta));

          // Zoom no ponto do cursor
          const rect = viewport.getBoundingClientRect();
          const cursorX = e.clientX - rect.left;
          const cursorY = e.clientY - rect.top;

          // Ajustar offset para zoom centrado no cursor
          const zoomRatio = newZoom / this.zoom;
          this.offsetX = cursorX - (cursorX - this.offsetX) * zoomRatio;
          this.offsetY = cursorY - (cursorY - this.offsetY) * zoomRatio;

          this.zoom = newZoom;
          this.applyTransform();
          this.savePositions();
        },

        handleTouchStart: function(e) {
          if (e.touches.length === 2) {
            // Pinch zoom - calcular distância inicial
            const touch1 = e.touches[0];
            const touch2 = e.touches[1];
            this.lastPinchDistance = Math.hypot(
              touch2.clientX - touch1.clientX,
              touch2.clientY - touch1.clientY
            );
            e.preventDefault();
          } else if (e.touches.length === 1) {
            // Single touch - pan ou drag
            const touch = e.touches[0];
            const roomEl = document.elementFromPoint(touch.clientX, touch.clientY)?.closest('.map-room');
            const viewport = document.getElementById('minimap-viewport');

            if (roomEl) {
              this.isDragging = true;
              this.dragType = 'node';
              this.dragTarget = roomEl.getAttribute('data-room-id');
              roomEl.classList.add('dragging');
              viewport.classList.add('dragging-node');
            } else {
              this.isDragging = true;
              this.dragType = 'pan';
              viewport.classList.add('dragging');
            }

            this.startX = touch.clientX;
            this.startY = touch.clientY;
            e.preventDefault();
          }
        },

        handleTouchMove: function(e) {
          if (e.touches.length === 2) {
            // Pinch zoom
            const touch1 = e.touches[0];
            const touch2 = e.touches[1];

            const currentDistance = Math.hypot(
              touch2.clientX - touch1.clientX,
              touch2.clientY - touch1.clientY
            );

            if (this.lastPinchDistance) {
              const delta = (currentDistance - this.lastPinchDistance) * 0.01;
              this.zoom = Math.max(this.minZoom, Math.min(this.maxZoom, this.zoom + delta));
              this.applyTransform();
            }

            this.lastPinchDistance = currentDistance;
            e.preventDefault();
          } else if (e.touches.length === 1 && this.isDragging) {
            const touch = e.touches[0];
            const viewport = document.getElementById('minimap-viewport');
            if (!viewport) return;

            if (this.dragType === 'pan') {
              const deltaX = touch.clientX - this.startX;
              const deltaY = touch.clientY - this.startY;

              this.offsetX += deltaX;
              this.offsetY += deltaY;

              this.startX = touch.clientX;
              this.startY = touch.clientY;

              this.applyTransform();
            } else if (this.dragType === 'node' && this.dragTarget) {
              const viewportRect = viewport.getBoundingClientRect();
              const width = viewportRect.width;
              const height = viewportRect.height;

              const x = (touch.clientX - viewportRect.left - this.offsetX) / this.zoom;
              const y = (touch.clientY - viewportRect.top - this.offsetY) / this.zoom;

              this.customPositions[this.dragTarget] = {
                x: (x / width) * 100,
                y: (y / height) * 100
              };

              Render.updateMinimap();
            }

            e.preventDefault();
          }
        },

        handleTouchEnd: function(e) {
          this.lastPinchDistance = null;

          if (this.isDragging) {
            const viewport = document.getElementById('minimap-viewport');

            if (this.dragType === 'node') {
              const roomEl = document.querySelector(`[data-room-id="${this.dragTarget}"]`);
              if (roomEl) {
                roomEl.classList.remove('dragging');

                // Verificar se foi um tap (toque rápido sem arrastar) para navegar
                if (e.changedTouches && e.changedTouches.length > 0) {
                  const touch = e.changedTouches[0];
                  const deltaX = Math.abs(touch.clientX - this.startX);
                  const deltaY = Math.abs(touch.clientY - this.startY);

                  // Se moveu menos de 10px, considerar como tap (navegar)
                  if (deltaX < 10 && deltaY < 10) {
                    if (roomEl.classList.contains('valid-exit')) {
                      Game.move(this.dragTarget);
                    } else if (roomEl.classList.contains('blocked-exit')) {
                      const room = GameState.rooms[this.dragTarget];
                      const msg = this.dragTarget === 'teto_masp' && !GameState.forceShieldDown
                        ? '🛡️ Um escudo de força mágico bloqueia o acesso! Derrote o Feiticeiro para removê-lo.'
                        : '✈️ Você precisa voar para acessar ' + (room ? room.name : 'este local') + '.';
                      Log.add(msg, 'warning');
                    }
                  }
                }
              }
              this.savePositions();
            }

            if (viewport) {
              viewport.classList.remove('dragging');
              viewport.classList.remove('dragging-node');
            }

            this.isDragging = false;
            this.dragType = null;
            this.dragTarget = null;
          }
        },

        applyTransform: function() {
          const minimap = document.getElementById('minimap');
          if (!minimap) return;

          minimap.style.transform = `translate(${this.offsetX}px, ${this.offsetY}px) scale(${this.zoom})`;
        },

        savePositions: function() {
          try {
            localStorage.setItem('avp_minimap_positions', JSON.stringify(this.customPositions));
            localStorage.setItem('avp_minimap_viewport', JSON.stringify({
              offsetX: this.offsetX,
              offsetY: this.offsetY,
              zoom: this.zoom
            }));
          } catch (e) {
            console.warn('Não foi possível salvar posições do minimapa:', e);
          }
        },

        loadPositions: function() {
          try {
            const saved = localStorage.getItem('avp_minimap_positions');
            if (saved) {
              this.customPositions = JSON.parse(saved);
            }

            const viewport = localStorage.getItem('avp_minimap_viewport');
            if (viewport) {
              const v = JSON.parse(viewport);
              this.offsetX = v.offsetX || 0;
              this.offsetY = v.offsetY || 0;
              this.zoom = v.zoom || 1;
            }
          } catch (e) {
            console.warn('Não foi possível carregar posições do minimapa:', e);
          }
        },

        resetPositions: function() {
          this.customPositions = {};
          this.offsetX = 0;
          this.offsetY = 0;
          this.zoom = 1;

          try {
            localStorage.removeItem('avp_minimap_positions');
            localStorage.removeItem('avp_minimap_viewport');
          } catch (e) {
            console.warn('Não foi possível limpar posições do minimapa:', e);
          }

          this.applyTransform();
          Render.updateMinimap();

          Log.add('Posições do minimapa resetadas.', 'info');
        }
      };

      // ============================================================================
      // MODALS - Sistema de modais
      // ============================================================================

      const Modals = {

        },

          const timeElapsed = GameState.time - (17 * 60);

            c => c.id !== 'player' && !c.isAlive && !c.isAlly
          ).length;

          const alliesGained = Object.values(GameState.characters).filter(
            c => c.id !== 'player' && c.isAlly && c.isAlive
          ).length;

          const itemsCollected = GameState.playerInventory.length;

          const summaryStats = `
            <div style="background: var(--bg-tertiary); padding: 1rem; border-radius: var(--radius); margin: 1rem 0; text-align: left;">
              <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; font-family: var(--font-mono); font-size: 0.85rem;">
                <div>⏱️ Tempo jogado:</div><div>${hoursPlayed}h ${minutesPlayed}min</div>
                <div>🕐 Hora final:</div><div>${Utils.formatTime(GameState.time)}</div>
                <div>❤️ HP restante:</div><div>${player.hp}/${player.maxHp}</div>
                <div>💀 Inimigos derrotados:</div><div>${enemiesDefeated}</div>
                <div>🤝 Total de aliados:</div><div>${alliesGained}</div>
                <div>🎒 Itens no inventário:</div><div>${itemsCollected}</div>
                <div>🔮 Palavras da Bruxa:</div><div>${GameState.witchWords}/4</div>
              </div>
            </div>
          `;

          const content = `
            <p style="font-size: 1.1rem; margin-bottom: 0.5rem;">${reason}</p>

              🔄 Jogar Novamente
            </button>

        },

        showCharacter: function(charId) {
          const char = GameState.characters[charId];
          const allyText = char.isAlly ? '(Aliado)' : '(Hostil)';

          // Botão de converter para o demônio (se leu o livro e ainda é hostil)
          let convertButton = '';
          if (charId === 'demonio' && GameState.hasReadMagicBook && !char.isAlly && char.isAlive) {
            convertButton = `<button class="btn btn-item" onclick="Game.speak('${GameState.demonMagicWord}'); Modals.hide();">✨ Converter</button>`;
          }

          const content = `
            <div id="character-modal-content">
              <p>${char.description}</p>
              <div class="character-stats">
                <div>❤️ HP: ${char.hp}/${char.maxHp}</div>
                <div>⚔️ Ataque: ${char.attackPower}</div>
                <div>🛡️ Defesa: ${char.defensePower}</div>
                <div>Status: ${allyText}</div>
              </div>
              ${!char.isAlly ? `<button class="btn btn-danger" onclick="Game.attackAndClose('${char.id}')">Atacar</button>` : ''}
              ${convertButton}
              <button class="btn" onclick="Modals.hide()">Fechar</button>
            </div>
