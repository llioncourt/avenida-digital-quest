<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Explore a Avenida Paulista em um RPG de aventura e sobrevivência. Enfrente a Bruxa, o Bombardeador e criaturas sombrias enquanto busca itens e desvenda mistérios pela avenida mais icônica de São Paulo."
    />
    <meta name="author" content="Avenida Paulista Adventure" />
    <meta
      name="keywords"
      content="RPG, aventura, jogo, Avenida Paulista, São Paulo, browser game, text adventure, survival"
    />

    <meta property="og:title" content="Avenida Paulista - Adventure RPG" />
    <meta
      property="og:description"
      content="Um RPG de aventura e sobrevivência na Avenida Paulista. Enfrente a Bruxa, o Bombardeador e criaturas sombrias em São Paulo."
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Avenida Paulista - Adventure RPG" />
    <meta
      name="twitter:description"
      content="RPG de aventura e sobrevivência na avenida mais icônica de São Paulo. Jogue direto no navegador!"
    />

    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏙️</text></svg>"
    />
    <title>Avenida Paulista - Adventure RPG</title>
    <style>
      /* ========== RESET & BASE ========== */
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --bg-primary: #0a0a0f;
        --bg-secondary: #12121a;
        --bg-tertiary: #1a1a25;
        --text-primary: #e8e8f0;
        --text-secondary: #a0a0b0;
        --text-muted: #606070;
        --accent-gold: #d4a846;
        --accent-gold-dim: #8a6d2e;
        --accent-red: #c94040;
        --accent-green: #40a060;
        --accent-blue: #4080c0;
        --accent-purple: #8040a0;
        --border-color: #2a2a35;
        --shadow: 0 4px 20px rgba(0,0,0,0.5);
        --radius: 8px;
        --font-mono: 'Courier New', Courier, monospace;
        --font-sans: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      }

      html, body {
        height: 100%;
        font-family: var(--font-sans);
        background: var(--bg-primary);
        color: var(--text-primary);
        line-height: 1.5;
      }

      /* ========== LAYOUT ========== */
      #game-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        max-width: 1200px;
        margin: 0 auto;
        padding: 1rem;
        gap: 1rem;
        transition: --bg-primary 0.5s ease, --bg-secondary 0.5s ease, --bg-tertiary 0.5s ease,
                    --text-primary 0.5s ease, --text-secondary 0.5s ease, --border-color 0.5s ease,
                    --accent-gold 0.5s ease;
      }

      /* Sala destruida - tons avermelhados/cinzentos */
      #game-container.theme-ruins {
        --bg-primary: #1a0a0a;
        --bg-secondary: #201010;
        --bg-tertiary: #2a1515;
        --text-primary: #d0b0b0;
        --text-secondary: #907070;
        --border-color: #3a2020;
        --accent-gold: #a06040;
      }

      /* Ceu - tons azuis etéreos */
      #game-container.theme-sky {
        --bg-primary: #0a0f1a;
        --bg-secondary: #101825;
        --bg-tertiary: #152030;
        --text-primary: #c0d8f0;
        --text-secondary: #7090b0;
        --border-color: #203050;
        --accent-gold: #60a0d0;
      }

      /* Bomba ativa na sala - tons alaranjados tensos */
      #game-container.theme-bomb {
        --bg-primary: #1a100a;
        --bg-secondary: #201810;
        --bg-tertiary: #2a2015;
        --text-primary: #f0d0a0;
        --text-secondary: #b08050;
        --border-color: #3a2a10;
        --accent-gold: #e08020;
      }

      /* ========== HEADER (compacto, dentro do game-panel) ========== */
      #header {
        background: linear-gradient(135deg, var(--bg-secondary), var(--bg-tertiary));
        border: 1px solid var(--border-color);
        border-radius: var(--radius);
        padding: 0.4rem 0.6rem;
        box-shadow: var(--shadow);
        flex-shrink: 0;
      }

      #stats {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        grid-template-rows: auto auto;
        gap: 0.15rem 0.4rem;
        font-family: var(--font-mono);
        font-size: 0.78rem;
        align-items: center;
      }

      /* HP: top-left */
      .stat-hp { grid-column: 1; grid-row: 1; justify-self: start; }
      /* Energy: bottom-left */
      .stat-energy { grid-column: 1; grid-row: 2; justify-self: start; }
      /* Weight: center */
      .stat-weight { grid-column: 2; grid-row: 1; grid-row-end: 3; justify-self: center; align-self: center; }
      /* Time: top-right */
      .stat-time { grid-column: 3; grid-row: 1; grid-row-end: 3; justify-self: end; align-self: center; }

      .stat {
        display: flex;
        align-items: center;
        gap: 0.2rem;
        flex-shrink: 0;
      }

      .stat-label {
        color: var(--text-secondary);
        font-size: 0.85em;
      }

      .stat-value {
        font-weight: bold;
        padding: 0.15rem 0.35rem;
        background: var(--bg-primary);
        border-radius: 4px;
        font-size: 0.85rem;
        white-space: nowrap;
      }

      #time-display { color: var(--accent-gold); }
      #hp-display { color: var(--accent-green); }
      #hp-display.danger { color: var(--accent-red); }
      #weight-display { color: var(--accent-blue); }
      #energy-display { color: #e0a020; }
      #energy-display.danger { color: var(--accent-red); }

      /* ========== MAIN CONTENT ========== */
      #main-content {
        display: flex;
        gap: 1rem;
        flex: 1;
        min-height: 0;
        align-items: stretch;
      }

      /* ========== LEFT COLUMN ========== */
      #left-column {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 1rem;
        min-width: 0;
        /* Garante que o container ocupe a altura total para dividir */
        height: 100%;
      }

      /*
        ALTERAÇÃO: Log Panel agora é flex: 1 (50% do espaço)
        e removemos max-height fixo.
      */
      #log-panel {
        background: linear-gradient(135deg, #1a1a2e, #16213e);
        border: 1px solid var(--accent-blue);
        flex: 1; /* Ocupa espaço flexível */
        min-height: 0; /* Permite scroll interno */
        border-radius: var(--radius);
        padding: 1rem;
        box-shadow: var(--shadow);
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }

      #log-container {
        flex: 1;
        min-height: 0;
        max-height: 100%;
        overflow-y: auto;
        overflow-x: hidden;
        padding: 0.5rem;
        background: var(--bg-primary);
        border-radius: var(--radius);
        font-family: var(--font-mono);
        font-size: 0.9rem; /* Aumentei um pouco a fonte para aproveitar o espaço */
        line-height: 1.6;
        word-wrap: break-word;
        word-break: break-word;
      }

      /*
        ALTERAÇÃO: Left Bottom agora é flex: 1 (os outros 50% do espaço)
      */
      #left-bottom {
        display: flex;
        gap: 1rem;
        flex: 1; /* Ocupa o restante do espaço vertical */
        min-height: 0;
      }

      #left-bottom #location-panel {
        flex: 1;
        overflow-y: auto;
        min-width: 0;
      }

      /*
        ALTERAÇÃO: Aumentar largura do inventário horizontalmente
      */
      #left-bottom #inventory-panel {
        flex: 0 0 340px; /* Aumentado de 220px para 340px */
        max-height: none;
        overflow-y: auto;
      }

      /* ========== RIGHT SIDEBAR (mapa + inventário) ========== */
      #right-sidebar {
        flex: 0 0 auto;
        width: 320px;
        min-width: 280px;
        max-width: 400px;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }

      #minimap-container {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }

      .panel {
        background: var(--bg-secondary);
        border: 1px solid var(--border-color);
        border-radius: var(--radius);
        padding: 1rem;
        box-shadow: var(--shadow);
      }

      #location-panel {
        flex-shrink: 0;
        position: relative;
        opacity: 1;
        transform: translateY(0);
        transition: opacity 0.2s ease, transform 0.2s ease;
      }
      #location-panel.room-transition-out {
        opacity: 0;
        transform: translateY(8px);
      }
      #location-panel.room-transition-in {
        opacity: 1;
        transform: translateY(0);
      }

      @keyframes room-name-glow {
        0% { text-shadow: 0 0 0 transparent; }
        50% { text-shadow: 0 0 14px var(--accent-gold); }
        100% { text-shadow: 0 0 0 transparent; }
      }
      .room-name-glow { animation: room-name-glow 0.6s ease; }

      @keyframes slide-up-fade {
        from { opacity: 0; transform: translateY(12px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .stagger-in {
        animation: slide-up-fade 0.25s ease backwards;
      }

      /* Grid para modal de seleção de item */
      .item-select-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 0.75rem;
        margin-bottom: 1rem;
      }
      .item-select-grid .btn {
        width: 100%;
        text-align: center;
      }

      /* Animação especial: Teto do MASP */
      @keyframes teto-flash {
        0% { opacity: 0; }
        15% { opacity: 0.7; }
        30% { opacity: 0.2; }
        50% { opacity: 0.6; }
        100% { opacity: 0; }
      }
      @keyframes screen-shake {
        0%, 100% { transform: translateX(0); }
        15% { transform: translateX(-4px); }
        30% { transform: translateX(4px); }
        45% { transform: translateX(-3px); }
        60% { transform: translateX(3px); }
        75% { transform: translateX(-2px); }
        90% { transform: translateX(2px); }
      }
      .teto-masp-glow {
        animation: teto-masp-glow-anim 1s ease;
      }
      @keyframes teto-masp-glow-anim {
        0% { text-shadow: 0 0 0 transparent; }
        30% { text-shadow: 0 0 20px #ff2222, 0 0 40px #8b0000; }
        60% { text-shadow: 0 0 14px #cc00cc, 0 0 30px #660066; }
        100% { text-shadow: 0 0 0 transparent; }
      }
      .teto-flash-overlay {
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background: radial-gradient(circle, rgba(255,255,255,0.9), rgba(212,168,70,0.4));
        pointer-events: none;
        z-index: 9999;
        animation: teto-flash 0.5s ease forwards;
      }
      .screen-shake {
        animation: screen-shake 0.4s ease;
      }


      .lanterna-indicator {
        position: absolute;
        top: 0.6rem;
        right: 0.6rem;
        font-size: 1.4rem;
        cursor: pointer;
        filter: drop-shadow(0 0 4px rgba(224, 160, 32, 0.8));
        animation: lanterna-glow 2s ease-in-out infinite;
        z-index: 2;
      }

      .lanterna-indicator:hover .lanterna-tooltip {
        display: block;
      }

      .lanterna-tooltip {
        display: none;
        position: absolute;
        top: 100%;
        right: 0;
        margin-top: 0.4rem;
        min-width: 220px;
        max-width: 300px;
        background: rgba(10, 10, 10, 0.95);
        border: 1px solid var(--accent-gold);
        border-radius: 6px;
        padding: 0.6rem 0.8rem;
        box-shadow: 0 0 12px rgba(224, 160, 32, 0.3), 0 4px 16px rgba(0, 0, 0, 0.6);
        font-size: 0.85rem;
        color: #e0e0e0;
        z-index: 100;
      }

      .lanterna-tooltip-title {
        color: var(--accent-gold);
        font-weight: bold;
        font-size: 0.9rem;
        margin-bottom: 0.4rem;
        font-family: var(--font-mono);
      }

      .lanterna-tooltip-room {
        margin-bottom: 0.3rem;
        padding-left: 0.3rem;
        border-left: 2px solid var(--accent-gold);
        margin-left: 0.1rem;
      }

      .lanterna-tooltip-room-name {
        color: var(--accent-gold);
        font-weight: 600;
        font-size: 0.8rem;
      }

      .lanterna-tooltip-item {
        color: #ccc;
        font-size: 0.8rem;
        padding-left: 0.2rem;
      }

      @keyframes lanterna-glow {
        0%, 100% { filter: drop-shadow(0 0 4px rgba(224, 160, 32, 0.8)); }
        50% { filter: drop-shadow(0 0 8px rgba(224, 160, 32, 1)); }
      }

      #location-name {
        font-size: 1.3rem;
        font-weight: bold;
        color: var(--accent-gold);
        margin-bottom: 0.5rem;
        font-family: var(--font-mono);
      }

      #location-description {
        color: var(--text-secondary);
        margin-bottom: 1rem;
        line-height: 1.6;
      }

      .section-title {
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: var(--text-muted);
        margin-bottom: 0.5rem;
        border-bottom: 1px solid var(--border-color);
        padding-bottom: 0.3rem;
      }

      /*
        ALTERAÇÃO: Nova classe de animação para o título do Log
      */
      @keyframes modern-pulse {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }

      .modern-pulse-title {
        font-size: 1.2rem;
        letter-spacing: 3px;
        text-transform: uppercase;
        font-family: var(--font-mono);
        font-weight: 800;
        margin: 0;
        padding: 0;
        border: none;

        /* Gradiente animado */
        background: linear-gradient(270deg, var(--accent-gold), #fff, var(--accent-gold), var(--accent-gold-dim));
        background-size: 300% 300%;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;

        animation: modern-pulse 4s ease infinite;
        text-shadow: 0 0 15px rgba(212, 168, 70, 0.2);
      }

      .button-group {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin-bottom: 1rem;
      }

      .btn {
        font-family: var(--font-mono);
        font-size: 0.85rem;
        padding: 0.5rem 1rem;
        border: 1px solid var(--border-color);
        border-radius: var(--radius);
        background: var(--bg-tertiary);
        color: var(--text-primary);
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .btn:hover {
        background: var(--accent-gold-dim);
        border-color: var(--accent-gold);
        transform: translateY(-1px);
      }

      .btn:active {
        transform: translateY(0);
      }

      .btn-item {
        background: linear-gradient(135deg, #2a1a1a, #1a1a0a);
        border-color: var(--accent-gold-dim);
      }

      .btn-item:hover {
        background: var(--accent-gold);
        color: #000;
      }

      .btn-character {
        background: linear-gradient(135deg, #2a1a2a, #1a0a1a);
        border-color: var(--accent-purple);
      }

      .btn-character:hover {
        background: var(--accent-purple);
        color: #fff;
      }

      .btn-character.ally {
        border-color: var(--accent-green);
        background: linear-gradient(135deg, #1a2a1a, #0a150a);
      }

      .btn-character.hostile {
        border-color: var(--accent-red);
        background: linear-gradient(135deg, #2a1a1a, #1a0a0a);
      }

      .btn-danger {
        background: linear-gradient(135deg, #2a1a1a, #1a0a0a);
        border-color: var(--accent-red);
      }

      .btn-danger:hover {
        background: var(--accent-red);
        color: #fff;
      }

      .btn-spectral {
        background: linear-gradient(135deg, #1a1030, #0a0820);
        border-color: var(--accent-purple);
        color: #c8a0f0;
        animation: spectral-glow 2s ease-in-out infinite;
        text-shadow: 0 0 8px rgba(160, 80, 220, 0.6);
      }
      .btn-spectral:hover {
        background: linear-gradient(135deg, #2a1848, #1a1030);
        border-color: #b060e0;
        box-shadow: 0 0 15px rgba(160, 80, 220, 0.4);
      }
      @keyframes spectral-glow {
        0%, 100% { box-shadow: 0 0 5px rgba(160, 80, 220, 0.2); }
        50% { box-shadow: 0 0 15px rgba(160, 80, 220, 0.5), 0 0 30px rgba(160, 80, 220, 0.2); }
      }

      #inventory-panel {
        flex-shrink: 0;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }

      #inventory-panel .section-title {
        position: sticky;
        top: 0;
        z-index: 2;
        background: var(--bg-secondary);
        margin: 0 0 0.5rem 0;
        padding-bottom: 0.3rem;
      }

      #inventory-panel .inventory-scroll-wrap {
        flex: 1;
        overflow-y: auto;
        position: relative;
      }

      /* ========== SUBTLE SCROLL INDICATORS ========== */
      .scroll-indicator-container {
        position: relative;
      }
      .scroll-indicator-container::after {
        content: '';
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 24px;
        background: linear-gradient(to bottom, transparent, var(--bg-secondary));
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.3s ease;
      }
      .scroll-indicator-container.has-overflow-below::after {
        opacity: 1;
      }

      #inventory-list {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }

      .inventory-item {
        display: flex;
        justify-content: space-between;
        align-items: center; /* Alinha o botão de ação verticalmente */
        padding: 0.6rem 0.5rem; /* Um pouco mais de padding vertical */
        background: var(--bg-tertiary);
        border-radius: var(--radius);
        border: 1px solid var(--border-color);
        overflow: hidden;
        min-width: 0;
      }

      .inventory-item > div:first-child {
        min-width: 0;
        overflow: hidden;
      }

      /*
        ALTERAÇÃO: Formatação dos itens do inventário
      */
      .inventory-item-name {
        display: block; /* Força quebra de linha */
        font-family: var(--font-mono);
        font-size: 0.9rem;
        color: var(--accent-gold);
        margin-bottom: 2px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .inventory-item-weight {
        display: block; /* Força quebra de linha (abaixo do nome) */
        font-size: 0.75rem;
        color: var(--text-muted);
      }

      .inventory-actions {
        display: flex;
        gap: 0.3rem;
        flex-shrink: 0;
        margin-left: 0.5rem;
      }

      /* ========== CRAFTING ========== */
      .craft-selected {
        border: 1px solid var(--accent-gold) !important;
        background: rgba(212, 168, 70, 0.12) !important;
        box-shadow: 0 0 8px rgba(212, 168, 70, 0.3);
      }
      .craft-toggle-btn {
        font-size: 0.85rem;
        padding: 2px 8px;
        min-width: unset;
        height: auto;
      }
      .craft-toggle-btn.craft-active {
        background: var(--accent-gold);
        color: var(--bg-primary);
      }

      .btn-small {
        font-size: 1rem;
        padding: 0.2rem 0.4rem;
        line-height: 1;
      }

      /* ========== LOG ENTRY STYLES ========== */
      .log-entry {
        padding: 0.2rem 0;
        border-bottom: 1px solid var(--border-color);
        overflow-wrap: break-word; /* Quebrar palavras longas */
      }

      .log-entry:last-child {
        border-bottom: none;
      }

      .log-time {
        color: var(--text-muted);
        font-size: 0.75rem;
        margin-right: 0.5rem;
      }

      .log-action { color: var(--accent-blue); }
      .log-success { color: var(--accent-green); }
      .log-danger { color: var(--accent-red); }
      .log-warning { color: var(--accent-gold); }
      .log-info { color: var(--text-secondary); }
      .log-magic { color: var(--accent-purple); font-style: italic; }

      /* ========== MINIMAP (estilos internos) ========== */
      #minimap-container {
        background:
          /* Grid sutil de quadras da cidade */
          linear-gradient(rgba(40, 40, 55, 0.3) 1px, transparent 1px),
          linear-gradient(90deg, rgba(40, 40, 55, 0.3) 1px, transparent 1px),
          linear-gradient(180deg, #0a0a12 0%, #08080d 100%);
        background-size: 20px 20px, 20px 20px, 100% 100%;
        border-radius: var(--radius);
        padding: 0.75rem;
        position: relative;
        overflow: hidden;
        border: 1px solid rgba(42, 42, 53, 0.8);
      }

      #minimap-container::before {
        content: '';
        position: absolute;
        inset: 0;
        background:
          radial-gradient(ellipse at 50% 0%, rgba(212, 168, 70, 0.03) 0%, transparent 50%),
          radial-gradient(ellipse at 50% 100%, rgba(64, 128, 192, 0.02) 0%, transparent 40%);
        pointer-events: none;
      }

      #minimap-header {
        display: flex;
        justify-content: center;
        align-items: center;
        margin-bottom: 0.5rem;
        position: relative;
      }

      #minimap-title {
        font-size: 0.65rem;
        text-transform: uppercase;
        letter-spacing: 2px;
        color: var(--accent-gold);
        text-align: center;
        font-weight: 600;
        text-shadow: 0 0 10px rgba(212, 168, 70, 0.3);
      }

      #minimap-reset {
        position: absolute;
        right: 0;
        top: 50%;
        transform: translateY(-50%);
        background: var(--bg-tertiary);
        border: 1px solid var(--border-color);
        border-radius: 4px;
        color: var(--text-secondary);
        font-size: 0.8rem;
        padding: 0.2rem 0.4rem;
        cursor: pointer;
        transition: all 0.2s ease;
      }

      #minimap-reset:hover {
        background: var(--accent-gold-dim);
        border-color: var(--accent-gold);
        color: var(--text-primary);
      }

      #minimap-viewport {
        position: relative;
        width: 100%;
        flex: 1;
        min-height: 0;
        overflow: hidden;
        cursor: grab;
        touch-action: none;
      }

      #minimap-viewport.dragging {
        cursor: grabbing;
      }

      #minimap-viewport.dragging-node {
        cursor: move;
      }

      #minimap {
        position: absolute;
        width: 100%;
        height: 100%;
        transform-origin: 0 0;
      }

      .map-room {
        position: absolute;
        /* Círculo de interseção - estilo mapa de cidade */
        background: radial-gradient(circle,
          rgba(45, 45, 60, 0.95) 0%,
          rgba(30, 30, 42, 0.9) 100%
        );
        border: 2px solid rgba(80, 80, 100, 0.8);
        border-radius: 50%;
        width: 28px;
        height: 28px;
        padding: 0;
        font-size: 0.45rem;
        font-family: var(--font-mono);
        font-weight: 600;
        color: rgba(180, 180, 200, 0.9);
        text-align: center;
        line-height: 24px;
        cursor: move;
        transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
        transform: translate(-50%, -50%);
        box-shadow:
          0 0 0 3px rgba(30, 30, 42, 0.8),
          0 2px 8px rgba(0, 0, 0, 0.5);
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: center;
        user-select: none;
      }

      .map-room:hover {
        transform: translate(-50%, -50%) scale(1.15);
        z-index: 20;
      }

      .map-room.dragging {
        opacity: 0.8;
        z-index: 100;
        box-shadow:
          0 0 0 3px rgba(212, 168, 70, 0.6),
          0 4px 16px rgba(0, 0, 0, 0.7);
        transition: none;
      }

      .map-room.current {
        /* Marcador "Você está aqui" - dourado destacado */
        background: radial-gradient(circle,
          rgba(212, 168, 70, 0.4) 0%,
          rgba(180, 140, 50, 0.6) 100%
        );
        border: 3px solid var(--accent-gold);
        color: var(--accent-gold);
        width: 36px;
        height: 36px;
        line-height: 30px;
        font-size: 0.5rem;
        box-shadow:
          0 0 0 4px rgba(30, 30, 42, 0.9),
          0 0 15px rgba(212, 168, 70, 0.5),
          0 0 30px rgba(212, 168, 70, 0.2);
        z-index: 15;
        animation: current-pulse 2s ease-in-out infinite;
      }

      /* Salas adjacentes (saídas válidas) - destinos clicáveis */
      .map-room.valid-exit {
        background: radial-gradient(circle,
          rgba(88, 166, 255, 0.2) 0%,
          rgba(56, 139, 219, 0.3) 100%
        );
        border: 2px solid rgba(88, 166, 255, 0.8);
        color: rgba(140, 190, 255, 1);
        cursor: pointer;
        box-shadow:
          0 0 0 3px rgba(30, 30, 42, 0.8),
          0 0 10px rgba(88, 166, 255, 0.4);
      }

      .map-room.valid-exit:hover {
        transform: translate(-50%, -50%) scale(1.2);
        box-shadow:
          0 0 0 4px rgba(30, 30, 42, 0.9),
          0 0 20px rgba(88, 166, 255, 0.6);
      }

      /* Saídas bloqueadas (requer voo ou escudo) */
      .map-room.blocked-exit {
        border: 2px dashed rgba(255, 180, 60, 0.5);
        color: rgba(255, 180, 60, 0.7);
        cursor: not-allowed;
      }

      @keyframes current-pulse {
        0%, 100% {
          box-shadow:
            0 0 0 4px rgba(30, 30, 42, 0.9),
            0 0 15px rgba(212, 168, 70, 0.5),
            0 0 30px rgba(212, 168, 70, 0.2);
        }
        50% {
          box-shadow:
            0 0 0 4px rgba(30, 30, 42, 0.9),
            0 0 20px rgba(212, 168, 70, 0.7),
            0 0 40px rgba(212, 168, 70, 0.3);
        }
      }

      .map-room.has-enemy::after {
        content: '';
        position: absolute;
        top: -3px;
        right: -3px;
        width: 10px;
        height: 10px;
        background: var(--accent-red);
        border-radius: 50%;
        border: 2px solid rgba(30, 30, 42, 0.9);
        animation: enemy-blink 1s ease-in-out infinite;
      }

      @keyframes enemy-blink {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.6; transform: scale(0.85); }
      }

      .map-room.has-ally::after {
        content: '';
        position: absolute;
        top: -3px;
        right: -3px;
        width: 10px;
        height: 10px;
        background: var(--accent-green);
        border-radius: 50%;
        border: 2px solid rgba(30, 30, 42, 0.9);
      }

      .map-room.has-both::after {
        content: '';
        position: absolute;
        top: -3px;
        right: -3px;
        width: 10px;
        height: 10px;
        background: linear-gradient(135deg, var(--accent-red) 50%, var(--accent-green) 50%);
        border-radius: 50%;
        border: 2px solid rgba(30, 30, 42, 0.9);
        animation: enemy-blink 1s ease-in-out infinite;
      }

      .map-room.has-bomb::after {
        content: '💣';
        position: absolute;
        top: -8px;
        right: -8px;
        font-size: 0.6rem;
        z-index: 25;
        animation: bomb-pulse 1s ease-in-out infinite;
      }

      /* Quando tem bomba E inimigo/aliado, bomba fica à esquerda */
      .map-room.has-bomb.has-enemy::after,
      .map-room.has-bomb.has-ally::after,
      .map-room.has-bomb.has-both::after {
        right: auto;
        left: -8px;
      }

      .map-room.secret-revealed {
        animation: secret-pulse 2s ease-in-out infinite;
        box-shadow: 0 0 10px rgba(224, 160, 32, 0.7);
        border-color: rgba(224, 160, 32, 0.8);
      }

      @keyframes secret-pulse {
        0%, 100% { box-shadow: 0 0 6px rgba(224, 160, 32, 0.4); }
        50% { box-shadow: 0 0 14px rgba(224, 160, 32, 0.9); }
      }

      /*
        Indicador visual de itens descobertos no minimapa.
        Fica abaixo do nó para não conflitar com os badges de inimigo/aliado/bomba.
      */
      .map-room .item-indicator {
        position: absolute;
        bottom: -10px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 0.45rem;
        z-index: 25;
        white-space: nowrap;
        pointer-events: none;
        line-height: 1;
      }

      @keyframes bomb-pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.5; transform: scale(1.3); }
      }

      /* Conexões como RUAS da cidade */
      .map-connection {
        position: absolute;
        background: linear-gradient(90deg,
          rgba(70, 70, 85, 0.5) 0%,
          rgba(90, 90, 110, 0.7) 10%,
          rgba(90, 90, 110, 0.7) 90%,
          rgba(70, 70, 85, 0.5) 100%
        );
        transform-origin: left center;
        height: 10px;
        z-index: 1;
        border-radius: 2px;
        box-shadow:
          inset 0 1px 0 rgba(255,255,255,0.08),
          inset 0 -1px 0 rgba(0,0,0,0.3),
          0 2px 4px rgba(0,0,0,0.4);
      }

      /* Linha central tracejada (faixa da rua) */
      .map-connection::after {
        content: '';
        position: absolute;
        top: 50%;
        left: 5%;
        right: 5%;
        height: 1px;
        background: repeating-linear-gradient(
          90deg,
          rgba(255, 220, 100, 0.25) 0px,
          rgba(255, 220, 100, 0.25) 6px,
          transparent 6px,
          transparent 12px
        );
        transform: translateY(-50%);
      }

      .map-legend {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        display: flex;
        justify-content: center;
        gap: 1rem;
        padding: 0.4rem;
        background: rgba(10, 10, 15, 0.8);
        border-radius: 0 0 var(--radius) var(--radius);
        border-top: 1px solid rgba(42, 42, 53, 0.4);
      }

      .legend-item {
        display: flex;
        align-items: center;
        gap: 4px;
        font-size: 0.6rem;
        color: var(--text-muted);
        font-family: var(--font-mono);
      }

      .legend-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        box-shadow: 0 0 6px currentColor;
      }

      .legend-dot.player {
        background: var(--accent-gold);
        box-shadow: 0 0 8px rgba(212, 168, 70, 0.6);
      }
      .legend-dot.enemy {
        background: var(--accent-red);
        box-shadow: 0 0 8px rgba(201, 64, 64, 0.6);
      }
      .legend-dot.ally {
        background: var(--accent-green);
        box-shadow: 0 0 8px rgba(64, 160, 96, 0.6);
      }

      #action-buttons {
        display: flex;
        gap: 0.5rem;
        margin-top: 0.5rem;
        flex-wrap: wrap;
      }

      /* ========== MODAL ========== */
      #modal-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.8);
        z-index: 100;
        justify-content: center;
        align-items: center;
      }

      #modal-overlay.active {
        display: flex;
      }

      #modal {
        background: var(--bg-secondary);
        border: 2px solid var(--accent-gold);
        border-radius: var(--radius);
        padding: 2rem;
        max-width: 500px;
        width: 90%;
        max-height: 85vh;
        overflow-y: auto;
        text-align: center;
        box-shadow: 0 0 50px rgba(212, 168, 70, 0.3);
        scrollbar-width: thin;
        scrollbar-color: #8B6914 rgba(139, 105, 20, 0.1);
      }

      #modal::-webkit-scrollbar { width: 6px; }
      #modal::-webkit-scrollbar-track { background: rgba(139, 105, 20, 0.1); border-radius: 3px; }
      #modal::-webkit-scrollbar-thumb { background: #8B6914; border-radius: 3px; }

      #modal h2 {
        font-family: var(--font-mono);
        font-size: 1.5rem;
        color: var(--accent-gold);
        margin-bottom: 1rem;
      }

      #modal p {
        color: var(--text-secondary);
        margin-bottom: 1.5rem;
        line-height: 1.6;
      }

      /* ========== MAPA ANTIGO MODAL ========== */
      #modal-overlay.mapa-exclusive #modal {
        max-width: 550px;
        border: 2px solid #8B6914;
        background: linear-gradient(135deg, #1a1408 0%, #2a1f0e 40%, #1a1408 100%);
        box-shadow: 0 0 60px rgba(139, 105, 20, 0.4), inset 0 0 30px rgba(139, 105, 20, 0.1);
      }

      .mapa-antigo-container {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }

      .mapa-antigo-subtitle {
        color: #c4a44a;
        font-style: italic;
        font-size: 0.9rem;
        text-align: center;
        margin-bottom: 0.25rem;
      }

      .mapa-antigo-scroll {
        padding-right: 0.5rem;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }

      .mapa-section {
        border: 1px solid rgba(139, 105, 20, 0.3);
        border-radius: var(--radius);
        overflow: hidden;
      }

      .mapa-section-label {
        background: rgba(139, 105, 20, 0.2);
        padding: 0.35rem 0.75rem;
        font-family: var(--font-mono);
        font-size: 0.8rem;
        color: #c4a44a;
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }

      .mapa-section-rooms {
        display: flex;
        flex-direction: column;
        max-height: 35vh;
        overflow-x: hidden;
        overflow-y: auto;
        scrollbar-width: thin;
        scrollbar-color: #8B6914 rgba(139, 105, 20, 0.1);
      }

      .mapa-section-rooms::-webkit-scrollbar { width: 6px; }
      .mapa-section-rooms::-webkit-scrollbar-track { background: rgba(139, 105, 20, 0.1); border-radius: 3px; }
      .mapa-section-rooms::-webkit-scrollbar-thumb { background: #8B6914; border-radius: 3px; }

      .mapa-room-btn {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        padding: 0.5rem 0.75rem;
        background: transparent;
        border: none;
        border-top: 1px solid rgba(139, 105, 20, 0.15);
        color: var(--text-primary);
        font-family: var(--font-mono);
        font-size: 0.85rem;
        cursor: pointer;
        transition: background 0.2s, transform 0.1s;
        text-align: left;
      }

      .mapa-room-btn:first-child { border-top: none; }

      .mapa-room-btn:hover {
        background: rgba(139, 105, 20, 0.25);
        transform: translateX(4px);
      }

      .mapa-room-btn:active {
        background: rgba(139, 105, 20, 0.4);
      }

      .mapa-room-name {
        flex: 1;
      }

      .mapa-cancel-btn {
        margin-top: 0.5rem;
        background: rgba(139, 105, 20, 0.15) !important;
        border: 1px solid rgba(139, 105, 20, 0.4) !important;
        color: #c4a44a !important;
      }

      .mapa-cancel-btn:hover {
        background: rgba(139, 105, 20, 0.3) !important;
      }

      #modal .btn {
        margin: 0.5rem;
      }

      /* ========== CHARACTER MODAL ========== */
      #character-modal-content {
        text-align: left;
      }

      #character-modal-content .character-stats {
        background: var(--bg-tertiary);
        padding: 1rem;
        border-radius: var(--radius);
        margin: 1rem 0;
        font-family: var(--font-mono);
        font-size: 0.9rem;
      }

      /* ========== RESPONSIVE ========== */
      @media (max-width: 800px) {
        #game-container {
          padding: 0.4rem;
          gap: 0.5rem;
        }

        #main-content {
          flex-direction: column;
          gap: 0.5rem;
        }

        #log-panel {
          max-height: 200px;
          flex: 0 0 auto;
          padding: 0.5rem;
        }

        #log-container {
          font-size: 0.8rem;
          line-height: 1.4;
        }

        #left-bottom {
          flex-direction: column;
          flex: 0 0 auto;
          gap: 0.5rem;
        }

        #left-bottom #inventory-panel {
          flex: 0 0 auto;
          width: 100%;
        }

        #right-sidebar {
          width: 100% !important;
          min-width: 0 !important;
          max-width: 100% !important;
        }

        #header {
          padding: 0.3rem 0.5rem;
        }

        #stats {
          font-size: 0.72rem;
          gap: 0.3rem;
          justify-content: space-around;
        }

        .stat-value {
          padding: 0.1rem 0.25rem;
          font-size: 0.75rem;
        }

        .stat-label {
          font-size: 0.75em;
        }

        #location-name {
          font-size: 1rem;
        }

        #location-description {
          font-size: 0.85rem;
        }

        .btn {
          font-size: 0.78rem;
          padding: 0.4rem 0.7rem;
        }

        .panel {
          padding: 0.6rem;
        }

        .section-title {
          font-size: 0.75rem;
        }

        .modern-pulse-title {
          font-size: 0.9rem;
          letter-spacing: 2px;
        }

        #minimap-container {
          max-height: 250px;
        }
      }

      /* ========== SCROLLBAR ========== */
      ::-webkit-scrollbar {
        width: 8px;
      }

      ::-webkit-scrollbar-track {
        background: var(--bg-primary);
      }

      ::-webkit-scrollbar-thumb {
        background: var(--border-color);
        border-radius: 4px;
      }

      ::-webkit-scrollbar-thumb:hover {
        background: var(--text-muted);
      }

      /* ========== WITCH COUNTER ========== */
      #witch-indicator {
        display: flex;
        gap: 0.3rem;
        align-items: center;
      }

      .witch-orb {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: var(--bg-tertiary);
        border: 1px solid var(--accent-purple);
        transition: all 0.3s ease;
      }

      .witch-orb.active {
        background: var(--accent-purple);
        box-shadow: 0 0 10px var(--accent-purple);
      }

      /* ========== GLITCH EFFECT ========== */
      @keyframes glitch-skew {
        0% { transform: skew(0deg); }
        10% { transform: skew(-2deg); }
        20% { transform: skew(3deg); }
        30% { transform: skew(-1deg); }
        40% { transform: skew(2deg); }
        50% { transform: skew(-3deg); }
        60% { transform: skew(1deg); }
        70% { transform: skew(-2deg); }
        80% { transform: skew(2deg); }
        90% { transform: skew(-1deg); }
        100% { transform: skew(0deg); }
      }

      @keyframes glitch-color {
        0% { filter: hue-rotate(0deg) saturate(1); }
        25% { filter: hue-rotate(90deg) saturate(2); }
        50% { filter: hue-rotate(-90deg) saturate(1.5); }
        75% { filter: hue-rotate(180deg) saturate(2); }
        100% { filter: hue-rotate(0deg) saturate(1); }
      }

      /*
        Deslocamento curto usado pelos pseudo-elementos do glitch.
        Mantido separado para facilitar ajuste manual fino do efeito.
      */
      @keyframes glitch-offset {
        0% { transform: translate(0, 0); }
        20% { transform: translate(-2px, 1px); }
        40% { transform: translate(2px, -1px); }
        60% { transform: translate(-1px, -2px); }
        80% { transform: translate(1px, 2px); }
        100% { transform: translate(0, 0); }
      }

      .glitch-active {
        animation: glitch-skew 0.15s infinite linear, glitch-color 0.3s infinite linear;
        position: relative;
      }

      .glitch-active::before,
      .glitch-active::after {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: inherit;
        pointer-events: none;
      }

      .glitch-active::before {
        animation: glitch-offset 0.2s infinite linear;
        background: rgba(255, 0, 0, 0.1);
        mix-blend-mode: multiply;
      }

      .glitch-active::after {
        animation: glitch-offset 0.25s infinite linear reverse;
        background: rgba(0, 255, 255, 0.1);
        mix-blend-mode: multiply;
      }

      /* Overlay de glitch */
      #glitch-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 10000;
        display: none;
      }

      #glitch-overlay.active {
        display: block;
        animation: glitch-overlay-flash 0.1s infinite;
      }

      @keyframes glitch-overlay-flash {
        0% { background: rgba(255, 0, 0, 0.05); }
        25% { background: rgba(0, 255, 0, 0.08); }
        50% { background: rgba(0, 0, 255, 0.05); }
        75% { background: rgba(255, 255, 0, 0.06); }
        100% { background: rgba(255, 0, 255, 0.04); }
      }

      /* ========== WITCH FLASH EFFECT ========== */
      @keyframes witch-flash {
        0% { opacity: 1; }
        100% { opacity: 0; }
      }

      /* ========== INTRO STAR WARS ========== */
      #intro-container {
        position: fixed;
        inset: 0;
        background: black;
        z-index: 10000;
        overflow: hidden;
        perspective: 400px;
        perspective-origin: 50% 40%;
      }

      /* Esconder jogo durante intro */
      body.intro-active #game-container {
        visibility: hidden;
        pointer-events: none;
      }

      #intro-stars {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(1px 1px at 20% 30%, white, transparent),
          radial-gradient(1px 1px at 40% 70%, white, transparent),
          radial-gradient(1px 1px at 50% 50%, white, transparent),
          radial-gradient(1px 1px at 80% 10%, white, transparent),
          radial-gradient(1px 1px at 10% 60%, white, transparent),
          radial-gradient(1px 1px at 70% 40%, white, transparent),
          radial-gradient(1px 1px at 30% 80%, white, transparent),
          radial-gradient(1px 1px at 60% 90%, white, transparent);
        background-size: 200px 200px;
        opacity: 0.4;
      }

      #intro-skip {
        position: absolute;
        top: 2rem;
        right: 2rem;
        z-index: 10001;
        background: transparent;
        border: 1px solid var(--accent-gold);
        color: var(--accent-gold);
        padding: 0.5rem 1rem;
        cursor: pointer;
        font-family: var(--font-mono);
        font-size: 0.9rem;
        transition: all 0.2s ease;
      }

      #intro-skip:hover {
        background: var(--accent-gold);
        color: black;
      }

      #intro-crawl {
        position: absolute;
        width: 80%;
        left: 50%;
        bottom: 0;
        transform-style: preserve-3d;
        /* Animação iniciada via JS após inserir conteúdo */
        animation: none;
        text-align: justify;
        color: var(--accent-gold);
        font-size: 1.6rem;
        line-height: 1.8;
      }

      .crawl-title {
        font-size: 3rem;
        margin-bottom: 2rem;
        text-shadow: 0 0 20px rgba(212, 168, 70, 0.5);
        text-align: center;
      }

      #intro-crawl p {
        margin-bottom: 3rem;
      }

      .crawl-final {
        font-size: 2rem;
        margin-top: 3rem;
        font-style: italic;
      }

      @keyframes star-wars-crawl {
        0% {
          transform: translateX(-50%) rotateX(28deg) translateY(80vh) translateZ(0);
          opacity: 1;
        }
        100% {
          transform: translateX(-50%) rotateX(28deg) translateY(-400vh) translateZ(-1200px);
          opacity: 1;
        }
      }
      /* ========== RANDOM EVENTS OVERLAYS ========== */
      #rain-overlay {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 100;
        background: linear-gradient(transparent 0%, rgba(100, 130, 180, 0.08) 100%);
        opacity: 0;
        transition: opacity 1.5s ease;
      }
      #rain-overlay.active {
        opacity: 1;
      }
      #rain-overlay.active::before {
        content: '';
        position: absolute;
        inset: 0;
        background-image:
          repeating-linear-gradient(
            transparent,
            transparent 4px,
            rgba(170, 200, 255, 0.08) 4px,
            rgba(170, 200, 255, 0.08) 5px
          );
        background-size: 3px 100%;
        animation: rain-fall 0.4s linear infinite;
      }
      #rain-overlay.active::after {
        content: '';
        position: absolute;
        inset: 0;
        background-image:
          repeating-linear-gradient(
            transparent,
            transparent 6px,
            rgba(170, 200, 255, 0.05) 6px,
            rgba(170, 200, 255, 0.05) 7px
          );
        background-size: 5px 100%;
        animation: rain-fall 0.6s linear infinite;
        animation-delay: 0.2s;
      }

      @keyframes rain-fall {
        0% { transform: translateY(-100%); }
        100% { transform: translateY(100%); }
      }

      #fog-overlay {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 99;
        background: radial-gradient(ellipse at center, rgba(200, 210, 220, 0.12) 0%, rgba(180, 190, 200, 0.06) 50%, transparent 80%);
        opacity: 0;
        transition: opacity 2s ease;
      }
      #fog-overlay.active {
        opacity: 1;
      }

      #whisper-overlay {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 98;
        background: rgba(0, 0, 0, 0.15);
        opacity: 0;
        transition: opacity 1.5s ease;

      #whisper-overlay.active {
        opacity: 1;

        animation: screen-shake 0.3s ease-out !important;

        0%, 100% { transform: translate(0, 0); }
        10% { transform: translate(-3px, -2px); }
        20% { transform: translate(4px, 1px); }
        30% { transform: translate(-2px, 3px); }
        40% { transform: translate(3px, -1px); }
        50% { transform: translate(-4px, 2px); }
        60% { transform: translate(2px, -3px); }
        70% { transform: translate(-1px, 4px); }
        80% { transform: translate(3px, -2px); }
        90% { transform: translate(-2px, 1px); }

        flex-direction: column;
        gap: 2rem;

        display: flex;

        display: flex;
        gap: 2rem;
        align-items: stretch;
        max-width: 700px;
        width: 95%;

      .combat-card {
        flex: 1;
        background: var(--bg-secondary);
        border: 2px solid var(--border-color);
        border-radius: var(--radius);
        padding: 1.5rem;

        border-color: var(--accent-red);
        box-shadow: 0 0 20px rgba(201, 64, 64, 0.3);

        box-shadow: 0 0 20px rgba(64, 128, 192, 0.3);

        font-family: var(--font-mono);
        font-size: 1.1rem;
        font-weight: bold;
        margin-bottom: 0.75rem;
        padding-bottom: 0.5rem;
        border-bottom: 1px solid var(--border-color);
      }

      .combat-card.attacker .combat-card-title {
        color: var(--accent-red);
      }

      .combat-card.defender .combat-card-title {
        color: var(--accent-blue);
      }

        opacity: 0;
        font-family: var(--font-mono);
        font-size: 0.85rem;
        margin-bottom: 0.4rem;
        color: var(--text-secondary);
      }

        opacity: 1;
        animation: combat-type-in 0.3s ease-out;
      }

        color: var(--accent-gold);
        font-weight: bold;
        font-size: 0.95rem;
        margin-top: 0.3rem;
      }

      .combat-line.combat-separator {
        border-top: 1px solid var(--border-color);
        padding-top: 0.4rem;
        margin-top: 0.4rem;
      }

      .combat-line.combat-result-damage {
        color: var(--accent-red);
        font-weight: bold;
        font-size: 1rem;
      }

      .combat-line.combat-result-hp {
        color: var(--accent-green);
        font-weight: bold;
      }

      .combat-line.combat-result-defeated {
        color: var(--accent-red);
        font-weight: bold;
        font-size: 1.1rem;
        text-transform: uppercase;
      }

      @keyframes combat-type-in {
        from { opacity: 0; transform: translateX(-10px); }
        to { opacity: 1; transform: translateX(0); }
      }

      #combat-confirm-btn {
        display: none;
        font-family: var(--font-mono);
        font-size: 1.1rem;
        font-weight: bold;
        padding: 0.8rem 2.5rem;
        border: 2px solid var(--accent-gold);
        border-radius: var(--radius);
        cursor: pointer;
        text-transform: uppercase;
        letter-spacing: 2px;
        animation: combat-blink 0.6s ease-in-out infinite alternate;
      }

      @keyframes combat-blink {
        0% { background: var(--accent-red); color: white; border-color: var(--accent-red); }
        100% { background: var(--accent-gold); color: black; border-color: var(--accent-gold); }
      }

      @media (max-width: 500px) {
        #combat-modal {
          flex-direction: column;
          gap: 1rem;
        }
        .combat-card {
          min-width: unset;
        }
      }
      /* Energy styles moved to main #stats section above */

      /* ========== NIGHT THEME ========== */
      #game-container.theme-night {
        --bg-primary: #050508;
        --bg-secondary: #0a0a12;
        --bg-tertiary: #10101a;
        --text-primary: #b0b0c0;
        --text-secondary: #707088;
        --border-color: #1a1a28;
        --accent-gold: #9a8030;
      }

      /* ========== JOURNAL BUTTON ========== */
      .journal-btn {
        background: none;
        border: none;
        padding: 0.3rem 0.5rem;
        cursor: pointer;
        font-size: 1rem;
      }

      /* ========== BOMB INDICATOR ========== */
      .bomb-indicator {
        background: none;
        border: none;
        padding: 0.3rem 0.5rem;
        cursor: pointer;
        font-size: 1rem;
        position: relative;
        display: none;
        animation: bomb-pulse 1.5s ease-in-out infinite;
      }

      @keyframes bomb-pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.2); }
      }

      /* ========== WEATHER INDICATORS ========== */
      .weather-indicator {
        display: none;
        position: relative;
        font-size: 1rem;
        padding: 0.3rem 0.2rem;
        cursor: default;
        animation: weather-pulse 2s ease-in-out infinite;
      }

        display: none;
        position: fixed;
        background: rgba(0,0,0,0.9);
        color: #0f0;

        border-radius: 4px;
        white-space: nowrap;
        z-index: 9999;
        pointer-events: none;
        border: 1px solid rgba(0,255,0,0.3);

        0%, 100% { opacity: 1; }
        50% { opacity: 0.5; }
      }
      .bomb-tooltip {
        display: none;
        position: fixed;
        background: var(--bg-secondary);

        font-size: 0.75rem;
        color: var(--text-primary);

      /* ========== JOURNAL MODAL ========== */
      .journal-tabs {
        display: flex;

        margin-bottom: 0.75rem;
        flex-wrap: wrap;
      }
      .journal-tab {
        padding: 0.4rem 0.8rem;

        border: 1px solid var(--border-color);
        border-radius: var(--radius);
        color: var(--text-secondary);
        font-family: var(--font-mono);
        font-size: 0.8rem;
        cursor: pointer;
        transition: all 0.2s;

      .journal-tab.active {
        background: var(--accent-gold-dim);
        border-color: var(--accent-gold);
        color: var(--text-primary);
      }
      .journal-content {
        max-height: 40vh;
        overflow-y: auto;
        text-align: left;
        font-family: var(--font-mono);
        font-size: 0.85rem;
      }
      .journal-entry {
        padding: 0.4rem 0;
        border-bottom: 1px solid var(--border-color);
        color: var(--text-secondary);
      }
      .journal-entry:last-child { border-bottom: none; }

      /* ========== ACHIEVEMENTS ========== */
      .achievement-grid {
        display: flex;
        flex-wrap: wrap;
        gap: 0.35rem;
        margin: 0.5rem 0;
        justify-content: center;
      }
      .achievement-badge {
        padding: 0.25rem 0.4rem;
        border-radius: var(--radius);
        border: 1px solid var(--border-color);
        background: var(--bg-tertiary);
        text-align: center;
        font-family: var(--font-mono);
        font-size: 0.65rem;
        opacity: 0.4;
        white-space: nowrap;
      }
      .achievement-badge.earned {
        opacity: 1;
        border-color: var(--accent-gold);
        background: linear-gradient(135deg, #2a2010, #1a1508);
      }
      .achievement-badge .achievement-icon {
        font-size: 1rem;
        display: inline;
        margin-right: 0.2rem;
        vertical-align: middle;
      }

      /* ========== ACHIEVEMENT TOAST ========== */
      @keyframes achievement-slide-in {
        0% { transform: translateY(-100%); opacity: 0; }
        100% { transform: translateY(0); opacity: 1; }
      }
      @keyframes achievement-slide-out {
        0% { transform: translateY(0); opacity: 1; }
        100% { transform: translateY(-100%); opacity: 0; }
      }
      .achievement-toast {
        position: fixed;
        top: 1rem;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10000;
        background: linear-gradient(135deg, #2a2010, #1a1508);
        border: 2px solid var(--accent-gold);
        border-radius: var(--radius);
        padding: 0.75rem 1.5rem;
        display: flex;
        align-items: center;
        gap: 0.75rem;
        font-family: var(--font-mono);
        color: var(--accent-gold);
        box-shadow: 0 0 20px rgba(255, 215, 0, 0.3), 0 4px 15px rgba(0,0,0,0.5);
        animation: achievement-slide-in 0.4s ease-out forwards;
        pointer-events: none;
      }
      .achievement-toast.hiding {
        animation: achievement-slide-out 0.4s ease-in forwards;
      }
      .achievement-toast .toast-icon {
        font-size: 1.8rem;
      }
      .achievement-toast .toast-text {
        display: flex;
        flex-direction: column;
      }
      .achievement-toast .toast-title {
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 1px;
        opacity: 0.7;
      }

        font-size: 1rem;
        font-weight: bold;
      }

      /* ========== VENDOR TRADE MODAL ========== */
      .trade-item {
        display: flex;
        justify-content: space-between;

        padding: 0.5rem;
        background: var(--bg-tertiary);
        border-radius: var(--radius);
        border: 1px solid var(--border-color);
        margin-bottom: 0.4rem;
      }
    </style>
  </head>

      const GlitchEffect = {

        // Dispara o efeito de glitch por um tempo determinado
        trigger: function(durationMs = 3000) {
          if (this.isActive) return;
          this.isActive = true;

          const container = document.getElementById('game-container');
          const overlay = document.getElementById('glitch-overlay');

          // Ativar glitch visual
          container.classList.add('glitch-active');
          overlay.classList.add('active');

          // Som de glitch (estático/ruído)
          this.playGlitchSound();

          // Desativar após duração
          setTimeout(() => {
            container.classList.remove('glitch-active');
            overlay.classList.remove('active');
            this.isActive = false;
          }, durationMs);
        },

        // Som de glitch usando ruído
        playGlitchSound: function() {
          if (!SoundSystem.audioCtx || !SoundSystem.enabled) return;

          const ctx = SoundSystem.audioCtx;
          const duration = 0.3;
          const intervals = 10;

          for (let i = 0; i < intervals; i++) {
            setTimeout(() => {
              if (!this.isActive) return;

              // Criar buffer de ruído
              const bufferSize = ctx.sampleRate * 0.05;
              const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
              const data = buffer.getChannelData(0);

              for (let j = 0; j < bufferSize; j++) {
                data[j] = (Math.random() * 2 - 1) * 0.3;
              }

              const noise = ctx.createBufferSource();
              noise.buffer = buffer;

              const gain = ctx.createGain();
              gain.gain.setValueAtTime(0.15 * SoundSystem.masterVolume, ctx.currentTime);
              gain.gain.exponentialValueToTargetAtTime(0.01, ctx.currentTime, 0.04);

              noise.connect(gain);
              gain.connect(ctx.destination);
              noise.start();
              noise.stop(ctx.currentTime + 0.05);
            }, i * 300);
          }
        }
      };

      const WeatherIndicators = {
        update: function() {
          var mapping = { 'weather-rain': 'rain', 'weather-wind': 'wind_howl', 'weather-fog': 'fog' };
          Object.keys(mapping).forEach(function(elemId) {
            var el = document.getElementById(elemId);
            if (el) {
              if (RandomEvents.isActive(mapping[elemId])) {
                el.classList.add('active');
              } else {
                el.classList.remove('active');
              }
            }
          });
        }
      };

      const RandomEvents = {
        activeEvents: {},
        activeSounds: {},

        process: function() {
          if (GameState.gameOver) return;

          // 1. Decrementar e expirar eventos ativos
          const toRemove = [];
          Object.keys(this.activeEvents).forEach(function(eventId) {
            const active = RandomEvents.activeEvents[eventId];
            if (active.turnsLeft > 0) {
              active.turnsLeft--;
              if (active.turnsLeft <= 0) {
                toRemove.push(eventId);
              }
            }
          });
          toRemove.forEach(function(eventId) { RandomEvents.endEvent(eventId); });

          // 2. Tentar disparar novos eventos independentes
          Object.keys(RANDOM_EVENTS).forEach(function(eventId) {
            const evt = RANDOM_EVENTS[eventId];
            if (evt.parent) return;
            if (RandomEvents.isActive(eventId)) return;
            if (Utils.random() < evt.chance) {
              RandomEvents.startEvent(eventId);
            }
          });

          // 3. Processar filhos de eventos ativos
          Object.keys(RandomEvents.activeEvents).forEach(function(eventId) {
            const evt = RANDOM_EVENTS[eventId];
            if (!evt || !evt.children) return;
            evt.children.forEach(function(childId) {
              const child = RANDOM_EVENTS[childId];
              if (child && Utils.random() < child.chance) {
                RandomEvents.startEvent(childId);
              }
            });
          });
        },

        startEvent: function(eventId) {
          const evt = RANDOM_EVENTS[eventId];
          if (!evt) return;

          // Para eventos com duração, não iniciar se já ativo
          if (evt.duration !== 0 && this.isActive(eventId)) return;

          // Calcular duração
          var turnsLeft = 0;
          if (typeof evt.duration === 'object') {
            turnsLeft = Utils.randomInt(evt.duration.min, evt.duration.max);
          } else {
            turnsLeft = evt.duration;
          }

          // Registrar se tem duração
          if (turnsLeft > 0) {
            this.activeEvents[eventId] = { turnsLeft: turnsLeft, startedAt: GameState.time };
          }

          // Texto no log
          if (evt.text && evt.text.length > 0) {
            Log.add(Utils.randomChoice(evt.text), 'info');
          }

          // Som
          if (this.sounds[eventId]) {
            this.sounds[eventId]();
          }

          // Visual
          if (this.visuals[eventId]) {
            this.visuals[eventId](true);
          }
          WeatherIndicators.update();
        },

        endEvent: function(eventId) {
          var evt = RANDOM_EVENTS[eventId];
          delete this.activeEvents[eventId];

          // Parar som contínuo
          this.stopSound(eventId);

          // Texto de fim
          if (evt && evt.endText && evt.endText.length > 0) {
            Log.add(Utils.randomChoice(evt.endText), 'info');
          }

          // Remover visual
          if (this.visuals[eventId]) {
            this.visuals[eventId](false);
          }

          // Encerrar filhos
          if (evt && evt.children) {
            var self = this;
            evt.children.forEach(function(childId) {
              if (self.isActive(childId)) {
                self.endEvent(childId);
              }
            });
          }
          WeatherIndicators.update();
        },

        isActive: function(eventId) {
          return !!this.activeEvents[eventId];
        },

        stopSound: function(eventId) {
          if (this.activeSounds[eventId]) {
            try {
              this.activeSounds[eventId].forEach(function(node) {
                if (node.stop) node.stop();
                if (node.disconnect) node.disconnect();
              });
            } catch(e) {}
            delete this.activeSounds[eventId];
          }
        },

        reset: function() {
          var self = this;
          Object.keys(this.activeSounds).forEach(function(id) { self.stopSound(id); });
          this.activeEvents = {};
          this.activeSounds = {};

            var nodes = self.activeSounds[id];
            if (nodes) {
              nodes.forEach(function(node) {
                // Mute gain nodes instead of stopping (so we can resume)
                if (node instanceof GainNode) {
                  node._savedGain = node.gain.value;
                  node.gain.setValueAtTime(0, SoundSystem.audioCtx.currentTime);
                }
              });
            }
          });

          var self = this;

            var nodes = self.activeSounds[id];

              nodes.forEach(function(node) {
                if (node instanceof GainNode && node._savedGain !== undefined) {

            gain.gain.value = 0.02 * SoundSystem.masterVolume;
            lfo.connect(lfoGain);
            lfoGain.connect(gain.gain);
            noise.connect(filter);
            filter.connect(gain);
            gain.connect(ctx.destination);
            lfo.start();
            noise.start();
            RandomEvents.activeSounds['whispers'] = [noise, lfo, gain, lfoGain, filter];
          },

      // ============================================================================
      // SOUND SYSTEM - Web Audio API
      // ============================================================================

      const SoundSystem = {
        audioCtx: null,
        enabled: true,
        masterVolume: 0.3,

        init: function() {
          this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        },

        resume: function() {
          if (this.audioCtx && this.audioCtx.state === 'suspended') {
            this.audioCtx.resume();
          }
        },

        toggle: function() {
          this.enabled = !this.enabled;
          const btn = document.getElementById('sound-toggle');
          if (btn) {
            btn.textContent = this.enabled ? '🔊' : '🔇';
          }
        },

        // Criar oscilador básico
        createOsc: function(type, freq, duration, volume = 0.3) {
          if (!this.enabled || !this.audioCtx) return null;
          this.resume();

          const osc = this.audioCtx.createOscillator();
          const gain = this.audioCtx.createGain();

          osc.type = type;
          osc.frequency.value = freq;
          gain.gain.value = volume * this.masterVolume;

          osc.connect(gain);
          gain.connect(this.audioCtx.destination);

          return { osc, gain, ctx: this.audioCtx };
        },

        // Criar ruído branco
        createNoise: function(duration, volume = 0.2) {
          if (!this.enabled || !this.audioCtx) return null;
          this.resume();

          const bufferSize = this.audioCtx.sampleRate * duration;
          const buffer = this.audioCtx.createBuffer(1, bufferSize, this.audioCtx.sampleRate);
          const data = buffer.getChannelData(0);

          for (let i = 0; i < bufferSize; i++) {
            data[i] = Math.random() * 2 - 1;
          }

          const noise = this.audioCtx.createBufferSource();
          const gain = this.audioCtx.createGain();
          noise.buffer = buffer;
          gain.gain.value = volume * this.masterVolume;

          noise.connect(gain);
          gain.connect(this.audioCtx.destination);

          return { noise, gain, ctx: this.audioCtx };
        },

        // === SONS DO JOGO ===

        playAttack: function() {
          const result = this.createOsc('sawtooth', 400, 0.15);
          if (!result) return;
          const { osc, gain, ctx } = result;

          const now = ctx.currentTime;
          osc.frequency.linearRampToValueAtTime(100, now + 0.15);
          gain.gain.linearRampToValueAtTime(0, now + 0.15);

          osc.start(now);
          osc.stop(now + 0.15);
        },

        playHit: function() {
          // Ruído de impacto
          const noise = this.createNoise(0.1, 0.3);
          if (noise) {
            const now = noise.ctx.currentTime;
            noise.gain.gain.linearRampToValueAtTime(0, now + 0.1);
            noise.noise.start(now);
            noise.noise.stop(now + 0.1);
          }

          // Tom grave
          const result = this.createOsc('sine', 80, 0.2, 0.4);
          if (result) {
            const { osc, gain, ctx } = result;
            const now = ctx.currentTime;
            gain.gain.linearRampToValueAtTime(0, now + 0.2);
            osc.start(now);
            osc.stop(now + 0.2);
          }

          const result = this.createOsc('sine', 400, 1.0, 0.3);
          if (!result) return;
          const { osc, gain, ctx } = result;

          const now = ctx.currentTime;
          osc.frequency.linearRampToValueAtTime(50, now + 1.0);
          gain.gain.setValueAtTime(0.3 * this.masterVolume, now);
          gain.gain.linearRampToValueAtTime(0, now + 1.0);

          osc.start(now);
          osc.stop(now + 1.0);
        },

        playMove: function() {

        playPickup: function() {

        playUseItem: function() {
          const result = this.createOsc('triangle', 400, 0.3);
          if (!result) return;
          const { osc, gain, ctx } = result;

          const now = ctx.currentTime;
          // Vibrato
          const lfo = ctx.createOscillator();
          const lfoGain = ctx.createGain();
          lfo.frequency.value = 15;
          lfoGain.gain.value = 50;
          lfo.connect(lfoGain);
          lfoGain.connect(osc.frequency);

          gain.gain.linearRampToValueAtTime(0, now + 0.3);

          lfo.start(now);
          osc.start(now);
          lfo.stop(now + 0.3);
          osc.stop(now + 0.3);
        },

        // Som místico grandioso para abertura do livro
        playMysticBook: function() {
          if (!this.enabled || !this.audioCtx) return;
          this.resume();
          var ctx = this.audioCtx;
          var now = ctx.currentTime;
          var master = ctx.createGain();
          master.gain.value = 0.25 * this.masterVolume;
          master.connect(ctx.destination);

          // Camada 1: Drone grave pulsante (fundação mística)
          var drone = ctx.createOscillator();
          var droneGain = ctx.createGain();
          drone.type = 'sine';
          drone.frequency.value = 110;
          var droneLfo = ctx.createOscillator();
          var droneLfoGain = ctx.createGain();
          droneLfo.frequency.value = 2;
          droneLfoGain.gain.value = 8;
          droneLfo.connect(droneLfoGain);
          droneLfoGain.connect(drone.frequency);
          droneGain.gain.setValueAtTime(0, now);
          droneGain.gain.linearRampToValueAtTime(0.4, now + 0.5);
          droneGain.gain.linearRampToValueAtTime(0.3, now + 2.0);
          droneGain.gain.linearRampToValueAtTime(0, now + 3.5);
          drone.connect(droneGain);
          droneGain.connect(master);
          droneLfo.start(now);
          drone.start(now);
          droneLfo.stop(now + 3.5);
          drone.stop(now + 3.5);

          // Camada 2: Acordes etéreos (quintas abertas ascendentes)
          var chordNotes = [
            { freq: 220, start: 0.2, dur: 2.8 },
            { freq: 330, start: 0.4, dur: 2.6 },
            { freq: 440, start: 0.6, dur: 2.4 },
            { freq: 660, start: 0.9, dur: 2.0 },
            { freq: 880, start: 1.2, dur: 1.5 },
          ];
          chordNotes.forEach(function(n) {
            var osc = ctx.createOscillator();
            var g = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.value = n.freq;
            var trem = ctx.createOscillator();
            var tremG = ctx.createGain();
            trem.frequency.value = 3 + Math.random() * 2;
            tremG.gain.value = 0.15;
            trem.connect(tremG);
            tremG.connect(g.gain);
            g.gain.setValueAtTime(0, now + n.start);
            g.gain.linearRampToValueAtTime(0.2, now + n.start + 0.3);
            g.gain.linearRampToValueAtTime(0.15, now + n.start + n.dur * 0.6);
            g.gain.linearRampToValueAtTime(0, now + n.start + n.dur);
            osc.connect(g);
            g.connect(master);
            trem.start(now + n.start);
            osc.start(now + n.start);
            trem.stop(now + n.start + n.dur);
            osc.stop(now + n.start + n.dur);
          });

          // Camada 3: Brilhos cristalinos (partículas mágicas)
          for (var i = 0; i < 8; i++) {
            var sparkle = ctx.createOscillator();
            var sGain = ctx.createGain();
            sparkle.type = 'sine';
            var sparkFreq = 1200 + Math.random() * 2000;
            sparkle.frequency.value = sparkFreq;
            var sStart = 0.3 + Math.random() * 2.2;
            var sDur = 0.1 + Math.random() * 0.25;
            sGain.gain.setValueAtTime(0, now + sStart);
            sGain.gain.linearRampToValueAtTime(0.08, now + sStart + 0.03);
            sGain.gain.linearRampToValueAtTime(0, now + sStart + sDur);
            sparkle.connect(sGain);
            sGain.connect(master);
            sparkle.start(now + sStart);
            sparkle.stop(now + sStart + sDur);
          }

          // Camada 4: Sweep ascendente místico (abertura de portal)
          var sweep = ctx.createOscillator();
          var sweepGain = ctx.createGain();
          sweep.type = 'sawtooth';
          sweep.frequency.setValueAtTime(80, now + 0.1);
          sweep.frequency.exponentialRampToValueAtTime(1200, now + 2.5);
          var sweepFilter = ctx.createBiquadFilter();
          sweepFilter.type = 'lowpass';
          sweepFilter.frequency.setValueAtTime(200, now + 0.1);
          sweepFilter.frequency.exponentialRampToValueAtTime(3000, now + 2.0);
          sweepFilter.frequency.exponentialRampToValueAtTime(500, now + 3.0);
          sweepFilter.Q.value = 5;
          sweepGain.gain.setValueAtTime(0, now + 0.1);
          sweepGain.gain.linearRampToValueAtTime(0.12, now + 0.8);
          sweepGain.gain.linearRampToValueAtTime(0.08, now + 2.0);
          sweepGain.gain.linearRampToValueAtTime(0, now + 3.0);
          sweep.connect(sweepFilter);
          sweepFilter.connect(sweepGain);
          sweepGain.connect(master);
          sweep.start(now + 0.1);
          sweep.stop(now + 3.0);

          // Camada 5: Sussurro de vento (ruído filtrado)
          var windDur = 3.5;
          var windBuf = ctx.createBuffer(1, ctx.sampleRate * windDur, ctx.sampleRate);
          var windData = windBuf.getChannelData(0);
          for (var w = 0; w < windData.length; w++) {
            windData[w] = (Math.random() * 2 - 1) * 0.5;
          }
          var wind = ctx.createBufferSource();
          wind.buffer = windBuf;
          var windFilter = ctx.createBiquadFilter();
          windFilter.type = 'bandpass';
          windFilter.frequency.setValueAtTime(400, now);
          windFilter.frequency.linearRampToValueAtTime(1500, now + 1.5);
          windFilter.frequency.linearRampToValueAtTime(600, now + 3.5);
          windFilter.Q.value = 3;
          var windGain = ctx.createGain();
          windGain.gain.setValueAtTime(0, now);
          windGain.gain.linearRampToValueAtTime(0.06, now + 0.5);
          windGain.gain.linearRampToValueAtTime(0.04, now + 2.5);
          windGain.gain.linearRampToValueAtTime(0, now + 3.5);
          wind.connect(windFilter);
          windFilter.connect(windGain);
          windGain.connect(master);
          wind.start(now);

          // Camada 6: Sino final revelador
          var bell1 = ctx.createOscillator();
          var bell2 = ctx.createOscillator();
          var bellGain = ctx.createGain();
          bell1.type = 'sine';
          bell1.frequency.value = 1318.5;
          bell2.type = 'sine';
          bell2.frequency.value = 1318.5 * 2.756;
          bellGain.gain.setValueAtTime(0, now + 2.5);
          bellGain.gain.linearRampToValueAtTime(0.2, now + 2.55);
          bellGain.gain.exponentialRampToValueAtTime(0.001, now + 3.8);
          bell1.connect(bellGain);
          bell2.connect(bellGain);
          bellGain.connect(master);
          bell1.start(now + 2.5);
          bell2.start(now + 2.5);
          bell1.stop(now + 3.8);
          bell2.stop(now + 3.8);
        },

        // Som de convocação do demônio - grave, ameaçador, crescente
        playDemonSummon: function() {
          if (!this.enabled || !this.audioCtx) return;
          this.resume();
          var ctx = this.audioCtx;
          var now = ctx.currentTime;
          var master = ctx.createGain();
          master.gain.value = 0.3 * this.masterVolume;
          master.connect(ctx.destination);

          // Camada 1: Rugido grave crescente (sawtooth sub-baixo)
          var roar = ctx.createOscillator();
          var roarGain = ctx.createGain();
          roar.type = 'sawtooth';
          roar.frequency.setValueAtTime(30, now);
          roar.frequency.exponentialRampToValueAtTime(80, now + 1.5);
          roar.frequency.exponentialRampToValueAtTime(50, now + 2.5);
          roarGain.gain.setValueAtTime(0, now);
          roarGain.gain.linearRampToValueAtTime(0.5, now + 0.8);
          roarGain.gain.linearRampToValueAtTime(0.3, now + 2.0);
          roarGain.gain.linearRampToValueAtTime(0, now + 3.0);
          roar.connect(roarGain);
          roarGain.connect(master);
          roar.start(now);
          roar.stop(now + 3.0);

          // Camada 2: Dissonância infernal (duas frequências próximas = batimento)
          var dis1 = ctx.createOscillator();
          var dis2 = ctx.createOscillator();
          var disGain = ctx.createGain();
          dis1.type = 'square';
          dis2.type = 'square';
          dis1.frequency.value = 110;
          dis2.frequency.value = 116; // batimento de ~6Hz = tremor sinistro
          disGain.gain.setValueAtTime(0, now + 0.3);
          disGain.gain.linearRampToValueAtTime(0.2, now + 1.0);
          disGain.gain.linearRampToValueAtTime(0.15, now + 2.0);
          disGain.gain.linearRampToValueAtTime(0, now + 2.8);
          dis1.connect(disGain);
          dis2.connect(disGain);
          disGain.connect(master);
          dis1.start(now + 0.3);
          dis2.start(now + 0.3);

          // Camada 3: Ruído de fogo/portal (ruído filtrado com sweep)
          var fireDur = 3.0;

          var fireData = fireBuf.getChannelData(0);
          for (var i = 0; i < fireData.length; i++) {
            fireData[i] = (Math.random() * 2 - 1) * 0.5;
          }
          var fire = ctx.createBufferSource();
          fire.buffer = fireBuf;
          var fireFilter = ctx.createBiquadFilter();
          fireFilter.type = 'bandpass';
          fireFilter.frequency.setValueAtTime(200, now);
          fireFilter.frequency.exponentialRampToValueAtTime(800, now + 1.5);
          fireFilter.frequency.exponentialRampToValueAtTime(300, now + 3.0);
          fireFilter.Q.value = 2;
          var fireGain = ctx.createGain();
          fireGain.gain.setValueAtTime(0, now);
          fireGain.gain.linearRampToValueAtTime(0.12, now + 0.5);
          fireGain.gain.linearRampToValueAtTime(0.08, now + 2.0);
          fireGain.gain.linearRampToValueAtTime(0, now + 3.0);
          fire.connect(fireFilter);
          fireFilter.connect(fireGain);
          fireGain.connect(master);
          fire.start(now);

          // Camada 4: Impacto grave final (boom de chegada)

          var boomGain = ctx.createGain();

          boom.frequency.exponentialRampToValueAtTime(25, now + 3.0);

          boomGain.gain.linearRampToValueAtTime(0.4, now + 2.1);
          boomGain.gain.exponentialRampToValueAtTime(0.001, now + 3.0);
          boom.connect(boomGain);
          boomGain.connect(master);
          boom.start(now + 2.0);

          var voiceLfoGain = ctx.createGain();

          voiceGain.gain.linearRampToValueAtTime(0.1, now + 1.5);
          voiceGain.gain.linearRampToValueAtTime(0.06, now + 2.5);
          voiceGain.gain.linearRampToValueAtTime(0, now + 3.0);
          voice.connect(voiceGain);
          voiceGain.connect(master);
          voiceLfo.start(now + 1.0);
          voice.start(now + 1.0);
          voiceLfo.stop(now + 3.0);
          voice.stop(now + 3.0);
        },

        // Som de conversão do demônio - divino, purificador, ascendente

          var master = ctx.createGain();

          // Camada 1: Acorde maior ascendente (purificação)
          var holyNotes = [
            { freq: 261.6, start: 0, dur: 3.0 },     // Dó
            { freq: 329.6, start: 0.15, dur: 2.8 },   // Mi
            { freq: 392.0, start: 0.3, dur: 2.6 },    // Sol

            g.connect(master);
            osc.start(now + n.start);
            osc.stop(now + n.start + n.dur);
          });

          // Camada 2: Shimmer celestial (osciladores agudos com tremolo)
          for (var i = 0; i < 6; i++) {
            var shimmer = ctx.createOscillator();
            var sGain = ctx.createGain();
            shimmer.type = 'sine';
            shimmer.frequency.value = 1000 + Math.random() * 1500;
            var trem = ctx.createOscillator();
            var tremG = ctx.createGain();
            trem.frequency.value = 4 + Math.random() * 4;

            trem.connect(tremG);

            shimmer.connect(sGain);
            sGain.connect(master);

        // BFS pathfinding para NPCs
        findPath: function(fromId, toId, canFly) {
          if (fromId === toId) return [fromId];
          var visited = {};
          var queue = [[fromId]];
          visited[fromId] = true;
          while (queue.length > 0) {
            var path = queue.shift();
            var current = path[path.length - 1];
            var room = GameState.rooms[current];
            if (!room) continue;
            var exits = Object.values(room.exits);
            for (var i = 0; i < exits.length; i++) {
              var next = exits[i];
              if (visited[next]) continue;
              var nextRoom = GameState.rooms[next];
              if (!nextRoom) continue;
              if (nextRoom.requiresFlight && !canFly) continue;
              if (next === 'teto_masp' && !GameState.forceShieldDown) continue;
              var newPath = path.concat([next]);
              if (next === toId) return newPath;
              visited[next] = true;
              queue.push(newPath);
            }
          }
          return null;
        },

        shuffle: function(arr) {
          const result = [...arr];
          for (let i = result.length - 1; i > 0; i--) {
            const j = Math.floor(this.random() * (i + 1));
            [result[i], result[j]] = [result[j], result[i]];
          }
